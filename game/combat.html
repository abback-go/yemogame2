<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전투 샌드박스 — 손맛 검증</title>
<style>
  html,body{margin:0;padding:0;background:#05060a;height:100%;overflow:hidden;
    font-family:'Malgun Gothic','맑은 고딕','NanumGothic','Noto Sans KR',sans-serif;}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%;}
  canvas{background:#05060a;outline:none;}
  #panel{position:fixed;top:0;right:0;width:330px;max-height:100%;overflow-y:auto;
    background:rgba(10,13,20,.95);border-left:1px solid #2a3348;color:#cfd8ea;font-size:12px;
    padding:10px 12px 30px;display:none;z-index:10;}
  #panel h3{margin:12px 0 6px;font-size:12px;color:#8fb7d8;border-bottom:1px solid #223;padding-bottom:3px;}
  #panel .row{display:flex;align-items:center;gap:6px;margin:3px 0;}
  #panel .row label{flex:0 0 122px;font-size:11px;color:#a9b6cc;}
  #panel .row input[type=range]{flex:1;min-width:0;}
  #panel .row .v{flex:0 0 42px;text-align:right;font-variant-numeric:tabular-nums;color:#e8eefc;}
  #panel .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  #panel button{background:#1c2536;color:#cfd8ea;border:1px solid #33405a;border-radius:4px;
    padding:5px 9px;cursor:pointer;font-size:11px;}
  #panel button:hover{background:#26324a;}
  #hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);
    background:rgba(16,20,30,.9);color:#c9d4ea;border:1px solid #2a3348;
    padding:5px 14px;border-radius:999px;font-size:12px;pointer-events:none;white-space:nowrap;}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="960" height="540" tabindex="0"></canvas></div>
<div id="panel"></div>
<div id="hint">클릭해서 시작 · 이동←→ 점프Z 대시C 공격X · 스킬 A/S/D · <b>F1 튜닝패널</b> · R 리셋 · H 도움말</div>
<script>
"use strict";
/* =====================================================================
   전투 샌드박스 — 손맛 검증용 (맵1 · 적1 · 전투 시스템 전체)
   검증 대상 = "마나 빈자 근접 시전자" 루프:
     마나 없음 → 붙어서 때림 → 드레인으로 마나 강탈 → 스킬에 쏟음 → 반복
   플레이어: 근접3타 콤보 / 대시(무적) / 대시공격 / 스킬 3종
   적: 중간보스급 3패턴 + 마나 보유(뺏기면 마법 못 씀 = 마나 번)
   F1 = 실시간 튜닝 패널 (모든 수치 슬라이더)
   ===================================================================== */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=960,H=540; cv.focus();
function fit(){const s=Math.min(window.innerWidth/W,window.innerHeight/H);
  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';}
addEventListener('resize',fit); fit();

/* ============================ 튜닝 값 ============================ */
const TUNE={
  // 이동
  moveSpeed:290, accel:3000, friction:2800, gravity:2300, jumpV:770, jumpCut:200,
  coyote:0.10, jumpBuffer:0.12,
  // 대시 (쉐도우 어썰트 결: 웅크림 → 폭발 → 감속)
  dashSpeed:720, dashTime:0.17, dashCd:0.40, dashIframe:0.22,
  dashPrep:0.06, dashBurst:1.7, dashEnd:0.45, dashGhost:1.0,
  // 근접 콤보
  atkDmg1:11, atkDmg2:12, atkDmg3:20,
  atkWind:0.05, atkActive:0.10, atkRec:0.13, atkRec3:0.26,
  atkRange:46, atkStep:80, comboWindow:0.42,
  // 대시 공격
  dashAtkDmg:22, dashAtkRange:60, dashAtkLunge:520,
  // 마나 경제
  manaMax:100, manaStart:15, manaRegen:0,
  drainMelee:7, drainDashAtk:12, drainSkill:0,
  // 스킬 (각인 파쇄 / 룬 사슬 채찍 / 낙인 기폭)
  s1Cost:25, s1Dmg:34, s1Range:150, s1Width:110,
  s2Cost:30, s2Dmg:9, s2Ticks:5, s2Range:215,
  s3Cost:35, s3Dmg:14, s3Dash:900, s3Boom:130, s3Brand:30, s3Delay:0.6,
  // 적
  eHp:420, eMana:100, eSpeed:120, eTelegraph:0.5, eCdMin:0.7, eCdMax:1.3,
  eMeleeDmg:14, eBoltDmg:11, eNovaDmg:20, eBoltCost:25, eNovaCost:40, eChargeDmg:18,
  eStaggerAt:60, eKnock:8,
  // 주스
  hitstop:0.055, shakeAmt:0.42, playerHp:120,
};
const TUNE_SPEC=[
 ['이동',[['moveSpeed','이동 속도',100,500,5],['accel','가속',800,6000,100],['friction','감속',800,6000,100],
   ['gravity','중력',1200,3600,50],['jumpV','점프력',400,1100,10],['coyote','코요테',0,.25,.01],['jumpBuffer','입력버퍼',0,.3,.01]]],
 ['대시',[['dashSpeed','대시 속도',300,1200,10],['dashTime','대시 시간',.06,.35,.01],
   ['dashCd','대시 쿨',.1,1.2,.02],['dashIframe','무적 시간',0,.4,.01],
   ['dashPrep','웅크림(선딜)',0,.2,.005],['dashBurst','초반 폭발 배율',1,2.5,.05],
   ['dashEnd','끝 감속 배율',.1,1.2,.05],['dashGhost','잔상 밀도',0,1,.05]]],
 ['근접 콤보',[['atkDmg1','1타 데미지',1,40,1],['atkDmg2','2타 데미지',1,40,1],['atkDmg3','3타 데미지',1,60,1],
   ['atkWind','선딜',.01,.2,.01],['atkActive','유효 프레임',.03,.3,.01],['atkRec','후딜(1·2타)',.03,.4,.01],
   ['atkRec3','후딜(3타)',.05,.6,.01],['atkRange','사거리',20,90,2],['atkStep','전진량',0,220,10],
   ['comboWindow','콤보 입력창',.15,.9,.02]]],
 ['대시 공격',[['dashAtkDmg','데미지',1,60,1],['dashAtkRange','사거리',20,110,2],['dashAtkLunge','돌진력',100,1000,20]]],
 ['마나 경제',[['manaMax','최대 마나',20,200,5],['manaStart','시작 마나',0,100,5],['manaRegen','자연 재생/초',0,20,.5],
   ['drainMelee','근접 드레인',0,25,1],['drainDashAtk','대시공격 드레인',0,40,1]]],
 ['스킬① 각인 파쇄',[['s1Cost','코스트',0,80,1],['s1Dmg','데미지',1,90,1],['s1Range','사거리',60,300,5],['s1Width','판정 높이',40,220,5]]],
 ['스킬② 룬 사슬 채찍',[['s2Cost','코스트',0,80,1],['s2Dmg','틱 데미지',1,30,1],['s2Ticks','틱 수',1,10,1],['s2Range','사거리',80,340,5]]],
 ['스킬③ 낙인 기폭',[['s3Cost','코스트',0,80,1],['s3Dmg','돌진 피해',1,60,1],['s3Brand','기폭 피해',1,90,1],
   ['s3Delay','기폭 지연',.15,1.5,.05],['s3Dash','돌진 속도',300,1500,20],['s3Boom','폭발 반경',40,240,5]]],
 ['적',[['eHp','체력',50,900,10],['eMana','마나',0,200,5],['eSpeed','이동 속도',0,320,10],
   ['eTelegraph','텔레그래프',.15,1.2,.05],['eCdMin','패턴 쿨(최소)',.2,2.5,.1],['eCdMax','패턴 쿨(최대)',.3,3.5,.1],
   ['eMeleeDmg','근접 피해',0,40,1],['eBoltDmg','투사체 피해',0,40,1],['eNovaDmg','폭발 피해',0,60,1],
   ['eChargeDmg','돌진 피해',0,50,1],['eStaggerAt','경직 누적치',10,200,5],['eKnock','피격 밀림',0,40,1]]],
 ['주스·기타',[['hitstop','히트스톱',0,.16,.005],['shakeAmt','화면 흔들림',0,1.2,.05],['playerHp','플레이어 체력',20,300,10]]],
];

/* ============================ 입력 ============================ */
const KEY={},PRESS={};
const MAP={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',
  KeyZ:'jump',Space:'jump',KeyX:'attack',KeyC:'dash',ShiftLeft:'dash',
  KeyA:'sk1',KeyS:'sk2',KeyD:'sk3',KeyR:'reset',KeyH:'help',F1:'panel',KeyT:'dummy',KeyM:'mute'};
addEventListener('keydown',e=>{ const a=MAP[e.code];
  if(e.code==='F1'){e.preventDefault(); togglePanel(); return;}
  if(!a)return; if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(!KEY[a])PRESS[a]=true; KEY[a]=true; });
addEventListener('keyup',e=>{const a=MAP[e.code]; if(a)KEY[a]=false;});
cv.addEventListener('mousedown',()=>cv.focus());
const P=a=>!!PRESS[a]; const clearP=()=>{for(const k in PRESS)PRESS[k]=false;};

/* ============================ 유틸 ============================ */
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a), sgn=v=>v<0?-1:1;
const aabb=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ============================ 사운드 ============================ */
let AC=null,muted=true;
function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function sfx(t){ if(muted)return; const ac=actx(); if(!ac)return;
  const now=ac.currentTime,o=ac.createOscillator(),g=ac.createGain(); o.connect(g);g.connect(ac.destination);
  let f=300,d=.08,v=.10,w='square';
  if(t==='hit'){f=200;d=.07;v=.13;}
  else if(t==='hit3'){f=140;d=.14;v=.18;}
  else if(t==='dash'){f=340;d=.10;w='sawtooth';v=.08;}
  else if(t==='jump'){f=520;d=.09;w='sine';}
  else if(t==='skill'){f=680;d=.16;w='sine';v=.12;}
  else if(t==='drain'){f=880;d=.05;w='triangle';v=.06;}
  else if(t==='hurt'){f=150;d=.15;w='sawtooth';v=.14;}
  else if(t==='deny'){f=110;d=.10;w='square';v=.10;}
  o.type=w;o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(Math.max(40,f*.4),now+d);
  g.gain.setValueAtTime(v,now);g.gain.exponentialRampToValueAtTime(.001,now+d);o.start(now);o.stop(now+d+.02);}

/* ============================ 상태 ============================ */
const G={t:0,dt:0,hitstop:0,shake:0,parts:[],floats:[],flash:{a:0,c:'#fff'},
  cam:{x:480,y:300},solids:[],player:null,enemy:null,help:false,dummy:false,
  killTimer:0,killed:false,killTime:0,dmgDealt:0,toast:{t:0,txt:''},waves:[]};

function toast(txt,d){G.toast={txt,t:d||2};}
function part(x,y,o){G.parts.push(Object.assign({x,y,vx:0,vy:0,g:0,life:.5,age:0,r:3,c:'#fff',shape:'c'},o));}
function burst(x,y,n,o){for(let i=0;i<n;i++){const a=rnd(0,6.283),s=rnd(o.spMin||40,o.spMax||200);
  part(x,y,Object.assign({},o,{vx:Math.cos(a)*s,vy:Math.sin(a)*s}));}}
function fnum(x,y,txt,c,big){G.floats.push({x,y,txt,c:c||'#fff',age:0,life:.85,big:!!big,vy:-32});}
function shake(a){G.shake=Math.max(G.shake,a*TUNE.shakeAmt/0.42);}
function hitstop(s){G.hitstop=Math.max(G.hitstop,s);}

/* ============================ 아레나 ============================ */
function buildArena(){
  G.solids=[
    {x:-40,y:470,w:1080,h:160},        // 바닥
    {x:150,y:360,w:180,h:18},          // 좌 플랫폼
    {x:690,y:360,w:180,h:18},          // 우 플랫폼
    {x:420,y:262,w:180,h:18},          // 중앙 상단
    {x:-60,y:-100,w:60,h:660},         // 좌벽
    {x:1000,y:-100,w:60,h:660},        // 우벽
  ];
}

/* ============================ 플레이어 ============================ */
function makePlayer(){
  return {x:220,y:400,w:26,h:44,vx:0,vy:0,face:1,onGround:false,
    coyote:0,buffer:0,dashT:0,dashCd:0,iframe:0,
    atk:0,atkDur:0,atkStep:0,atkHit:false,comboT:0,comboIdx:0,dashAtk:false,
    dashPrep:0,dashStart:0,dashPassed:false,queued:false,
    skill:'',skillT:0,skillDur:0,skillHit:null,
    hp:TUNE.playerHp,mana:TUNE.manaStart,hurt:0,dead:false,
    afterimg:[],animRun:0,squash:1};
}
function resetAll(){
  buildArena(); G.player=makePlayer(); G.enemy=makeEnemy();
  G.parts=[];G.floats=[];G.waves=[];G.killed=false;G.killTimer=0;G.dmgDealt=0;
  G.flash={a:0,c:'#fff'};G.shake=0;
}

function updatePlayer(dt){
  const p=G.player; if(!p)return;
  p.dashCd=Math.max(0,p.dashCd-dt); p.iframe=Math.max(0,p.iframe-dt);
  p.hurt=Math.max(0,p.hurt-dt); p.coyote=Math.max(0,p.coyote-dt); p.buffer=Math.max(0,p.buffer-dt);
  p.comboT=Math.max(0,p.comboT-dt); if(p.comboT<=0&&p.atk<=0)p.comboIdx=0;
  if(TUNE.manaRegen>0) p.mana=Math.min(TUNE.manaMax,p.mana+TUNE.manaRegen*dt);

  const busy = p.skill!=='' || p.atk>0 || p.dashPrep>0;
  const canAct = !p.dead;

  // 스킬 입력
  if(canAct&&!busy&&p.dashT<=0){
    if(P('sk1'))trySkill('slash'); else if(P('sk2'))trySkill('whip'); else if(P('sk3'))trySkill('blast');
  }
  // 대시 — 웅크림(prep) → 폭발 → 감속
  if(canAct&&P('dash')&&p.dashCd<=0&&p.dashT<=0&&p.dashPrep<=0&&p.skill===''){
    p.dashPrep=TUNE.dashPrep; p.dashCd=TUNE.dashCd;
    p.iframe=Math.max(p.iframe,TUNE.dashPrep+TUNE.dashIframe);
    p.atk=0;p.dashAtk=false;p.dashPassed=false;
    let ix=(KEY.left?-1:0)+(KEY.right?1:0); if(ix!==0)p.face=ix;
    sfx('dash');
    // 웅크림: 발밑으로 빨려드는 기류
    for(let i=0;i<8;i++){const a=rnd(0,6.283),d=rnd(26,52);
      part(p.x+p.w/2+Math.cos(a)*d,p.y+26+Math.sin(a)*d*.6,
        {c:'#9fd8ff',r:2.4,life:TUNE.dashPrep+.05,vx:-Math.cos(a)*d*7,vy:-Math.sin(a)*d*4});}
  }
  if(p.dashPrep>0){ p.dashPrep-=dt; p.vx=0; p.squash=.66;
    if(p.dashPrep<=0){ p.dashT=TUNE.dashTime; p.dashStart=TUNE.dashTime;
      burst(p.x+p.w/2,p.y+26,10,{c:'#cfe3ff',r:3,life:.28,spMin:60,spMax:220}); } }
  // 공격 / 대시공격
  if(canAct&&P('attack')&&p.skill===''&&p.dashPrep<=0){
    if(p.dashT>0){ startDashAttack(p); }
    else if(p.atk<=0){ startCombo(p); }
    else { // 공격 중 선입력 — 윈드업만 지나면 언제든 예약(콤보가 씹히지 않게)
      const since=p.atkDur-p.atk;
      if(since>=TUNE.atkWind*0.8) p.queued=true;
    }
  }
  // 점프
  if(canAct&&P('jump'))p.buffer=TUNE.jumpBuffer;
  if(p.buffer>0&&(p.onGround||p.coyote>0)&&p.dashT<=0&&p.skill===''){
    p.vy=-TUNE.jumpV;p.buffer=0;p.coyote=0;p.onGround=false;p.squash=.72;sfx('jump');
    burst(p.x+p.w/2,p.y+p.h,7,{c:'#aab6cc',r:2.5,life:.28,g:520,spMin:20,spMax:95});
  }
  if(!KEY.jump&&p.vy<-TUNE.jumpCut&&p.dashT<=0)p.vy=-TUNE.jumpCut;

  // 이동/물리
  if(p.dashPrep>0){ p.vx=0; p.vy=0; }
  else if(p.dashT>0){ p.dashT-=dt; p.vy=0;
    // 속도 커브: 초반 폭발 → 끝에서 감속
    const k=1-clamp(p.dashT/Math.max(.01,p.dashStart||TUNE.dashTime),0,1); // 0→1 진행도
    const mult=lerp(TUNE.dashBurst,TUNE.dashEnd,k*k);
    p.vx=p.face*TUNE.dashSpeed*mult;
    // 촘촘한 다중 잔상
    if(TUNE.dashGhost>0){ p.afterimg.push({x:p.x,y:p.y,face:p.face,age:0});
      if(Math.random()<TUNE.dashGhost*.6)p.afterimg.push({x:p.x-p.face*9,y:p.y,face:p.face,age:.05}); }
    // 관통감: 적을 지나칠 때 스파크 + 짧은 정지
    const e=G.enemy;
    if(e&&e.alive&&!p.dashPassed&&aabb(p,e)){ p.dashPassed=true;
      hitstop(TUNE.hitstop*.5); shake(.25);
      for(let i=0;i<12;i++)part(p.x+p.w/2,p.y+rnd(6,40),
        {c:i%2?'#dff0ff':'#7fd0ff',r:rnd(1.5,3.5),life:rnd(.15,.32),vx:-p.face*rnd(120,340),vy:rnd(-90,90)});
    }
  }
  else if(p.skill==='blast'){ /* 스킬 내부에서 처리 */ }
  else {
    let ix=0; if(!p.dead){ if(KEY.left)ix-=1; if(KEY.right)ix+=1; }
    const moveLock = (p.atk>0)||(p.skill!=='');
    if(!moveLock){ if(ix!==0){p.face=ix; p.vx=lerp(p.vx,ix*TUNE.moveSpeed,1-Math.pow(.0005,dt));}
      else p.vx=lerp(p.vx,0,1-Math.pow(.0004,dt)); }
    else p.vx=lerp(p.vx,0,1-Math.pow(.02,dt));
    p.vy+=TUNE.gravity*dt;
  }
  // 공격 진행
  if(p.atk>0){ p.atk-=dt; const since=p.atkDur-p.atk;
    const act=p.dashAtk?[0.04,0.14]:[TUNE.atkWind,TUNE.atkWind+TUNE.atkActive];
    if(since>=act[0]&&since<=act[1]&&!p.atkHit) doMeleeHit(p);
    if(p.atk<=0){ if(p.queued&&!p.dashAtk){p.queued=false; startCombo(p);} else {p.queued=false; p.dashAtk=false;} }
  }
  // 스킬 진행
  if(p.skill!=='') updateSkill(p,dt);

  collide(p,dt);
  p.animRun+=Math.abs(p.vx)*dt*.06;
  p.squash=lerp(p.squash,1,1-Math.pow(.0001,dt));
  for(let i=p.afterimg.length-1;i>=0;i--){p.afterimg[i].age+=dt;if(p.afterimg[i].age>.24)p.afterimg.splice(i,1);}
  if(p.hp<=0&&!p.dead){p.dead=true;onDeath();}
}
function collide(p,dt){
  p.x+=p.vx*dt;
  for(const s of G.solids){if(aabb(p,s)){if(p.vx>0)p.x=s.x-p.w;else if(p.vx<0)p.x=s.x+s.w;p.vx=0;}}
  p.y+=p.vy*dt;p.onGround=false;
  for(const s of G.solids){if(aabb(p,s)){
    if(p.vy>0){p.y=s.y-p.h;p.onGround=true;if(p.vy>420)p.squash=.74;p.vy=0;p.coyote=TUNE.coyote;}
    else if(p.vy<0){p.y=s.y+s.h;p.vy=0;}}}
  if(p.onGround)p.coyote=TUNE.coyote;
}
function startCombo(p){
  // 3타를 치면 다시 1타로 순환
  p.comboIdx=(p.comboT>0&&p.comboIdx<3)?p.comboIdx+1:1; p.comboT=TUNE.comboWindow; p.queued=false;
  const last=p.comboIdx>=3;
  p.atkDur=TUNE.atkWind+TUNE.atkActive+(last?TUNE.atkRec3:TUNE.atkRec);
  p.atk=p.atkDur;p.atkHit=false;p.dashAtk=false;
  p.vx=p.face*TUNE.atkStep*(last?1.4:1);
  if(!p.onGround)p.vy=Math.min(p.vy,60);
}
function startDashAttack(p){
  p.dashT=0;p.dashAtk=true;p.atkDur=0.30;p.atk=p.atkDur;p.atkHit=false;p.comboIdx=0;
  p.vx=p.face*TUNE.dashAtkLunge; p.iframe=Math.max(p.iframe,.08);
  for(let i=0;i<4;i++)p.afterimg.push({x:p.x-p.face*i*10,y:p.y,face:p.face,age:i*.03});
}
function meleeBox(p){
  const r=p.dashAtk?TUNE.dashAtkRange:TUNE.atkRange, h=p.dashAtk?46:40;
  return {x:p.face>0?p.x+p.w-6:p.x-r+6,y:p.y+(44-h)/2,w:r,h};
}
function doMeleeHit(p){
  const e=G.enemy; if(!e||!e.alive)return;
  const hb=meleeBox(p);
  if(!aabb(hb,e))return;
  p.atkHit=true;
  const dmg = p.dashAtk?TUNE.dashAtkDmg : (p.comboIdx===1?TUNE.atkDmg1:p.comboIdx===2?TUNE.atkDmg2:TUNE.atkDmg3);
  const drain = p.dashAtk?TUNE.drainDashAtk:TUNE.drainMelee;
  const heavy = p.dashAtk||p.comboIdx>=3;
  damageEnemy(e,dmg,p.face,heavy);
  drainMana(p,e,drain);
  hitstop(TUNE.hitstop*(heavy?1.8:1)); shake(heavy?.6:.34); sfx(heavy?'hit3':'hit');
}
function drainMana(p,e,amt){
  if(amt<=0)return;
  const got=Math.min(amt,e.mana);
  if(got<=0){ fnum(e.x+e.w/2,e.y-4,'마나 없음','#5b6c86'); return; }
  e.mana-=got; p.mana=Math.min(TUNE.manaMax,p.mana+got);
  sfx('drain');
  // 적 → 플레이어로 흡수되는 입자
  for(let i=0;i<5;i++){
    G.waves.push({type:'drain',x:e.x+e.w/2+rnd(-14,14),y:e.y+rnd(6,40),
      tx:p.x+p.w/2,ty:p.y+16,age:0,life:.34});
  }
  fnum(p.x+p.w/2,p.y-16,'+'+got,'#7fd0ff');
}
/* ---------- 스킬 ---------- */
function trySkill(kind){
  const p=G.player;
  const cost = kind==='slash'?TUNE.s1Cost:kind==='whip'?TUNE.s2Cost:TUNE.s3Cost;
  if(p.mana<cost){ sfx('deny'); G.manaDeny=.35; fnum(p.x+p.w/2,p.y-14,'마나 부족','#e2607a'); return; }
  p.mana-=cost; p.skill=kind; p.skillT=0; p.skillHit=new Set(); sfx('skill');
  p.skillDur = kind==='slash'?0.34 : kind==='whip'?0.52 : 0.42;
  if(kind==='blast'){ p.vy=0; p.iframe=Math.max(p.iframe,.20); }
  if(kind==='slash'){ p.vx=p.face*90; }
  G.flash={a:.14,c:kind==='whip'?'#ff9a4a':kind==='blast'?'#c9a8ff':'#9fd8ff'};
}
function updateSkill(p,dt){
  const e=G.enemy; p.skillT+=dt; const t=p.skillT, k=p.skill;
  if(k==='slash'){
    // 각인 파쇄: 룬이 급히 그려짐(0~0.10) → 깨지며 전방으로 마력 파동
    p.vx=lerp(p.vx,0,1-Math.pow(.01,dt)); p.vy+=TUNE.gravity*dt*0.5;
    if(t<0.10&&!p.skillHit.has('draw')){ p.skillHit.add('draw');
      G.waves.push({type:'rune',x:p.x+p.w/2+p.face*40,y:p.y+22,face:p.face,age:0,life:.16,r:34}); }
    if(t>=0.10&&!p.skillHit.has('a')){ p.skillHit.add('a');
      const hb={x:p.face>0?p.x+p.w:p.x-TUNE.s1Range,y:p.y+22-TUNE.s1Width/2,w:TUNE.s1Range,h:TUNE.s1Width};
      G.waves.push({type:'shatter',x:p.x+p.w/2+p.face*40,y:p.y+22,face:p.face,age:0,life:.30,
        r:TUNE.s1Range,hgt:TUNE.s1Width});
      // 룬 파편
      for(let i=0;i<14;i++){const a=rnd(-0.8,0.8);
        part(p.x+p.w/2+p.face*40,p.y+22,{c:i%3?'#bfe0ff':'#ffffff',r:rnd(1.5,3.5),life:rnd(.25,.5),
          vx:p.face*Math.cos(a)*rnd(160,420),vy:Math.sin(a)*rnd(120,300),g:180});}
      if(e&&e.alive&&aabb(hb,e)){ damageEnemy(e,TUNE.s1Dmg,p.face,true); hitstop(TUNE.hitstop*2.2); shake(.8); }
      else shake(.35);
    }
  } else if(k==='whip'){
    p.vx=lerp(p.vx,0,1-Math.pow(.02,dt)); p.vy+=TUNE.gravity*dt*0.35;
    const tickEvery=0.42/TUNE.s2Ticks;
    const idx=Math.floor((t-0.08)/tickEvery);
    if(t>=0.08&&idx>=0&&idx<TUNE.s2Ticks&&!p.skillHit.has('t'+idx)){ p.skillHit.add('t'+idx);
      const prog=idx/Math.max(1,TUNE.s2Ticks-1);
      const ang=lerp(-0.9,0.9,prog)*p.face;
      const ox=p.x+p.w/2+Math.cos(ang)*TUNE.s2Range*p.face*(p.face>0?1:-1)*0;
      const reach=TUNE.s2Range;
      const ex=p.x+p.w/2+p.face*reach*Math.cos(ang*0.8), ey=p.y+22+Math.sin(ang)*46;
      G.waves.push({type:'whip',x:p.x+p.w/2,y:p.y+22,ex,ey,age:0,life:.24,face:p.face,seed:idx});
      for(let i=0;i<4;i++) part(lerp(p.x+p.w/2,ex,rnd(.3,1)),lerp(p.y+22,ey,rnd(.3,1)),
        {c:i%2?'#ffd28a':'#ff8a3a',r:rnd(2,4.5),life:rnd(.2,.45),vy:-rnd(20,70),g:-40});
      const hb={x:Math.min(p.x+p.w/2,ex)-10,y:Math.min(p.y+22,ey)-14,
        w:Math.abs(ex-(p.x+p.w/2))+20,h:Math.abs(ey-(p.y+22))+28};
      if(e&&e.alive&&aabb(hb,e)){ damageEnemy(e,TUNE.s2Dmg,p.face,false); hitstop(TUNE.hitstop*.7); shake(.28); sfx('hit'); }
    }
  } else if(k==='blast'){
    // 낙인 기폭: 마력을 타고 돌진 → 스친 적에게 룬 낙인 → 지연 후 낙인이 터진다
    if(t<0.06){ p.vx=lerp(p.vx,0,.3); }
    else if(t<0.30){ p.vx=p.face*TUNE.s3Dash; p.vy=0;
      p.afterimg.push({x:p.x,y:p.y,face:p.face,age:0});
      part(p.x+p.w/2-p.face*12,p.y+rnd(10,38),
        {c:Math.random()<.5?'#c9a8ff':'#8fd0ff',r:rnd(2,5),life:.35,vy:-rnd(10,60),g:-60});
      if(e&&e.alive&&!p.skillHit.has('brand')&&aabb({x:p.x-6,y:p.y,w:p.w+12,h:p.h},e)){
        p.skillHit.add('brand');
        damageEnemy(e,TUNE.s3Dmg,p.face,false);
        e.brand={t:TUNE.s3Delay,dur:TUNE.s3Delay}; // 낙인 부착
        G.waves.push({type:'brandmark',x:e.x+e.w/2,y:e.y+e.h/2,age:0,life:.3});
        hitstop(TUNE.hitstop*1.4); shake(.5);
        fnum(e.x+e.w/2,e.y-28,'낙인','#c9a8ff');
      }
    }
    else { p.vx=lerp(p.vx,0,1-Math.pow(.001,dt)); p.vy+=TUNE.gravity*dt;
      if(!p.skillHit.has('land')){ p.skillHit.add('land');
        burst(p.x+p.w/2,p.y+30,10,{c:'#b9a8ff',r:3,life:.3,g:200,spMin:50,spMax:180}); }
    }
  }
  if(p.skillT>=p.skillDur){ p.skill=''; p.skillT=0; }
}
function damageEnemy(e,dmg,dir,heavy){
  if(!e.alive)return;
  e.hp-=dmg; e.hurt=.13; e.x+=dir*TUNE.eKnock*(heavy?1.6:1); e.stagger+=dmg;
  G.dmgDealt+=dmg;
  const hx=e.x+e.w/2-dir*12,hy=e.y+e.h*.4;
  burst(hx,hy,heavy?14:9,{c:'#ffe6a0',r:3,life:.35,g:220,spMin:80,spMax:heavy?320:240});
  burst(hx,hy,4,{c:'#fff',r:2,life:.18,spMin:140,spMax:340});
  fnum(hx,hy-12,String(dmg),heavy?'#ffd166':'#ffe6a0',heavy);
  if(e.stagger>=TUNE.eStaggerAt){ e.stagger=0; e.state='stagger'; e.stateT=.75; e.tel=''; e.vx=0;
    fnum(e.x+e.w/2,e.y-16,'경직!','#ffcf66',true); }
  if(e.hp<=0){ e.hp=0; e.alive=false; onKill(); }
}
function onKill(){
  const e=G.enemy;
  burst(e.x+e.w/2,e.y+e.h/2,34,{c:'#c98a6a',r:4,life:.7,g:260,spMin:70,spMax:340});
  burst(e.x+e.w/2,e.y+e.h/2,14,{c:'#fff',r:3,life:.4,spMin:100,spMax:420});
  shake(1);G.flash={a:.4,c:'#fff'};hitstop(.14);G.killed=true;G.killTime=G.killTimer;
  toast('처치! 시간 '+G.killTime.toFixed(1)+'초 · 총 피해 '+G.dmgDealt+'  —  R: 다시',6);
}
function hurtPlayer(dmg,kx){

  p.hp-=dmg;p.hurt=.32;p.iframe=.75;p.vx=kx*280;p.vy=-170;
  p.atk=0;p.skill='';p.dashT=0;

function onDeath(){ const p=G.player;
  burst(p.x+p.w/2,p.y+p.h/2,22,{c:'#e26',r:3,life:.6,g:220,spMin:60,spMax:260});
  shake(.9);G.flash={a:.55,c:'#000'};toast('쓰러졌다 — R: 다시',5);

/* ============================ 적 ============================ */
function makeEnemy(){
  return {x:700,y:400,w:46,h:70,vx:0,vy:0,face:-1,alive:true,
    hp:TUNE.eHp,maxhp:TUNE.eHp,mana:TUNE.eMana,maxmana:TUNE.eMana,
    hurt:0,stagger:0,state:'idle',stateT:0,tel:'',telT:0,cd:1.0,
    bolts:[],nova:null,anim:0};
}
function updateEnemy(dt){
  const e=G.enemy,p=G.player; if(!e)return;
  e.anim+=dt; e.hurt=Math.max(0,e.hurt-dt);
  updateEnemyProjectiles(dt);
  // 낙인 기폭 — 지연 후 폭발
  if(e.brand){ e.brand.t-=dt;
    if(Math.random()<.5)part(e.x+e.w/2+rnd(-16,16),e.y+rnd(8,52),
      {c:'#c9a8ff',r:rnd(1.5,3),life:.35,vy:-rnd(20,60)});
    if(e.brand.t<=0){ const bx=e.x+e.w/2,by=e.y+e.h/2; e.brand=null;
      G.waves.push({type:'detonate',x:bx,y:by,age:0,life:.40,r:TUNE.s3Boom});
      burst(bx,by,24,{c:'#c9a8ff',r:4,life:.5,g:100,spMin:90,spMax:340});
      burst(bx,by,12,{c:'#f0e6ff',r:3,life:.32,spMin:130,spMax:420});
      shake(1.0); G.flash={a:.28,c:'#d8c8ff'}; hitstop(TUNE.hitstop*2.4); sfx('skill');
      if(e.alive) damageEnemy(e,TUNE.s3Brand,sgn(bx-(p?p.x:bx))||1,true);
    }
  }
  if(!e.alive)return;
  e.face = p.x<e.x?-1:1;
  e.vy+=TUNE.gravity*dt;

  if(G.dummy){ e.vx=lerp(e.vx,0,.2); e.tel=''; e.state='idle'; moveEnemy(e,dt); return; }

  if(e.state==='stagger'){ e.stateT-=dt; e.vx=lerp(e.vx,0,.2);
    if(e.stateT<=0){e.state='idle';e.cd=.5;} moveEnemy(e,dt); return; }

  if(e.tel!==''){ e.telT-=dt; e.vx=lerp(e.vx,0,.25);
    if(e.telT<=0){ execPattern(e); e.tel=''; }
  } else if(e.state==='idle'){
    const dx=(p.x+p.w/2)-(e.x+e.w/2), dist=Math.abs(dx);
    // 거리 유지: 너무 멀면 접근
    if(dist>200) e.vx=lerp(e.vx,sgn(dx)*TUNE.eSpeed,1-Math.pow(.002,dt));
    else e.vx=lerp(e.vx,0,1-Math.pow(.001,dt));
    e.cd-=dt;
    if(e.cd<=0){
      const canBolt=e.mana>=TUNE.eBoltCost, canNova=e.mana>=TUNE.eNovaCost;
      const opts=[];
      if(dist<150) opts.push('melee','melee');
      if(dist>=120) opts.push('charge');
      if(canBolt) opts.push('bolt', dist>250?'bolt':'bolt');
      if(canNova&&dist<260) opts.push('nova');
      const pick=opts.length?opts[Math.floor(Math.random()*opts.length)]:'melee';
      e.tel=pick; e.telT=TUNE.eTelegraph*(pick==='nova'?1.35:pick==='charge'?.9:1);
    }
  } else if(e.state==='melee'){ e.stateT-=dt; e.vx=lerp(e.vx,0,.3);
    if(e.stateT<=0){e.state='idle';e.cd=rnd(TUNE.eCdMin,TUNE.eCdMax);} }
  else if(e.state==='charge'){ e.stateT-=dt; e.vx=e.chargeDir*430;
    if(Math.abs((p.x+p.w/2)-(e.x+e.w/2))<38&&Math.abs(p.y-e.y)<62){
      hurtPlayer(TUNE.eChargeDmg,e.chargeDir); e.state='recover'; e.stateT=.6; e.vx=0; }
    if(e.stateT<=0){e.state='recover';e.stateT=.5;e.vx=0;} }
  else if(e.state==='recover'){ e.stateT-=dt; e.vx=lerp(e.vx,0,.2);
    if(e.stateT<=0){e.state='idle';e.cd=rnd(TUNE.eCdMin,TUNE.eCdMax);} }
  moveEnemy(e,dt);
}
function moveEnemy(e,dt){
  e.x+=e.vx*dt;
  for(const s of G.solids){if(aabb(e,s)){if(e.vx>0)e.x=s.x-e.w;else if(e.vx<0)e.x=s.x+e.w;e.vx=0;}}
  e.y+=e.vy*dt;
  for(const s of G.solids){if(aabb(e,s)&&e.vy>0){e.y=s.y-e.h;e.vy=0;}}
}
function execPattern(e){
  const p=G.player;
  if(e.tel==='melee'){ e.state='melee'; e.stateT=.3;
    const hb={x:e.face>0?e.x+e.w:e.x-70,y:e.y+8,w:70,h:58};
    shake(.35); burst(e.x+e.w/2+e.face*50,e.y+34,8,{c:'#c9a06a',r:3,life:.25,spMin:40,spMax:160});
    if(aabb(hb,p)) hurtPlayer(TUNE.eMeleeDmg,e.face);
  } else if(e.tel==='charge'){ e.state='charge'; e.stateT=.5; e.chargeDir=sgn((p.x+p.w/2)-(e.x+e.w/2)); }
  else if(e.tel==='bolt'){ e.state='recover'; e.stateT=.35; e.mana=Math.max(0,e.mana-TUNE.eBoltCost);
    for(let i=0;i<3;i++){ const dx=(p.x+p.w/2)-(e.x+e.w/2),dy=(p.y+20)-(e.y+24),d=Math.hypot(dx,dy)||1;
      const sp=rnd(280,340), spread=(i-1)*0.20, ca=Math.atan2(dy,dx)+spread;
      e.bolts.push({x:e.x+e.w/2,y:e.y+24,vx:Math.cos(ca)*sp,vy:Math.sin(ca)*sp,age:0}); }
    sfx('skill');
  } else if(e.tel==='nova'){ e.state='recover'; e.stateT=.6; e.mana=Math.max(0,e.mana-TUNE.eNovaCost);
    e.nova={x:e.x+e.w/2,y:e.y+e.h/2,r:0,age:0,life:.42,hit:false}; shake(.7); sfx('skill'); }
}
function updateEnemyProjectiles(dt){
  const e=G.enemy,p=G.player;
  for(let i=e.bolts.length-1;i>=0;i--){ const b=e.bolts[i]; b.age+=dt; b.x+=b.vx*dt; b.y+=b.vy*dt;
    part(b.x,b.y,{c:'#b98bff',r:2.5,life:.2});
    if(b.age>3||b.x<-100||b.x>1100){e.bolts.splice(i,1);continue;}
    if(p&&!p.dead&&p.iframe<=0&&aabb({x:b.x-8,y:b.y-8,w:16,h:16},p)){hurtPlayer(TUNE.eBoltDmg,sgn(b.vx));e.bolts.splice(i,1);}
  }
  if(e.nova){ const n=e.nova; n.age+=dt; n.r=lerp(0,190,clamp(n.age/n.life,0,1));
    if(!n.hit&&n.age>n.life*.55){ n.hit=true;
      if(p&&!p.dead&&Math.hypot((p.x+p.w/2)-n.x,(p.y+p.h/2)-n.y)<n.r+10) hurtPlayer(TUNE.eNovaDmg,sgn((p.x)-n.x)); }
    if(n.age>=n.life)e.nova=null; }
}

/* ============================ 렌더 ============================ */
let OFF={x:0,y:0};
function w2s(x,y){return {x:x-(G.cam.x-OFF.x)+W/2, y:y-(G.cam.y-OFF.y)+H/2};}
function render(){
  OFF = G.shake>0?{x:rnd(-1,1)*G.shake*11,y:rnd(-1,1)*G.shake*11}:{x:0,y:0};
  ctx.setTransform(1,0,0,1,0,0);
  drawBG();
  ctx.save();
  ctx.translate(W/2,H/2); ctx.translate(-(G.cam.x-OFF.x),-(G.cam.y-OFF.y));
  drawSolids(); drawWaves(); drawEnemy(); drawPlayer(); drawParts();
  ctx.restore();
  drawHUD();
  if(G.flash.a>0){ctx.globalAlpha=G.flash.a;ctx.fillStyle=G.flash.c;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  if(G.help)drawHelp();
}
function drawBG(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0d1220');g.addColorStop(1,'#161d2c');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // 훈련장 느낌 격자 + 원경 기둥
  ctx.strokeStyle='rgba(90,120,170,.06)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.fillStyle='rgba(24,32,48,.85)';
  for(let i=0;i<5;i++){const x=60+i*210; ctx.fillRect(x,120,52,340);}
  const vg=ctx.createRadialGradient(W/2,H/2,140,W/2,H/2,520);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}
function drawSolids(){
  for(const s of G.solids){
    ctx.fillStyle='#232c3d'; ctx.fillRect(s.x,s.y,s.w,s.h);
    ctx.fillStyle='#38455f'; ctx.fillRect(s.x,s.y,s.w,4);
    ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillRect(s.x,s.y+s.h-4,s.w,4);
  }
}
// 급조된 룬 다각형 — jitter 로 일부러 삐뚤게(정식 마법과의 대비 = §1.2 정체성)
function drawRunePoly(r,sides,jitter){
  ctx.beginPath();
  for(let i=0;i<sides;i++){ const a=i/sides*6.283;
    const rr=r*(1+Math.sin(i*2.7)*jitter);
    const x=Math.cos(a)*rr,y=Math.sin(a)*rr;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y); }
  ctx.closePath(); ctx.stroke();
}
function drawWaves(){
  for(const w of G.waves){
    const k=1-w.age/w.life;
    if(w.type==='rune'){
      // 급조된 룬 — 삐뚤빼뚤한 다각형 + 내부 선 (정교하지 않은 게 포인트)
      ctx.save();ctx.translate(w.x,w.y);ctx.rotate((1-k)*0.5);
      ctx.globalAlpha=Math.min(1,(1-k)*3)*k+k*.3;
      ctx.strokeStyle='rgba(190,225,255,.95)';ctx.lineWidth=2;
      drawRunePoly(w.r*(0.6+0.4*(1-k)),6,0.16);
      ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1;
      drawRunePoly(w.r*0.55*(0.6+0.4*(1-k)),3,0.3);
      ctx.restore();ctx.globalAlpha=1;
    } else if(w.type==='shatter'){
      // 룬이 깨지며 전방으로 터지는 마력 파동
      ctx.save();ctx.translate(w.x,w.y);ctx.scale(w.face,1);ctx.globalAlpha=k;
      const grd=ctx.createLinearGradient(0,0,w.r,0);
      grd.addColorStop(0,'rgba(200,225,255,.85)');grd.addColorStop(.55,'rgba(160,205,255,.5)');
      grd.addColorStop(1,'rgba(140,190,255,0)');
      ctx.fillStyle=grd;
      const spread=w.hgt*.5*(0.45+0.55*(1-k)), reach=w.r*(0.35+0.75*(1-k));
      ctx.beginPath();ctx.moveTo(0,-spread*.35);
      ctx.quadraticCurveTo(reach*.6,-spread,reach,0);
      ctx.quadraticCurveTo(reach*.6, spread,0, spread*.35);
      ctx.closePath();ctx.fill();
      // 앞머리 룬 링
      ctx.strokeStyle='rgba(235,247,255,'+(k*.9)+')';ctx.lineWidth=2.5;
      ctx.save();ctx.translate(reach*.85,0);drawRunePoly(16*(0.6+0.6*k),5,0.2);ctx.restore();
      ctx.restore();ctx.globalAlpha=1;
    } else if(w.type==='brandmark'){
      ctx.save();ctx.translate(w.x,w.y);ctx.rotate((1-k)*1.2);ctx.globalAlpha=k;
      ctx.strokeStyle='rgba(201,168,255,.95)';ctx.lineWidth=2.5;
      drawRunePoly(30*(1.4-0.4*k),4,0.22);ctx.restore();ctx.globalAlpha=1;
    } else if(w.type==='detonate'){
      const r=w.r*(0.25+0.95*(1-k));
      ctx.globalAlpha=k*.95;
      const grd=ctx.createRadialGradient(w.x,w.y,r*.15,w.x,w.y,r);
      grd.addColorStop(0,'rgba(245,238,255,.95)');grd.addColorStop(.5,'rgba(180,140,255,.5)');
      grd.addColorStop(1,'rgba(150,110,255,0)');
      ctx.fillStyle=grd;ctx.beginPath();ctx.arc(w.x,w.y,r,0,6.283);ctx.fill();
      ctx.save();ctx.translate(w.x,w.y);ctx.rotate((1-k)*1.6);
      ctx.strokeStyle='rgba(220,200,255,'+k+')';ctx.lineWidth=3;drawRunePoly(r*.92,6,0.14);
      ctx.strokeStyle='rgba(255,255,255,'+(k*.7)+')';ctx.lineWidth=1.5;drawRunePoly(r*.55,3,0.25);
      ctx.restore();ctx.globalAlpha=1;
    } else if(w.type==='whip'){
      // 룬 사슬 채찍 — 사슬 몸체 + 마디마다 작은 룬
      ctx.globalAlpha=k;
      const mx=(w.x+w.ex)/2, my=(w.y+w.ey)/2+18;
      ctx.strokeStyle='rgba(255,150,60,'+(0.85*k)+')';ctx.lineWidth=6;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(w.x,w.y);ctx.quadraticCurveTo(mx,my,w.ex,w.ey);ctx.stroke();
      ctx.strokeStyle='rgba(255,240,200,'+(0.9*k)+')';ctx.lineWidth=2.2;ctx.stroke();
      // 마디 룬 (2차 베지어 위 등간격)
      const N=5;
      for(let i=1;i<=N;i++){ const u=i/(N+1), iu=1-u;
        const px=iu*iu*w.x+2*iu*u*mx+u*u*w.ex, py=iu*iu*w.y+2*iu*u*my+u*u*w.ey;
        ctx.save();ctx.translate(px,py);ctx.rotate(u*3+(w.seed||0));
        ctx.strokeStyle='rgba(255,225,170,'+(k*.95)+')';ctx.lineWidth=1.6;
        drawRunePoly(6.5,3,0.25); ctx.restore(); }
      ctx.globalAlpha=1;
    } else if(w.type==='drain'){
      const t=w.age/w.life;
      const cx=lerp(w.x,w.tx,t*t), cy=lerp(w.y,w.ty,t*t);
      ctx.globalAlpha=1-t; ctx.fillStyle='#7fd0ff';
      ctx.beginPath();ctx.arc(cx,cy,3.5*(1-t*.4),0,6.283);ctx.fill();
      ctx.globalAlpha=(1-t)*.4;ctx.beginPath();ctx.arc(cx,cy,8*(1-t*.4),0,6.283);ctx.fill();
      ctx.globalAlpha=1;
    }
  }
}
function drawPlayer(){
  const p=G.player;if(!p)return;
  for(const a of p.afterimg){const k=1-a.age/.24;ctx.globalAlpha=k*.42;body(a.x,a.y,a.face,p,true);}
  ctx.globalAlpha=1;
  if(p.hurt>0&&Math.floor(G.t*30)%2===0)ctx.globalAlpha=.45;
  body(p.x,p.y,p.face,p,false);ctx.globalAlpha=1;
  // 근접 참격 — 이나리 결: 원호 스윕이 아니라 '직선 일도양단'
  if(p.atk>0){ const since=p.atkDur-p.atk;
    const a0=p.dashAtk?0.02:TUNE.atkWind-0.02, a1=p.dashAtk?0.18:TUNE.atkWind+TUNE.atkActive+0.04;
    if(since>=a0&&since<=a1){
      const prog=clamp((since-a0)/(a1-a0),0,1);
      const cx=p.x+p.w/2,cy=p.y+22;
      const len=(p.dashAtk?TUNE.dashAtkRange:TUNE.atkRange)+34;
      // 콤보 단계별 각도: 1타 수평 / 2타 아래→위 대각 / 3타 위→아래 큰 대각 / 대시공격 = 낮고 긴 수평
      const ang = p.dashAtk?0.02 : (p.comboIdx===1? -0.06 : p.comboIdx===2? -0.42 : 0.46);
      const heavy=p.dashAtk||p.comboIdx>=3;
      slashLine(cx,cy,p.face,len*(0.55+0.45*Math.min(1,prog*2.2)),ang,1-prog,heavy);
      if(p.comboIdx>=3&&!p.dashAtk) // 3타는 교차 2줄
        slashLine(cx,cy,p.face,len*(0.5+0.4*Math.min(1,prog*2)),ang-0.75,(1-prog)*.7,false);
    }
  }
}
// 직선 참격 한 줄 — 가늘고 길게, 끝이 뾰족한 렌즈 형태(카타나 결)
function slashLine(cx,cy,face,len,ang,alpha,heavy){
  if(alpha<=0)return;
  const th=(heavy?13:9);
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(ang*face); ctx.scale(face,1);
  // 본체(렌즈형)
  ctx.globalAlpha=alpha;
  const g=ctx.createLinearGradient(-len*0.25,0,len,0);
  g.addColorStop(0,'rgba(150,200,255,0)');
  g.addColorStop(.35,'rgba(235,247,255,.95)');
  g.addColorStop(1,'rgba(170,215,255,0)');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(-len*0.25,0);
  ctx.quadraticCurveTo(len*0.4,-th, len,0);
  ctx.quadraticCurveTo(len*0.4, th, -len*0.25,0);
  ctx.fill();
  // 심(코어) 라인
  ctx.strokeStyle='rgba(255,255,255,'+(alpha*.95)+')';
  ctx.lineWidth=heavy?2.6:1.8; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-len*0.18,0); ctx.lineTo(len*0.97,0); ctx.stroke();
  if(heavy){ ctx.strokeStyle='rgba(255,226,160,'+(alpha*.6)+')'; ctx.lineWidth=1.2; ctx.stroke(); }
  ctx.restore(); ctx.globalAlpha=1;
}
function body(x,y,face,p,ghost){
  const cx=x+p.w/2,bot=y+p.h,sq=p.squash||1,sw=p.w*(2-sq),sh=p.h*sq,bx=cx-sw/2,by=bot-sh;
  if(!ghost){ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(cx,bot+2,p.w*.6,5,0,0,6.283);ctx.fill();}
  ctx.fillStyle='#1b2130';ctx.fillRect(cx-8,by+sh-15,6,15);ctx.fillRect(cx+2,by+sh-15,6,15);
  ctx.fillStyle='#2b3040';roundRect(bx+2,by+10,sw-4,sh-22,6);ctx.fill();
  ctx.fillStyle='#8f2f36';ctx.fillRect(cx-7,by+16,14,5);
  ctx.fillStyle='#232838';ctx.beginPath();ctx.ellipse(cx,by+8,11,12,0,0,6.283);ctx.fill();
  ctx.beginPath();ctx.moveTo(cx-11,by+10);ctx.lineTo(cx+(face>0?9:-9),by-6);ctx.lineTo(cx+11,by+10);ctx.fill();
  ctx.fillStyle='#d7c48a';ctx.fillRect(cx+(face>0?2:-8),by+5,6,3);
  if(!(p.atk>0)&&p.skill===''){ctx.strokeStyle='#c9d2e0';ctx.lineWidth=2;ctx.beginPath();
    ctx.moveTo(cx+face*10,by+sh-20);ctx.lineTo(cx+face*18,by+sh-30);ctx.stroke();}
}

  ctx.fillStyle='#9fb0c8';ctx.fillText('H 를 다시 눌러 닫기',W/2,H-40);ctx.textAlign='left';
}

/* ============================ 튜닝 패널 ============================ */
const panel=document.getElementById('panel');
let panelBuilt=false;
function buildPanel(){
  let html='<div style="font-size:13px;color:#9fd8ff;font-weight:bold;margin-bottom:4px">튜닝 패널 (F1)</div>'+
    '<div style="font-size:11px;color:#8b98ad;margin-bottom:6px">값을 바꾸면 즉시 반영. 리셋해야 적용되는 값(체력·마나 최대치)은 <b>적용+리셋</b>.</div>';
  for(const [group,items] of TUNE_SPEC){
    html+='<h3>'+group+'</h3>';
    for(const [key,label,min,max,step] of items){
      html+='<div class="row"><label>'+label+'</label>'+
        '<input type="range" data-k="'+key+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+TUNE[key]+'">'+
        '<span class="v" id="v_'+key+'">'+TUNE[key]+'</span></div>';
    }
  }
  html+='<div class="btns"><button id="btnReset">적용 + 리셋</button>'+
    '<button id="btnDummy">더미 모드 토글</button><button id="btnDefault">기본값 복원</button>'+
    '<button id="btnCopy">수치 복사(JSON)</button></div>'+
    '<div id="copied" style="font-size:11px;color:#7fd0ff;margin-top:6px"></div>';
  panel.innerHTML=html;
  panel.querySelectorAll('input[type=range]').forEach(inp=>{
    inp.addEventListener('input',()=>{const k=inp.dataset.k;TUNE[k]=parseFloat(inp.value);
      document.getElementById('v_'+k).textContent=(Math.round(TUNE[k]*100)/100);});
  });
  document.getElementById('btnReset').onclick=()=>{resetAll();cv.focus();};
  document.getElementById('btnDummy').onclick=()=>{G.dummy=!G.dummy;cv.focus();};
  document.getElementById('btnDefault').onclick=()=>{Object.assign(TUNE,JSON.parse(DEFAULTS));
    panel.querySelectorAll('input[type=range]').forEach(i=>{i.value=TUNE[i.dataset.k];
      document.getElementById('v_'+i.dataset.k).textContent=TUNE[i.dataset.k];});resetAll();cv.focus();};
  document.getElementById('btnCopy').onclick=()=>{
    const s=JSON.stringify(TUNE,null,1);
    navigator.clipboard&&navigator.clipboard.writeText(s);
    document.getElementById('copied').textContent='복사됨 — 마음에 드는 수치가 나오면 붙여넣어 알려주세요.';};
  panelBuilt=true;
}
const DEFAULTS=JSON.stringify(TUNE);
function togglePanel(){ if(!panelBuilt)buildPanel();
  panel.style.display = panel.style.display==='block'?'none':'block'; cv.focus(); }

/* ============================ 루프 ============================ */
function update(dt){
  G.t+=dt;
  if(P('help'))G.help=!G.help;
  if(P('reset'))resetAll();
  if(P('dummy')){G.dummy=!G.dummy;toast(G.dummy?'더미 모드 ON (적이 반격하지 않음)':'더미 모드 OFF',2);}
  if(P('mute')){muted=!muted;if(!muted)actx();toast(muted?'🔇 음소거':'🔊 소리 켜짐',1.5);}
  if(G.help){clearP();return;}
  if(G.manaDeny>0)G.manaDeny=Math.max(0,G.manaDeny-dt*2);
  if(G.hitstop>0){G.hitstop-=dt;clearP();
    G.shake=Math.max(0,G.shake-dt*2.4);return;}
  if(!G.killed&&G.player&&!G.player.dead)G.killTimer+=dt;

  updatePlayer(dt); updateEnemy(dt);
  // 파티클
  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.age+=dt;
    if(p.age>=p.life){G.parts.splice(i,1);continue;}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  for(let i=G.floats.length-1;i>=0;i--){const f=G.floats[i];f.age+=dt;f.y+=f.vy*dt;f.vy*=0.94;
    if(f.age>=f.life)G.floats.splice(i,1);}
  for(let i=G.waves.length-1;i>=0;i--){const w=G.waves[i];w.age+=dt;if(w.age>=w.life)G.waves.splice(i,1);}
  // 카메라(플레이어·적 중간, 완만)
  const p=G.player,e=G.enemy;
  const tx=e&&e.alive?clamp((p.x+e.x)/2+20,380,600):clamp(p.x,380,600);
  G.cam.x=lerp(G.cam.x,tx,1-Math.pow(.002,dt));
  G.cam.y=lerp(G.cam.y,clamp(p.y-40,240,330),1-Math.pow(.004,dt));
  G.shake=Math.max(0,G.shake-dt*2.4);
  if(G.flash.a>0)G.flash.a=Math.max(0,G.flash.a-dt*2.2);
  if(G.toast.t>0)G.toast.t-=dt;
  clearP();
}
let last=performance.now();
function frame(now){let dt=(now-last)/1000;last=now;dt=clamp(dt,0,1/30);G.dt=dt;
  update(dt);render();requestAnimationFrame(frame);}
resetAll();
requestAnimationFrame(frame);
</script>
