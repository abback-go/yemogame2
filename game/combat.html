/* ============================ 유틸 ============================ */
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a), sgn=v=>v<0?-1:1;
const aabb=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

let AC=null,muted=true;
function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function sfx(t){ if(muted)return; const ac=actx(); if(!ac)return;
  const now=ac.currentTime,o=ac.createOscillator(),g=ac.createGain(); o.connect(g);g.connect(ac.destination);
  let f=300,d=.08,v=.10,w='square';
  if(t==='hit'){f=210;d=.07;v=.13;}
  else if(t==='hit3'){f=150;d=.14;v=.18;}
  else if(t==='dash'){f=340;d=.10;w='sawtooth';v=.08;}
  else if(t==='jump'){f=520;d=.09;w='sine';}
  else if(t==='craft'){f=760;d=.09;w='triangle';v=.07;}
  else if(t==='throw'){f=430;d=.09;w='sawtooth';v=.10;}
  else if(t==='skill'){f=680;d=.16;w='sine';v=.12;}
  else if(t==='boom'){f=110;d=.28;w='sawtooth';v=.18;}
  else if(t==='shroud'){f=300;d=.30;w='sine';v=.11;}
  else if(t==='hurt'){f=150;d=.15;w='sawtooth';v=.14;}
  else if(t==='deny'){f=110;d=.10;w='square';v=.10;}
  o.type=w;o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(Math.max(40,f*.4),now+d);
  g.gain.setValueAtTime(v,now);g.gain.exponentialRampToValueAtTime(.001,now+d);o.start(now);o.stop(now+d+.02);}

const G={t:0,dt:0,hitstop:0,shake:0,slow:0,zoom:0,shakeV:{x:0,y:0},tscale:1,
  edge:{a:0,c:'255,255,255'},
  parts:[],floats:[],flash:{a:0,c:'#fff'},
  cam:{x:480,y:300},solids:[],player:null,enemy:null,help:false,dummy:false,
  killTimer:0,killed:false,killTime:0,dmgDealt:0,toast:{t:0,txt:''},waves:[],
  javs:[],meteors:[],fields:[],pillars:[],walls:[],manaDeny:0};

function toast(txt,d){G.toast={txt,t:d||2};}
function part(x,y,o){G.parts.push(Object.assign({x,y,vx:0,vy:0,g:0,life:.5,age:0,r:3,c:'#fff'},o));}
function burst(x,y,n,o){for(let i=0;i<n;i++){const a=rnd(0,6.283),s=rnd(o.spMin||40,o.spMax||200);
  part(x,y,Object.assign({},o,{vx:Math.cos(a)*s,vy:Math.sin(a)*s}));}}
// 원뿔형 분사 — dir 방향 ±40도로 튄다
function cone(x,y,dir,n,o){
  const base=dir>=0?0:Math.PI;
  for(let i=0;i<n;i++){ const a=base+rnd(-.7,.7)-rnd(0,.35), sp=rnd(o.spMin||60,o.spMax||240);
    part(x,y,Object.assign({},o,{vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-rnd(0,90)})); } }
// 화면 가장자리 임팩트 — 큰 타격에 테두리가 속성색으로 번쩍인다
function edgePunch(el,a){ G.edge={a:a,c:EL[el||CUR].col.glow}; }
function fnum(x,y,txt,c,big){G.floats.push({x,y,txt,c:c||'#fff',age:0,life:.85,big:!!big,vy:-32});}
// 방향성 셰이크: dx,dy를 주면 그 방향으로 화면이 "밀린다" — 어디서 맞았는지가 몸으로 읽힌다
function shake(a,dx,dy){
  G.shake=Math.max(G.shake,a*TUNE.shakeAmt/0.42);
  if(dx!==undefined){ const m=a*TUNE.shakeDir*13;
    G.shakeV.x=clamp(G.shakeV.x+dx*m,-34,34);
    G.shakeV.y=clamp(G.shakeV.y+(dy||0)*m,-26,26); } }
// 히트스톱 + 슬로우 꼬리 + 줌 펀치를 한 번에. z=줌 배율(0이면 줌 없음)
function hitstop(s,z){
  G.hitstop=Math.max(G.hitstop,s);
  const ratio=s/Math.max(.001,TUNE.hitstop);
  G.slow=Math.max(G.slow,TUNE.slowTail*clamp(ratio,.5,2.2));
  if(z) G.zoom=Math.max(G.zoom,TUNE.zoomPunch*z); }
// 임팩트 방사선 — 타격 지점에서 짧고 굵게 뻗었다 사라진다
function impact(x,y,dir,heavy,el){
  const n=TUNE.impactLines|0; if(n<=0)return;
  G.waves.push({type:'impact',x,y,age:0,life:heavy?.24:.16,
    r:TUNE.impactLen*(heavy?1.5:1),n:heavy?n:Math.max(3,n-2),
    ang:Math.atan2(0,dir)+rnd(-.3,.3),el:el||CUR,big:!!heavy}); }
// 속성 잔입자 — 불은 떠오르고, 물은 가라앉고, 바람은 흩어지고, 흙은 떨어진다
function motes(x,y,n,spread,el){ const c=EL[el||CUR].col, k=el||CUR;
  for(let i=0;i<(n||1);i++){
    const o={c:Math.random()<.5?c.mid:c.edge,r:rnd(1.4,3.2),life:rnd(.25,.6),vx:rnd(-26,26)};
    if(k==='fire'){o.vy=-rnd(28,86);o.g=-40;}
    else if(k==='water'){o.vy=-rnd(4,26);o.g=90;}
    else if(k==='wind'){o.vx=rnd(-90,90);o.vy=rnd(-40,40);o.g=0;}
    else {o.vy=-rnd(20,60);o.g=460;}
    part(x+rnd(-(spread||6),spread||6),y+rnd(-(spread||6),spread||6),o); } }

function switchElement(k){
  if(!EL[k]||k===CUR)return;
  CUR=k; const p=G.player;
  if(p){ p.cast=0;p.skill='';p.comboIdx=0;p.shroud=0;p.gale=0; }

function updatePlayer(dt){
  const p=G.player; if(!p)return; const t=T();
  p.dashCd=Math.max(0,p.dashCd-dt); p.iframe=Math.max(0,p.iframe-dt);
  p.hurt=Math.max(0,p.hurt-dt); p.coyote=Math.max(0,p.coyote-dt); p.buffer=Math.max(0,p.buffer-dt);
  p.cd1=Math.max(0,p.cd1-dt); p.cd2=Math.max(0,p.cd2-dt); p.cd3=Math.max(0,p.cd3-dt);
  p.comboT=Math.max(0,p.comboT-dt); if(p.comboT<=0&&p.cast<=0)p.comboIdx=0;
  if(TUNE.manaRegen>0) p.mana=Math.min(TUNE.manaMax,p.mana+TUNE.manaRegen*dt);
  // 얼음 갑주 지속
  if(p.shield>0){ p.shieldT-=dt;
    if(Math.random()<.35) motes(p.x+p.w/2+rnd(-16,16),p.y+rnd(4,40),1,3,'water');
    if(p.shieldT<=0) shieldBreak(p,false); }
  // 염화 외피 (무적 지속)
  if(p.shroud>0){
    p.shroud-=dt; p.iframe=Math.max(p.iframe,dt+.02);
    motes(p.x+p.w/2+rnd(-14,14),p.y+rnd(4,40),1,3,'fire');
    if(p.shroud<=0){ p.shroud=0; shroudBurst(p); }
  }
  // 질풍 (고속 이동 + 무적)
  if(p.gale>0){
    p.gale-=dt; p.iframe=Math.max(p.iframe,dt+.02); p.vy=0;
    p.vx=p.galeDir*(T().s3Dist/Math.max(.01,T().s3Time));
    p.afterimg.push({x:p.x,y:p.y,face:p.face,age:0});
    motes(p.x+p.w/2,p.y+rnd(6,40),1,8,'wind');
    const e=G.enemy;
    if(e&&e.alive&&!p.skillHit.has('gale')&&aabb({x:p.x-4,y:p.y,w:p.w+8,h:p.h},e)){
      p.skillHit.add('gale'); dealDamage(e,T().s3Dmg,p.galeDir,true);
      hitstop(TUNE.hitstop*1.4,.5); shake(.6,0,1);
    }
    if(p.gale<=0){ p.gale=0; p.vx*=.25; }
  }

  p.meleeT=Math.max(0,p.meleeT-dt); if(p.meleeT<=0&&p.melee<=0)p.meleeIdx=0;
  p.bladeSpawn=Math.max(0,p.bladeSpawn-dt); p.bladeFxCd=Math.max(0,p.bladeFxCd-dt);
  bladeCheck(p);
  const busy = p.skill!=='' || p.cast>0 || p.melee>0 || p.dashPrep>0 || p.shroud>0 || p.gale>0;
  const canAct = !p.dead;

  if(canAct&&!busy&&p.dashT<=0){
    if(P('sk1'))trySkill(0); else if(P('sk2'))trySkill(1); else if(P('sk3'))trySkill(2);
  }
  // 대시
  if(canAct&&P('dash')&&p.dashCd<=0&&p.dashT<=0&&p.dashPrep<=0&&p.skill===''&&p.shroud<=0&&p.gale<=0){
    p.dashPrep=TUNE.dashPrep; p.dashCd=TUNE.dashCd;
    p.iframe=Math.max(p.iframe,TUNE.dashPrep+TUNE.dashIframe);
    p.cast=0;p.dashPassed=false;
    let ix=(KEY.left?-1:0)+(KEY.right?1:0); if(ix!==0)p.face=ix;
    sfx('dash');
    const c=C();
    for(let i=0;i<8;i++){const a=rnd(0,6.283),d=rnd(26,52);
      part(p.x+p.w/2+Math.cos(a)*d,p.y+26+Math.sin(a)*d*.6,
        {c:c.mid,r:2.4,life:TUNE.dashPrep+.05,vx:-Math.cos(a)*d*7,vy:-Math.sin(a)*d*4});}
  }
  if(p.dashPrep>0){ p.dashPrep-=dt; p.vx=0; p.squash=.66;
    if(p.dashPrep<=0){ p.dashT=TUNE.dashTime; p.dashStart=TUNE.dashTime;
      burst(p.x+p.w/2,p.y+26,10,{c:C().core,r:3,life:.28,spMin:60,spMax:220});
      // 돌진 이펙트 — 가로로 길게 늘어난 창 + 균열 + 속도선
      if(TUNE.dashFxLen>0) G.waves.push({type:'dash',x:p.x+p.w/2,y:p.y+26,age:0,
        life:TUNE.dashFxLife,r:TUNE.dashFxLen,face:p.face,el:CUR,
        seed:Math.floor(Math.random()*997)});
      cone(p.x+p.w/2-p.face*20,p.y+26,-p.face,12,
        {c:C().mid,r:2.6,life:.30,g:120,spMin:180,spMax:520});
      shake(.30,p.face,0); } }

  // 기본공격
  if(canAct&&P('attack')&&p.skill===''&&p.dashPrep<=0&&p.shroud<=0&&p.gale<=0){
    if(p.melee>0){ const since=p.meleeDur-p.melee; if(since>=TUNE.meleeWind*0.8) p.meleeQ=true; }
    else if(p.cast>0){ const since=p.castDur-p.cast; if(since>=t.javWind*0.8) p.queued=true; }
    else if(p.bladeOn) startMelee(p);   // 손에 검이 쥐어져 있으면 휘두른다
    else startCast(p);
  }
  // 점프
  if(canAct&&P('jump'))p.buffer=TUNE.jumpBuffer;
  if(p.buffer>0&&(p.onGround||p.coyote>0)&&p.dashT<=0&&p.skill===''&&p.gale<=0){
    p.vy=-TUNE.jumpV;p.buffer=0;p.coyote=0;p.onGround=false;p.squash=.72;sfx('jump');
    burst(p.x+p.w/2,p.y+p.h,7,{c:'#aab6cc',r:2.5,life:.28,g:520,spMin:20,spMax:95});
  }
  if(!KEY.jump&&p.vy<-TUNE.jumpCut&&p.dashT<=0)p.vy=-TUNE.jumpCut;

  // 이동/물리
  if(p.gale>0){ /* 질풍이 vx 통제 */ }
  else if(p.dashPrep>0){ p.vx=0; p.vy=0; }
  else if(p.dashT>0){ p.dashT-=dt; p.vy=0;
    const k=1-clamp(p.dashT/Math.max(.01,p.dashStart||TUNE.dashTime),0,1);
    p.vx=p.face*TUNE.dashSpeed*lerp(TUNE.dashBurst,TUNE.dashEnd,k*k);
    if(TUNE.dashGhost>0){ p.afterimg.push({x:p.x,y:p.y,face:p.face,age:0});
      if(Math.random()<TUNE.dashGhost*.6)p.afterimg.push({x:p.x-p.face*9,y:p.y,face:p.face,age:.05}); }
    const e=G.enemy;
    if(e&&e.alive&&!p.dashPassed&&aabb(p,e)){ p.dashPassed=true;
      hitstop(TUNE.hitstop*.5); shake(.3,0,-1); const c=C();
      for(let i=0;i<12;i++)part(p.x+p.w/2,p.y+rnd(6,40),
        {c:i%2?c.core:c.edge,r:rnd(1.5,3.5),life:rnd(.15,.32),vx:-p.face*rnd(120,340),vy:rnd(-90,90)});
    }
  }
  else {
    let ix=0; if(!p.dead){ if(KEY.left)ix-=1; if(KEY.right)ix+=1; }
    let mult=1;
    if(p.cast>0) mult=t.javMoveMult;
    else if(p.shroud>0) mult=t.s3MoveMult!==undefined?t.s3MoveMult:0.6;
    else if(p.skill!=='') mult=0;
    if(mult>0){ if(ix!==0){ if(p.cast<=0)p.face=ix; p.vx=lerp(p.vx,ix*TUNE.moveSpeed*mult,1-Math.pow(.0005,dt)); }
      else p.vx=lerp(p.vx,0,1-Math.pow(.0004,dt)); }
    else p.vx=lerp(p.vx,0,1-Math.pow(.02,dt));
    p.vy+=TUNE.gravity*dt;
  }

  // 근접 진행
  if(p.melee>0){ p.melee-=dt; const since=p.meleeDur-p.melee;
    if(!p.meleeFired&&since>=TUNE.meleeWind){ p.meleeFired=true; meleeStrike(p); }
    if(p.melee<=0){ p.melee=0; if(p.meleeQ&&p.meleeIdx<3){ p.meleeQ=false; startMelee(p); } else p.meleeQ=false; }
  }
  // 시전 진행
  if(p.cast>0){ p.cast-=dt; const since=p.castDur-p.cast;
    if(!p.castFired&&since>=t.javWind){ p.castFired=true; fireJavelin(p); }
    if(p.cast<=0){ if(p.queued){p.queued=false; startCast(p);} else p.queued=false; }
  }
  if(p.skill!=='') updateSkill(p,dt);

  collide(p,dt);
  p.animRun+=Math.abs(p.vx)*dt*.06;
  p.squash=lerp(p.squash,1,1-Math.pow(.0001,dt));
  for(let i=p.afterimg.length-1;i>=0;i--){p.afterimg[i].age+=dt;if(p.afterimg[i].age>.24)p.afterimg.splice(i,1);}
  if(p.hp<=0&&!p.dead){p.dead=true;onDeath();}
}
function collide(p,dt){
  p.x+=p.vx*dt;
  for(const s of G.solids){if(aabb(p,s)){if(p.vx>0)p.x=s.x-p.w;else if(p.vx<0)p.x=s.x+s.w;p.vx=0;}}
  p.y+=p.vy*dt;p.onGround=false;
  for(const s of G.solids){if(aabb(p,s)){
    if(p.vy>0){p.y=s.y-p.h;p.onGround=true;if(p.vy>420)p.squash=.74;p.vy=0;p.coyote=TUNE.coyote;}
    else if(p.vy<0){p.y=s.y+s.h;p.vy=0;}}}
  if(p.onGround)p.coyote=TUNE.coyote;
}

/* =================== 근접 「불의 검」 (시험 구현) ===================
   판정: 사거리 안에 들어오면 손에 검이 잡힌다 → 누르기 전에 뭐가 나올지 보인다.
   히스테리시스로 경계 깜빡임을 막고, 애매하면 근접 쪽으로 기운다.       */
// 가로 베기 — 세로로 둥글게 돌리지 않는다. 얕은 각으로 앞을 쓸어 벤다.
const SWING={1:{from:0.40,to:-0.26},2:{from:-0.38,to:0.30},3:{from:0.52,to:-0.44}};
function bladeCheck(p){
  const was=p.bladeOn;
  let on=false;
  if(TUNE.meleeOn&&CUR==='fire'&&!p.dead){
    if(TUNE.meleeMode===2) on=!!KEY.down;
    else if(TUNE.meleeMode===1) on=p.dashCd>TUNE.dashCd-0.32;
    else { const e=G.enemy;
      if(e&&e.alive){ const px=p.x+p.w/2, dx=(e.x+e.w/2-px)*p.face,
        dy=Math.abs((e.y+e.h/2)-(p.y+p.h/2));
        const R=TUNE.meleeRange+(was?TUNE.meleeHyst:0);
        on = dx>-38 && dx<R && dy<76; } }
  }
  p.bladeOn=on;
  if(on&&!was&&p.bladeFxCd<=0) forgeBlade(p);
  if(!on&&was&&p.bladeSpawn>0) p.bladeSpawn=0;
}
// 검이 생겨나는 연출 — 그냥 나타나지 않는다. 불티가 모이고, 광선이 서고, 스파이크가 터진다
function forgeBlade(p){
  const c=C(), ox=p.x+p.w/2+p.face*6, oy=p.y+24;
  p.bladeSpawn=TUNE.bladeForge; p.bladeFxCd=TUNE.bladeForgeCd;
  G.waves.push({type:'forge',x:ox,y:oy,age:0,life:TUNE.bladeForge*1.25,
    r:TUNE.bladeLen,face:p.face,el:CUR,seed:Math.floor(Math.random()*997)});
  G.waves.push({type:'impact',x:ox,y:oy,age:0,life:.26,r:104,n:11,ang:0,el:CUR,big:true});
  for(let i=0;i<24;i++){ const a=rnd(0,6.283), d=rnd(48,130);
    part(ox+Math.cos(a)*d,oy+Math.sin(a)*d,
      {c:i%3?c.mid:c.core,r:rnd(1.6,3.6),life:TUNE.bladeForge*0.95,
       vx:-Math.cos(a)*d*6.5,vy:-Math.sin(a)*d*6.5}); }
  shake(.5,0,0); edgePunch(CUR,.22); sfx('craft');

function startMelee(p){
  p.meleeIdx=(p.meleeT>0&&p.meleeIdx<3)?p.meleeIdx+1:1;
  p.meleeT=TUNE.meleeCombo; p.meleeQ=false;
  const last=p.meleeIdx>=3;
  p.dashSlash = p.dashCd>TUNE.dashCd-0.30;   // 대시 직후 = 강화판
  p.meleeDur=TUNE.meleeWind+(last?TUNE.meleeRec3:TUNE.meleeRec);
  p.melee=p.meleeDur; p.meleeFired=false;
  p.vx*=0.25;                       // 발을 붙이고 당긴다 — 예비동작에 체중이 실린다
  sfx('craft');
  // 예비동작 동안 검으로 불티가 빨려 들어온다
  const c=C(), hx=p.x+p.w/2-p.face*10, hy=p.y+24;
  for(let i=0;i<12;i++){ const a=rnd(0,6.283), d=rnd(34,80);
    part(hx+Math.cos(a)*d,hy+Math.sin(a)*d,
      {c:i%2?c.mid:c.core,r:rnd(1.8,3.4),life:TUNE.meleeWind+.04,
       vx:-Math.cos(a)*d*7,vy:-Math.sin(a)*d*7}); }
}
function meleeStrike(p){
  const c=C(), e=G.enemy, last=p.meleeIdx>=3, boost=p.dashSlash?TUNE.dashSlashMult:1;
  const ox=p.x+p.w/2, oy=p.y+22;

  G.waves.push({type:'slash',x:ox,y:oy,age:0,life:last?.26:.19,r:reach,
    face:p.face,el:CUR,idx:p.meleeIdx,big:last,boost:p.dashSlash?1:0});
  p.vx += p.face*(last?TUNE.meleeStep3:TUNE.meleeStep)*(p.dashSlash?1.25:1);
  sfx('throw');
  if(e&&e.alive){
    const dx=(e.x+e.w/2-ox)*p.face, dy=(e.y+e.h/2)-oy;
    if(dx>-40 && dx<reach && Math.abs(dy)<82){
      const base=last?TUNE.meleeDmg3:(p.meleeIdx===2?TUNE.meleeDmg2:TUNE.meleeDmg1);
      dealDamage(e,Math.round(base*boost),p.face,true,CUR,TUNE.meleeStagger);
      // 묵직함 = 히트스톱보다 그 뒤의 슬로우 꼬리에서 나온다
      hitstop(TUNE.hitstop*(last?4.2:2.6), last?1.7:.9);
      G.slow=Math.max(G.slow,TUNE.slowTail*(1+TUNE.meleeSlow*(last?2.2:1)));
      shake(last?1.6:1.0, p.face, p.meleeIdx===1?-.6:p.meleeIdx===2?.6:0);
      sfx(last?'boom':'hit3');
      edgePunch(CUR,last?.55:.32);
      G.waves.push({type:'boom',x:e.x+e.w/2,y:e.y+e.h*.45,age:0,life:last?.42:.30,
        r:last?110:74,el:CUR});
    }
  }
}
// 레퍼런스: 긴 발광 직검 — 방사형 스파이크 가드 · 뾰족한 끝 · 중앙 코어 라인
function drawBlade(len,al,c,grow){
  if(al<=0.01)return;
  grow=(grow===undefined)?1:clamp(grow,0,1);
  const ease=Math.pow(grow,0.5);
  const w0=10*(0.35+0.65*ease), tip=len*ease;
  const spk=1+(1-grow)*2.6;          // 가드 스파이크가 크게 터졌다 수축한다
  const g=ctx.createLinearGradient(0,0,tip,0);
  g.addColorStop(0,'rgba('+c.glow+','+(al*.85)+')');
  g.addColorStop(.35,'rgba(255,206,96,'+(al*.95)+')');
  g.addColorStop(.8,'rgba(255,236,160,'+(al*.95)+')');
  g.addColorStop(1,'rgba(255,255,255,'+(al*.5)+')');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(-16,0);
  ctx.lineTo(4,-w0*.5); ctx.lineTo(tip*.80,-w0*.30); ctx.lineTo(tip,0);
  ctx.lineTo(tip*.80,w0*.30); ctx.lineTo(4,w0*.5);
  ctx.closePath(); ctx.fill();
  // 외곽 열기
  ctx.strokeStyle='rgba('+c.glow+','+(al*.45)+')'; ctx.lineWidth=5; ctx.stroke();
  // 중앙 코어 라인
  ctx.strokeStyle='rgba(255,255,255,'+(al*.95)+')'; ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.moveTo(2,0); ctx.lineTo(tip*.96,0); ctx.stroke();
  // 방사형 가드 스파이크 — 레퍼런스의 별 모양
  ctx.lineCap='round';
  for(let i=0;i<9;i++){
    const a=i/9*6.283+0.35, L=((i%2)?23:14)*spk;
    ctx.strokeStyle='rgba(255,232,150,'+(al*.9)+')'; ctx.lineWidth=(i%2)?3.2:2;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*L,Math.sin(a)*L); ctx.stroke(); }
  // 가드 백열
  const cg=ctx.createRadialGradient(0,0,1,0,0,18);
  cg.addColorStop(0,'rgba(255,255,255,'+al+')');
  cg.addColorStop(.5,'rgba(255,210,110,'+(al*.5)+')');
  cg.addColorStop(1,'rgba('+c.glow+',0)');
  ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(0,0,18,0,6.283); ctx.fill();
  // 자루 + 끝의 뾰족한 것
  ctx.strokeStyle='rgba(255,178,84,'+(al*.85)+')'; ctx.lineWidth=4.5;
  ctx.beginPath(); ctx.moveTo(-5,0); ctx.lineTo(-22,0); ctx.stroke();
  ctx.strokeStyle='rgba(255,232,150,'+(al*.7)+')'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(-22,0); ctx.lineTo(-32,-4); ctx.stroke();
}

/* ================= 기본공격 — 속성별 "빚어서 던진다" ================= */
function startCast(p){
  const t=T(), c=C();
  p.comboIdx=(p.comboT>0&&p.comboIdx<3)?p.comboIdx+1:1;
  p.comboT=t.javCombo; p.queued=false;
  const last=p.comboIdx>=3;
  p.castDur=t.javWind+(last?t.javRec3:t.javRec);
  p.cast=p.castDur; p.castFired=false;
  p.aim = KEY.up?-1:(KEY.down?1:0);
  sfx('craft');
  // 모여드는 연출 — 속성마다 모이는 방식이 다르다
  const hx=p.x+p.w/2+p.face*20, hy=p.y+20, st=E().craft;
  const n = st==='gather'?9 : st==='swirl'?11 : 7;
  for(let i=0;i<n;i++){
    const a=rnd(0,6.283), d=rnd(20,52);
    const o={c:i%2?c.mid:c.edge,r:rnd(1.6,3),life:t.javWind+.05,
      vx:-Math.cos(a)*d*8,vy:-Math.sin(a)*d*8};
    if(st==='gather'){ o.r=rnd(2.2,4.2); o.g=380; o.c=i%3?c.edge:c.dark; }   // 흙: 무겁게 굴러 모임
    if(st==='swirl'){ o.vx+=-Math.sin(a)*d*6; o.vy+=Math.cos(a)*d*6; o.r=rnd(1.2,2.4); } // 바람: 소용돌이로
    if(st==='freeze'){ o.c=i%3?c.mid:c.core; }                                // 물: 물방울이 모여
    part(hx+Math.cos(a)*d,hy+Math.sin(a)*d,o);
  }
}
function javOrigin(p){ return {x:p.x+p.w/2+p.face*22, y:p.y+20}; }
function fireJavelin(p){
  const t=T(), c=C(), last=p.comboIdx>=3, o=javOrigin(p);
  const ang=p.aim*TUNE.javAimAng;
  const dirx=Math.cos(ang)*p.face, diry=Math.sin(ang);
  // javLob = 살짝 위로 던지는 초기 상승 (중력형 투사체의 사거리를 벌어준다)
  G.javs.push({x:o.x,y:o.y,vx:dirx*t.javSpeed,vy:diry*t.javSpeed-(t.javLob||0),
    dmg:last?t.javDmg3:(p.comboIdx===2?t.javDmg2:t.javDmg1),
    pierce:t.javPierce+(last?1:0), big:last, el:CUR, spin:0,
    face:p.face, hit:new Set(), travelled:0, age:0, trail:[]});
  // 1·2연은 반동으로 물러나고, 마무리(3연)는 앞으로 파고든다 — 콤보 끝에 체중이 실린다
  p.vx += last ? p.face*t.javKick*2.2 : -p.face*t.javKick;
  sfx('throw'); shake(last?.30:.14);
  G.waves.push({type:'muzzle',x:o.x,y:o.y,face:p.face,ang:ang,age:0,life:.14,big:last,el:CUR});
  // 물 = 발사 순간 얼어붙는 서리 반짝
  if(E().craft==='freeze') for(let i=0;i<8;i++)part(o.x,o.y,
    {c:'#ffffff',r:rnd(1.2,2.6),life:rnd(.1,.24),vx:rnd(-140,140),vy:rnd(-140,140)});
  for(let i=0;i<(last?10:5);i++)part(o.x,o.y,
    {c:i%2?c.core:c.edge,r:rnd(1.8,3.8),life:rnd(.14,.3),
     vx:dirx*rnd(60,220)+rnd(-50,50),vy:diry*rnd(60,220)+rnd(-50,50)});
}
function updateJavelins(dt){
  const e=G.enemy;
  for(let i=G.javs.length-1;i>=0;i--){
    const j=G.javs[i], t=TUNE.el[j.el], c=EL[j.el].col; j.age+=dt;
    if(t.javGrav>0) j.vy+=t.javGrav*dt;             // 땅 = 포물선
    if(j.el==='earth') j.spin+=dt*10*(j.big?.7:1);
    const step=Math.hypot(j.vx,j.vy)*dt;
    j.x+=j.vx*dt; j.y+=j.vy*dt; j.travelled+=step;
    j.trail.push({x:j.x,y:j.y}); if(j.trail.length>13)j.trail.shift();
    if(Math.random()<.7) motes(j.x-j.vx*dt*.5,j.y-j.vy*dt*.5,1,2,j.el);
    if(j.travelled>=t.javRange){ javFizzle(j); G.javs.splice(i,1); continue; }
    let hitSolid=false;
    for(const s of G.solids){ if(aabb({x:j.x-5,y:j.y-5,w:10,h:10},s)){hitSolid=true;break;} }
    if(hitSolid){ javImpact(j); G.javs.splice(i,1); continue; }
    if(e&&e.alive&&!j.hit.has(e)&&aabb({x:j.x-9,y:j.y-9,w:18,h:18},e)){
      j.hit.add(e);
      dealDamage(e,j.dmg,sgn(j.vx)||1,j.big,j.el,t.javStagger);
      applyStatus(e,j.el,t.javStat);
      onBrandHit(e);
      hitstop(TUNE.hitstop*(j.big?2.0:.95), j.big?1.0:.35); shake(j.big?.75:.34,sgn(j.vx)||j.face,0); sfx(j.big?'hit3':'hit');
      j.pierce-=1;
      if(j.pierce<=0){ javImpact(j); G.javs.splice(i,1); continue; }
    }
  }
}
function javImpact(j){
  const t=TUNE.el[j.el], c=EL[j.el].col, e=G.enemy;
  burst(j.x,j.y,j.big?16:10,{c:c.mid,r:3,life:.34,g:j.el==='earth'?420:160,spMin:70,spMax:j.big?320:220});
  burst(j.x,j.y,4,{c:c.core,r:2,life:.18,spMin:120,spMax:300});

  // 땅 = 착탄 충격 (작은 범위 피해)
  if(t.javImpactR>0){

    shake(.35);
    if(e&&e.alive&&!j.hit.has('imp')&&Math.hypot((e.x+e.w/2)-j.x,(e.y+e.h/2)-j.y)<t.javImpactR+16){
      dealDamage(e,Math.round(j.dmg*.5),sgn((e.x+e.w/2)-j.x)||1,false,j.el,t.javStagger);
    }

}
function javFizzle(j){
  const c=EL[j.el].col, n=j.big?12:8;
  for(let i=0;i<n;i++) part(j.x-j.vx*0.02*rnd(0,1),j.y-j.vy*0.02*rnd(0,1),
    {c:Math.random()<.5?c.mid:c.edge,r:rnd(1.6,3.4),life:rnd(.28,.55),
     vx:j.vx*rnd(.04,.14)+rnd(-40,40),vy:-rnd(20,70),g:j.el==='earth'?420:-50});
  G.waves.push({type:'fizzle',x:j.x,y:j.y,ang:Math.atan2(j.vy,j.vx),age:0,life:.26,big:j.big,el:j.el});

/* ======================= 상태이상 ======================= */
function applyStatus(e,el,stacks){
  if(!stacks||stacks<=0||!e.alive)return;
  const st=EL[el].status; if(!st)return;
  const t=TUNE.el[el];
  e.st=e.st||{};
  e.st[st]=e.st[st]||{n:0,t:0,tick:0,el:el};
  e.st[st].n=Math.min(t.stMax,e.st[st].n+stacks);
  e.st[st].t=t.stDur;
}
function updateStatus(e,dt){
  if(!e.st)return;
  for(const k in e.st){
    const s=e.st[k]; if(!s||s.n<=0){delete e.st[k];continue;}
    const t=TUNE.el[s.el];
    s.t-=dt;
    motes(e.x+e.w/2+rnd(-e.w/2,e.w/2),e.y+rnd(6,e.h-6),1,3,s.el);
    s.tick+=dt;
    if(s.tick>=0.5){ s.tick-=0.5;
      const d=(t.stDps||0)*s.n*0.5;
      if(d>0&&e.alive){ e.hp-=d; G.dmgDealt+=d;
        fnum(e.x+e.w/2+rnd(-12,12),e.y+rnd(10,30),String(Math.round(d)),EL[s.el].col.ui);
        if(e.hp<=0){e.hp=0;e.alive=false;onKill();} } }
    if(s.t<=0)delete e.st[k];
  }
}
function chillMult(e){ // 둔화 → 적 이동·행동 속도 배율
  const s=e.st&&e.st.chill; if(!s)return 1;
  return Math.max(0.25, 1 - s.n*(TUNE.el.water.stSlow||0.1));
}
function statusList(e){ const out=[]; if(!e.st)return out;
  for(const k in e.st){ const s=e.st[k];
    out.push({k, n:s.n, c:EL[s.el].col.ui, label:(k==='burn'?'화상':k==='chill'?'둔화':k)}); }
  return out; }

/* ======================= 피해 · 상성 ======================= */
function dealDamage(e,dmg,dir,heavy,el,staggerMult){
  if(!e.alive)return;
  el=el||CUR;
  let d=dmg, aff=false;
  if(e.weak===el && TUNE.affMult>1){ d=Math.round(d*TUNE.affMult); aff=true; }
  if(e.frozen>0 && TUNE.el.water.s2Vuln>1){ d=Math.round(d*TUNE.el.water.s2Vuln); }
  e.hp-=d; e.hurt=.13;
  // 넉백은 순간이동이 아니라 속도다 — 밀렸다가 버티며 멈춘다
  e.kx=(e.kx||0)+dir*TUNE.knockVel*(heavy?1.8:1)*(TUNE.eKnock/8);
  e.flash=Math.max(e.flash||0,TUNE.hitFlash*(heavy?1.5:1));
  e.punch=Math.max(e.punch||0,TUNE.punchAmt*(heavy?1.45:1));
  e.stagger+=d*(staggerMult===undefined?1:staggerMult);
  G.dmgDealt+=d;
  const c=EL[el].col, hx=e.x+e.w/2-dir*12, hy=e.y+e.h*.4;
  impact(hx,hy,dir,heavy,el);
  // 스파크는 맞은 방향으로 원뿔형으로 튄다 — 방사형보다 "어디서 맞았는지"가 읽힌다
  cone(hx,hy,dir,heavy?20:13,{c:c.mid,r:3.2,life:.35,g:300,spMin:180,spMax:heavy?620:430});
  cone(hx,hy,dir,heavy?9:6,{c:'#fff',r:2.2,life:.15,spMin:320,spMax:760});
  if(heavy) edgePunch(el,.34);

/* ======================= 스킬 ======================= */
function skillDef(i){ return E().skills[i]; }
function skillCost(i){ const t=T(); return i===0?t.s1Cost:i===1?t.s2Cost:t.s3Cost; }
function skillCd(i){ const t=T(); return i===0?t.s1Cd:i===1?t.s2Cd:t.s3Cd; }
function skillCdLeft(p,i){ return i===0?p.cd1:i===1?p.cd2:p.cd3; }
function setCd(p,i,v){ if(i===0)p.cd1=v; else if(i===1)p.cd2=v; else p.cd3=v; }

function trySkill(i){
  const p=G.player, t=T(), c=C(), def=skillDef(i);
  if(skillCdLeft(p,i)>0){ sfx('deny'); fnum(p.x+p.w/2,p.y-14,'쿨타임','#8fa4c4'); return; }
  const cost=skillCost(i);
  if(p.mana<cost){ sfx('deny'); G.manaDeny=.35; fnum(p.x+p.w/2,p.y-14,'마나 부족','#e2607a'); return; }
  p.mana-=cost; p.skill=def.id; p.skillT=0; p.skillHit=new Set(); setCd(p,i,skillCd(i)); sfx('skill');
  G.flash={a:.15,c:c.mid};
  const id=def.id;
  // 즉시형 스킬들
  if(id==='shroud'){ p.skillDur=0.14; p.shroud=t.s3Iframe; p.iframe=Math.max(p.iframe,t.s3Iframe+.05);
    sfx('shroud'); shake(.4); G.waves.push({type:'ring',x:p.x+p.w/2,y:p.y+p.h/2,age:0,life:.32,r:70,el:CUR}); }
  else if(id==='armor'){ p.skillDur=0.16; p.shield=t.s3Shield; p.shieldT=t.s3Dur;
    shake(.3); G.waves.push({type:'ring',x:p.x+p.w/2,y:p.y+p.h/2,age:0,life:.36,r:64,el:CUR});
    fnum(p.x+p.w/2,p.y-16,'갑주 '+t.s3Shield,c.ui); }
  else if(id==='gale'){ p.skillDur=0.02; p.gale=t.s3Time; p.galeDir=p.face;
    p.iframe=Math.max(p.iframe,t.s3Iframe); shake(.35);
    for(let k=0;k<6;k++)p.afterimg.push({x:p.x-p.face*k*10,y:p.y,face:p.face,age:k*.02}); }
  else if(id==='wall'){ p.skillDur=0.22;
    const wx=p.x+p.w/2+p.face*t.s3Dist-t.s3W/2;
    G.walls.push({x:wx,y:p.y+p.h-t.s3H,w:t.s3W,h:t.s3H,hp:t.s3Hp,maxhp:t.s3Hp,t:t.s3Dur,rise:0});
    shake(.5); sfx('boom'); }
  else p.skillDur = (id==='meteor')?0.30 : (id==='brand')?0.34 : (id==='frost')?0.28
                  : (id==='freeze')?0.30 : (id==='vortex')?0.26 : (id==='vacuum')?0.50
                  : (id==='spikes')?0.28 : (id==='crush')?0.36 : 0.28;
}

function updateSkill(p,dt){

      } else shake(.3); } }

  else if(id==='frost'){ brake(.01);

      const o=javOrigin(p), hb={x:p.face>0?o.x:o.x-t.s2Range,y:p.y-4,w:t.s2Range,h:56};
      G.waves.push({type:'lance',x:o.x,y:o.y,face:p.face,age:0,life:.28,r:t.s2Range,el:CUR});
      for(let i=0;i<16;i++)part(o.x+p.face*rnd(20,t.s2Range*.8),o.y+rnd(-16,16),
        {c:i%3?c.core:c.mid,r:rnd(1.6,3.4),life:rnd(.2,.5),vx:p.face*rnd(60,240),vy:rnd(-120,120),g:60});
      if(e&&e.alive&&aabb(hb,e)){

        e.frozen=t.s2Freeze; e.vx=0; e.tel=''; e.state='idle';

      } else shake(.3); } }

  /* ---- 바람 ---- */
  else if(id==='vortex'){ brake(.01);

  else if(id==='vacuum'){ p.vx=lerp(p.vx,0,1-Math.pow(.02,dt)); p.vy+=TUNE.gravity*dt*0.35;

        {c:i%2?c.core:c.mid,r:rnd(1.2,2.8),life:rnd(.12,.3),vx:p.face*rnd(180,420),vy:rnd(-80,80)});
      if(e&&e.alive&&aabb(hb,e)){ dealDamage(e,t.s2Dmg,p.face,false);

function updateMeteors(dt){

    m.y+=t.s1Fall*dt;

    let land=false;
    for(const s of G.solids){ if(aabb({x:m.x-8,y:m.y-8,w:16,h:16},s)){land=true;break;} }

function updateFields(dt){   // 서리 폭풍 / 회오리
  const e=G.enemy;
  for(let i=G.fields.length-1;i>=0;i--){
    const f=G.fields[i]; f.t-=dt;
    const el=f.wind?'wind':'water', c=EL[el].col;
    if(Math.random()<.6){ const a=rnd(0,6.283), d=f.wind?f.r:rnd(0,f.r);
      part(f.x+Math.cos(a)*d,f.y+Math.sin(a)*d*.5,
        {c:Math.random()<.5?c.mid:c.core,r:rnd(1.4,3),life:.4,
         vx:f.wind?-Math.cos(a)*120:rnd(-20,20), vy:f.wind?-Math.sin(a)*80:rnd(-30,10),g:f.wind?0:60}); }
    if(e&&e.alive){
      const dx=f.x-(e.x+e.w/2), dy=f.y-(e.y+e.h/2), dist=Math.hypot(dx,dy);
      if(dist<f.r+20){
        if(f.wind&&e.frozen<=0&&e.bound<=0){ const k=f.pull*dt/Math.max(30,dist);
          e.x+=dx*k*.02; e.vx=lerp(e.vx,dx*2,.2); }
        f.tick+=dt;
        const iv=f.wind?0.25:(TUNE.el.water.s1Tick||0.5);
        if(f.tick>=iv){ f.tick-=iv;
          if(f.wind) dealDamage(e,f.dmg,sgn(-dx)||1,false,'wind',0.4);
          else { dealDamage(e,TUNE.el.water.s1Dmg,sgn(-dx)||1,false,'water',0.5);
                 applyStatus(e,'water',TUNE.el.water.s1Chill); } }
      }
    }
    if(f.t<=0)G.fields.splice(i,1);
  }
}

function updateEnemy(dt){
  const e=G.enemy,p=G.player; if(!e)return;
  e.anim+=dt; e.hurt=Math.max(0,e.hurt-dt);
  // 타격감 상태 감쇠 — 넉백은 속도로 밀리고, 플래시·스쿼시는 빠르게 복원된다
  e.flash=Math.max(0,(e.flash||0)-dt);
  e.punch=Math.max(0,(e.punch||0)-dt*TUNE.punchDecay*0.1);
  if(e.kx){ e.x+=e.kx*dt; e.kx*=Math.pow(0.0001,dt*TUNE.knockDecay/11);
    if(Math.abs(e.kx)<6)e.kx=0; e.x=clamp(e.x,-20,980-e.w); }
  updateEnemyProjectiles(dt);
  if(e.alive){ e.mana=Math.min(e.maxmana,e.mana+TUNE.eManaRegen*dt); updateStatus(e,dt); }
  // 낙인 기폭
  if(e.brand){ const t=TUNE.el.fire; e.brand.t-=dt;
    if(Math.random()<.5)motes(e.x+e.w/2+rnd(-16,16),e.y+rnd(8,52),1,3,'fire');
    if(e.brand.t<=0){ const bx=e.x+e.w/2,by=e.y+e.h/2, st=e.brand.stacks; e.brand=null;
      const dmg=t.s2Brand+st*t.s2StackDmg;
      G.waves.push({type:'boom',x:bx,y:by,age:0,life:.44,r:t.s2Boom,el:'fire'});
      burst(bx,by,26+st*2,{c:EL.fire.col.mid,r:4,life:.55,g:100,spMin:90,spMax:360});
      shake(1.3+st*0.06,0,0); G.flash={a:.30,c:EL.fire.col.mid}; hitstop(TUNE.hitstop*2.4,1.4); sfx('boom');
      fnum(bx,by-40,'기폭 x'+st,EL.fire.col.ui,true);
      if(e.alive){ dealDamage(e,dmg,sgn(bx-(p?p.x:bx))||1,true,'fire'); applyStatus(e,'fire',2); } } }
  if(!e.alive)return;

  // 빙결 / 포박 — 행동 정지
  if(e.frozen>0){ e.frozen-=dt; e.vx=0; e.tel=''; e.vy+=TUNE.gravity*dt; moveEnemy(e,dt);
    if(Math.random()<.3)motes(e.x+e.w/2+rnd(-20,20),e.y+rnd(4,60),1,3,'water');
    if(e.frozen<=0){ const t=TUNE.el.water;
      G.waves.push({type:'ring',x:e.x+e.w/2,y:e.y+e.h/2,age:0,life:.3,r:56,el:'water'});
      burst(e.x+e.w/2,e.y+e.h/2,18,{c:EL.water.col.core,r:3,life:.4,spMin:80,spMax:300});
      if(t.s2Shatter>0){ dealDamage(e,t.s2Shatter,1,true,'water'); fnum(e.x+e.w/2,e.y-30,'파쇄!',EL.water.col.ui,true); }
      shake(.6); sfx('boom'); }
    return; }
  if(e.bound>0){ e.bound-=dt; e.vx=0; e.tel=''; e.vy+=TUNE.gravity*dt; moveEnemy(e,dt);
    if(Math.random()<.3)motes(e.x+e.w/2+rnd(-20,20),e.y+e.h-rnd(0,20),1,3,'earth'); return; }

  e.face = p.x<e.x?-1:1;
  e.vy+=TUNE.gravity*dt;
  const cm=chillMult(e);   // 둔화 → 이동·쿨 진행 느려짐

  if(G.dummy){ e.vx=lerp(e.vx,0,.2); e.tel=''; e.state='idle'; moveEnemy(e,dt); return; }
  if(e.state==='stagger'){ e.stateT-=dt; e.vx=lerp(e.vx,0,.2);
    if(e.stateT<=0){e.state='idle';e.cd=.5;} moveEnemy(e,dt); return; }

  if(e.tel!==''){ e.telT-=dt*cm; e.vx=lerp(e.vx,0,.25);
    if(e.telT<=0){ execPattern(e); e.tel=''; }
  } else if(e.state==='idle'){
    const dx=(p.x+p.w/2)-(e.x+e.w/2), dist=Math.abs(dx);
    if(dist>200) e.vx=lerp(e.vx,sgn(dx)*TUNE.eSpeed*cm,1-Math.pow(.002,dt));
    else e.vx=lerp(e.vx,0,1-Math.pow(.001,dt));
    e.cd-=dt*cm;
    if(e.cd<=0){
      const canBolt=e.mana>=TUNE.eBoltCost, canNova=e.mana>=TUNE.eNovaCost, opts=[];
      if(dist<150) opts.push('melee','melee');
      if(dist>=120) opts.push('charge');
      if(canBolt) opts.push('bolt','bolt');
      if(canNova&&dist<260) opts.push('nova');
      const pick=opts.length?opts[Math.floor(Math.random()*opts.length)]:'melee';
      e.tel=pick; e.telT=TUNE.eTelegraph*(pick==='nova'?1.35:pick==='charge'?.9:1);
    }
  } else if(e.state==='melee'){ e.stateT-=dt; e.vx=lerp(e.vx,0,.3);
    if(e.stateT<=0){e.state='idle';e.cd=rnd(TUNE.eCdMin,TUNE.eCdMax);} }
  else if(e.state==='charge'){ e.stateT-=dt; e.vx=e.chargeDir*430*cm;
    if(Math.abs((p.x+p.w/2)-(e.x+e.w/2))<38&&Math.abs(p.y-e.y)<62){
      hurtPlayer(TUNE.eChargeDmg,e.chargeDir); e.state='recover'; e.stateT=.6; e.vx=0; }
    if(e.stateT<=0){e.state='recover';e.stateT=.5;e.vx=0;} }
  else if(e.state==='recover'){ e.stateT-=dt; e.vx=lerp(e.vx,0,.2);
    if(e.stateT<=0){e.state='idle';e.cd=rnd(TUNE.eCdMin,TUNE.eCdMax);} }
  moveEnemy(e,dt);
}
function moveEnemy(e,dt){
  e.x+=e.vx*dt;
  for(const s of G.solids){if(aabb(e,s)){if(e.vx>0)e.x=s.x-e.w;else if(e.vx<0)e.x=s.x+e.w;e.vx=0;}}
  for(const w of G.walls){if(aabb(e,w)){if(e.vx>0)e.x=w.x-e.w;else if(e.vx<0)e.x=w.x+w.w;e.vx=0;}}
  e.y+=e.vy*dt;
  for(const s of G.solids){if(aabb(e,s)&&e.vy>0){e.y=s.y-e.h;e.vy=0;}}
}
function execPattern(e){
  const p=G.player;
  if(e.tel==='melee'){ e.state='melee'; e.stateT=.3;
    const hb={x:e.face>0?e.x+e.w:e.x-70,y:e.y+8,w:70,h:58};
    shake(.35); burst(e.x+e.w/2+e.face*50,e.y+34,8,{c:'#c9a06a',r:3,life:.25,spMin:40,spMax:160});
    if(aabb(hb,p)) hurtPlayer(TUNE.eMeleeDmg,e.face);
  } else if(e.tel==='charge'){ e.state='charge'; e.stateT=.5; e.chargeDir=sgn((p.x+p.w/2)-(e.x+e.w/2)); }
  else if(e.tel==='bolt'){ e.state='recover'; e.stateT=.35; e.mana=Math.max(0,e.mana-TUNE.eBoltCost);
    for(let i=0;i<3;i++){ const dx=(p.x+p.w/2)-(e.x+e.w/2),dy=(p.y+20)-(e.y+24);
      const sp=rnd(280,340), ca=Math.atan2(dy,dx)+(i-1)*0.20;
      e.bolts.push({x:e.x+e.w/2,y:e.y+24,vx:Math.cos(ca)*sp,vy:Math.sin(ca)*sp,age:0}); }
    sfx('skill');
  } else if(e.tel==='nova'){ e.state='recover'; e.stateT=.6; e.mana=Math.max(0,e.mana-TUNE.eNovaCost);
    e.nova={x:e.x+e.w/2,y:e.y+e.h/2,r:0,age:0,life:.42,hit:false}; shake(.7); sfx('skill'); }
}
function updateEnemyProjectiles(dt){
  const e=G.enemy,p=G.player;
  for(let i=e.bolts.length-1;i>=0;i--){ const b=e.bolts[i]; b.age+=dt; b.x+=b.vx*dt; b.y+=b.vy*dt;
    part(b.x,b.y,{c:'#b98bff',r:2.5,life:.2});
    if(b.age>3||b.x<-100||b.x>1100){e.bolts.splice(i,1);continue;}
    // 바위 방벽이 막는다
    let blocked=false;
    for(const w of G.walls){ if(aabb({x:b.x-6,y:b.y-6,w:12,h:12},w)){ w.hp-=TUNE.eBoltDmg; blocked=true;
      burst(b.x,b.y,8,{c:EL.earth.col.mid,r:2.6,life:.3,g:400,spMin:50,spMax:200}); break; } }
    if(blocked){e.bolts.splice(i,1);continue;}
    if(p&&!p.dead&&p.iframe<=0&&aabb({x:b.x-8,y:b.y-8,w:16,h:16},p)){hurtPlayer(TUNE.eBoltDmg,sgn(b.vx));e.bolts.splice(i,1);}
  }
  if(e.nova){ const n=e.nova; n.age+=dt; n.r=lerp(0,190,clamp(n.age/n.life,0,1));
    if(!n.hit&&n.age>n.life*.55){ n.hit=true;
      if(p&&!p.dead&&Math.hypot((p.x+p.w/2)-n.x,(p.y+p.h/2)-n.y)<n.r+10) hurtPlayer(TUNE.eNovaDmg,sgn((p.x)-n.x)); }
    if(n.age>=n.life)e.nova=null; }
}

/* ============================ 렌더 ============================ */
let OFF={x:0,y:0};
function w2s(x,y){return {x:x-(G.cam.x-OFF.x)+W/2, y:y-(G.cam.y-OFF.y)+H/2};}
function render(){
  // 셰이크 = 랜덤 + 방향 + 주파수. 큰 타격일수록 느리고 크게 흔들린다(저주파)
  const sh=G.shake;
  if(sh>0||G.shakeV.x||G.shakeV.y){
    const hz=TUNE.shakeHz*(sh>0.7?0.55:sh>0.35?0.78:1);
    OFF={ x:Math.sin(G.t*hz)*sh*8*rnd(.55,1.45)+G.shakeV.x,
          y:Math.cos(G.t*hz*1.37)*sh*6*rnd(.55,1.45)+G.shakeV.y };
  } else OFF={x:0,y:0};
  ctx.setTransform(1,0,0,1,0,0);
  drawBG();
  ctx.save();
  // 줌 펀치 — 큰 타격에 화면이 순간 당겨졌다 풀린다
  if(G.zoom>0.0005){ const z=1+G.zoom;
    ctx.translate(W/2,H/2); ctx.scale(z,z); ctx.translate(-W/2,-H/2); }
  ctx.translate(W/2,H/2); ctx.translate(-(G.cam.x-OFF.x),-(G.cam.y-OFF.y));
  drawSolids(); drawWalls(); drawFields(); drawWaves(false); drawEnemy();
  drawPillars(); drawMeteors(); drawJavelins(); drawPlayer(); drawParts();
  drawWaves(true);   // 임팩트 방사선 — 적·파티클 위
  drawEnemyDanger();   // 위험 레이어 = 항상 최상단
  ctx.restore();
  drawHUD();
  if(G.edge.a>0){
    const eg=ctx.createRadialGradient(W/2,H/2,H*0.30,W/2,H/2,H*0.85);
    eg.addColorStop(0,'rgba('+G.edge.c+',0)');
    eg.addColorStop(1,'rgba('+G.edge.c+','+(G.edge.a*0.85)+')');
    ctx.fillStyle=eg;ctx.fillRect(0,0,W,H); }
  if(G.flash.a>0){ctx.globalAlpha=G.flash.a;ctx.fillStyle=G.flash.c;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  if(G.help)drawHelp();
}
function drawBG(){
  // 환경은 한색 유지 — 속성 이펙트가 튀어 보이게 하는 대비축 (§6.7 가독성 1원칙)
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0d1220');g.addColorStop(1,'#161d2c');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(90,120,170,.06)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.fillStyle='rgba(24,32,48,.85)';
  for(let i=0;i<5;i++){const x=60+i*210; ctx.fillRect(x,120,52,340);}
  const vg=ctx.createRadialGradient(W/2,H/2,140,W/2,H/2,520);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.58)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}
function drawSolids(){
  for(const s of G.solids){
    ctx.fillStyle='#232c3d'; ctx.fillRect(s.x,s.y,s.w,s.h);
    ctx.fillStyle='#38455f'; ctx.fillRect(s.x,s.y,s.w,4);
    ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillRect(s.x,s.y+s.h-4,s.w,4);
  }
}
function drawWalls(){
  const c=EL.earth.col;
  for(const w of G.walls){
    const h=w.h*w.rise, y=w.y+w.h-h, k=clamp(w.hp/w.maxhp,0,1);
    ctx.fillStyle=c.dark; ctx.fillRect(w.x,y,w.w,h);
    ctx.fillStyle=c.edge; ctx.fillRect(w.x,y,w.w,5);
    ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;
    for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(w.x,y+h*i/4);ctx.lineTo(w.x+w.w,y+h*i/4);ctx.stroke();}
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(w.x,y-6,w.w,3);
    ctx.fillStyle=c.mid;ctx.fillRect(w.x,y-6,w.w*k,3);
  }
}
function drawFields(){
  for(const f of G.fields){
    const el=f.wind?'wind':'water', c=EL[el].col, k=clamp(f.t/f.dur,0,1);
    ctx.save(); ctx.globalAlpha=.20+.16*k;
    const g=ctx.createRadialGradient(f.x,f.y,4,f.x,f.y,f.r);
    g.addColorStop(0,'rgba('+c.glow+',.7)'); g.addColorStop(1,'rgba('+c.glow+',0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(f.x,f.y,f.r,f.r*(f.wind?1:.55),0,0,6.283); ctx.fill();
    ctx.globalAlpha=.5+.3*Math.sin(G.t*4);
    ctx.strokeStyle=c.mid; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(f.x,f.y,f.r,f.r*(f.wind?1:.55),0,0,6.283); ctx.stroke();
    if(f.wind){ ctx.globalAlpha=.5;
      for(let i=0;i<3;i++){ const a=G.t*3+i*2.1;
        ctx.beginPath(); ctx.arc(f.x,f.y,f.r*(0.35+0.2*i),a,a+2.2); ctx.stroke(); } }
    ctx.restore();
  }
}
function drawPillars(){
  const c=EL.earth.col;
  for(const q of G.pillars){ if(q.delay>0){
      ctx.globalAlpha=.4; ctx.strokeStyle=c.edge; ctx.lineWidth=2;
      ctx.beginPath(); ctx.ellipse(q.x,q.base-2,18,5,0,0,6.283); ctx.stroke(); ctx.globalAlpha=1; continue; }
    const h=q.up, y=q.base-h;
    ctx.fillStyle=c.dark;
    ctx.beginPath(); ctx.moveTo(q.x-15,q.base); ctx.lineTo(q.x-9,y+6); ctx.lineTo(q.x,y);
    ctx.lineTo(q.x+9,y+6); ctx.lineTo(q.x+15,q.base); ctx.closePath(); ctx.fill();
    ctx.strokeStyle=c.mid; ctx.lineWidth=2; ctx.stroke();
  }
}
function drawRunePoly(r,sides,jitter){
  ctx.beginPath();
  for(let i=0;i<sides;i++){ const a=i/sides*6.283, rr=r*(1+Math.sin(i*2.7)*jitter);
    const x=Math.cos(a)*rr,y=Math.sin(a)*rr; if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y); }
  ctx.closePath(); ctx.stroke();
}
/* --- 속성별 투척체 실루엣 --- */
function drawProjShape(el,len,th,alpha,big,spin){
  const c=EL[el].col, sh=EL[el].shape;
  if(sh==='lance'){                       // 불 — 백열 코어를 가진 마름모 창
    const g=ctx.createLinearGradient(-len*0.30,0,len*0.72,0);
    g.addColorStop(0,'rgba(255,110,30,0)');
    g.addColorStop(.30,'rgba(255,150,50,'+(alpha*.85)+')');
    g.addColorStop(.72,'rgba(255,220,150,'+(alpha*.95)+')');
    g.addColorStop(1,'rgba(255,246,220,0)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.moveTo(-len*0.30,0);
    ctx.quadraticCurveTo(len*0.10,-th,len*0.72,0);
    ctx.quadraticCurveTo(len*0.10, th,-len*0.30,0); ctx.fill();
    ctx.strokeStyle='rgba(255,250,235,'+(alpha*.95)+')'; ctx.lineWidth=big?2.6:1.8; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-len*0.22,0); ctx.lineTo(len*0.70,0); ctx.stroke();
  } else if(sh==='shard'){                // 물 — 각진 얼음 결정
    ctx.globalAlpha=alpha;
    ctx.fillStyle='rgba('+c.glow+',.30)';
    ctx.beginPath(); ctx.moveTo(len*.72,0); ctx.lineTo(len*.16,-th*1.25);
    ctx.lineTo(-len*.34,-th*.5); ctx.lineTo(-len*.34,th*.5); ctx.lineTo(len*.16,th*1.25);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle=c.mid;
    ctx.beginPath(); ctx.moveTo(len*.72,0); ctx.lineTo(len*.10,-th*.72);
    ctx.lineTo(-len*.26,0); ctx.lineTo(len*.10,th*.72); ctx.closePath(); ctx.fill();
    ctx.strokeStyle=c.core; ctx.lineWidth=big?2:1.3;
    ctx.beginPath(); ctx.moveTo(-len*.2,0); ctx.lineTo(len*.66,0); ctx.stroke();
    ctx.globalAlpha=1;
  } else if(sh==='crescent'){             // 바람 — 압축된 초승달
    ctx.globalAlpha=alpha*.9;
    ctx.strokeStyle=c.mid; ctx.lineWidth=big?5:3.4; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(-len*.15,0,len*.55,-1.05,1.05); ctx.stroke();
    ctx.strokeStyle=c.core; ctx.lineWidth=big?2:1.4;
    ctx.beginPath(); ctx.arc(-len*.15,0,len*.55,-.85,.85); ctx.stroke();
    ctx.globalAlpha=alpha*.45; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.arc(-len*.34,0,len*.5,-.7,.7); ctx.stroke();
    ctx.globalAlpha=1;
  } else {                                // 땅 — 회전하는 암석 덩어리
    ctx.save(); ctx.rotate(spin||0);
    ctx.globalAlpha=alpha;
    ctx.fillStyle=c.dark;
    ctx.beginPath();
    const R=th*1.9;
    for(let i=0;i<7;i++){ const a=i/7*6.283, rr=R*(0.75+((i*37)%10)/22);
      const x=Math.cos(a)*rr, y=Math.sin(a)*rr; if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y); }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle=c.edge; ctx.lineWidth=big?2.4:1.6; ctx.stroke();
    ctx.fillStyle=c.mid; ctx.globalAlpha=alpha*.5;
    ctx.beginPath(); ctx.arc(-R*.25,-R*.25,R*.3,0,6.283); ctx.fill();
    ctx.restore(); ctx.globalAlpha=1;
  }
}
function drawJavelins(){
  for(const j of G.javs){
    const c=EL[j.el].col, t=TUNE.el[j.el];
    for(let i=0;i<j.trail.length;i++){ const tp=j.trail[i], k=(i+1)/j.trail.length;
      ctx.globalAlpha=k*.30; ctx.fillStyle=c.edge;
      ctx.beginPath();ctx.arc(tp.x,tp.y,(j.big?6:4.4)*k,0,6.283);ctx.fill(); }
    ctx.globalAlpha=1;
    const rk=clamp(j.travelled/Math.max(1,t.javRange),0,1);
    const fade=rk<0.7?1:lerp(1,0.35,(rk-0.7)/0.3);     // 사거리 한계가 눈에 보이게
    ctx.save(); ctx.translate(j.x,j.y); ctx.rotate(Math.atan2(j.vy,j.vx));
    const gl=ctx.createRadialGradient(0,0,2,0,0,(j.big?34:24)*fade);
    gl.addColorStop(0,'rgba('+c.glow+','+(.45*fade)+')'); gl.addColorStop(1,'rgba('+c.glow+',0)');
    ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,0,(j.big?34:24)*fade,0,6.283);ctx.fill();
    drawProjShape(j.el,(j.big?76:56)*(0.55+0.45*fade),(j.big?9:6.5)*fade,fade,j.big,j.spin);
    ctx.restore();
  }
}
function drawMeteors(){
  const c=EL.fire.col, t=TUNE.el.fire;
  for(const m of G.meteors){
    if(m.delay>0){ const k=clamp(1-m.delay/0.5,0,1);
      ctx.globalAlpha=.25+.35*k; ctx.strokeStyle=c.edge;ctx.lineWidth=2;
      ctx.beginPath();ctx.ellipse(m.x,462,t.s1Radius*.5*(0.5+0.5*k),12,0,0,6.283);ctx.stroke();

    ctx.save();ctx.translate(m.x,m.y);

    ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,0,28,0,6.283);ctx.fill();
    ctx.fillStyle=c.core;ctx.beginPath();ctx.arc(0,0,7,0,6.283);ctx.fill();
    ctx.strokeStyle='rgba('+c.glow+',.5)';ctx.lineWidth=7;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(0,-40);ctx.stroke();
    ctx.restore();
  }
}
// late=true면 임팩트 방사선만 그린다 — 타격 표시는 적보다 위에 있어야 보인다
function drawWaves(late){
  for(const w of G.waves){
    if(!!late !== (w.type==='impact'||w.type==='slash'||w.type==='forge')) continue;
    const k=1-w.age/w.life, c=EL[w.el||CUR].col;
    if(w.type==='muzzle'){

function drawPlayer(){
  const p=G.player;if(!p)return; const c=C(), t=T();

  ctx.globalAlpha=1;

  if(p.bladeOn&&p.melee<=0&&p.cast<=0&&p.skill===''){
    const bob=Math.sin(G.t*6)*0.06;
    ctx.save();ctx.translate(p.x+p.w/2+p.face*6,p.y+24);ctx.scale(p.face,1);
    const gw=p.bladeSpawn>0?1-p.bladeSpawn/Math.max(.001,TUNE.bladeForge):1;

    ctx.restore();
  }
  if(p.hurt>0&&Math.floor(G.t*30)%2===0)ctx.globalAlpha=.45;
  body(p.x,p.y,p.face,p,false);ctx.globalAlpha=1;
  // 휘두르는 중 — 손에 든 칼 자체
  if(p.melee>0){
    const A=SWING[p.meleeIdx]||SWING[1];
    const since=p.meleeDur-p.melee;
    const w1=clamp(since/Math.max(.001,TUNE.meleeWind),0,1);
    const sw=p.meleeFired?clamp((since-TUNE.meleeWind)/Math.max(.001,p.meleeDur-TUNE.meleeWind),0,1):0;
    const ang = p.meleeFired ? A.from+(A.to-A.from)*Math.pow(sw,TUNE.meleeSwingEase)
                             : A.from+TUNE.meleeWindPull*Math.pow(1-w1,0.6);  // 예비 = 뒤로 크게 당김
    ctx.save();ctx.translate(p.x+p.w/2+p.face*8,p.y+22);ctx.scale(p.face,1);ctx.rotate(ang);
    // 예비동작 동안 칼이 달아오른다
    drawBlade(TUNE.bladeLen, p.meleeFired?1:(0.72+0.28*w1), c);
    ctx.restore();
  }
  // 빚는 중 — 손 앞에서 형태가 잡혀간다 (2박자의 첫 박)

    const prog=clamp((p.castDur-p.cast)/Math.max(.001,t.javWind),0,1), o=javOrigin(p);
    const ang=(KEY.up?-1:KEY.down?1:0)*TUNE.javAimAng;
    ctx.save();ctx.translate(o.x,o.y);ctx.rotate(ang*p.face);ctx.scale(p.face,1);
    ctx.globalAlpha=prog;
    const gl=ctx.createRadialGradient(0,0,1,0,0,26*prog);
    gl.addColorStop(0,'rgba(255,255,255,.75)');gl.addColorStop(1,'rgba('+c.glow+',0)');
    ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,0,26*prog,0,6.283);ctx.fill();
    drawProjShape(CUR,(p.comboIdx>=3?70:52)*prog,(p.comboIdx>=3?8:6)*prog,prog,p.comboIdx>=3,0);
    ctx.strokeStyle='rgba('+c.glow+','+(prog*.8)+')';ctx.lineWidth=1.8;
    drawRunePoly(13*(1.4-0.4*prog),5,0.24);
    ctx.restore();ctx.globalAlpha=1;
  }

    const el=p.shroud>0?'fire':'water', cc=EL[el].col;
    const cx=p.x+p.w/2, cy=p.y+p.h/2, pulse=0.5+0.5*Math.sin(G.t*18);
    ctx.save();ctx.translate(cx,cy);
    const gl=ctx.createRadialGradient(0,0,8,0,0,44);
    gl.addColorStop(0,'rgba('+cc.glow+',.10)');
    gl.addColorStop(.7,'rgba('+cc.glow+','+(0.22+0.12*pulse)+')');
    gl.addColorStop(1,'rgba('+cc.glow+',0)');
    ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,0,44,0,6.283);ctx.fill();
    ctx.rotate(G.t*(el==='fire'?2.2:0.8));
    ctx.strokeStyle='rgba('+cc.glow+','+(0.55+0.35*pulse)+')';ctx.lineWidth=2.6;
    drawRunePoly(32,el==='fire'?6:8,el==='fire'?0.12:0.05);
    ctx.restore();
  }
}

  if(e.nova){const n=e.nova,k=1-n.age/n.life;
    ctx.strokeStyle='rgba(190,140,255,'+(0.8*k)+')';ctx.lineWidth=5;
    ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,6.283);ctx.stroke();
    ctx.fillStyle='rgba(160,110,255,'+(0.14*k)+')';ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,6.283);ctx.fill();}
  if(!e.alive)return;
  const cx=e.x+e.w/2,bot=e.y+e.h;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(cx,bot+2,e.w*.6,6,0,0,6.283);ctx.fill();
  // 피격 스쿼시 — 발밑을 축으로 가로로 눌리고 세로로 짧아진다
  const pu=e.punch||0;
  ctx.save();
  if(pu>0.001){ ctx.translate(cx,bot); ctx.scale(1+pu*0.55,1-pu*0.30); ctx.translate(-cx,-bot); }
  ctx.fillStyle='#2a2f3a';ctx.fillRect(cx-15,bot-22,11,22);ctx.fillRect(cx+4,bot-22,11,22);
  // 상태이상 틴트 — 어둡게 물들여 실루엣을 지키면서 상태를 알린다
  const burn=e.st&&e.st.burn?clamp(e.st.burn.n/6,0,1):0;
  const chill=e.st&&e.st.chill?clamp(e.st.chill.n/6,0,1):0;
  let base=e.hurt>0?'#9a6a56':(e.state==='stagger'?'#5a5060':'#454d5e');
  if(burn>0) base='rgb('+Math.round(69+71*burn)+','+Math.round(77-15*burn)+','+Math.round(94-46*burn)+')';
  else if(chill>0) base='rgb('+Math.round(69-14*chill)+','+Math.round(77+18*chill)+','+Math.round(94+46*chill)+')';
  ctx.fillStyle=base;
  roundRect(e.x+4,e.y+16,e.w-8,e.h-30,6);ctx.fill();
  ctx.fillStyle='#39404e';ctx.fillRect(cx-4,e.y+20,8,e.h-34);
  ctx.fillStyle='#525b6e';ctx.beginPath();ctx.ellipse(e.x+8,e.y+22,10,8,0,0,6.283);ctx.fill();
  ctx.beginPath();ctx.ellipse(e.x+e.w-8,e.y+22,10,8,0,0,6.283);ctx.fill();
  ctx.fillStyle='#3c4353';ctx.beginPath();ctx.ellipse(cx,e.y+11,13,13,0,0,6.283);ctx.fill();
  ctx.fillStyle=e.mana<=0?'#48506a':'#7fd0ff';ctx.fillRect(cx-9,e.y+8,18,4);
  // 무기
  ctx.save();ctx.translate(cx+e.face*15,e.y+26);
  ctx.rotate(e.face*(e.state==='melee'?1.5:-0.5)+(e.tel==='melee'?-1.3:0));
  ctx.fillStyle='#5a4636';ctx.fillRect(0,-4,9,-38);ctx.fillStyle='#6b5442';ctx.fillRect(-6,-50,20,17);ctx.restore();
  // 낙인
  if(e.brand){ const c=EL.fire.col, q=1-clamp(e.brand.t/e.brand.dur,0,1);
    const pulse=0.5+0.5*Math.sin(G.t*(8+22*q)), st=e.brand.stacks;
    ctx.save();ctx.translate(cx,e.y+e.h/2);ctx.rotate(G.t*(0.6+2*q));
    ctx.strokeStyle='rgba('+c.glow+','+(0.5+0.5*pulse)+')';ctx.lineWidth=2.2+st*0.12;
    drawRunePoly(26+6*pulse+st*1.6,4,0.22);ctx.restore(); }
  // 빙결 — 얼음 블록
  if(e.frozen>0){ const c=EL.water.col;
    ctx.save(); ctx.globalAlpha=.55;
    ctx.fillStyle='rgba('+c.glow+',.45)';
    ctx.beginPath(); ctx.moveTo(e.x-4,bot); ctx.lineTo(e.x+2,e.y-8); ctx.lineTo(e.x+e.w-2,e.y-4);
    ctx.lineTo(e.x+e.w+4,bot); ctx.closePath(); ctx.fill();
    ctx.strokeStyle=c.core; ctx.lineWidth=2; ctx.stroke();
    ctx.globalAlpha=1; ctx.restore(); }
  // 포박 — 발밑 암석
  if(e.bound>0){ const c=EL.earth.col;
    ctx.fillStyle=c.dark;
    for(let i=0;i<4;i++){ const ox=-18+i*12;
      ctx.beginPath(); ctx.moveTo(cx+ox,bot); ctx.lineTo(cx+ox+5,bot-22-((i*7)%9));
      ctx.lineTo(cx+ox+11,bot); ctx.closePath(); ctx.fill(); } }
  // 순백 플래시 — 맞은 프레임에 실루엣이 하얗게 탄다 (타격감의 절반)
  if((e.flash||0)>0){
    const k=clamp(e.flash/Math.max(.001,TUNE.hitFlash),0,1);
    ctx.globalAlpha=k*0.92; ctx.fillStyle='#ffffff';
    roundRect(e.x+4,e.y+16,e.w-8,e.h-30,6);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx,e.y+11,13,13,0,0,6.283);ctx.fill();
    ctx.fillRect(cx-15,bot-22,11,22);ctx.fillRect(cx+4,bot-22,11,22);
    ctx.globalAlpha=1; }
  ctx.restore();
}

/* ============================ 튜닝 패널 ============================ */
const panel=document.getElementById('panel');
let panelBuilt=false;
function rowHtml(key,label,min,max,step,scope){
  const v=scope==='el'?T()[key]:TUNE[key];
  if(v===undefined)return '';
  return '<div class="row"><label>'+label+'</label>'+
    '<input type="range" data-k="'+key+'" data-s="'+(scope||'')+'" min="'+min+'" max="'+max+
    '" step="'+step+'" value="'+v+'">'+
    '<span class="v" id="v_'+(scope||'g')+'_'+key+'">'+v+'</span></div>';
}
function buildPanel(){
  const c=C();
  let html='<div style="font-size:13px;color:'+c.ui+';font-weight:bold;margin-bottom:2px">튜닝 패널 (F1)</div>'+
    '<div style="font-size:11px;color:#8b98ad;margin-bottom:8px">현재 속성 <b style="color:'+c.ui+'">'+E().name+
    '</b> — 1~4로 전환하면 이 패널도 바뀝니다. 최대치 변경은 <b>적용+리셋</b>.</div>';
  html+='<h3 style="color:'+c.ui+'">기본공격 — '+E().name+'</h3>';
  for(const [k,l,mn,mx,st] of SPEC_JAV) html+=rowHtml(k,l,mn,mx,st,'el');
  for(const [group,items] of (SPEC_EL[CUR]||[])){
    html+='<h3 style="color:'+c.ui+'">'+group+'</h3>';
    for(const [k,l,mn,mx,st] of items) html+=rowHtml(k,l,mn,mx,st,'el');
  }
  for(const [group,items] of SPEC_COMMON){
    html+='<h3 style="color:#8fb7d8">'+group+'</h3>';
    for(const [k,l,mn,mx,st] of items) html+=rowHtml(k,l,mn,mx,st,'');
  }
  html+='<div class="btns"><button id="btnReset">적용 + 리셋</button>'+
    '<button id="btnDummy">더미 모드</button><button id="btnWeak">적 약점 변경</button>'+
    '<button id="btnDefault">기본값 복원</button><button id="btnCopy">수치 복사(JSON)</button></div>'+
    '<div id="copied" style="font-size:11px;color:'+c.ui+';margin-top:6px"></div>';
  panel.innerHTML=html;
  panel.querySelectorAll('input[type=range]').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const k=inp.dataset.k, s=inp.dataset.s, v=parseFloat(inp.value);
      if(s==='el') T()[k]=v; else TUNE[k]=v;
      document.getElementById('v_'+(s||'g')+'_'+k).textContent=(Math.round(v*100)/100);
    });
  });
  document.getElementById('btnReset').onclick=()=>{resetAll();cv.focus();};
  document.getElementById('btnDummy').onclick=()=>{G.dummy=!G.dummy;cv.focus();};
  document.getElementById('btnWeak').onclick=()=>{cycleWeak();cv.focus();};
  document.getElementById('btnDefault').onclick=()=>{
    const d=JSON.parse(DEFAULTS); Object.assign(TUNE,d); TUNE.el=d.el; buildPanel(); resetAll(); cv.focus();};
  document.getElementById('btnCopy').onclick=()=>{
    const s=JSON.stringify({common:TUNE,el:TUNE.el},null,1);
    navigator.clipboard&&navigator.clipboard.writeText(s);
    document.getElementById('copied').textContent='복사됨 — 마음에 드는 수치가 나오면 붙여넣어 알려주세요.';};
  panelBuilt=true;
}
const DEFAULTS=JSON.stringify(TUNE);
function togglePanel(){ if(!panelBuilt)buildPanel();
  panel.style.display = panel.style.display==='block'?'none':'block'; cv.focus(); }
function cycleWeak(){
  const e=G.enemy; if(!e)return;
  e.weak=ELKEYS[(ELKEYS.indexOf(e.weak)+1)%4];
  toast('적 약점 → '+EL[e.weak].name+'  (배율 ×'+TUNE.affMult.toFixed(2)+')',2);

/* ============================ 루프 ============================ */
function update(dt){
  G.t+=dt;
  if(P('help'))G.help=!G.help;
  if(P('reset'))resetAll();
  if(P('dummy')){G.dummy=!G.dummy;toast(G.dummy?'더미 모드 ON (적이 반격하지 않음)':'더미 모드 OFF',2);}
  if(P('mute')){muted=!muted;if(!muted)actx();toast(muted?'🔇 음소거':'🔊 소리 켜짐',1.5);}
  if(P('weak'))cycleWeak();
  for(let i=0;i<4;i++) if(P('el'+(i+1))) switchElement(ELKEYS[i]);
  if(G.help){clearP();return;}
  if(G.manaDeny>0)G.manaDeny=Math.max(0,G.manaDeny-dt*2);
  // 히트스톱 중에도 입력은 살려둔다 — 멈춘 동안 누른 키가 풀리는 순간 나가야 손이 안 답답하다
  if(G.hitstop>0){G.hitstop-=G.rawDt||dt;G.shake=Math.max(0,G.shake-dt*3.0);
    G.shakeV.x*=Math.pow(.02,dt);G.shakeV.y*=Math.pow(.02,dt);return;}
  if(!G.killed&&G.player&&!G.player.dead)G.killTimer+=dt;

  updatePlayer(dt); updateEnemy(dt); updateJavelins(dt);
  updateMeteors(dt); updateFields(dt); updatePillars(dt); updateWalls(dt);

  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.age+=dt;
    if(p.age>=p.life){G.parts.splice(i,1);continue;}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  for(let i=G.floats.length-1;i>=0;i--){const f=G.floats[i];f.age+=dt;f.y+=f.vy*dt;f.vy*=0.94;
    if(f.age>=f.life)G.floats.splice(i,1);}
  for(let i=G.waves.length-1;i>=0;i--){const w=G.waves[i];w.age+=dt;if(w.age>=w.life)G.waves.splice(i,1);}

  const p=G.player,e=G.enemy;
  const tx=e&&e.alive?clamp((p.x+e.x)/2+20,380,600):clamp(p.x,380,600);
  G.cam.x=lerp(G.cam.x,tx,1-Math.pow(.002,dt));
  G.cam.y=lerp(G.cam.y,clamp(p.y-40,240,330),1-Math.pow(.004,dt));
  G.shake=Math.max(0,G.shake-dt*3.0);
  G.shakeV.x*=Math.pow(.0006,dt); G.shakeV.y*=Math.pow(.0006,dt);
  G.zoom=Math.max(0,G.zoom-dt*TUNE.zoomDecay*G.zoom-dt*0.02);
  if(G.flash.a>0)G.flash.a=Math.max(0,G.flash.a-dt*2.6);
  if(G.edge.a>0)G.edge.a=Math.max(0,G.edge.a-dt*3.4);
  if(G.toast.t>0)G.toast.t-=dt;
  clearP();
}
let last=performance.now();
function frame(now){
  let raw=(now-last)/1000; last=now; raw=clamp(raw,0,1/30);
  // 히트스톱이 풀린 직후 시간이 천천히 정상 속도로 돌아온다 — 이 꼬리가 "묵직함"을 만든다
  let ts=1;
  if(G.slow>0){ const k=clamp(G.slow/Math.max(.001,TUNE.slowTail),0,1);
    ts=TUNE.slowScale+(1-TUNE.slowScale)*(1-k); G.slow=Math.max(0,G.slow-raw); }
  G.tscale=ts; G.rawDt=raw;
  const dt=raw*ts; G.dt=dt;
  update(dt);render();requestAnimationFrame(frame);}
resetAll();
requestAnimationFrame(frame);
</script>
