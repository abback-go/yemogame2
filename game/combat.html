<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전투 샌드박스 — 불 속성 시전자</title>
<style>
  html,body{margin:0;padding:0;background:#05060a;height:100%;overflow:hidden;
    font-family:'Malgun Gothic','맑은 고딕','NanumGothic','Noto Sans KR',sans-serif;}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%;}
  canvas{background:#05060a;outline:none;}
  #panel{position:fixed;top:0;right:0;width:330px;max-height:100%;overflow-y:auto;
    background:rgba(18,11,8,.95);border-left:1px solid #48301f;color:#f0dcc8;font-size:12px;
    padding:10px 12px 30px;display:none;z-index:10;}
  #panel h3{margin:12px 0 6px;font-size:12px;color:#ffab5e;border-bottom:1px solid #3a2418;padding-bottom:3px;}
  #panel .row{display:flex;align-items:center;gap:6px;margin:3px 0;}
  #panel .row label{flex:0 0 122px;font-size:11px;color:#d3b79c;}
  #panel .row input[type=range]{flex:1;min-width:0;}
  #panel .row .v{flex:0 0 42px;text-align:right;font-variant-numeric:tabular-nums;color:#fff0dd;}
  #panel .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  #panel button{background:#33200f;color:#f0dcc8;border:1px solid #5a3820;border-radius:4px;
    padding:5px 9px;cursor:pointer;font-size:11px;}
  #panel button:hover{background:#452c15;}
  #hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);
    background:rgba(26,15,10,.9);color:#f0d7bd;border:1px solid #4a2f1c;
    padding:5px 14px;border-radius:999px;font-size:12px;pointer-events:none;white-space:nowrap;}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="960" height="540" tabindex="0"></canvas></div>
<div id="panel"></div>
<div id="hint">클릭해서 시작 · 이동←→ 점프Z 대시C <b>창던지기X</b> (↑↓조준) · 스킬 A/S/D · <b>F1 튜닝패널</b> · R 리셋 · H 도움말</div>
<script>
"use strict";
/* =====================================================================
   전투 샌드박스 — 불 속성 시전자 (손맛 검증)
   기본공격 = 화염창 투척 (일리움 크래프트:자벨린 결)
     "빚는다(선딜) → 직선으로 날린다" 2박자. 유도 없음. 중력 없음. 관통.
   스킬 3종
     A 화염 낙하 (광역기)  — 전방 넓은 구역에 운석 순차 낙하
     S 작열 낙인 (대인기)  — 창을 꽂아 낙인 → 기본공격으로 스택 축적 → 대폭발
     D 염화 외피 (무적기)  — 완전 무적 + 해제 시 주변 폭발
   F1 = 실시간 튜닝 패널 (모든 수치 슬라이더)
   ===================================================================== */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=960,H=540; cv.focus();
function fit(){const s=Math.min(window.innerWidth/W,window.innerHeight/H);
  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';}
addEventListener('resize',fit); fit();

/* ============================ 튜닝 값 ============================ */
const TUNE={
  // 이동
  moveSpeed:290, accel:3000, friction:2800, gravity:2300, jumpV:770, jumpCut:200,
  coyote:0.10, jumpBuffer:0.12,
  // 대시 (웅크림 → 폭발 → 감속)
  dashSpeed:720, dashTime:0.17, dashCd:0.40, dashIframe:0.22,
  dashPrep:0.06, dashBurst:1.7, dashEnd:0.45, dashGhost:1.0,
  // 기본공격 — 화염창 투척
  javWind:0.07, javRec:0.11, javRec3:0.20, javCombo:0.50,
  javSpeed:1020, javDmg1:9, javDmg2:10, javDmg3:17,
  javPierce:1, javRange:640, javBurn:1, javMoveMult:0.45, javKick:60,
  javAimAng:0.52,
  // 화상 (불 속성 정체성)
  burnDps:3, burnDur:3.0, burnMax:6,
  // 스킬① 화염 낙하 (광역)
  s1Cost:28, s1Cd:5.0, s1Count:5, s1Dmg:14, s1Radius:82, s1Zone:430,
  s1Interval:0.10, s1Fall:1250, s1Burn:1,
  // 스킬② 작열 낙인 (대인)
  s2Cost:32, s2Cd:7.0, s2Dmg:20, s2Range:160, s2Boom:130,
  s2Brand:44, s2Delay:2.6, s2StackDmg:7, s2StackCut:0.16,
  // 스킬③ 염화 외피 (무적)
  s3Cost:25, s3Cd:9.0, s3Iframe:0.85, s3Dmg:18, s3Boom:125, s3Knock:26, s3MoveMult:0.6,
  // 마나
  manaMax:100, manaStart:100, manaRegen:12,
  // 적
  eHp:420, eMana:100, eManaRegen:6, eSpeed:120, eTelegraph:0.5, eCdMin:0.7, eCdMax:1.3,
  eMeleeDmg:14, eBoltDmg:11, eNovaDmg:20, eBoltCost:25, eNovaCost:40, eChargeDmg:18,
  eStaggerAt:60, eKnock:8,
  // 주스
  hitstop:0.055, shakeAmt:0.42, playerHp:120,
};
const TUNE_SPEC=[
 ['이동',[['moveSpeed','이동 속도',100,500,5],['accel','가속',800,6000,100],['friction','감속',800,6000,100],
   ['gravity','중력',1200,3600,50],['jumpV','점프력',400,1100,10],['coyote','코요테',0,.25,.01],['jumpBuffer','입력버퍼',0,.3,.01]]],
 ['대시',[['dashSpeed','대시 속도',300,1200,10],['dashTime','대시 시간',.06,.35,.01],
   ['dashCd','대시 쿨',.1,1.2,.02],['dashIframe','무적 시간',0,.4,.01],
   ['dashPrep','웅크림(선딜)',0,.2,.005],['dashBurst','초반 폭발 배율',1,2.5,.05],
   ['dashEnd','끝 감속 배율',.1,1.2,.05],['dashGhost','잔상 밀도',0,1,.05]]],
 ['기본공격 — 화염창',[
   ['javWind','빚는 시간(선딜)',.01,.30,.005],['javRec','후딜(1·2연)',.03,.40,.01],
   ['javRec3','후딜(3연)',.05,.60,.01],['javCombo','연타 유지창',.15,1.2,.02],
   ['javSpeed','창 속도',300,1800,20],['javRange','사거리',150,900,10],
   ['javDmg1','1연 데미지',1,40,1],['javDmg2','2연 데미지',1,40,1],['javDmg3','3연 데미지',1,60,1],
   ['javPierce','관통 수',1,6,1],['javBurn','화상 부여',0,3,1],
   ['javMoveMult','시전 중 이동',0,1,.05],['javKick','발사 반동',0,240,10],
   ['javAimAng','↑↓ 조준 각도',0,1.2,.02]]],
 ['화상',[['burnDps','스택당 초당피해',0,12,.5],['burnDur','지속 시간',.5,8,.5],['burnMax','최대 스택',1,12,1]]],
 ['스킬① 화염 낙하 (광역)',[['s1Cost','코스트',0,80,1],['s1Cd','쿨타임',0,15,.5],
   ['s1Count','운석 수',1,12,1],['s1Dmg','발당 데미지',1,50,1],['s1Radius','폭발 반경',30,180,5],
   ['s1Zone','낙하 구역 폭',120,760,10],['s1Interval','낙하 간격',.02,.4,.01],
   ['s1Fall','낙하 속도',400,2600,50],['s1Burn','화상 부여',0,3,1]]],
 ['스킬② 작열 낙인 (대인)',[['s2Cost','코스트',0,80,1],['s2Cd','쿨타임',0,20,.5],
   ['s2Dmg','꽂기 데미지',1,60,1],['s2Range','사거리',60,340,5],
   ['s2Brand','기폭 기본피해',1,120,1],['s2StackDmg','스택당 추가피해',0,25,1],
   ['s2Delay','기폭 지연',.5,6,.1],['s2StackCut','스택당 시간단축',0,.5,.01],['s2Boom','폭발 반경',40,260,5]]],
 ['스킬③ 염화 외피 (무적)',[['s3Cost','코스트',0,80,1],['s3Cd','쿨타임',0,20,.5],
   ['s3Iframe','무적 시간',.2,2.5,.05],['s3Dmg','해제 폭발피해',0,60,1],
   ['s3Boom','폭발 반경',40,260,5],['s3Knock','밀어내기',0,80,2],['s3MoveMult','무적 중 이동',0,1,.05]]],
 ['마나',[['manaMax','최대 마나',20,200,5],['manaStart','시작 마나',0,200,5],['manaRegen','자연 재생/초',0,40,1]]],
 ['적',[['eHp','체력',50,900,10],['eMana','마나',0,200,5],['eManaRegen','마나 재생/초',0,30,1],
   ['eSpeed','이동 속도',0,320,10],
   ['eTelegraph','텔레그래프',.15,1.2,.05],['eCdMin','패턴 쿨(최소)',.2,2.5,.1],['eCdMax','패턴 쿨(최대)',.3,3.5,.1],
   ['eMeleeDmg','근접 피해',0,40,1],['eBoltDmg','투사체 피해',0,40,1],['eNovaDmg','폭발 피해',0,60,1],
   ['eChargeDmg','돌진 피해',0,50,1],['eStaggerAt','경직 누적치',10,200,5],['eKnock','피격 밀림',0,40,1]]],
 ['주스·기타',[['hitstop','히트스톱',0,.16,.005],['shakeAmt','화면 흔들림',0,1.2,.05],['playerHp','플레이어 체력',20,300,10]]],
];

/* ============================ 입력 ============================ */
const KEY={},PRESS={};
const MAP={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',
  KeyZ:'jump',Space:'jump',KeyX:'attack',KeyC:'dash',ShiftLeft:'dash',
  KeyA:'sk1',KeyS:'sk2',KeyD:'sk3',KeyR:'reset',KeyH:'help',F1:'panel',KeyT:'dummy',KeyM:'mute'};
addEventListener('keydown',e=>{ const a=MAP[e.code];
  if(e.code==='F1'){e.preventDefault(); togglePanel(); return;}
  if(!a)return; if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(!KEY[a])PRESS[a]=true; KEY[a]=true; });
addEventListener('keyup',e=>{const a=MAP[e.code]; if(a)KEY[a]=false;});
cv.addEventListener('mousedown',()=>cv.focus());
const P=a=>!!PRESS[a]; const clearP=()=>{for(const k in PRESS)PRESS[k]=false;};

/* ============================ 유틸 ============================ */
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a), sgn=v=>v<0?-1:1;
const aabb=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ============================ 사운드 ============================ */
let AC=null,muted=true;
function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function sfx(t){ if(muted)return; const ac=actx(); if(!ac)return;
  const now=ac.currentTime,o=ac.createOscillator(),g=ac.createGain(); o.connect(g);g.connect(ac.destination);
  let f=300,d=.08,v=.10,w='square';
  if(t==='hit'){f=210;d=.07;v=.13;}
  else if(t==='hit3'){f=150;d=.14;v=.18;}
  else if(t==='dash'){f=340;d=.10;w='sawtooth';v=.08;}
  else if(t==='jump'){f=520;d=.09;w='sine';}
  else if(t==='craft'){f=760;d=.09;w='triangle';v=.07;}   // 창 빚기
  else if(t==='throw'){f=430;d=.09;w='sawtooth';v=.10;}    // 발사
  else if(t==='skill'){f=680;d=.16;w='sine';v=.12;}
  else if(t==='boom'){f=110;d=.28;w='sawtooth';v=.18;}
  else if(t==='shroud'){f=300;d=.30;w='sine';v=.11;}
  else if(t==='hurt'){f=150;d=.15;w='sawtooth';v=.14;}
  else if(t==='deny'){f=110;d=.10;w='square';v=.10;}
  o.type=w;o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(Math.max(40,f*.4),now+d);
  g.gain.setValueAtTime(v,now);g.gain.exponentialRampToValueAtTime(.001,now+d);o.start(now);o.stop(now+d+.02);}

/* ============================ 상태 ============================ */
const G={t:0,dt:0,hitstop:0,shake:0,parts:[],floats:[],flash:{a:0,c:'#fff'},
  cam:{x:480,y:300},solids:[],player:null,enemy:null,help:false,dummy:false,
  killTimer:0,killed:false,killTime:0,dmgDealt:0,toast:{t:0,txt:''},waves:[],
  javs:[],meteors:[],manaDeny:0};

function toast(txt,d){G.toast={txt,t:d||2};}
function part(x,y,o){G.parts.push(Object.assign({x,y,vx:0,vy:0,g:0,life:.5,age:0,r:3,c:'#fff',shape:'c'},o));}
function burst(x,y,n,o){for(let i=0;i<n;i++){const a=rnd(0,6.283),s=rnd(o.spMin||40,o.spMax||200);
  part(x,y,Object.assign({},o,{vx:Math.cos(a)*s,vy:Math.sin(a)*s}));}}
function fnum(x,y,txt,c,big){G.floats.push({x,y,txt,c:c||'#fff',age:0,life:.85,big:!!big,vy:-32});}
function shake(a){G.shake=Math.max(G.shake,a*TUNE.shakeAmt/0.42);}
function hitstop(s){G.hitstop=Math.max(G.hitstop,s);}
// 불티 — 위로 떠오르며 사라지는 잔열 입자 (불 속성 공통 언어)
function ember(x,y,n,spread){ for(let i=0;i<(n||1);i++)
  part(x+rnd(-(spread||6),spread||6),y+rnd(-(spread||6),spread||6),
    {c:Math.random()<.5?'#ffd07a':'#ff7a2a',r:rnd(1.4,3.2),life:rnd(.25,.6),
     vx:rnd(-26,26),vy:-rnd(28,86),g:-40}); }

/* ============================ 아레나 ============================ */
function buildArena(){
  G.solids=[
    {x:-40,y:470,w:1080,h:160},        // 바닥
    {x:150,y:360,w:180,h:18},          // 좌 플랫폼
    {x:690,y:360,w:180,h:18},          // 우 플랫폼
    {x:420,y:262,w:180,h:18},          // 중앙 상단
    {x:-60,y:-100,w:60,h:660},         // 좌벽
    {x:1000,y:-100,w:60,h:660},        // 우벽
  ];
}

/* ============================ 플레이어 ============================ */
function makePlayer(){
  return {x:220,y:400,w:26,h:44,vx:0,vy:0,face:1,onGround:false,
    coyote:0,buffer:0,dashT:0,dashCd:0,iframe:0,
    dashPrep:0,dashStart:0,dashPassed:false,
    cast:0,castDur:0,castFired:false,comboT:0,comboIdx:0,queued:false,aim:0,
    skill:'',skillT:0,skillDur:0,skillHit:null,
    cd1:0,cd2:0,cd3:0,shroud:0,
    hp:TUNE.playerHp,mana:TUNE.manaStart,hurt:0,dead:false,
    afterimg:[],animRun:0,squash:1};
}
function resetAll(){
  buildArena(); G.player=makePlayer(); G.enemy=makeEnemy();
  G.parts=[];G.floats=[];G.waves=[];G.javs=[];G.meteors=[];
  G.killed=false;G.killTimer=0;G.dmgDealt=0;
  G.flash={a:0,c:'#fff'};G.shake=0;
}

function updatePlayer(dt){
  const p=G.player; if(!p)return;
  p.dashCd=Math.max(0,p.dashCd-dt); p.iframe=Math.max(0,p.iframe-dt);
  p.hurt=Math.max(0,p.hurt-dt); p.coyote=Math.max(0,p.coyote-dt); p.buffer=Math.max(0,p.buffer-dt);
  p.cd1=Math.max(0,p.cd1-dt); p.cd2=Math.max(0,p.cd2-dt); p.cd3=Math.max(0,p.cd3-dt);
  p.comboT=Math.max(0,p.comboT-dt); if(p.comboT<=0&&p.cast<=0)p.comboIdx=0;
  if(TUNE.manaRegen>0) p.mana=Math.min(TUNE.manaMax,p.mana+TUNE.manaRegen*dt);

  // 염화 외피 (무적 지속) — 이동은 되고 공격은 막힌다
  if(p.shroud>0){
    p.shroud-=dt; p.iframe=Math.max(p.iframe,dt+.02);
    ember(p.x+p.w/2+rnd(-14,14),p.y+rnd(4,40),1,3);
    if(p.shroud<=0){ p.shroud=0; shroudBurst(p); }
  }

  const busy = p.skill!=='' || p.cast>0 || p.dashPrep>0 || p.shroud>0;
  const canAct = !p.dead;

  // 스킬 입력
  if(canAct&&!busy&&p.dashT<=0){
    if(P('sk1'))trySkill('meteor'); else if(P('sk2'))trySkill('brand'); else if(P('sk3'))trySkill('shroud');
  }
  // 대시 — 웅크림(prep) → 폭발 → 감속
  if(canAct&&P('dash')&&p.dashCd<=0&&p.dashT<=0&&p.dashPrep<=0&&p.skill===''&&p.shroud<=0){
    p.dashPrep=TUNE.dashPrep; p.dashCd=TUNE.dashCd;
    p.iframe=Math.max(p.iframe,TUNE.dashPrep+TUNE.dashIframe);
    p.cast=0;p.dashPassed=false;
    let ix=(KEY.left?-1:0)+(KEY.right?1:0); if(ix!==0)p.face=ix;
    sfx('dash');
    for(let i=0;i<8;i++){const a=rnd(0,6.283),d=rnd(26,52);
      part(p.x+p.w/2+Math.cos(a)*d,p.y+26+Math.sin(a)*d*.6,
        {c:'#ffb163',r:2.4,life:TUNE.dashPrep+.05,vx:-Math.cos(a)*d*7,vy:-Math.sin(a)*d*4});}
  }
  if(p.dashPrep>0){ p.dashPrep-=dt; p.vx=0; p.squash=.66;
    if(p.dashPrep<=0){ p.dashT=TUNE.dashTime; p.dashStart=TUNE.dashTime;
      burst(p.x+p.w/2,p.y+26,10,{c:'#ffd6a0',r:3,life:.28,spMin:60,spMax:220}); } }

  // 기본공격 — 화염창 투척 (대시 중에도 던질 수 있게: 즉발 정체성)
  if(canAct&&P('attack')&&p.skill===''&&p.dashPrep<=0&&p.shroud<=0){
    if(p.cast<=0) startCast(p);
    else { const since=p.castDur-p.cast; if(since>=TUNE.javWind*0.8) p.queued=true; }
  }
  // 점프
  if(canAct&&P('jump'))p.buffer=TUNE.jumpBuffer;
  if(p.buffer>0&&(p.onGround||p.coyote>0)&&p.dashT<=0&&p.skill===''){
    p.vy=-TUNE.jumpV;p.buffer=0;p.coyote=0;p.onGround=false;p.squash=.72;sfx('jump');
    burst(p.x+p.w/2,p.y+p.h,7,{c:'#c9a184',r:2.5,life:.28,g:520,spMin:20,spMax:95});
  }
  if(!KEY.jump&&p.vy<-TUNE.jumpCut&&p.dashT<=0)p.vy=-TUNE.jumpCut;

  // 이동/물리
  if(p.dashPrep>0){ p.vx=0; p.vy=0; }
  else if(p.dashT>0){ p.dashT-=dt; p.vy=0;
    const k=1-clamp(p.dashT/Math.max(.01,p.dashStart||TUNE.dashTime),0,1);
    const mult=lerp(TUNE.dashBurst,TUNE.dashEnd,k*k);
    p.vx=p.face*TUNE.dashSpeed*mult;
    if(TUNE.dashGhost>0){ p.afterimg.push({x:p.x,y:p.y,face:p.face,age:0});
      if(Math.random()<TUNE.dashGhost*.6)p.afterimg.push({x:p.x-p.face*9,y:p.y,face:p.face,age:.05}); }
    const e=G.enemy;
    if(e&&e.alive&&!p.dashPassed&&aabb(p,e)){ p.dashPassed=true;
      hitstop(TUNE.hitstop*.5); shake(.25);
      for(let i=0;i<12;i++)part(p.x+p.w/2,p.y+rnd(6,40),
        {c:i%2?'#ffe1b0':'#ff8f3a',r:rnd(1.5,3.5),life:rnd(.15,.32),vx:-p.face*rnd(120,340),vy:rnd(-90,90)});
    }
  }
  else {
    let ix=0; if(!p.dead){ if(KEY.left)ix-=1; if(KEY.right)ix+=1; }
    // 시전 중에도 느리게 걸을 수 있다(즉발 원거리 = 발이 완전히 묶이면 답답함)
    let mult=1;
    if(p.cast>0) mult=TUNE.javMoveMult;
    else if(p.shroud>0) mult=TUNE.s3MoveMult;
    else if(p.skill!=='') mult=0;
    if(mult>0){ if(ix!==0){ if(p.cast<=0)p.face=ix; p.vx=lerp(p.vx,ix*TUNE.moveSpeed*mult,1-Math.pow(.0005,dt)); }
      else p.vx=lerp(p.vx,0,1-Math.pow(.0004,dt)); }
    else p.vx=lerp(p.vx,0,1-Math.pow(.02,dt));
    p.vy+=TUNE.gravity*dt;
  }

  // 시전 진행 — 빚기(선딜) → 발사 → 후딜
  if(p.cast>0){ p.cast-=dt; const since=p.castDur-p.cast;
    if(!p.castFired&&since>=TUNE.javWind){ p.castFired=true; fireJavelin(p); }
    if(p.cast<=0){ if(p.queued){p.queued=false; startCast(p);} else p.queued=false; }
  }
  // 스킬 진행
  if(p.skill!=='') updateSkill(p,dt);

  collide(p,dt);
  p.animRun+=Math.abs(p.vx)*dt*.06;
  p.squash=lerp(p.squash,1,1-Math.pow(.0001,dt));
  for(let i=p.afterimg.length-1;i>=0;i--){p.afterimg[i].age+=dt;if(p.afterimg[i].age>.24)p.afterimg.splice(i,1);}
  if(p.hp<=0&&!p.dead){p.dead=true;onDeath();}
}
function collide(p,dt){
  p.x+=p.vx*dt;
  for(const s of G.solids){if(aabb(p,s)){if(p.vx>0)p.x=s.x-p.w;else if(p.vx<0)p.x=s.x+s.w;p.vx=0;}}
  p.y+=p.vy*dt;p.onGround=false;
  for(const s of G.solids){if(aabb(p,s)){
    if(p.vy>0){p.y=s.y-p.h;p.onGround=true;if(p.vy>420)p.squash=.74;p.vy=0;p.coyote=TUNE.coyote;}
    else if(p.vy<0){p.y=s.y+s.h;p.vy=0;}}}
  if(p.onGround)p.coyote=TUNE.coyote;
}

/* ---------- 기본공격: 화염창 투척 ---------- */
function startCast(p){
  p.comboIdx=(p.comboT>0&&p.comboIdx<3)?p.comboIdx+1:1;
  p.comboT=TUNE.javCombo; p.queued=false;
  const last=p.comboIdx>=3;
  p.castDur=TUNE.javWind+(last?TUNE.javRec3:TUNE.javRec);
  p.cast=p.castDur; p.castFired=false;
  // 조준: ↑ 위로, ↓ 아래로 (직선 유지 — 유도 없음)
  p.aim = KEY.up?-1: (KEY.down?1:0);
  sfx('craft');
  // 빚는 연출: 손 앞으로 불티가 모여든다
  const hx=p.x+p.w/2+p.face*20, hy=p.y+20;
  for(let i=0;i<7;i++){const a=rnd(0,6.283),d=rnd(20,46);
    part(hx+Math.cos(a)*d,hy+Math.sin(a)*d,
      {c:i%2?'#ffd07a':'#ff7a2a',r:rnd(1.6,3),life:TUNE.javWind+.04,
       vx:-Math.cos(a)*d*8,vy:-Math.sin(a)*d*8});}
}
function javOrigin(p){ return {x:p.x+p.w/2+p.face*22, y:p.y+20}; }
function fireJavelin(p){
  const last=p.comboIdx>=3;
  const o=javOrigin(p);
  const ang=p.aim*TUNE.javAimAng*(p.face>0?1:1); // 위/아래는 face와 무관
  const dirx=Math.cos(ang)*p.face, diry=Math.sin(ang);
  G.javs.push({x:o.x,y:o.y,vx:dirx*TUNE.javSpeed,vy:diry*TUNE.javSpeed,
    dmg:last?TUNE.javDmg3:(p.comboIdx===2?TUNE.javDmg2:TUNE.javDmg1),
    pierce:TUNE.javPierce+(last?1:0), big:last, ang:Math.atan2(diry,dirx*p.face)*p.face,
    face:p.face, hit:new Set(), travelled:0, age:0, trail:[]});
  p.vx-=p.face*TUNE.javKick*(last?1.6:1);
  sfx('throw'); shake(last?.30:.14);
  // 총구 섬광
  G.waves.push({type:'muzzle',x:o.x,y:o.y,face:p.face,ang:ang,age:0,life:.14,big:last});
  for(let i=0;i<(last?10:5);i++)part(o.x,o.y,
    {c:i%2?'#fff0cf':'#ff9a3a',r:rnd(1.8,3.8),life:rnd(.14,.3),
     vx:dirx*rnd(60,220)+rnd(-50,50),vy:diry*rnd(60,220)+rnd(-50,50)});
}
function updateJavelins(dt){
  const e=G.enemy;
  for(let i=G.javs.length-1;i>=0;i--){
    const j=G.javs[i]; j.age+=dt;
    const step=Math.hypot(j.vx,j.vy)*dt;
    j.x+=j.vx*dt; j.y+=j.vy*dt; j.travelled+=step;
    j.trail.push({x:j.x,y:j.y}); if(j.trail.length>7)j.trail.shift();
    if(Math.random()<.7) part(j.x-j.vx*dt*0.5,j.y-j.vy*dt*0.5,
      {c:Math.random()<.5?'#ffcf82':'#ff6f28',r:rnd(1.4,j.big?3.4:2.6),life:rnd(.14,.34),
       vx:rnd(-30,30),vy:-rnd(10,50),g:-30});
    // 사거리 소진
    if(j.travelled>=TUNE.javRange){ javFizzle(j); G.javs.splice(i,1); continue; }
    // 벽/지형
    let hitSolid=false;
    for(const s of G.solids){ if(aabb({x:j.x-5,y:j.y-5,w:10,h:10},s)){hitSolid=true;break;} }
    if(hitSolid){ javImpact(j); G.javs.splice(i,1); continue; }
    // 적 명중
    if(e&&e.alive&&!j.hit.has(e)&&aabb({x:j.x-9,y:j.y-9,w:18,h:18},e)){
      j.hit.add(e);
      damageEnemy(e,j.dmg,sgn(j.vx)||1,j.big);
      applyBurn(e,TUNE.javBurn);
      onBrandHit(e);
      hitstop(TUNE.hitstop*(j.big?1.7:.85)); shake(j.big?.55:.28); sfx(j.big?'hit3':'hit');
      j.pierce-=1;
      if(j.pierce<=0){ javImpact(j); G.javs.splice(i,1); continue; }
    }
  }
}
function javImpact(j){
  burst(j.x,j.y,j.big?16:10,{c:'#ffb35e',r:3,life:.34,g:160,spMin:70,spMax:j.big?320:220});
  burst(j.x,j.y,4,{c:'#fff4dd',r:2,life:.18,spMin:120,spMax:300});
  G.waves.push({type:'sparkring',x:j.x,y:j.y,age:0,life:.22,r:j.big?34:24});
}
function javFizzle(j){ for(let i=0;i<4;i++)ember(j.x,j.y,1,4); }

/* ---------- 화상 ---------- */
function applyBurn(e,stacks){
  if(!stacks||stacks<=0||!e.alive)return;
  e.burn=e.burn||{n:0,t:0,tick:0};
  e.burn.n=Math.min(TUNE.burnMax,e.burn.n+stacks);
  e.burn.t=TUNE.burnDur;
}
function updateBurn(e,dt){
  if(!e.burn||e.burn.n<=0)return;
  e.burn.t-=dt;
  ember(e.x+e.w/2+rnd(-e.w/2,e.w/2),e.y+rnd(6,e.h-6),1,3);
  e.burn.tick+=dt;
  if(e.burn.tick>=0.5){ e.burn.tick-=0.5;
    const d=TUNE.burnDps*e.burn.n*0.5;
    if(d>0&&e.alive){ e.hp-=d; G.dmgDealt+=d;
      fnum(e.x+e.w/2+rnd(-12,12),e.y+rnd(10,30),String(Math.round(d)),'#ff9440');
      if(e.hp<=0){e.hp=0;e.alive=false;onKill();} } }
  if(e.burn.t<=0)e.burn=null;
}

/* ---------- 스킬 ---------- */
function skillCost(k){ return k==='meteor'?TUNE.s1Cost:k==='brand'?TUNE.s2Cost:TUNE.s3Cost; }
function skillCd(k){ return k==='meteor'?TUNE.s1Cd:k==='brand'?TUNE.s2Cd:TUNE.s3Cd; }
function skillCdLeft(p,k){ return k==='meteor'?p.cd1:k==='brand'?p.cd2:p.cd3; }
function trySkill(kind){
  const p=G.player;
  if(skillCdLeft(p,kind)>0){ sfx('deny'); fnum(p.x+p.w/2,p.y-14,'쿨타임','#c98a5a'); return; }
  const cost=skillCost(kind);
  if(p.mana<cost){ sfx('deny'); G.manaDeny=.35; fnum(p.x+p.w/2,p.y-14,'마나 부족','#e2607a'); return; }
  p.mana-=cost; p.skill=kind; p.skillT=0; p.skillHit=new Set(); sfx('skill');
  if(kind==='meteor'){ p.skillDur=0.30; p.cd1=TUNE.s1Cd; G.flash={a:.16,c:'#ff9a4a'}; }
  else if(kind==='brand'){ p.skillDur=0.34; p.cd2=TUNE.s2Cd; G.flash={a:.14,c:'#ff6a2a'}; }
  else { p.skillDur=0.14; p.cd3=TUNE.s3Cd; p.shroud=TUNE.s3Iframe;
    p.iframe=Math.max(p.iframe,TUNE.s3Iframe+.05); sfx('shroud');
    G.flash={a:.20,c:'#ffc46a'}; shake(.4);
    G.waves.push({type:'shroudOn',x:p.x+p.w/2,y:p.y+p.h/2,age:0,life:.32,r:70}); }
}
function updateSkill(p,dt){
  const e=G.enemy; p.skillT+=dt; const t=p.skillT, k=p.skill;
  if(k==='meteor'){
    // 화염 낙하 — 하늘에 마법진 → 전방 구역에 운석 순차 낙하
    p.vx=lerp(p.vx,0,1-Math.pow(.01,dt)); p.vy+=TUNE.gravity*dt*0.5;
    if(!p.skillHit.has('cast')){ p.skillHit.add('cast');
      const zx=p.x+p.w/2+p.face*(TUNE.s1Zone*0.5+40);
      G.waves.push({type:'skyrune',x:zx,y:p.y-140,age:0,life:.42,r:TUNE.s1Zone*0.42});
      for(let i=0;i<TUNE.s1Count;i++){
        const tx=zx+rnd(-TUNE.s1Zone/2,TUNE.s1Zone/2);
        G.meteors.push({x:tx,y:p.y-190-rnd(0,70),vy:0,delay:0.14+i*TUNE.s1Interval,done:false});
      }
      shake(.3);
    }
  } else if(k==='brand'){
    // 작열 낙인 — 큰 창을 꽂아 넣는다 (단일 대상)
    p.vx=lerp(p.vx,0,1-Math.pow(.02,dt)); p.vy+=TUNE.gravity*dt*0.35;
    if(t<0.12&&!p.skillHit.has('wind')){ p.skillHit.add('wind');
      const o=javOrigin(p);
      for(let i=0;i<12;i++){const a=rnd(0,6.283),d=rnd(24,60);
        part(o.x+Math.cos(a)*d,o.y+Math.sin(a)*d,
          {c:i%2?'#ffcf82':'#ff5a2a',r:rnd(2,4),life:.16,vx:-Math.cos(a)*d*9,vy:-Math.sin(a)*d*9});}
    }
    if(t>=0.12&&!p.skillHit.has('stab')){ p.skillHit.add('stab');
      const o=javOrigin(p);
      const hb={x:p.face>0?o.x:o.x-TUNE.s2Range,y:p.y+2,w:TUNE.s2Range,h:42};
      G.waves.push({type:'lance',x:o.x,y:o.y,face:p.face,age:0,life:.30,r:TUNE.s2Range});
      for(let i=0;i<18;i++){const a=rnd(-0.5,0.5);
        part(o.x+p.face*rnd(20,TUNE.s2Range*.7),o.y+rnd(-10,10),
          {c:i%3?'#ffc06a':'#ffffff',r:rnd(1.6,3.6),life:rnd(.2,.45),
           vx:p.face*Math.cos(a)*rnd(120,340),vy:Math.sin(a)*rnd(90,240),g:120});}
      if(e&&e.alive&&aabb(hb,e)){
        damageEnemy(e,TUNE.s2Dmg,p.face,true);
        applyBurn(e,1);
        e.brand={t:TUNE.s2Delay,dur:TUNE.s2Delay,stacks:0};
        G.waves.push({type:'brandmark',x:e.x+e.w/2,y:e.y+e.h/2,age:0,life:.3});
        hitstop(TUNE.hitstop*2.0); shake(.7);
        fnum(e.x+e.w/2,e.y-28,'낙인!','#ff7a3a',true);
      } else shake(.3);
    }
  }
  if(p.skillT>=p.skillDur){ p.skill=''; p.skillT=0; }
}
function shroudBurst(p){
  const cx=p.x+p.w/2, cy=p.y+p.h/2, e=G.enemy;
  G.waves.push({type:'detonate',x:cx,y:cy,age:0,life:.40,r:TUNE.s3Boom});
  burst(cx,cy,26,{c:'#ffab4a',r:4,life:.5,g:100,spMin:90,spMax:340});
  burst(cx,cy,12,{c:'#fff2d6',r:3,life:.32,spMin:130,spMax:420});
  shake(1.0); G.flash={a:.26,c:'#ffca86'}; hitstop(TUNE.hitstop*2.0); sfx('boom');
  if(e&&e.alive&&Math.hypot((e.x+e.w/2)-cx,(e.y+e.h/2)-cy)<TUNE.s3Boom+20){
    const dir=sgn((e.x+e.w/2)-cx)||1;
    damageEnemy(e,TUNE.s3Dmg,dir,true);
    applyBurn(e,1); e.x+=dir*TUNE.s3Knock;
  }
}
// 낙인이 붙은 적을 기본공격이 때리면 — 스택 축적 + 기폭 앞당김 (기본기 ↔ 대인기 루프)
function onBrandHit(e){
  if(!e.brand)return;
  e.brand.stacks+=1;
  e.brand.t=Math.max(0.12,e.brand.t-TUNE.s2StackCut);
  fnum(e.x+e.w/2,e.y-40,'낙인 '+e.brand.stacks,'#ffb066');
  for(let i=0;i<5;i++)ember(e.x+e.w/2,e.y+e.h/2,1,16);
}
function updateMeteors(dt){
  const e=G.enemy;
  for(let i=G.meteors.length-1;i>=0;i--){
    const m=G.meteors[i];
    if(m.delay>0){ m.delay-=dt;
      if(m.delay<=0) part(m.x,m.y,{c:'#ffd08a',r:5,life:.16});
      continue; }
    m.vy=TUNE.s1Fall; m.y+=m.vy*dt;
    part(m.x+rnd(-6,6),m.y-14,{c:Math.random()<.5?'#ffcf82':'#ff6f28',r:rnd(2,4.5),life:rnd(.18,.36),vy:-rnd(20,70),g:-40});
    let land=false;
    for(const s of G.solids){ if(aabb({x:m.x-8,y:m.y-8,w:16,h:16},s)){land=true;break;} }
    if(!land&&e&&e.alive&&aabb({x:m.x-10,y:m.y-10,w:20,h:20},e)) land=true;
    if(land||m.y>620){ meteorBoom(m); G.meteors.splice(i,1); }
  }
}
function meteorBoom(m){
  const e=G.enemy;
  G.waves.push({type:'boom',x:m.x,y:m.y,age:0,life:.34,r:TUNE.s1Radius});
  burst(m.x,m.y,14,{c:'#ffa845',r:3.4,life:.42,g:180,spMin:80,spMax:300});
  burst(m.x,m.y,5,{c:'#fff2d6',r:2.4,life:.22,spMin:140,spMax:360});
  shake(.45); hitstop(TUNE.hitstop*.5); sfx('boom');
  if(e&&e.alive&&Math.hypot((e.x+e.w/2)-m.x,(e.y+e.h/2)-m.y)<TUNE.s1Radius+18){
    damageEnemy(e,TUNE.s1Dmg,sgn((e.x+e.w/2)-m.x)||1,false);
    applyBurn(e,TUNE.s1Burn); onBrandHit(e);
  }
}

function damageEnemy(e,dmg,dir,heavy){
  if(!e.alive)return;
  e.hp-=dmg; e.hurt=.13; e.x+=dir*TUNE.eKnock*(heavy?1.6:1); e.stagger+=dmg;
  G.dmgDealt+=dmg;
  const hx=e.x+e.w/2-dir*12,hy=e.y+e.h*.4;
  burst(hx,hy,heavy?14:9,{c:'#ffd07a',r:3,life:.35,g:220,spMin:80,spMax:heavy?320:240});
  burst(hx,hy,4,{c:'#fff',r:2,life:.18,spMin:140,spMax:340});
  fnum(hx,hy-12,String(dmg),heavy?'#ffc04d':'#ffe6a0',heavy);
  if(e.stagger>=TUNE.eStaggerAt){ e.stagger=0; e.state='stagger'; e.stateT=.75; e.tel=''; e.vx=0;
    fnum(e.x+e.w/2,e.y-16,'경직!','#ffcf66',true); }
  if(e.hp<=0){ e.hp=0; e.alive=false; onKill(); }
}
function onKill(){
  const e=G.enemy;
  burst(e.x+e.w/2,e.y+e.h/2,34,{c:'#ff9a4a',r:4,life:.7,g:260,spMin:70,spMax:340});
  burst(e.x+e.w/2,e.y+e.h/2,14,{c:'#fff',r:3,life:.4,spMin:100,spMax:420});
  shake(1);G.flash={a:.4,c:'#ffd9a8'};hitstop(.14);G.killed=true;G.killTime=G.killTimer;
  toast('처치! 시간 '+G.killTime.toFixed(1)+'초 · 총 피해 '+Math.round(G.dmgDealt)+'  —  R: 다시',6);
}
function hurtPlayer(dmg,kx){
  const p=G.player; if(p.iframe>0||p.dead||G.dummy||p.shroud>0)return;
  p.hp-=dmg;p.hurt=.32;p.iframe=.75;p.vx=kx*280;p.vy=-170;
  p.cast=0;p.skill='';p.dashT=0;
  shake(.65);sfx('hurt');G.flash={a:.32,c:'#a33'};
  burst(p.x+p.w/2,p.y+p.h/2,11,{c:'#e26',r:3,life:.4,g:300,spMin:60,spMax:210});
  fnum(p.x+p.w/2,p.y-10,'-'+dmg,'#ff6b81');
}
function onDeath(){ const p=G.player;
  burst(p.x+p.w/2,p.y+p.h/2,22,{c:'#e26',r:3,life:.6,g:220,spMin:60,spMax:260});
  shake(.9);G.flash={a:.55,c:'#000'};toast('쓰러졌다 — R: 다시',5);
  setTimeout(()=>{ if(G.player&&G.player.dead) resetAll(); },900);
}

/* ============================ 적 ============================ */
function makeEnemy(){
  return {x:700,y:400,w:46,h:70,vx:0,vy:0,face:-1,alive:true,
    hp:TUNE.eHp,maxhp:TUNE.eHp,mana:TUNE.eMana,maxmana:TUNE.eMana,
    hurt:0,stagger:0,state:'idle',stateT:0,tel:'',telT:0,cd:1.0,
    bolts:[],nova:null,anim:0,burn:null,brand:null};
}
function updateEnemy(dt){
  const e=G.enemy,p=G.player; if(!e)return;
  e.anim+=dt; e.hurt=Math.max(0,e.hurt-dt);
  updateEnemyProjectiles(dt);
  if(e.alive){ e.mana=Math.min(e.maxmana,e.mana+TUNE.eManaRegen*dt); updateBurn(e,dt); }
  // 낙인 기폭 — 지연 후 폭발 (스택만큼 강해진다)
  if(e.brand){ e.brand.t-=dt;
    if(Math.random()<.5)part(e.x+e.w/2+rnd(-16,16),e.y+rnd(8,52),
      {c:'#ff8a3a',r:rnd(1.5,3),life:.35,vy:-rnd(20,60)});
    if(e.brand.t<=0){ const bx=e.x+e.w/2,by=e.y+e.h/2, st=e.brand.stacks; e.brand=null;
      const dmg=TUNE.s2Brand+st*TUNE.s2StackDmg;
      G.waves.push({type:'detonate',x:bx,y:by,age:0,life:.44,r:TUNE.s2Boom});
      burst(bx,by,26+st*2,{c:'#ff8a3a',r:4,life:.55,g:100,spMin:90,spMax:360});
      burst(bx,by,14,{c:'#fff0d4',r:3,life:.32,spMin:130,spMax:440});
      shake(1.0+st*0.05); G.flash={a:.30,c:'#ffbe7a'}; hitstop(TUNE.hitstop*2.4); sfx('boom');
      fnum(bx,by-40,'기폭 x'+st,'#ffb066',true);
      if(e.alive){ damageEnemy(e,dmg,sgn(bx-(p?p.x:bx))||1,true); applyBurn(e,2); }
    }
  }
  if(!e.alive)return;
  e.face = p.x<e.x?-1:1;
  e.vy+=TUNE.gravity*dt;

  if(G.dummy){ e.vx=lerp(e.vx,0,.2); e.tel=''; e.state='idle'; moveEnemy(e,dt); return; }

  if(e.state==='stagger'){ e.stateT-=dt; e.vx=lerp(e.vx,0,.2);
    if(e.stateT<=0){e.state='idle';e.cd=.5;} moveEnemy(e,dt); return; }

  if(e.tel!==''){ e.telT-=dt; e.vx=lerp(e.vx,0,.25);
    if(e.telT<=0){ execPattern(e); e.tel=''; }
  } else if(e.state==='idle'){
    const dx=(p.x+p.w/2)-(e.x+e.w/2), dist=Math.abs(dx);
    if(dist>200) e.vx=lerp(e.vx,sgn(dx)*TUNE.eSpeed,1-Math.pow(.002,dt));
    else e.vx=lerp(e.vx,0,1-Math.pow(.001,dt));
    e.cd-=dt;
    if(e.cd<=0){
      const canBolt=e.mana>=TUNE.eBoltCost, canNova=e.mana>=TUNE.eNovaCost;
      const opts=[];
      if(dist<150) opts.push('melee','melee');
      if(dist>=120) opts.push('charge');
      if(canBolt) opts.push('bolt','bolt');
      if(canNova&&dist<260) opts.push('nova');
      const pick=opts.length?opts[Math.floor(Math.random()*opts.length)]:'melee';
      e.tel=pick; e.telT=TUNE.eTelegraph*(pick==='nova'?1.35:pick==='charge'?.9:1);
    }
  } else if(e.state==='melee'){ e.stateT-=dt; e.vx=lerp(e.vx,0,.3);
    if(e.stateT<=0){e.state='idle';e.cd=rnd(TUNE.eCdMin,TUNE.eCdMax);} }
  else if(e.state==='charge'){ e.stateT-=dt; e.vx=e.chargeDir*430;
    if(Math.abs((p.x+p.w/2)-(e.x+e.w/2))<38&&Math.abs(p.y-e.y)<62){
      hurtPlayer(TUNE.eChargeDmg,e.chargeDir); e.state='recover'; e.stateT=.6; e.vx=0; }
    if(e.stateT<=0){e.state='recover';e.stateT=.5;e.vx=0;} }
  else if(e.state==='recover'){ e.stateT-=dt; e.vx=lerp(e.vx,0,.2);
    if(e.stateT<=0){e.state='idle';e.cd=rnd(TUNE.eCdMin,TUNE.eCdMax);} }
  moveEnemy(e,dt);
}
function moveEnemy(e,dt){
  e.x+=e.vx*dt;
  for(const s of G.solids){if(aabb(e,s)){if(e.vx>0)e.x=s.x-e.w;else if(e.vx<0)e.x=s.x+e.w;e.vx=0;}}
  e.y+=e.vy*dt;
  for(const s of G.solids){if(aabb(e,s)&&e.vy>0){e.y=s.y-e.h;e.vy=0;}}
}
function execPattern(e){
  const p=G.player;
  if(e.tel==='melee'){ e.state='melee'; e.stateT=.3;
    const hb={x:e.face>0?e.x+e.w:e.x-70,y:e.y+8,w:70,h:58};
    shake(.35); burst(e.x+e.w/2+e.face*50,e.y+34,8,{c:'#c9a06a',r:3,life:.25,spMin:40,spMax:160});
    if(aabb(hb,p)) hurtPlayer(TUNE.eMeleeDmg,e.face);
  } else if(e.tel==='charge'){ e.state='charge'; e.stateT=.5; e.chargeDir=sgn((p.x+p.w/2)-(e.x+e.w/2)); }
  else if(e.tel==='bolt'){ e.state='recover'; e.stateT=.35; e.mana=Math.max(0,e.mana-TUNE.eBoltCost);
    for(let i=0;i<3;i++){ const dx=(p.x+p.w/2)-(e.x+e.w/2),dy=(p.y+20)-(e.y+24),d=Math.hypot(dx,dy)||1;
      const sp=rnd(280,340), spread=(i-1)*0.20, ca=Math.atan2(dy,dx)+spread;
      e.bolts.push({x:e.x+e.w/2,y:e.y+24,vx:Math.cos(ca)*sp,vy:Math.sin(ca)*sp,age:0}); }
    sfx('skill');
  } else if(e.tel==='nova'){ e.state='recover'; e.stateT=.6; e.mana=Math.max(0,e.mana-TUNE.eNovaCost);
    e.nova={x:e.x+e.w/2,y:e.y+e.h/2,r:0,age:0,life:.42,hit:false}; shake(.7); sfx('skill'); }
}
function updateEnemyProjectiles(dt){
  const e=G.enemy,p=G.player;
  for(let i=e.bolts.length-1;i>=0;i--){ const b=e.bolts[i]; b.age+=dt; b.x+=b.vx*dt; b.y+=b.vy*dt;
    part(b.x,b.y,{c:'#b98bff',r:2.5,life:.2});
    if(b.age>3||b.x<-100||b.x>1100){e.bolts.splice(i,1);continue;}
    if(p&&!p.dead&&p.iframe<=0&&aabb({x:b.x-8,y:b.y-8,w:16,h:16},p)){hurtPlayer(TUNE.eBoltDmg,sgn(b.vx));e.bolts.splice(i,1);}
  }
  if(e.nova){ const n=e.nova; n.age+=dt; n.r=lerp(0,190,clamp(n.age/n.life,0,1));
    if(!n.hit&&n.age>n.life*.55){ n.hit=true;
      if(p&&!p.dead&&Math.hypot((p.x+p.w/2)-n.x,(p.y+p.h/2)-n.y)<n.r+10) hurtPlayer(TUNE.eNovaDmg,sgn((p.x)-n.x)); }
    if(n.age>=n.life)e.nova=null; }
}

// 급조된 룬 다각형 — jitter 로 일부러 삐뚤게
function drawRunePoly(r,sides,jitter){
  ctx.beginPath();
  for(let i=0;i<sides;i++){ const a=i/sides*6.283;
    const rr=r*(1+Math.sin(i*2.7)*jitter);
    const x=Math.cos(a)*rr,y=Math.sin(a)*rr;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y); }
  ctx.closePath(); ctx.stroke();
}

  ctx.fillStyle=bn>0?'rgb('+Math.round(69+120*bn)+','+Math.round(77+30*bn)+','+Math.round(94-30*bn)+')':base;
  roundRect(e.x+4,e.y+16,e.w-8,e.h-30,6);ctx.fill();
  ctx.fillStyle='#39404e';ctx.fillRect(cx-4,e.y+20,8,e.h-34);
  ctx.fillStyle='#525b6e';ctx.beginPath();ctx.ellipse(e.x+8,e.y+22,10,8,0,0,6.283);ctx.fill();
  ctx.beginPath();ctx.ellipse(e.x+e.w-8,e.y+22,10,8,0,0,6.283);ctx.fill();
  ctx.fillStyle='#3c4353';ctx.beginPath();ctx.ellipse(cx,e.y+11,13,13,0,0,6.283);ctx.fill();
  ctx.fillStyle=dry?'#48506a':'#7fd0ff';ctx.fillRect(cx-9,e.y+8,18,4);
  if(e.mana>0){const mk=e.mana/Math.max(1,e.maxmana);
    const g=ctx.createRadialGradient(cx,e.y+34,4,cx,e.y+34,50);
    g.addColorStop(0,'rgba(130,190,255,'+(0.18*mk)+')');g.addColorStop(1,'rgba(130,190,255,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,e.y+34,50,0,6.283);ctx.fill();}
  // 화상 아지랑이
  if(bn>0){ const g=ctx.createRadialGradient(cx,e.y+34,6,cx,e.y+34,52);
    g.addColorStop(0,'rgba(255,140,50,'+(0.26*bn)+')');g.addColorStop(1,'rgba(255,110,30,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,e.y+34,52,0,6.283);ctx.fill(); }
  // 무기
  ctx.save();ctx.translate(cx+e.face*15,e.y+26);
  ctx.rotate(e.face*(e.state==='melee'?1.5:-0.5)+(e.tel==='melee'?-1.3:0));
  ctx.fillStyle='#5a4636';ctx.fillRect(0,-4,9,-38);ctx.fillStyle='#6b5442';ctx.fillRect(-6,-50,20,17);ctx.restore();
  // 텔레그래프
  if(tel>0){
    const label={melee:'휘두르기',charge:'돌진',bolt:'투사체',nova:'광역 폭발'}[e.tel]||'';
    const col=e.tel==='nova'?'rgba(190,120,255,':'rgba(255,140,60,';
    ctx.strokeStyle=col+(0.45+0.5*tel)+')';ctx.lineWidth=3;
    roundRect(e.x+2,e.y+14,e.w-4,e.h-28,7);ctx.stroke();
    ctx.fillStyle=e.tel==='nova'?'#c89aff':'#ffcf66';ctx.font='12px sans-serif';ctx.textAlign='center';
    ctx.fillText(label,cx,e.y-30);ctx.textAlign='left';
    if(e.tel==='charge'){ctx.strokeStyle='rgba(255,140,60,'+(0.3+0.4*tel)+')';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(cx,bot-6);ctx.lineTo(cx+e.face*260,bot-6);ctx.stroke();}
    if(e.tel==='nova'){ctx.strokeStyle='rgba(190,120,255,'+(0.25+0.35*tel)+')';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(cx,e.y+e.h/2,190,0,6.283);ctx.stroke();}
  }
  if(e.state==='stagger'){ctx.fillStyle='#ffcf66';ctx.font='12px sans-serif';ctx.textAlign='center';
    ctx.fillText('경직',cx,e.y-30);ctx.textAlign='left';}
  // 낙인 — 몸에 룬이 붙어 점점 빨리 맥동 (스택만큼 커진다)
  if(e.brand){ const q=1-clamp(e.brand.t/e.brand.dur,0,1);
    const pulse=0.5+0.5*Math.sin(G.t*(8+22*q));
    const st=e.brand.stacks;
    ctx.save();ctx.translate(cx,e.y+e.h/2);ctx.rotate(G.t*(0.6+2*q));
    ctx.strokeStyle='rgba(255,130,60,'+(0.5+0.5*pulse)+')';ctx.lineWidth=2.2+st*0.12;
    drawRunePoly(26+6*pulse+st*1.6,4,0.22);
    ctx.strokeStyle='rgba(255,225,190,'+(0.35+0.45*pulse)+')';ctx.lineWidth=1.2;
    drawRunePoly(15+4*pulse+st,3,0.3);
    ctx.restore(); }
  // 적 HP/마나 바
  const s=w2s(cx,e.y-16);
  const bw=90;
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(s.x-bw/2-1,s.y-1,bw+2,13);
  ctx.fillStyle='#7a2230';ctx.fillRect(s.x-bw/2,s.y,bw,7);
  ctx.fillStyle='#e0556a';ctx.fillRect(s.x-bw/2,s.y,bw*clamp(e.hp/e.maxhp,0,1),7);
  ctx.fillStyle='#1d2b45';ctx.fillRect(s.x-bw/2,s.y+8,bw,4);
  ctx.fillStyle='#4aa3e0';ctx.fillRect(s.x-bw/2,s.y+8,bw*clamp(e.mana/Math.max(1,e.maxmana),0,1),4);
  // 화상 스택
  if(e.burn&&e.burn.n>0){ ctx.fillStyle='#ff9440';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
    ctx.fillText('화상 x'+e.burn.n,s.x,s.y-6);ctx.textAlign='left'; }
}
function drawParts(){
  for(const p of G.parts){const k=1-p.age/p.life;ctx.globalAlpha=k;ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*(0.35+0.65*k),0,6.283);ctx.fill();}
  ctx.globalAlpha=1;
  for(const f of G.floats){const k=1-f.age/f.life;ctx.globalAlpha=k;ctx.fillStyle=f.c;
    ctx.font=(f.big?'bold 24px':'bold 17px')+' sans-serif';ctx.textAlign='center';
    ctx.fillText(f.txt,f.x,f.y);}
  ctx.globalAlpha=1;ctx.textAlign='left';
}
function drawHUD(){
  const p=G.player;if(!p)return;
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(18,18,224,44);
  ctx.fillStyle='#5a2030';ctx.fillRect(22,22,216,14);
  ctx.fillStyle='#e0556a';ctx.fillRect(22,22,216*clamp(p.hp/TUNE.playerHp,0,1),14);
  ctx.fillStyle='#ffe0c4';ctx.font='10px sans-serif';ctx.fillText('HP '+Math.max(0,Math.ceil(p.hp)),26,33);
  // 마나
  const mk=clamp(p.mana/TUNE.manaMax,0,1);
  ctx.fillStyle='#2a1a12';ctx.fillRect(22,40,216,16);
  const grd=ctx.createLinearGradient(22,0,238,0);grd.addColorStop(0,'#b3491f');grd.addColorStop(1,'#ffc46a');
  ctx.fillStyle=grd;ctx.fillRect(22,40,216*mk,16);
  if(G.manaDeny>0){ctx.fillStyle='rgba(226,96,122,'+(G.manaDeny*2)+')';ctx.fillRect(22,40,216,16);}
  for(const c of [TUNE.s1Cost,TUNE.s2Cost,TUNE.s3Cost]){const x=22+216*clamp(c/TUNE.manaMax,0,1);
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(x,40,1,16);}
  ctx.fillStyle='#fff2df';ctx.font='11px sans-serif';ctx.fillText('MANA '+Math.floor(p.mana),26,52);
  // 스킬 슬롯 (쿨타임 표시)
  const skills=[['A','화염 낙하',TUNE.s1Cost,p.cd1,TUNE.s1Cd,'광역'],
                ['S','작열 낙인',TUNE.s2Cost,p.cd2,TUNE.s2Cd,'대인'],
                ['D','염화 외피',TUNE.s3Cost,p.cd3,TUNE.s3Cd,'무적']];
  for(let i=0;i<3;i++){const[k,nm,cost,cd,cdMax,tag]=skills[i];const x=258+i*104,y=18;
    const ok=p.mana>=cost&&cd<=0;
    ctx.fillStyle=ok?'rgba(70,36,16,.9)':'rgba(32,24,20,.85)';roundRect(x,y,96,44,6);ctx.fill();
    if(cd>0){ ctx.fillStyle='rgba(10,8,8,.62)';
      roundRect(x,y,96,44*clamp(cd/Math.max(.01,cdMax),0,1),6);ctx.fill(); }
    ctx.strokeStyle=ok?'rgba(255,180,100,.75)':'rgba(120,96,80,.4)';ctx.lineWidth=1.5;
    roundRect(x,y,96,44,6);ctx.stroke();
    ctx.fillStyle=ok?'#fff0dc':'#8a7768';ctx.font='bold 13px sans-serif';ctx.fillText(k,x+8,y+18);
    ctx.font='12px "Malgun Gothic",sans-serif';ctx.fillText(nm,x+24,y+18);
    ctx.fillStyle=ok?'#ffb066':'#7d6a5c';ctx.font='11px sans-serif';
    ctx.fillText(cd>0?(cd.toFixed(1)+'s'):('마나 '+cost),x+8,y+34);
    ctx.fillStyle='rgba(255,200,150,.45)';ctx.font='10px "Malgun Gothic",sans-serif';
    ctx.fillText(tag,x+72,y+34);
  }
  // 연타 표시
  if(p.comboIdx>0&&p.comboT>0){ctx.fillStyle='rgba(255,200,140,.85)';ctx.font='bold 14px sans-serif';
    ctx.fillText('연타 '+p.comboIdx,22,78);}
  ctx.fillStyle='rgba(230,200,175,.45)';ctx.font='11px sans-serif';ctx.textAlign='right';
  ctx.fillText((G.dummy?'[더미 모드] ':'')+'시간 '+G.killTimer.toFixed(1)+'s · 피해 '+Math.round(G.dmgDealt)+
    '  |  F1 튜닝 · H 도움말 · R 리셋 · T 더미',W-14,H-12);ctx.textAlign='left';
  if(G.toast.t>0){const a=clamp(G.toast.t,0,1);ctx.globalAlpha=Math.min(1,a*1.6);
    ctx.font='15px "Malgun Gothic",sans-serif';const tw=ctx.measureText(G.toast.txt).width;
    roundRect(W/2-tw/2-14,H-86,tw+28,30,15);ctx.fillStyle='rgba(22,14,10,.9)';ctx.fill();
    ctx.strokeStyle='rgba(180,130,90,.4)';ctx.stroke();
    ctx.fillStyle='#f4e2d0';ctx.textAlign='center';ctx.fillText(G.toast.txt,W/2,H-66);
    ctx.textAlign='left';ctx.globalAlpha=1;}
}
function drawHelp(){
  ctx.fillStyle='rgba(10,6,5,.92)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffe6cc';ctx.textAlign='center';ctx.font='bold 24px "Malgun Gothic",sans-serif';
  ctx.fillText('전투 샌드박스 — 불 속성 시전자',W/2,64);
  ctx.font='15px "Malgun Gothic",sans-serif';
  const L=['이동 ← →  ·  점프 Z / Space  ·  대시 C / Shift (무적)',
   '',
   '기본공격 X — 화염창 투척: 손 앞에 창을 빚어서 직선으로 던진다 (유도 없음)',
   '     ↑ 또는 ↓ 를 같이 누르면 위/아래로 조준 · 3연타째는 대형 창(관통 +1)',
   '',
   'A 화염 낙하 (광역) — 전방 넓은 구역에 운석이 순차로 떨어진다',
   'S 작열 낙인 (대인) — 큰 창을 꽂아 낙인 부착 → 지연 후 대폭발',
   'D 염화 외피 (무적) — 짧게 완전 무적, 해제되는 순간 주변이 터진다',
   '',
   '── 핵심 루프 ──',
   'S로 낙인을 박고 → X 창을 계속 꽂아 넣으면 낙인 스택이 쌓이고 기폭이 앞당겨진다.',
   '맞힌 적은 화상이 쌓여 계속 탄다. 위험할 땐 D로 받아내고 해제 폭발로 되받아친다.',
   '',
   'F1 튜닝 패널(모든 수치 실시간)  ·  T 더미 모드  ·  R 리셋  ·  M 소리'];
  for(let i=0;i<L.length;i++)ctx.fillText(L[i],W/2,104+i*26);
  ctx.fillStyle='#c8a68c';ctx.fillText('H 를 다시 눌러 닫기',W/2,H-30);ctx.textAlign='left';
}

/* ============================ 튜닝 패널 ============================ */
const panel=document.getElementById('panel');
let panelBuilt=false;
function buildPanel(){
  let html='<div style="font-size:13px;color:#ffab5e;font-weight:bold;margin-bottom:4px">튜닝 패널 (F1)</div>'+
    '<div style="font-size:11px;color:#b09680;margin-bottom:6px">값을 바꾸면 즉시 반영. 리셋해야 적용되는 값(체력·마나 최대치)은 <b>적용+리셋</b>.</div>';
  for(const [group,items] of TUNE_SPEC){
    html+='<h3>'+group+'</h3>';
    for(const [key,label,min,max,step] of items){
      html+='<div class="row"><label>'+label+'</label>'+
        '<input type="range" data-k="'+key+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+TUNE[key]+'">'+
        '<span class="v" id="v_'+key+'">'+TUNE[key]+'</span></div>';
    }
  }
  html+='<div class="btns"><button id="btnReset">적용 + 리셋</button>'+
    '<button id="btnDummy">더미 모드 토글</button><button id="btnDefault">기본값 복원</button>'+
    '<button id="btnCopy">수치 복사(JSON)</button></div>'+
    '<div id="copied" style="font-size:11px;color:#ffab5e;margin-top:6px"></div>';
  panel.innerHTML=html;
  panel.querySelectorAll('input[type=range]').forEach(inp=>{
    inp.addEventListener('input',()=>{const k=inp.dataset.k;TUNE[k]=parseFloat(inp.value);
      document.getElementById('v_'+k).textContent=(Math.round(TUNE[k]*100)/100);});
  });
  document.getElementById('btnReset').onclick=()=>{resetAll();cv.focus();};
  document.getElementById('btnDummy').onclick=()=>{G.dummy=!G.dummy;cv.focus();};
  document.getElementById('btnDefault').onclick=()=>{Object.assign(TUNE,JSON.parse(DEFAULTS));
    panel.querySelectorAll('input[type=range]').forEach(i=>{i.value=TUNE[i.dataset.k];
      document.getElementById('v_'+i.dataset.k).textContent=TUNE[i.dataset.k];});resetAll();cv.focus();};
  document.getElementById('btnCopy').onclick=()=>{
    const s=JSON.stringify(TUNE,null,1);
    navigator.clipboard&&navigator.clipboard.writeText(s);
    document.getElementById('copied').textContent='복사됨 — 마음에 드는 수치가 나오면 붙여넣어 알려주세요.';};
  panelBuilt=true;
}
const DEFAULTS=JSON.stringify(TUNE);
function togglePanel(){ if(!panelBuilt)buildPanel();
  panel.style.display = panel.style.display==='block'?'none':'block'; cv.focus(); }

/* ============================ 루프 ============================ */
function update(dt){
  G.t+=dt;
  if(P('help'))G.help=!G.help;
  if(P('reset'))resetAll();
  if(P('dummy')){G.dummy=!G.dummy;toast(G.dummy?'더미 모드 ON (적이 반격하지 않음)':'더미 모드 OFF',2);}
  if(P('mute')){muted=!muted;if(!muted)actx();toast(muted?'🔇 음소거':'🔊 소리 켜짐',1.5);}
  if(G.help){clearP();return;}
  if(G.manaDeny>0)G.manaDeny=Math.max(0,G.manaDeny-dt*2);
  if(G.hitstop>0){G.hitstop-=dt;clearP();
    G.shake=Math.max(0,G.shake-dt*2.4);return;}
  if(!G.killed&&G.player&&!G.player.dead)G.killTimer+=dt;

  updatePlayer(dt); updateEnemy(dt); updateJavelins(dt); updateMeteors(dt);
  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.age+=dt;
    if(p.age>=p.life){G.parts.splice(i,1);continue;}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  for(let i=G.floats.length-1;i>=0;i--){const f=G.floats[i];f.age+=dt;f.y+=f.vy*dt;f.vy*=0.94;
    if(f.age>=f.life)G.floats.splice(i,1);}
  for(let i=G.waves.length-1;i>=0;i--){const w=G.waves[i];w.age+=dt;if(w.age>=w.life)G.waves.splice(i,1);}
  const p=G.player,e=G.enemy;
  const tx=e&&e.alive?clamp((p.x+e.x)/2+20,380,600):clamp(p.x,380,600);
  G.cam.x=lerp(G.cam.x,tx,1-Math.pow(.002,dt));
  G.cam.y=lerp(G.cam.y,clamp(p.y-40,240,330),1-Math.pow(.004,dt));
  G.shake=Math.max(0,G.shake-dt*2.4);
  if(G.flash.a>0)G.flash.a=Math.max(0,G.flash.a-dt*2.2);
  if(G.toast.t>0)G.toast.t-=dt;
  clearP();
}
let last=performance.now();
function frame(now){let dt=(now-last)/1000;last=now;dt=clamp(dt,0,1/30);G.dt=dt;
  update(dt);render();requestAnimationFrame(frame);}
resetAll();
requestAnimationFrame(frame);
</script>
