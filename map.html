<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대협곡 세계 — 월드맵 v1</title>
<style>
  :root{--bg:#0b0d12;--panel:#141826;--line:#2a3348;--txt:#dfe6f2;--dim:#8a93a6;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif;}
  #cv{position:absolute;inset:0;cursor:grab;}
  #cv.drag{cursor:grabbing;}
  #hud{position:fixed;top:0;left:0;right:0;padding:10px 14px;display:flex;gap:14px;align-items:center;
    background:linear-gradient(180deg,rgba(11,13,18,.92),rgba(11,13,18,0));pointer-events:none;flex-wrap:wrap;}
  #hud>*{pointer-events:auto;}
  h1{font-size:15px;font-weight:700;letter-spacing:.5px;}
  h1 small{color:var(--dim);font-weight:400;margin-left:8px;}
  #stagebox{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
    border-radius:999px;padding:6px 14px;font-size:12px;}
  #stagebox input{accent-color:#e8c66a;}
  #stageLabel{min-width:180px;color:#e8c66a;}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;
    padding:6px 10px;font-size:12px;cursor:pointer;}
  .btn:hover{border-color:#e8c66a;}
  #legend{position:fixed;left:14px;bottom:14px;background:rgba(20,24,38,.94);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;font-size:11px;line-height:1.9;max-height:46vh;overflow:auto;}
  #legend b{font-size:12px;}
  .lg{display:flex;align-items:center;gap:7px;white-space:nowrap;}
  .sw{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;}
  #info{position:fixed;right:14px;top:64px;width:330px;max-height:calc(100vh - 90px);overflow:auto;
    background:rgba(20,24,38,.96);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:12.5px;
    line-height:1.75;display:none;}
  #info h2{font-size:15px;margin-bottom:2px;}
  #info .meta{color:var(--dim);font-size:11px;margin-bottom:8px;}
  #info .concept{border-left:3px solid var(--line);padding-left:9px;margin:8px 0;}
  #info .ex{color:var(--dim);}
  #info .gate{color:#e8c66a;}
  #info .close{float:right;cursor:pointer;color:var(--dim);}
  #tip{position:fixed;padding:4px 9px;background:#000d;border:1px solid var(--line);border-radius:6px;
    font-size:12px;pointer-events:none;display:none;z-index:9;}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <h1>🗺 대협곡 세계 — 월드맵 v1<small id="stats"></small></h1>
  <div id="stagebox">
    <span>진행 단계</span>
    <input type="range" id="stage" min="0" max="6" value="6" step="1">
    <span id="stageLabel"></span>
  </div>
  <button class="btn" id="fit">화면 맞춤</button>
  <button class="btn" id="zin">＋</button>
  <button class="btn" id="zout">－</button>
</div>
<div id="legend"></div>
<div id="info"></div>
<div id="tip"></div>
<script>
"use strict";
const DATA = {"meta": {"title": "대협곡 세계 — 월드맵 v1", "room_total": 295, "tech_order": ["이단점프", "벽달리기", "얼음 발판", "활공", "물잠", "비행"], "stage_report": [{"stage": 0, "techs": [], "new": 91, "total": 91}, {"stage": 1, "techs": ["이단점프"], "new": 30, "total": 121}, {"stage": 2, "techs": ["벽달리기"], "new": 41, "total": 162}, {"stage": 3, "techs": ["얼음 발판"], "new": 42, "total": 204}, {"stage": 4, "techs": ["활공"], "new": 52, "total": 256}, {"stage": 5, "techs": ["물잠"], "new": 6, "total": 262}, {"stage": 6, "techs": ["비행"], "new": 33, "total": 295}]}, "regions": [{"id": "sch", "name": "협곡 학교", "element": "정규 3속성(불·물·바람)", "identity": "협곡 양쪽 절벽에 걸쳐 지어진 수직 캠퍼스 — 세계의 허브. 수업·승급·각인·기록 정리의 중심이자 끝까지 피난처.", "palette": "따뜻한 석재 베이지 + 남색 지붕 + 창마다 노란 불빛", "music": "목관+하프, 낮에는 부산하고 밤에는 고요한 두 버전", "color": "#e8c66a", "region_magic": [], "boss_key_story": "보스 없음 — 허브. 대신 승급 시험(3부)이 이 지역의 '보스' 역할을 한다.", "state_change": "막이 진행될수록 게시판·급식 메뉴·학생들의 대화가 갱신되고, 시계탑 꼭대기가 마지막에 열린다.", "unique_enemy": "없음(결계 돔 안의 훈련 허수아비만 — 전투는 실습으로 격리)", "local_loops": ["정문 마당→본관→아래 계단→정수장→곤돌라 마을→곤돌라 승강장→정문 마당 (허브 순환)", "서쪽 다리 개통 시: 학교↔기사단 마을 직통 (월드 루프 ①의 닫힘)"], "bounds": [300, 450, 630, 720]}, {"id": "gon", "name": "곤돌라 마을", "element": "없음", "identity": "학교로 오르는 곤돌라 줄기에 계단식으로 붙어 자란 하숙·상점 마을. 튜토리얼 직후 만나는 세상의 첫 온기.", "palette": "낡은 목재 갈색 + 빨랫줄의 원색 + 곤돌라 케이블의 검은 선", "music": "아코디언과 그릇 부딪는 소리, 저녁엔 느려진다", "color": "#d99a5b", "region_magic": [], "boss_key_story": "보스 없음 — 마을. 하숙집에 짐을 풀면(첫 거점) 마을 사람들의 부탁이 게시판으로 흘러들기 시작한다.", "state_change": "의뢰 평판이 쌓일수록 장터에 좌판이 늘고 곤돌라 야간 운행이 열린다.", "unique_enemy": "없음(마을 — 안전지대)", "local_loops": ["곤돌라 정거장→윗계단→중턱 장터→아랫계단→우물 계단→(정수장)→학교→곤돌라 (수직 생활 순환)"], "bounds": [450, 840, 510, 960]}, {"id": "cyn", "name": "대협곡", "element": "없음", "identity": "세계의 수직 척추 — 절벽·선반·낡은 사다리로 이어진 연결 조직. 위로는 고원, 아래로는 해가 닿은 적 없는 바닥.", "palette": "회청색 암벽 + 높이에 따라 변하는 빛(위는 금빛, 아래는 남색)", "music": "바람 소리 그 자체가 음악 — 높이에 따라 화음이 변한다", "color": "#8a93a6", "region_magic": [], "boss_key_story": "보스 없음 — 통로 지역. 대신 수직 왕복 자체가 시험이다.", "state_change": "곤돌라 간이역이 수리되면(의뢰) 협곡 중단이 패스트트래블로 열린다.", "unique_enemy": "절벽 틈의 바람매 — 상승기류를 타고 급습해 오는 비행형.", "local_loops": ["낙하 수직굴로 한 번에 내려가고, 벽달리기로 벽 하부에서 되올라오는 수직 루프", "간이 곤돌라역 개통 후: 중단↔학교/마을 패스트트래블 루프"], "bounds": [690, 780, 840, 1020]}, {"id": "min", "name": "거인의 광산", "element": "대지", "identity": "화석이 된 태고 거인의 몸을 파 내려가는 광산 — 마력석의 산지이자 세계의 길찾기 미로. 이단점프가 여는 첫 대지역.", "palette": "황토·뼈의 상아색 + 갱도 램프의 주황 점들", "music": "곡괭이 리듬과 낮은 울림 — 심부로 갈수록 심장박동 같은 저음이 섞인다", "color": "#c2a06a", "region_magic": [{"name": "돌기둥(가칭)", "effect": "발밑에서 돌기둥을 솟구쳐 적을 띄우고 낮은 발판이 된다 — 무겁고 결정적인 지역 마법"}], "boss_key_story": "입구 캠프의 노광부 일을 돕다 보면 '거인을 달래는 자장가'(진동의 리듬)를 배운다 — 그 리듬 없이 심장 방 문은 열리지 않는다.", "state_change": "심장의 맥동이 잦아들어 무너지던 갱도가 안정되고, 열기 통로(가마 마을행)와 수레 레일 전 구간이 개방된다.", "unique_enemy": "잠꼬대 굴착꾼 — 평소엔 화석처럼 잠들어 있다가 소리(공격·달리기)에 깨어나는 석상형.", "local_loops": ["권양기를 수리하면 잊힌 레일 구간이 열려 심부↔입구 캠프 직통 지름길이 된다", "뼈의 미로 가짜 출구가 사실 상부 갱도로 되돌아오는 낙하 지름길", "언 갱도·수문·열기 통로 — 이웃 지역들로 향하는 뒷문 셋이 전부 나중에 열리는 외부 루프"], "bounds": [360, 1110, 600, 1440]}, {"id": "for", "name": "잠들지 않는 숲", "element": "어둠", "identity": "해가 닿은 적 없는 협곡 바닥의 숲 — 빛을 재배하는 사람들의 땅. 추격과 매복의 지역, 벽달리기가 연다.", "palette": "짙은 남색·먹색 + 램프의 호박색 원 + 반딧불의 점묘", "music": "낮은 현악 드론 + 벌레 소리 — 램프 반경 밖에서는 음이 한 겹 얇아진다", "color": "#7a6fb8", "region_magic": [{"name": "그림자 손(가칭)", "effect": "어둠에서 손이 뻗어 적을 붙잡아 세운다 — 추격자를 끊는 결정적 지역 마법"}, {"name": "어둠 장막(가칭)", "effect": "짧게 주위 빛을 삼켜 적의 시선을 끊는다"}], "boss_key_story": "램프 마을의 빛 밭에서 씨앗 도둑 소동을 해결하다 보면 '씨앗 램프'(휴대 광원의 심지)를 맡게 된다 — 그 빛이 없으면 심부의 어둠은 걷히지 않는다.", "state_change": "등불나무가 개화해 숲 전체의 어둠이 한 단계 옅어지고, 나무 꼭대기에서 마을로 내려가는 빛의 지름길이 열린다.", "unique_enemy": "빛꺼림 — 램프 반경 밖에서만 움직이는 그림자 짐승. 빛 안으로는 절대 들어오지 못한다.", "local_loops": ["등불나무 개화 후: 나무 꼭대기→램프 마을 직통 하강로 (보스 보상 지름길)", "반딧불 틈→반딧불 성소(숨은 거점) 뒷길", "서쪽 뿌리 비탈: 광산 붕괴 지점에서 떨어져 들어오는 뒷문(월드 루프 ②)"], "bounds": [810, 1140, 930, 1590]}, {"id": "mir", "name": "거울의 도시", "element": "태양", "identity": "태양빛을 거울 배관으로 골목마다 배달하는 사막 도시 — 빛 퍼즐의 지역. 얼음 발판이 연다. 로컬 스토리: '태양로가 흐려진다'.", "palette": "모래 백금색 + 거울의 const STAGE_NAMES = ["시작 킷 (달리기·점프·대시·부유)","+ 이단점프","+ 벽달리기","+ 얼음 발판","+ 활공","+ 물잠","+ 비행"];
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const rooms = DATA.rooms, regions = DATA.regions, edges = DATA.edges;
const byId = {}; rooms.forEach(r => byId[r.id] = r);
const regById = {}; regions.forEach(r => regById[r.id] = r);
document.getElementById('stats').textContent = regions.length + '개 지역 · ' + rooms.length + '방';

let cam = {x:0, y:0, z:1};
let stageMax = 6;

function fit(){
  const xs = rooms.map(r=>r.x), ys = rooms.map(r=>r.y);
  const minx = Math.min(...xs)-80, maxx = Math.max(...xs)+80;
  const miny = Math.min(...ys)-110, maxy = Math.max(...ys)+80;
  const z = Math.min(innerWidth/(maxx-minx), innerHeight/(maxy-miny));
  cam.z = z; cam.x = minx - (innerWidth/z-(maxx-minx))/2; cam.y = miny - (innerHeight/z-(maxy-miny))/2;
}
function resize(){
  cv.width = innerWidth*devicePixelRatio; cv.height = innerHeight*devicePixelRatio;
  cv.style.width = innerWidth+'px'; cv.style.height = innerHeight+'px';
  draw();
}
const W2S = (x,y)=>[(x-cam.x)*cam.z, (y-cam.y)*cam.z];
const S2W = (x,y)=>[x/cam.z+cam.x, y/cam.z+cam.y];
const RAD = {S:7,M:9,L:12,XL:15};

function roomAlpha(r){ return r.stage<=stageMax ? 1 : 0.13; }

function draw(){
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  ctx.clearRect(0,0,innerWidth,innerHeight);
  ctx.fillStyle = '#0b0d12'; ctx.fillRect(0,0,innerWidth,innerHeight);
  // 지역 박스
  for(const g of regions){
    const [x1,y1] = W2S(g.bounds[0]-34, g.bounds[1]-34);
    const [x2,y2] = W2S(g.bounds[2]+34, g.bounds[3]+34);
    ctx.fillStyle = g.color+'12'; ctx.strokeStyle = g.color+'55'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(x1,y1,x2-x1,y2-y1,10); ctx.fill(); ctx.stroke();
    ctx.fillStyle = g.color; ctx.font = 'bold '+(13*Math.min(cam.z*1.6,1.15)+3)+'px sans-serif';
    ctx.globalAlpha = 0.9; ctx.fillText(g.name, x1+9, y1+18); ctx.globalAlpha = 1;
  }
  // 간선
  for(const e of edges){
    const a = byId[e.a], b = byId[e.b]; if(!a||!b) continue;
    const [x1,y1] = W2S(a.x,a.y), [x2,y2] = W2S(b.x,b.y);
    const dim = (a.stage>stageMax || b.stage>stageMax);
    ctx.globalAlpha = dim?0.08:(e.cross?0.85:0.45);
    ctx.strokeStyle = e.gate==='none' ? (e.cross?'#c9d4e8':'#5f6b85') : '#e8c66a';
    ctx.lineWidth = e.cross?2:1.2;
    ctx.setLineDash(e.gate==='none'?[]:[5,4]);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.setLineDash([]);
    if(e.oneway){ // 화살촉
      const mx=(x1+x2)/2, my=(y1+y2)/2, ang=Math.atan2(y2-y1,x2-x1);
      ctx.fillStyle = ctx.strokeStyle;
      ctx.beginPath();
      ctx.moveTo(mx+7*Math.cos(ang), my+7*Math.sin(ang));
      ctx.lineTo(mx+7*Math.cos(ang+2.6), my+7*Math.sin(ang+2.6));
      ctx.lineTo(mx+7*Math.cos(ang-2.6), my+7*Math.sin(ang-2.6));
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  // 방
  for(const r of rooms){
    const [x,y] = W2S(r.x,r.y);
    const rad = RAD[r.size]*Math.max(cam.z,0.55)/Math.max(cam.z,0.0001)*cam.z; // 화면 고정 크기 근사
    const R = RAD[r.size]* Math.min(Math.max(cam.z,0.6),1.4);
    ctx.globalAlpha = roomAlpha(r);
    const col = regById[r.region].color;
    ctx.fillStyle = col; ctx.strokeStyle = '#0b0d12'; ctx.lineWidth = 2;
    ctx.beginPath();
    if(r.type==='boss'||r.type==='miniboss'){
      const k = r.type==='boss'?R*1.5:R*1.1;
      ctx.moveTo(x,y-k); ctx.lineTo(x+k,y); ctx.lineTo(x,y+k); ctx.lineTo(x-k,y);
      ctx.closePath();
    } else if(r.type==='town'||r.type==='hub'){
      ctx.rect(x-R,y-R,R*2,R*2);
    } else {
      ctx.arc(x,y,R,0,7);
    }
    ctx.fill(); ctx.stroke();
    if(r.type==='secret'){ ctx.setLineDash([3,3]); ctx.strokeStyle='#fff9'; ctx.stroke(); ctx.setLineDash([]); }
    if(r.type==='challenge'){ ctx.strokeStyle='#fff6'; ctx.beginPath(); ctx.arc(x,y,R+3,0,7); ctx.stroke(); }
    if(r.flags.includes('bench')){ ctx.fillStyle='#0b0d12'; ctx.beginPath(); ctx.arc(x,y,Math.max(R*0.35,2),0,7); ctx.fill(); }
    if(r.flags.includes('gondola')||r.flags.includes('rail')){
      ctx.strokeStyle='#fff'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.arc(x,y,R+4,0,7); ctx.stroke();
    }
    if(cam.z>0.85){
      ctx.fillStyle = '#dfe6f2'; ctx.font = '10px sans-serif'; ctx.textAlign='center';
      ctx.fillText(r.name, x, y+R+11); ctx.textAlign='left';
    }
    ctx.globalAlpha = 1;
  }
}

function roomAt(sx,sy){
  const [wx,wy] = S2W(sx,sy);
  let best=null, bd=1e9;
  for(const r of rooms){
    const d = Math.hypot(r.x-wx, r.y-wy);
    if(d<bd){bd=d;best=r;}
  }
  return bd*cam.z < 22 ? best : null;
}

const info = document.getElementById('info');
function showInfo(r){
  const g = regById[r.region];
  const exits = r.exits.map(e=>{
    const t = byId[e.to];
    const gate = e.gate!=='none' ? ' <span class="gate">['+e.gate+']</span>' : '';
    const ow = e.oneway ? ' (일방)' : '';
    return '<div class="ex">→ ' + (t? t.name + ' <small>('+regById[t.region].name+')</small>' : e.to) + gate + ow + '</div>';
  }).join('');
  info.innerHTML = '<span class="close" onclick="info.style.display=\'none\'">✕</span>'
    + '<h2>' + r.name + '</h2>'
    + '<div class="meta">' + g.name + ' · ' + r.subzone + ' · ' + r.type + ' · 크기 ' + r.size
    + ' · 개방 단계 ' + r.stage + (r.flags.length? ' · '+r.flags.join(','):'') + '</div>'
    + '<div class="concept">' + r.concept + '</div>'
    + exits
    + '<div style="margin-top:10px;color:#8a93a6;font-size:11px">'
    + '지역: ' + g.identity + '</div>';
  info.style.display = 'block';
}

let drag = null;
cv.addEventListener('pointerdown', e=>{ drag = {x:e.clientX, y:e.clientY, cx:cam.x, cy:cam.y, moved:false}; cv.classList.add('drag'); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e=>{
  const tip = document.getElementById('tip');
  if(drag){
    const dx = (e.clientX-drag.x)/cam.z, dy=(e.clientY-drag.y)/cam.z;
    if(Math.hypot(e.clientX-drag.x, e.clientY-drag.y)>4) drag.moved=true;
    cam.x = drag.cx-dx; cam.y = drag.cy-dy; draw();
  } else {
    const r = roomAt(e.clientX, e.clientY);
    if(r){ tip.style.display='block'; tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+10)+'px';
      tip.textContent = r.name + ' — ' + regById[r.region].name; }
    else tip.style.display='none';
  }
});
cv.addEventListener('pointerup', e=>{
  cv.classList.remove('drag');
  if(drag && !drag.moved){ const r = roomAt(e.clientX, e.clientY); if(r) showInfo(r); }
  drag = null;
});
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  const f = e.deltaY<0 ? 1.15 : 1/1.15;
  const [wx,wy] = S2W(e.clientX, e.clientY);
  cam.z = Math.min(Math.max(cam.z*f, 0.15), 4);
  cam.x = wx - e.clientX/cam.z; cam.y = wy - e.clientY/cam.z;
  draw();
},{passive:false});
document.getElementById('fit').onclick = ()=>{fit();draw();};
document.getElementById('zin').onclick = ()=>{cam.z*=1.25;draw();};
document.getElementById('zout').onclick = ()=>{cam.z/=1.25;draw();};

  return '<div class="lg"><span class="sw" style="background:'+g.color+'"></span>'+g.name+' <small style="color:#8a93a6">'+cnt+'방'+(g.element!=='없음'&&!g.element.startsWith('없음')?' · '+g.element:'')+'</small></div>';
}).join('') + '<hr style="border-color:#2a3348;margin:6px 0">'
 + '<div class="lg">■ 마을/허브 · ● 필드 · ◆ 보스 · ◇ 미니보스</div>'
 + '<div class="lg">중심점 = 거점(세이브) · 겹띠 = 곤돌라/수레역</div>'
 + '<div class="lg">점선 테두리 = 비밀 · <span style="color:#e8c66a">노란 점선</span> = 잠긴 길(게이트)</div>'
 + '<div class="lg">화살촉 = 일방통행 · 굵은 선 = 지역 간 연결</div>';

addEventListener('resize', resize);
setStageLabel(); fit(); resize();
</script>
