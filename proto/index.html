const player={
  x:0,y:0, vx:0,vy:0, face:1, floor:1,
  grounded:false, ground:null, slip:false, slipFrom:null,
  coyoteT:0, bufT:0, jumps:0, jumpCut:false,
  dashT:0, dashCd:0, dashUsed:false, iframe:0,
  /* ★ 창대쉬 상태 — 충전 1회. 접지 또는 wallJump:true 벽 접촉에서만 회복 */
  sdCharge:true, sdHover:0, sdT:0, sdx:0, sdy:0, sdCd:0,
  wall:0, wallGeo:null, lastWallUid:null, wallLock:0, wallSliding:false,
  dropT:0, dropping:false, landT:0, hurtT:0, atkT:0,
  alive:true, respawn:{x:2,y:1}, deaths:0,
  st:"idle", animI:0, animT:0, animFlip:false,
  tele:{apex:0, apexBase:0, lastJumpH:0, lastDashX:0, dashFrom:0, maxSpd:0,
        lastSdashD:0, sdFromX:0, sdFromY:0, dashEndPending:false, sdEndPending:false},
};
const IN={left:false,right:false,up:false,down:false,jump:false,dash:false,
          jumpEdge:false,dashEdge:false,upEdge:false,atkEdge:false,sdEdge:false};
function pollInput(){
  IN.left =!!(keys["arrowleft"] ||keys["a"]);
  IN.right=!!(keys["arrowright"]||keys["d"]);
  IN.up   =!!(keys["arrowup"]   ||keys["w"]);
  IN.down =!!(keys["arrowdown"] ||keys["s"]);
  IN.jump =!!(keys[" "]||keys["z"]);
  IN.dash =!!(keys["shift"]||keys["x"]);
}
const approach=(v,t,d)=> v<t ? Math.min(v+d,t) : Math.max(v-d,t);
const bodyBox=(x,y)=>({x0:x-PHYS.bodyW/2, y0:y, x1:x+PHYS.bodyW/2, y1:y+PHYS.bodyH});
/* 수평을 막는가 — deco는 통과, oneway는 수평으로 막지 않는다 */
const blocksX=g=> g.t!=="deco" && g.t!=="oneway";
function bodyBlocked(x,y){
  const b=bodyBox(x,y);
  for(const g of Q.solidsNear(b.x0,b.y0,b.x1,b.y1)){
    if(!blocksX(g)) continue;
    if(rectHit(b,g)) return true;
  }
  return false;
}
function sweepX(p,dx){
  if(!dx) return false;
  const b=bodyBox(p.x,p.y), hw=PHYS.bodyW/2;
  let nx=p.x+dx, hit=false;
  for(const g of Q.sweep(b,dx,0)){
    if(!blocksX(g)) continue;
    if(g.y0>=b.y1-1e-6||g.y1<=b.y0+1e-6) continue;          // 세로로 안 겹침
    if(dx>0 && b.x1<=g.x0+1e-6 && g.x0-hw<nx){ nx=g.x0-hw; hit=true; }
    if(dx<0 && b.x0>=g.x1-1e-6 && g.x1+hw>nx){ nx=g.x1+hw; hit=true; }
  }
  p.x=nx; return hit;
}
/* 렛지 스냅(PHYS.ledgeSnap): 낮은 턱에 막히면 그만큼 올라서서 재시도 */
function moveX(p,dx){
  const x0=p.x, y0=p.y;
  if(!sweepX(p,dx)) return false;
  if(p.grounded && PHYS.ledgeSnap>0){
    p.x=x0; p.y=y0+PHYS.ledgeSnap;
    if(!bodyBlocked(p.x,p.y) && !sweepX(p,dx)) return false;   // 승월 성공
    p.x=x0; p.y=y0; sweepX(p,dx);                              // 실패 — 되돌림
  }
  return true;
}
function moveY(p,dy){
  if(!dy) return 0;
  const b=bodyBox(p.x,p.y);
  let ny=p.y+dy, land=null, ceil=false;
  for(const g of Q.sweep(b,0,dy)){
    if(g.t==="deco") continue;
    if(g.x0>=b.x1-1e-6||g.x1<=b.x0+1e-6) continue;            // 가로로 안 겹침
    if(dy<0){                                                  // 하강
      if(g.t==="oneway"){
        if(p.dropping && g.dropThrough!==false) continue;
        if(b.y0<g.y1-1e-6) continue;                           // 판 아래에서 올라오는 중
      }
      if(b.y0>=g.y1-1e-6 && ny<g.y1 && (!land||g.y1>land.y1)){ land=g; }
    }else{                                                     // 상승
      if(g.t==="oneway") continue;                             // 아래에서 통과
      if(b.y1<=g.y0+1e-6 && ny+PHYS.bodyH>g.y0){ ny=Math.min(ny,g.y0-PHYS.bodyH); ceil=true; }
    }
  }
  if(land) ny=land.y1;
  p.y=ny;
  if(land){ p.vy=0; return land.stand? 1 : 2; }                 // 1=착지 2=비착지(미끄럼)
  if(ceil){ p.vy=0; return -1; }
  return 0;
}
/* 발밑 접지 판정 — oneway 드롭스루 중이면 무시 */
function groundUnder(p){
  const b=bodyBox(p.x,p.y);
  for(const g of Q.solidsNear(b.x0,p.y-0.06,b.x1,p.y+0.02)){
    if(g.t==="deco") continue;
    if(g.x0>=b.x1-1e-6||g.x1<=b.x0+1e-6) continue;
    if(Math.abs(g.y1-p.y)>0.03) continue;
    if(g.t==="oneway" && p.dropping && g.dropThrough!==false) continue;
    return g;
  }
  return null;
}
/* 층은 y로 결정한다. 층 경계가 맞닿아 있으므로 "정확히 포함"을 먼저 보고,
   밖으로 벗어났을 때만 가장 가까운 층으로 떨어뜨린다.
   (허용오차부터 보면 48.5가 5F로 잡히는 등 경계에서 오판이 난다) */
function floorOf(y){
  for(const f of FLOORS) if(y>=f.yOff && y<f.yOff+f.h) return f.n;
  let best=null,bd=Infinity;
  for(const f of FLOORS){
    const d = y<f.yOff ? f.yOff-y : y-(f.yOff+f.h);
    if(d<bd){ bd=d; best=f; }
  }
  return best? best.n : 1;
}
function setAnim(p,st){ if(p.st!==st){ p.st=st; p.animI=0; p.animT=0; } }
function doJump(p,v){ p.vy=v; p.grounded=false; p.ground=null; p.coyoteT=0; p.bufT=0;
  p.jumpCut=false; p.tele.apexBase=p.y; p.tele.apex=p.y; setAnim(p,"rise"); }

function respawnPlayer(p){
  p.x=p.respawn.x; p.y=p.respawn.y;
  p.vx=0; p.vy=0; p.dashT=0; p.dashCd=0; p.dashUsed=false; p.jumps=0;
  p.sdCharge=true; p.sdHover=0; p.sdT=0; p.sdCd=0; p.lastWallUid=null;
  p.dropT=0; p.dropping=false; p.slip=false; p.alive=true; p.hurtT=0; p.iframe=0.6;
  p.floor=floorOf(p.y); setAnim(p,"idle");
}
function killPlayer(p,src){
  if(!p.alive) return;
  p.alive=false; p.deaths++; p.hurtT=CTRL.hurtTime; p.vx=0; p.vy=0;
  setAnim(p,"hurt");
  /* hazards[].respawn이 체크포인트를 지정하면 그쪽, "auto"면 마지막으로 활성화한
     강림 사당(p.respawn)을 그대로 쓴다. 낙하 지점 기준 최근접을 쓰면 아래층 사당으로
     끌려간다(6F L3에서 떨어졌는데 6F 최하단 사당3으로 가는 문제). */
  const named = src && src.respawn && src.respawn!=="auto"
    ? CHECKPOINTS.find(c=>c.id===src.respawn) : null;
  if(named) p.respawn={x:named.wx, y:named.wy};
  else if(!p.respawn){ const n=nearestCheckpoint(p); if(n) p.respawn={x:n.wx, y:n.wy}; }
}
function nearestCheckpoint(p){
  let best=null,bd=1e9;
  for(const c of CHECKPOINTS){
    if(c.floor!==p.floor) continue;
    const d=Math.hypot(c.wx-p.x,c.wy-p.y); if(d<bd){bd=d;best=c;}
  }
  if(best) return best;
  const f=FLOORS.find(a=>a.n===p.floor);
  const e=f&&(f.portals||[]).find(q=>q.id==="entry");
  return e? {wx:e.pos[0], wy:e.pos[1]+f.yOff} : null;
}
/* 문 포탈 사용 (물리 연속 구간은 지형으로 통과하므로 대상 아님) */
function tryPortal(p){
  for(const q of PORTALS){
    if(q.mode!=="door"||q.floor!==p.floor) continue;
    if(Math.abs(q.wx-p.x)>0.9 || Math.abs(q.wy-p.y)>1.0) continue;
    const dst=PORTALS.find(r=>r.fid===q.to && r.id===q.toPortal);
    if(!dst) continue;
    p.x=dst.wx; p.y=dst.wy; p.vx=0; p.vy=0; p.jumps=0; p.dashUsed=false;
    p.floor=floorOf(p.y); p.respawn={x:dst.wx,y:dst.wy};
    setAnim(p,"idle"); toast(`${dst.fid} 진입`); return true;
  }
  return false;
}
function warpFloor(n){
  const f=FLOORS.find(a=>a.n===n); if(!f) return;
  const e=(f.portals||[]).find(q=>q.id==="entry");
  const pos = f.spawnW ? {x:f.spawnW[0],y:f.spawnW[1]} : (e? {x:e.pos[0],y:e.pos[1]+f.yOff} : {x:1,y:f.yOff+1});
  player.respawn={x:pos.x,y:pos.y}; respawnPlayer(player);
  toast(`${n}F ${f.name} 진입`);
}

/* ── 고정 타임스텝 1스텝 ─────────────────────────────────────────── */
function stepPlayer(dt){
  const p=player;
  p.coyoteT=Math.max(0,p.coyoteT-dt); p.bufT=Math.max(0,p.bufT-dt);
  p.dashCd =Math.max(0,p.dashCd -dt); p.iframe=Math.max(0,p.iframe-dt);
  p.wallLock=Math.max(0,p.wallLock-dt); p.dropT=Math.max(0,p.dropT-dt);
  p.landT=Math.max(0,p.landT-dt); p.atkT=Math.max(0,p.atkT-dt);
  p.sdCd=Math.max(0,p.sdCd-dt);
  p.dropping=p.dropT>0;

  if(!p.alive){ p.hurtT-=dt; if(p.hurtT<=0) respawnPlayer(p); return; }

  const dir=(IN.right?1:0)-(IN.left?1:0);

  /* 입력 에지 소비 */
  if(IN.jumpEdge){ p.bufT=CTRL.jumpBuf; IN.jumpEdge=false; }
  if(IN.upEdge){ IN.upEdge=false; tryPortal(p); }
  if(IN.atkEdge){ IN.atkEdge=false; if(p.atkT<=0) p.atkT=ANIM.attack.i.length/ANIM.attack.fps; }
  /* ★ 창대쉬 발동 — 대시와 완전히 별개 입력.
     8방향(방향키 조합, 무입력 시 바라보는 방향) · 충전 1회 ·
     발동하면 sdashHover 동안 공중에 정지했다가 그 방향으로 sdashTime 돌진.
     대시 중/체공 중에도 이어서 나가므로 "점프 → 이단강림 → 대시 → 창대쉬" 4단 체인이 성립한다. */
  if(IN.sdEdge){
    IN.sdEdge=false;
    if(p.sdCharge && p.sdT<=0 && p.sdHover<=0 && p.sdCd<=0){
      let ax=(IN.right?1:0)-(IN.left?1:0), ay=(IN.up?1:0)-(IN.down?1:0);
      if(!ax && !ay) ax=p.face;                       // 무입력 = 바라보는 방향
      const L=Math.hypot(ax,ay)||1;
      p.sdx=ax/L; p.sdy=ay/L;
      p.sdCharge=false; p.sdHover=PHYS.sdashHover; p.sdT=PHYS.sdashTime;
      p.tele.sdFromX=p.x; p.tele.sdFromY=p.y;
      p.dashT=0;                                      // 진행 중인 대시는 흡수
      p.vx=0; p.vy=0; p.jumpCut=true;                 // 체공 중 가변점프 컷 무효화
      if(ax) p.face=Math.sign(ax);
      p.iframe=Math.max(p.iframe, PHYS.sdashHover+PHYS.sdashTime);
      setAnim(p,"sdash");
    }
  }
  if(IN.dashEdge){
    IN.dashEdge=false;
    if(p.sdHover<=0 && p.sdT<=0 && p.dashCd<=0 && p.dashT<=0 && !(p.dashUsed&&!p.grounded)){
      p.dashT=PHYS.dashTime; p.dashDir=dir||p.face; p.face=p.dashDir;
      p.dashCd=PHYS.dashTime+CTRL.dashCool; p.iframe=PHYS.dashTime;
      p.tele.dashFrom=p.x;
      if(!p.grounded) p.dashUsed=true;
      setAnim(p,"dash");
    }
  }
  /* 아래+점프 = 한방향 판 드롭스루 */
  if(IN.down && p.bufT>0 && p.grounded && p.ground && p.ground.t==="oneway"
     && p.ground.dropThrough!==false){
    p.dropT=0.16; p.dropping=true; p.bufT=0; p.grounded=false; p.y-=0.02;
  }

  /* 벽 접촉 / 벽 슬라이드 — Q.wallContact는 `wallJump:true` 표면만 돌려준다 */
  const wc = p.grounded? 0 : Q.wallContact(bodyBox(p.x,p.y));
  p.wall = wc? wc.dir : 0;
  p.wallGeo = wc? wc.geo : null;
  if(wc && p.lastWallUid && p.lastWallUid!==wc.geo.uid) p.lastWallUid=null;  // 다른 벽 = 초기화
  p.wallSliding = !p.grounded && p.wall!==0 && dir===p.wall && p.vy<0
                  && p.dashT<=0 && p.sdT<=0 && p.sdHover<=0;
  /* ★ 창대쉬 충전 회복 — 접지 **또는 지정 벽 접촉**에서만.
     경계벽이 여기 들어오면 "붙어 충전 → 창대쉬 → 다시 붙기"로 무한 상승이 된다.
     Q.wallContact가 wallJump:true만 돌려주므로 구조적으로 차단된다. */
  if(p.grounded || wc) p.sdCharge=true;

  /* 점프 (버퍼 + 코요테 + 벽점프 + 이단 강림)
     ★ 슬립(첨탑캡 stand:false) 중에는 점프 일체 봉인 — v1.0에서 고쳤다던
       "캡을 밟고 튀어올라 게이트를 넘는" 결함이 부활했었다(어드바이저 B-2).
     ★ 창대쉬 체공/돌진 중에도 점프 봉인. */
  if(p.bufT>0 && p.dashT<=0 && !p.slip && p.sdHover<=0 && p.sdT<=0){
    if(p.grounded||p.coyoteT>0){ doJump(p,PHYS.jumpV); p.jumps=1; p.lastWallUid=null; }
    else if(p.wall!==0 && p.wallGeo && p.lastWallUid!==p.wallGeo.uid){   // 벽점프
      doJump(p,PHYS.jumpV); p.vx=-p.wall*PHYS.runSpeed*CTRL.wallJumpPush;
      p.face=-p.wall; p.wallLock=CTRL.wallJumpLock; p.jumps=1;
      /* ★ 같은 표면 연속 벽점프 금지 — 접지하거나 다른 벽에 붙기 전까지.
         이게 없으면 벽 하나만으로 무한히 올라가 6F가 통째로 스킵된다(B-1). */
      p.lastWallUid=p.wallGeo.uid;
    }
    else if(p.jumps<2){ doJump(p,PHYS.airJumpV); p.jumps=2; } // 이단 강림
  }
  /* 가변 점프 — 버튼을 놓으면 상승분을 잘라낸다 */
  if(!IN.jump && p.vy>0 && !p.jumpCut){ p.vy*=CTRL.cutJump; p.jumpCut=true; }

  /* 수평 */
  const sdashing = p.sdT>0 || p.sdHover>0;
  const dashing = p.dashT>0;
  if(sdashing){
    if(p.sdHover>0){ p.sdHover-=dt; p.vx=0; p.vy=0; }      // 체공(완전 정지)
    else{
      /* 마지막 스텝은 남은 시간만큼만 — 그래야 변위가 정확히 sdashSpeed·sdashTime이
         되어 REACH.sdash 계약과 이산화 오차 없이 일치한다 */
      const s=Math.min(dt,p.sdT)/dt; p.sdT-=dt;
      p.vx=p.sdx*PHYS.sdashSpeed*s; p.vy=p.sdy*PHYS.sdashSpeed*s;
    }
  }else if(dashing){
    const s=Math.min(dt,p.dashT)/dt; p.dashT-=dt;   // 마지막 스텝은 남은 시간만큼만
    p.vx=p.dashDir*PHYS.dashSpeed*s;
    p.iframe=Math.max(p.iframe,p.dashT);
    /* ★ 계측은 moveX **이후**에 해야 한다. v1.2는 여기서 바로 찍어 마지막 한 스텝의
       이동분이 빠졌다(표시 1.235 / 실제 1.30 — 어드바이저 B-9). 플래그만 세운다. */
    if(p.dashT<=0) p.tele.dashEndPending=true;
  }else{
    const acc=p.grounded?CTRL.accelGround:CTRL.accelAir;
    const fri=p.grounded?CTRL.fricGround:CTRL.fricAir;
    if(p.wallLock<=0){
      if(dir){ p.vx=approach(p.vx, dir*PHYS.runSpeed*(p.grounded?1:PHYS.airControl), acc*dt); p.face=dir; }
      else     p.vx=approach(p.vx, 0, fri*dt);
    }
    if(p.slip && p.slipFrom){                              // 첨탑캡 = 못 서는 표면
      const c=(p.slipFrom.x0+p.slipFrom.x1)/2;
      p.vx += (p.x<c?-1:1)*CTRL.slipAccel*dt;
    }
  }
  /* ★ 공중 수평 감쇠 — v1.2의 즉시 하드 클램프를 0.12s 접근 감쇠로 교체.
     클램프는 감각을 죽이면서(대시 관성이 뚝 끊긴다) 게이팅 근거로는 무의미했다:
     클램프 유무로 모델 도달이 3.12↔3.46 움직이는 동안 실측 최대는 5.33u였다
     (어드바이저 B-8). 게이팅은 이제 ENV 포락선이 보장하므로 관성을 살린다.
     벽점프 반동 구간(wallLock)·대시·창대쉬 중은 제외. */
  if(!p.grounded && !dashing && !sdashing && p.wallLock<=0){
    const cap=PHYS.runSpeed*PHYS.airControl;
    if(Math.abs(p.vx)>cap){
      const d=(PHYS.dashSpeed-cap)/Math.max(1e-6,PHYS.airDecayT);
      p.vx = p.vx>0 ? Math.max(cap,p.vx-d*dt) : Math.min(-cap,p.vx+d*dt);
    }
  }
  /* 수직 — 벨로시티 베를레(반중력 → 이동 → 반중력).
     대칭 오일러로 하면 점프 정점이 1.5546u로 REACH.jump(1.592)보다 0.037u 모자라
     "설계상 닿아야 할 곳"에 못 닿는다. 반중력 분할이면 정점이 해석해와 일치한다.
     ★ 창대쉬 체공·돌진 중에는 중력이 걸리지 않는다(변위가 정확히 sdashSpeed·sdashTime). */
  const noGrav = sdashing || (dashing && CTRL.dashFreezeY);
  if(noGrav){ /* vy는 위에서 이미 지정됨 */ }
  else{
    p.vy-=PHYS.gravity*dt*0.5;
    if(p.wallSliding && p.vy<-CTRL.wallSlideV) p.vy=-CTRL.wallSlideV;
    if(p.vy<-CTRL.maxFall) p.vy=-CTRL.maxFall;
  }

  /* 이동 — 축 분리 */
  if(moveX(p,p.vx*dt)){ p.vx=0; if(p.sdT>0){ p.sdT=0; p.vy=0; } }   // 벽에 박으면 돌진 종료
  const r=moveY(p,p.vy*dt);
  if(r!==0 && p.sdT>0){ p.sdT=0; p.vy=0; }                          // 천장/바닥도 마찬가지
  if(r===0 && !noGrav){
    p.vy-=PHYS.gravity*dt*0.5;                             // 충돌하지 않았을 때만 후반 반중력
    if(p.vy<-CTRL.maxFall) p.vy=-CTRL.maxFall;
  }
  /* 창대쉬 종료 — 상승분은 남기지 않는다(변위형 이동기).
     수평 관성만 남기고 위 감쇠 로직이 상한으로 되돌린다. */
  if(sdashing && p.sdT<=0 && p.sdHover<=0){ p.vy=0; p.jumpCut=true; p.tele.sdEndPending=true; }
  const g=groundUnder(p);
  const wasGround=p.grounded;
  p.ground=g;
  p.grounded = !!g && g.stand===true && p.vy<=0 && p.dashT<=0;
  p.slip     = !!g && g.stand!==true;
  p.slipFrom = p.slip? g : null;
  if(p.grounded){
    p.coyoteT=CTRL.coyote; p.jumps=0; p.dashUsed=false; p.jumpCut=false;
    p.lastWallUid=null;                                    // 접지 = 벽점프 제한 해제
    if(!p.sdCharge) p.sdCd=CTRL.sdashCool;
    p.sdCharge=true;                                       // 창대쉬 충전 회복
    if(!wasGround && r===1){ p.landT=CTRL.landAnim; setAnim(p,"land"); }
    const cp=Q.checkpointNear(p.x,p.y,0.9);
    if(cp) p.respawn={x:cp.wx, y:cp.wy};
  }else if(wasGround && p.vy<=0){ p.coyoteT=CTRL.coyote; }

  /* 계측 — 이동이 전부 끝난 뒤에 찍는다 (B-9) */
  if(p.tele.dashEndPending){ p.tele.dashEndPending=false;
    p.tele.lastDashX=Math.abs(p.x-p.tele.dashFrom); }
  if(p.tele.sdEndPending){ p.tele.sdEndPending=false;
    p.tele.lastSdashD=Math.hypot(p.x-p.tele.sdFromX, p.y-p.tele.sdFromY); }
  if(!p.grounded){ if(p.y>p.tele.apex) p.tele.apex=p.y; }
  else if(p.tele.apex>p.tele.apexBase){ p.tele.lastJumpH=p.tele.apex-p.tele.apexBase;
                                        p.tele.apex=p.y; p.tele.apexBase=p.y; }
  p.tele.maxSpd=Math.max(p.tele.maxSpd,Math.abs(p.vx));

  /* 낙하존 — kind:"fall"은 "구역 바닥 아래로 떨어지면" 성립한다.
     (3F 우물처럼 구역 안에 안전 바닥이 있는 경우를 오검출하지 않기 위함)
     ★ 층 스코프는 p.floor로 건다. 그래서 p.floor는 "착지했을 때만" 갱신한다 —
       y로 매 스텝 다시 계산하면 층 경계를 지나는 순간 소속이 아랫층으로 바뀌어
       낙하존 판정이 통째로 건너뛰어진다(4F 대균열이 사람을 안 죽이던 버그). */
  for(const z of HAZARDS){
    if(z.kind!=="fall"||z.floor!==p.floor) continue;
    if(p.x<z.x0-0.2||p.x>z.x1+0.2) continue;
    if(p.y<z.y0){ killPlayer(p,z); return; }
  }
  const f=FLOORS.find(a=>a.n===p.floor);
  if(f && p.y < f.yOff-4){ killPlayer(p,null); return; }
  if(p.grounded) p.floor=floorOf(p.y);
}
/* ==================================================================== */
/* 10.6 이동기 실측 — 「컨트롤러가 REACH/ENV 계약을 지키는가」 (어드바이저 B-3)  */
/*                                                                      */
/*  v1.2에는 이 검사가 **0줄**이었다. 그래서 CTRL을 34가지로 망가뜨려도       */
/*  (dashFreezeY·클램프 삭제·wallJumpPush 4.0·accelAir 260·maxFall 99·      */
/*   cutJump 1.0·coyote 9.0·베를레→오일러) 전부 12/12 PASS였다.            */
/*  REACH는 컨트롤러가 지켜야 할 **계약**인데 이행 확인 코드가 없었다.        */
/*                                                                      */
/*  여기서는 실제 stepPlayer를 헤드리스로 굴려 도달 포락선을 측정하고,        */
/*  모델(ENV)과 대조한다. 인게임 `T`에서도 그대로 돈다.                     */
/* ==================================================================== */
const MEAS_PAD={uid:"meas:pad", id:"pad", t:"solid", stand:true, label:"계측 발판",
  x0:-320, x1:-80, y0:-2, y1:0, floor:1, fid:"plaza"};
const MEAS_EPS = ENV_STEP + PHYS.dashSpeed*CTRL.dt;   // 버킷 0.1u + 1스텝 이산화

function _measSnapshot(){
  const s=Object.assign({},player);
  s.tele=Object.assign({},player.tele); s.respawn=Object.assign({},player.respawn);
  return {p:s, in:Object.assign({},IN)};
}
function _measRestore(s){
  Object.assign(player,s.p);
  player.tele=s.p.tele; player.respawn=s.p.respawn;
  Object.assign(IN,s.in);
}
/* 한 정책을 굴려 (dx,dy) 궤적을 포락선 버킷에 적립.
   plan: {dashMode:"ground"|"air"|"none", tDash, tAir, tSd, sdx, sdy, sdash:bool} */
function _measRun(plan, tbl, out){
  const p=player;
  for(const k in IN) IN[k]=false;
  p.x=-200; p.y=0; p.vx=0; p.vy=0; p.face=1; p.floor=1;
  p.grounded=true; p.ground=MEAS_PAD; p.slip=false; p.slipFrom=null;
  p.jumps=0; p.dashT=0; p.dashCd=0; p.dashUsed=false; p.iframe=0;
  p.sdCharge=true; p.sdHover=0; p.sdT=0; p.sdCd=0; p.lastWallUid=null;
  p.coyoteT=0; p.bufT=0; p.dropT=0; p.dropping=false; p.alive=true; p.hurtT=0;
  p.wallLock=0; p.landT=0; p.atkT=0; p.jumpCut=false;
  p.vx=PHYS.runSpeed; IN.right=true;                    // 이미 최고속으로 달리는 중
  let t=0, launched=false, x0=0, y0=0, maxY=-1e9, air=0;
  const dt=CTRL.dt;
  if(plan.dashMode==="ground"){ IN.dashEdge=true; stepPlayer(dt); t+=dt; }
  for(let n=0;n<600;n++){
    if(!launched){
      if(plan.dashMode!=="ground" || p.dashT<=0){       // 지상대시는 끝나자마자 점프
        IN.jumpEdge=true; launched=true; x0=p.x; y0=p.y; t=0;
      }
    }else{
      if(plan.dashMode==="air" && t>=plan.tDash && t<plan.tDash+dt) IN.dashEdge=true;
      if(plan.tAir!=null && t>=plan.tAir && t<plan.tAir+dt) IN.jumpEdge=true;
      if(plan.sdash && t>=plan.tSd && t<plan.tSd+dt) IN.sdEdge=true;
    }
    stepPlayer(dt); t+=dt;
    if(launched){
      air++;
      const dx=p.x-x0, dy=p.y-y0;
      if(dy>maxY) maxY=dy;
      const i=envIdx(dy);
      if(i>=0&&i<tbl.length&&dx>tbl[i]) tbl[i]=dx;
      /* ★ 착지하면 비행 종료 — 여기서 안 끊으면 착지 후 계속 달린 거리가
         dy=0 버킷에 쌓여 "포락선 초과 6.6u" 같은 허깨비가 나온다 */
      if(air>6 && p.grounded) break;
      if(dy<-6 || t>3.0) break;
    }
    if(!launched && t>1.0) break;
  }
  if(out && maxY>out.maxUp) out.maxUp=maxY;
}
/* 컨트롤러 실측 포락선 (kit: "basic" | "full") */
function measureEnvelope(kit){
  const tbl=new Float64Array(ENV_N).fill(-1);
  const out={maxUp:-1e9};
  const snap=_measSnapshot();
  grid.insert(MEAS_PAD);
  try{
    const dashModes=["ground","air","none"];
    const tAirs=[0.02,0.12,0.24,0.36,0.52,0.70,null];
    const tSds = kit==="full"? [0.0,0.10,0.22,0.34,0.50,0.70,0.95] : [];
    const dirs =[[1,0],[0.7071,0.7071],[0,1],[0.7071,-0.7071],[0,-1]];
    for(const dm of dashModes) for(const tAir of tAirs){
      _measRun({dashMode:dm,tDash:0.05,tAir,sdash:false}, tbl, out);
      for(const tSd of tSds) for(const d of dirs)
        _measRun({dashMode:dm,tDash:0.05,tAir,sdash:true,tSd,sdx:d[0],sdy:d[1]}, tbl, out);
    }
  } finally { grid.remove(MEAS_PAD); _measRestore(snap); }
  return {tbl, maxUp:out.maxUp};
}
/* 스칼라 실측: 단일점프·이단강림·대시거리·창대쉬 변위 */
function measureScalars(){
  const snap=_measSnapshot(); grid.insert(MEAS_PAD);
  const p=player, dt=CTRL.dt, R={};
  const reset=()=>{ for(const k in IN) IN[k]=false;
    p.x=-200;p.y=0;p.vx=0;p.vy=0;p.face=1;p.floor=1;p.grounded=true;p.ground=MEAS_PAD;
    p.slip=false;p.jumps=0;p.dashT=0;p.dashCd=0;p.dashUsed=false;p.sdCharge=true;
    p.sdHover=0;p.sdT=0;p.sdCd=0;p.coyoteT=0;p.bufT=0;p.alive=true;p.wallLock=0;
    p.lastWallUid=null;p.jumpCut=false;p.iframe=0; };
  try{
    /* 단일점프 (버튼 계속 누름) */
    reset(); IN.jump=true; IN.jumpEdge=true; let m=0;
    for(let n=0;n<300;n++){ stepPlayer(dt); m=Math.max(m,p.y); if(n>4&&p.grounded) break; }
    R.jump=m;
    /* 이단강림 — 재입력 타이밍을 훑어 **최댓값**을 찾는다.
       한 타이밍만 찍으면 "정점 전에 눌러 손해 본 값"이 나와, 컨트롤러가
       설계 도달을 실제로 낼 수 있는지 증명하지 못한다. */
    R.doubleJump=0;
    for(let k=0;k<70;k+=2){
      reset(); IN.jump=true; IN.jumpEdge=true; m=0;
      for(let n=0;n<300;n++){ if(n===k) IN.jumpEdge=true; stepPlayer(dt); m=Math.max(m,p.y);
                              if(n>4&&p.grounded) break; }
      R.doubleJump=Math.max(R.doubleJump,m);
    }
    /* 지상 대시 순수 거리 */
    reset(); IN.dashEdge=true; const dx0=p.x;
    for(let n=0;n<80;n++){ stepPlayer(dt); if(p.dashT<=0) break; }
    R.dashDist=Math.abs(p.x-dx0);
    /* 창대쉬 수직 변위 (제자리에서 위로) */
    reset(); IN.up=true; IN.sdEdge=true; const sy=p.y;
    for(let n=0;n<200;n++){ stepPlayer(dt); if(p.sdT<=0&&p.sdHover<=0) break; }
    R.sdashUp=p.y-sy;
    /* ★ 4단 체인: 점프 → 이단강림 → 대시 → 창대쉬(위).
       네 입력이 실제로 **연속으로 나가는지** + 최대 상승이 얼마인지 둘 다 본다.
       타이밍을 훑어 최댓값을 취한다. */
    R.chainUp=0; R.chainOk=false;
    for(let ka=8;ka<=44;ka+=4) for(let ks=ka+8;ks<=ka+40;ks+=4){
      reset(); IN.jump=true; IN.jumpEdge=true; m=0;
      let sawDash=false, sawSd=false, jumpsSeen=0;
      for(let n=0;n<400;n++){
        if(n===ka) IN.jumpEdge=true;                        // 이단강림
        if(n===ka+4) IN.dashEdge=true;                      // 대시
        if(n===ks){ IN.up=true; IN.sdEdge=true; }           // 창대쉬(위)
        stepPlayer(dt); m=Math.max(m,p.y);
        if(p.dashT>0) sawDash=true;
        if(p.sdT>0||p.sdHover>0) sawSd=true;
        jumpsSeen=Math.max(jumpsSeen,p.jumps);
        if(n>ks+40&&p.grounded) break;
      }
      if(m>R.chainUp) R.chainUp=m;
      if(sawDash&&sawSd&&jumpsSeen>=2) R.chainOk=true;      // 4단이 전부 발동했다
    }
  } finally { grid.remove(MEAS_PAD); _measRestore(snap); }
  return R;
}
/* ── 벽 등반 실측 ────────────────────────────────────────────────────
   평지 포락선만 재면 **벽을 이용한 무한 상승**을 볼 수 없다. v1.2가 그랬고,
   그래서 경계벽 76회 벽점프로 6F가 통째로 스킵되는 걸 12/12 PASS로 놓쳤다(B-1).
   여기서는 합성 벽 옆에서 점프/창대쉬를 연타시켜 실제 상승 한계를 잰다.
     opt.wallJump — 이 벽이 설계 지정 슈트인가
     opt.sdash    — 창대쉬도 연타할 것인가 (충전 회복 규칙 검사) */
function measureWallClimb(opt){
  const WALL={uid:"meas:wall", id:"wall", t:"wall", stand:false, label:"계측 벽",
    x0:-180, x1:-179.6, y0:0, y1:opt.wallTop, floor:1, fid:"plaza",
    wallJump:opt.wallJump===true};
  const snap=_measSnapshot(); grid.insert(MEAS_PAD); grid.insert(WALL);
  const p=player, dt=CTRL.dt; let best=0;
  try{
    for(const period of [10,14,18,24,30,40]){
      for(const k in IN) IN[k]=false;
      p.x=-182; p.y=0; p.vx=0; p.vy=0; p.face=1; p.floor=1;
      p.grounded=true; p.ground=MEAS_PAD; p.slip=false; p.jumps=0;
      p.dashT=0; p.dashCd=0; p.dashUsed=false; p.sdCharge=true; p.sdHover=0; p.sdT=0;
      p.sdCd=0; p.coyoteT=0; p.bufT=0; p.alive=true; p.wallLock=0; p.lastWallUid=null;
      p.jumpCut=false; p.iframe=0;
      IN.right=true; IN.jump=true;                 // 벽을 향해 붙어서 점프 연타
      for(let n=0;n<1200;n++){
        if(n%period===0) IN.jumpEdge=true;
        if(opt.sdash && n%period===Math.floor(period/2)){ IN.up=true; IN.sdEdge=true; }
        stepPlayer(dt);
        if(p.y>best) best=p.y;
        if(p.y<-6) break;
      }
    }
  } finally { grid.remove(WALL); grid.remove(MEAS_PAD); _measRestore(snap); }
  return best;
}
/* 계약 검사: 실측이 모델 포락선을 넘어서면 게이팅 근거가 무너진다 */
function reachContractIssues(){
  const bad=[];
  const S=measureScalars();
  const chk=(n,meas,model)=>{ if(meas>model+MEAS_EPS)
    bad.push(`${n} 실측 ${meas.toFixed(3)} > 모델 ${model.toFixed(3)}`); };
  chk("단일점프", S.jump, REACH.jump);
  chk("이단강림", S.doubleJump, REACH.doubleJump);
  chk("대시거리", S.dashDist, PHYS.dashSpeed*PHYS.dashTime);
  chk("창대쉬 변위", S.sdashUp, REACH.sdash);
  chk("4단 체인 상승", S.chainUp, REACH.chainUp);
  if(!S.chainOk) bad.push("4단 체인(점프→이단강림→대시→창대쉬)이 나가지 않음");
  /* ★ 반대 방향도 본다 — 설계가 요구하는 도달을 컨트롤러가 **실제로 낼 수 있는가**.
     못 내면 게이트 갭이 "넘을 수 있다"고 검증된 채 실제로는 못 넘는다. */
  const short=(n,meas,model)=>{ if(meas<model-GATE_MARGIN)
    bad.push(`${n} 실측 ${meas.toFixed(3)} < 설계 ${model.toFixed(3)} (도달 미달)`); };
  short("단일점프", S.jump, REACH.jump);
  short("이단강림", S.doubleJump, REACH.doubleJump);
  short("4단 체인 상승", S.chainUp, REACH.chainUp);
  /* ── 벽 등반 3종 (B-1 · 창대쉬 충전 규칙) ──
     WT는 검사용 합성 벽 높이. 실제 맵의 슈트보다 훨씬 높게 잡아야
     "무한 상승"과 "벽 높이에 묶인 상승"이 구분된다. */
  const WT=40, WS=8;                              // 같은 벽을 높이만 달리해 두 번 잰다
  S.wallTall   = measureWallClimb({wallTop:WT, wallJump:true,  sdash:false});
  S.wallShort  = measureWallClimb({wallTop:WS, wallJump:true,  sdash:false});
  S.wallTallSd = measureWallClimb({wallTop:WT, wallJump:true,  sdash:true });
  S.wallPlain  = measureWallClimb({wallTop:WT, wallJump:false, sdash:false});
  S.wallPlainSd= measureWallClimb({wallTop:WT, wallJump:false, sdash:true });
  /* ① 지정 슈트라도 **벽이 높다고 더 올라가면 안 된다** — 같은 표면 연속 벽점프가
        금지돼 있으므로 벽점프는 1회뿐이고, 상승은 벽 높이와 무관해야 한다.
        (연속 벽점프를 되살리면 tall이 short를 한참 앞질러 여기서 터진다) */
  if(S.wallTall > S.wallShort+MEAS_EPS)
    bad.push(`★같은 벽 연속 벽점프 성립 (h${WT} ${S.wallTall.toFixed(2)} > h${WS} ${S.wallShort.toFixed(2)})`);
  /* ② 지정 슈트 + 창대쉬는 충전이 회복되므로 **벽 꼭대기까지**는 기어오를 수 있다.
        그 위로 더 가면 안 된다(모델 wallBoostTop이 이 상한을 전제한다). */
  if(S.wallTallSd > WT+REACH.chainUp+MEAS_EPS)
    bad.push(`지정 벽 창대쉬 등반 ${S.wallTallSd.toFixed(2)} > 벽상단+체인 ${(WT+REACH.chainUp).toFixed(2)}`);
  /* ③ 경계벽(비지정)은 벽점프도 창대쉬 충전도 성립하면 안 된다 */
  if(S.wallPlain > REACH.doubleJump+MEAS_EPS)
    bad.push(`★경계벽 벽점프 성립 ${S.wallPlain.toFixed(2)} > ${REACH.doubleJump.toFixed(2)} (무한 벽점프 부활)`);
  if(S.wallPlainSd > REACH.chainUp+MEAS_EPS)
    bad.push(`★경계벽 창대쉬 충전 ${S.wallPlainSd.toFixed(2)} > ${REACH.chainUp.toFixed(2)} (무한 상승 부활)`);
  for(const kit of ["basic","full"]){
    const M=measureEnvelope(kit), model=kit==="full"? ENV.full : ENV.basic;
    let worst=0, at=null;
    for(let i=0;i<M.tbl.length;i++){
      if(M.tbl[i]<0) continue;
      const md=model[i]<0? -Infinity : model[i];
      const over=M.tbl[i]-md;
      if(over>worst){ worst=over; at=ENV_LO+i*ENV_STEP; }
    }
    if(worst>MEAS_EPS)
      bad.push(`${kit} 포락선 초과 ${worst.toFixed(3)}u @dy${at.toFixed(1)}`);
  }
  return {bad, scalars:S};
}
/* 애니메이션 상태 선택 + 프레임 진행 */
function updateAnim(p,dt){
  let st;
  p.animFlip=false;
  if(!p.alive)             st="hurt";
  else if(p.sdHover>0)     st="charge";                  // ★ 창대쉬 체공(응축)
  else if(p.sdT>0){                                      // ★ 방향별 돌진 + 좌우 반전
    const s=sdashAnim(p.sdx,p.sdy); st=s.a; p.animFlip=s.flip;
  }
  else if(p.dashT>0)       st="dash";
  else if(p.atkT>0)        st="attack";
  else if(p.wallSliding)   st="wallslide";
  else if(!p.grounded)     st = p.vy> 1.2 ? "rise" : (p.vy<-1.2 ? "fall" : "apex");
  else if(p.landT>0)       st="land";
  /* ★ 기본 지상 이동은 walk가 아니라 run (유저 확정). walk는 상수로 남아 있다. */
  else if(Math.abs(p.vx)>0.35) st="run";
  else                     st="idle";
  setAnim(p,st);
  const A=ANIM[p.st];
  p.animT+=dt;
  const span=1/A.fps;
  while(p.animT>=span){
    p.animT-=span;
    if(p.animI<A.i.length-1) p.animI++;
    else if(A.loop) p.animI=0;
  }
}
function drawPlayer(T){
  const p=player, A=ANIM[p.st]||ANIM.idle;
  const fi=A.i[Math.min(p.animI,A.i.length-1)];   // 절대 인덱스 → 격자 좌표
  const cx=(fi%SPRITE.cols)*SPRITE.fw, cy=Math.floor(fi/SPRITE.cols)*SPRITE.fh;
  const S=PLAY.scale;
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);                 // 디바이스 픽셀로 — 정수배 보장
  ctx.imageSmoothingEnabled=false;
  const DX=Math.round(sx(p.x)*DPR), DY=Math.round(sy(p.y)*DPR);
  ctx.translate(DX,DY);
  /* 좌우 반전만 쓴다(상하 반전 금지 — 창과 몸이 뒤집혀 보인다).
     창대쉬 중에는 돌진 방향이 반전을 결정하고, 그 외엔 바라보는 방향이 결정한다. */
  const flip = (p.sdT>0) ? p.animFlip : (p.face<0);
  if(flip) ctx.scale(-1,1);                      // 피벗 기준 반전 — 발 위치 불변
  if(p.iframe>0) ctx.globalAlpha=0.35+0.65*Math.abs(Math.sin(T*0.03));
  if(SPRITE.ready){
    /* 셀 전체를 그린다 — sdash_down은 피벗보다 31px 아래로 창끝이 뻗으므로
       셀 하단을 잘라내면 창이 잘린다 */
    ctx.drawImage(SPRITE.img, cx, cy, SPRITE.fw, SPRITE.fh,
                  -SPRITE.pivotX*S, -SPRITE.pivotY*S, SPRITE.fw*S, SPRITE.fh*S);
  }else{
    ctx.fillStyle="#ffe8a8";
    ctx.fillRect(-PHYS.bodyW/2*100*S, -PHYS.bodyH*100*S, PHYS.bodyW*100*S, PHYS.bodyH*100*S);
  }
  ctx.restore();
  if(ui.debug){                                  // K = 히트박스
    const b=bodyBox(p.x,p.y), z=cam.zoom;
    ctx.save();
    ctx.strokeStyle="rgba(255,120,110,0.95)"; ctx.lineWidth=1.5;
    ctx.strokeRect(sx(b.x0),sy(b.y1),(b.x1-b.x0)*z,(b.y1-b.y0)*z);
    ctx.strokeStyle="rgba(143,220,240,0.9)";
    ctx.beginPath(); ctx.moveTo(sx(p.x)-6,sy(p.y)); ctx.lineTo(sx(p.x)+6,sy(p.y)); ctx.stroke();
    ctx.restore();
  }
}
function togglePlay(on){
  PLAY.on = on===undefined ? !PLAY.on : !!on;
  if(PLAY.on){
    const f=FLOORS.find(a=>a.n===(ui.floorFocus||1))||FLOORS[0];
    const e=(f.portals||[]).find(q=>q.id==="entry");
    const pos=f.spawnW? {x:f.spawnW[0],y:f.spawnW[1]}
                      : (e? {x:e.pos[0],y:e.pos[1]+f.yOff} : {x:1,y:f.yOff+1});
    player.respawn={x:pos.x,y:pos.y}; respawnPlayer(player);
    player.deaths=0; PLAY.acc=0;
    /* ★ 2배 확대에서 세로 시야가 4.5u뿐이라 오버레이가 화면을 크게 먹는다.
       플레이 모드에서는 도움말·미니맵·좌표를 기본 숨김 → H로 되돌린다. */
    ui.help=false;
    toast("플레이 모드 — ←→ 이동 · Space 점프 · Shift 대시 · ★C 창대쉬 · H 도움말 · Enter 복귀");
  }else{
    ui.help=true;
    focusFloor(player.floor||1);
    toast("뷰어 모드");
  }
}
function playCamera(dt){
  const S=PLAY.scale;
  cam.tzoom=cam.zoom=100*S/DPR;                  // 스프라이트 정수배 유지 (줌 보간 금지)
  const halfW=W/2/cam.zoom, halfH=H/2/cam.zoom;
  let tx=player.x+player.face*CTRL.camLead, ty=player.y+PHYS.bodyH*0.5+CTRL.camUp;
  const f=FLOORS.find(a=>a.n===player.floor);
  if(f){
    tx = f.w   > halfW*2 ? clamp(tx, halfW, f.w-halfW)                     : f.w/2;
    ty = f.h   > halfH*2 ? clamp(ty, f.yOff+halfH, f.yOff+f.h-halfH)       : f.yOff+f.h/2;
  }
  cam.tx=tx; cam.ty=ty;
  const k=1-Math.pow(0.0005,dt);
  cam.x=lerp(cam.x,cam.tx,k); cam.y=lerp(cam.y,cam.ty,k);
  const q=cam.zoom*DPR;                          // 카메라를 디바이스 픽셀 격자에 스냅
  cam.x=Math.round(cam.x*q)/q; cam.y=Math.round(cam.y*q)/q;
}

/* ------------------------------------------------------------------ */
/* 11. 메인 루프                                                       */
/* ------------------------------------------------------------------ */
let last=performance.now();
function frame(T){
  const dt=Math.min(50,T-last); last=T;
  if(PLAY.on){
    /* 고정 타임스텝 — 프레임률과 무관하게 물리가 동일하게 재현된다 */
    pollInput();
    PLAY.acc=Math.min(0.25, PLAY.acc+dt/1000);
    let n=0;
    while(PLAY.acc>=CTRL.dt && n<CTRL.maxSub){ stepPlayer(CTRL.dt); PLAY.acc-=CTRL.dt; n++; }
    if(n>=CTRL.maxSub) PLAY.acc=0;
    PLAY.t+=dt/1000;
    updateAnim(player,dt/1000);
    ui.floorFocus=player.floor;
    playCamera(dt/1000);
  }else{
  const sp=(keys["shift"]?2.4:1)*dt*0.018*(60/cam.zoom)*22;
  if(keys["a"]||keys["arrowleft"])  cam.tx-=sp;
  if(keys["d"]||keys["arrowright"]) cam.tx+=sp;
  if(keys["w"]||keys["arrowup"])    cam.ty+=sp;
  if(keys["s"]||keys["arrowdown"])  cam.ty-=sp;
  if(keys["="]||keys["+"]) cam.tzoom=clamp(cam.tzoom*1.03,6,220);
  if(keys["-"]||keys["_"]) cam.tzoom=clamp(cam.tzoom/1.03,6,220);
  cam.tx=clamp(cam.tx,-12,WORLD.x1+12);
  cam.ty=clamp(cam.ty,-8,WORLD.y1+8);
  const k=1-Math.pow(0.001,dt/1000);
  cam.x=lerp(cam.x,cam.tx,k); cam.y=lerp(cam.y,cam.ty,k); cam.zoom=lerp(cam.zoom,cam.tzoom,k);
  }

  drawSky(T);
  const vy0=wyAt(H)-2, vy1=wyAt(0)+2;
  const vis=FLOORS.filter(f=>f.yOff+f.h>vy0 && f.yOff<vy1);

  for(const f of vis) drawChamber(f);
  for(const f of vis) drawGodRays(f,T);
  for(const z_ of HAZARDS) if(z_.y1>vy0&&z_.y0<vy1) drawHazard(z_,T);

  // 장식 → 벽 → 솔리드/한방향/나브
  for(const g of WORLD_GEO) if(g.t==="deco") drawWall(g,T,0.42);
  for(const g of WORLD_GEO) if(g.t==="wall") drawWall(g,T);
  for(const g of WORLD_GEO){
    if(g.t==="solid"){
      const f=FLOORS.find(a=>a.n===g.floor);
      drawSolid(g,T,{massTo: (g.y0-f.yOff)<=0.25 ? f.yOff-0.4 : null});
    } else if(g.t==="oneway") drawOneway(g,T);
    else if(g.t==="vault")    drawVault(g,T);
  }
  if(spear.planted) drawSolid(spear.planted,T);
  for(const f of SPEAR_FACES) drawSpearFace(f,T);

  for(const c of CHECKPOINTS) drawShrine(c,T);
  for(const t of TARGETS)     drawTarget(t,T);
  for(const c of COLLECTIBLES)drawCrystal(c,T);
  for(const tr of TRIGGERS)   if(tr.kind==="goal-strike") drawBell(tr,T);
  for(const p of PORTALS)     drawPortal(p,T);
  for(const f of vis)         drawSpawn(f,T);
  if(ui.plan) drawSpearPlan(T);
  if(PLAY.on) drawPlayer(T);

  ctx.save(); ctx.globalCompositeOperation="lighter";
  for(const m of MOTES){
    const my=(m.y+(T*0.00004*m.sp))%WORLD.y1;
    const X=sx(m.x), Y=sy(my+Math.sin(T*0.0009+m.ph)*0.12);
    if(X<-20||X>W+20||Y<-20||Y>H+20) continue;
    ctx.fillStyle=`rgba(214,238,255,${0.18+0.16*Math.sin(T*0.002+m.ph)})`;
    ctx.beginPath(); ctx.arc(X,Y,Math.max(0.8,m.r*cam.zoom),0,7); ctx.fill();
  }
  ctx.restore();

  if(ui.floorFocus>0) for(const f of vis) if(f.n!==ui.floorFocus) dimFloor(f);
  drawReach(T);
  drawGrid();
  if(ui.debug) for(const f of vis) drawDebug(f);
  _lb.length=0; _badges.length=0;
  if(ui.labels){
    const order=[...vis].sort((a,b)=>(b.n===ui.floorFocus)-(a.n===ui.floorFocus));
    for(const f of order) drawLabels(f, ui.floorFocus>0 && f.n!==ui.floorFocus);
  }
  for(const f of vis) drawFloorBadge(f);
  drawVignette();
  drawMinimap();
  drawHUD(T);
  requestAnimationFrame(frame);
}
focusFloor(1);
cam.x=cam.tx; cam.y=cam.ty; cam.zoom=cam.tzoom;
TESTS=runTests();                       // 컨트롤러 정의 완료 후 최초 1회
requestAnimationFrame(frame);

/* 헤드리스/콘솔 노출 */
window.__MAP__={MAP,FLOORS,WORLD,WORLD_GEO,SPEAR_FACES,HAZARDS,CHECKPOINTS,PORTALS,
  TARGETS,COLLECTIBLES,TRIGGERS,PLANS,PHYS,REACH,GATE_MARGIN,ENV,envDx,envMaxUp,ENV_LO,ENV_STEP,Q,grid,spear,
  plantSpear,recallSpear,runTests,auditGates,gateViolations,ledgeEmbedded,
  typeOverlaps,planIssues,targetGateIssues,reachFrom,standables,
  freeClosure,fullClosure,closure,spearClosure,solvability,collectableIssues,hiddenGateIssues,
  pointReachable,pointHit,occludedPair,occludedPoint,canMove,maxRise,envFor,envSlack,
  startSurfaces,graphNodes,finialNodes,wallBoostTop,
  standPoints,bodyFitIssues,supportIssues,walkClearance,
  measureEnvelope,measureScalars,reachContractIssues,
  SPRITE,ANIM,CTRL,PLAY,player,IN,togglePlay,warpFloor,respawnPlayer,stepPlayer,bodyBox,
  cam,focusFloor,overview,ui,exportJSON};
</script>
