/* 0. 물리 상수 (유니티 이식 스펙 §4와 동일 — 여기가 단일 진실원)        */
/* ------------------------------------------------------------------ */
const PHYS = {
  gravity:      26.0,   // u/s² (아래)
  runSpeed:      3.92,  // u/s
  airControl:    0.90,
  jumpV:         9.10,  // u/s
  airJumpV:      8.20,  // u/s (이단 강림)
  dashSpeed:     7.80,  // u/s
  dashTime:      0.16,  // s
  vaultV:       13.30,  // u/s (창대 도약 — 정점 3.4u 역산)
  spearRange:    5.00,  // u  창 던지기 사거리
  attackUpReach: 0.80,  // u  위공격 유효 리치(히트박스 상단 기준 추가 도달)
  ledgeSnap:     0.08,  // u  낮은 턱 자동 승월
  bodyW:         0.30, bodyH: 0.46,
};
/* REACH는 상수가 아니라 PHYS에서 유도된다 → 물리를 튜닝하면 게이팅이 자동 재검증됨 */
const REACH = (()=>{
  const h = v => v*v/(2*PHYS.gravity);
  const jump = h(PHYS.jumpV);
  const airT = 2*PHYS.jumpV/PHYS.gravity;               // 단일점프 총 체공
  return {
    jump,
    doubleJump: jump + h(PHYS.airJumpV),
    vault:      h(PHYS.vaultV),
    // 대시점프 수평 도달: 대시 구간 + 잔여 체공을 공중제어 속도로
    dashX: PHYS.dashSpeed*PHYS.dashTime + (airT-PHYS.dashTime)*PHYS.runSpeed*PHYS.airControl,
    spear: PHYS.spearRange,
    atkUp: PHYS.attackUpReach,
  };
})();

/* 2. 월드 평탄화 — yOff 산술을 여기서 한 번만. 이후 전부 월드 좌표.     */
/* ------------------------------------------------------------------ */
const STANDABLE = new Set(["solid","oneway","vault"]);
let WORLD_GEO=[], SPEAR_FACES=[], HAZARDS=[], CHECKPOINTS=[], PORTALS=[],
    TARGETS=[], COLLECTIBLES=[], TRIGGERS=[], PLANS=[], WORLD={x0:0,x1:0,y0:0,y1:0};

function buildWorld(){
  WORLD_GEO=[]; SPEAR_FACES=[]; HAZARDS=[]; CHECKPOINTS=[]; PORTALS=[];
  TARGETS=[]; COLLECTIBLES=[]; TRIGGERS=[]; PLANS=[];
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for(const f of FLOORS){
    const o=f.yOff;
    f.bbox={x0:0,x1:f.w,y0:0,y1:f.h};
    for(const g of f.geo){
      const [x,y,w,h]=g.rect;
      const wg={...g, floor:f.n, fid:f.id, uid:`${f.id}:${g.id}`,
        x0:x, y0:y+o, x1:x+w, y1:y+h+o,
        stand: g.stand!==undefined ? g.stand : STANDABLE.has(g.t)};
      WORLD_GEO.push(wg);
      x0=Math.min(x0,wg.x0); x1=Math.max(x1,wg.x1);
      y0=Math.min(y0,wg.y0); y1=Math.max(y1,wg.y1);
    }
    for(const s of (f.spearFaces||[])){
      const [x,y,w,h]=s.rect;
      SPEAR_FACES.push({...s, floor:f.n, fid:f.id, uid:`${f.id}:${s.id}`,
        x0:x, y0:y+o, x1:x+w, y1:y+h+o, nx:s.normal[0], ny:s.normal[1]});
    }
    for(const z of (f.hazards||[])){
      const [x,y,w,h]=z.rect;
      HAZARDS.push({...z, floor:f.n, fid:f.id, uid:`${f.id}:${z.id}`,
        x0:x, y0:y+o, x1:x+w, y1:y+h+o});
    }
    for(const c of (f.checkpoints||[]))  CHECKPOINTS.push({...c, floor:f.n, fid:f.id, wx:c.pos[0], wy:c.pos[1]+o});
    for(const p of (f.portals||[]))      PORTALS.push({...p, floor:f.n, fid:f.id, wx:p.pos[0], wy:p.pos[1]+o});
    for(const t of (f.targets||[]))      TARGETS.push({...t, floor:f.n, fid:f.id, wx:t.pos[0], wy:t.pos[1]+o});
    for(const c of (f.collectibles||[])) COLLECTIBLES.push({...c, floor:f.n, fid:f.id, wx:c.pos[0], wy:c.pos[1]+o});
    for(const t of (f.triggers||[])){
      const [x,y,w,h]=t.rect;
      TRIGGERS.push({...t, floor:f.n, fid:f.id, x0:x, y0:y+o, x1:x+w, y1:y+h+o});
    }
    for(const p of (f.spearPlan||[])){
      const face=(f.spearFaces||[]).find(s=>s.id===p.face);
      const nx = face? face.normal[0] : -1;
      const L  = MAP.spear.ledgeLen, T = MAP.spear.ledgeThick;
      const px = p.at[0], py = p.at[1]+o;
      PLANS.push({...p, floor:f.n, fid:f.id, faceRef:face,
        fromX:p.from[0], fromY:p.from[1]+o, atX:px, atY:py, nx,
        // 박힌 창 = 면 법선 방향으로 돌출한 작은 레지
        ledge:{ x0: nx<0? px-L : px, x1: nx<0? px : px+L, y0:py, y1:py+T },
        dist: Math.hypot(px-p.from[0], py-(p.from[1]+o))});
    }
    if(f.spawn) f.spawnW=[f.spawn[0], f.spawn[1]+o];
  }
  for(const f of FLOORS){ x1=Math.max(x1,f.w); y1=Math.max(y1,f.yOff+f.h); }
  WORLD={x0:Math.min(0,x0), x1, y0:Math.min(0,y0), y1};
}
buildWorld();

/* ------------------------------------------------------------------ */
/* 3. 콜리전 질의 API — 다음 단계(캐릭터 컨트롤러)의 유일한 진입점      */
/*    공간 해시 + 동적 창 발판 등록/해제                                */
/* ------------------------------------------------------------------ */
class SpatialHash{
  constructor(cell=2){ this.cell=cell; this.m=new Map(); }
  _k(cx,cy){ return cx+","+cy; }
  _cells(g,fn){
    const c=this.cell;
    for(let cx=Math.floor(g.x0/c); cx<=Math.floor(g.x1/c); cx++)
      for(let cy=Math.floor(g.y0/c); cy<=Math.floor(g.y1/c); cy++) fn(this._k(cx,cy));
  }
  insert(g){ this._cells(g,k=>{ let a=this.m.get(k); if(!a) this.m.set(k,a=[]); a.push(g); }); }
  remove(g){ this._cells(g,k=>{ const a=this.m.get(k); if(!a) return;
                const i=a.indexOf(g); if(i>=0) a.splice(i,1); }); }
  query(x0,y0,x1,y1){
    const c=this.cell, out=new Set();
    for(let cx=Math.floor(x0/c); cx<=Math.floor(x1/c); cx++)
      for(let cy=Math.floor(y0/c); cy<=Math.floor(y1/c); cy++){
        const a=this.m.get(this._k(cx,cy)); if(a) for(const g of a) out.add(g);
      }
    return [...out];
  }
}
const grid=new SpatialHash(2);
for(const g of WORLD_GEO) if(g.t!=="deco") grid.insert(g);

/* 동적 창 발판 — 한 번에 하나 (MAP.spear.maxPlanted) */
const spear = { state:"held", planted:null };
function plantSpear(faceUid, atY){
  const face=SPEAR_FACES.find(f=>f.uid===faceUid); if(!face) return null;
  if(spear.planted) recallSpear();
  const {ledgeLen:L, ledgeThick:T}=MAP.spear;
  const px = face.nx<0 ? face.x0 : face.x1;                 // 면의 노출면
  const g={ id:"spear_ledge", uid:"dyn:spear", t:"solid", dyn:true, stand:true, vaultable:true,
            label:"박힌 창(발판)",
            x0: face.nx<0 ? px-L : px, x1: face.nx<0 ? px : px+L,
            y0: atY, y1: atY+T, floor:face.floor, fid:face.fid };
  spear.planted=g; spear.state="planted"; grid.insert(g); return g;
}
function recallSpear(){ if(spear.planted) grid.remove(spear.planted);
                        spear.planted=null; spear.state="held"; }

const rectHit=(a,b)=> a.x0<b.x1 && a.x1>b.x0 && a.y0<b.y1 && a.y1>b.y0;
const Q = {
  solidsNear(x0,y0,x1,y1){ return grid.query(x0,y0,x1,y1).filter(g=>g.t!=="deco"); },
  /* 축분리 스윕용 후보 (컨트롤러가 붙을 때 tMin 계산을 여기에 채운다) */
  sweep(box,dx,dy){
    const ex={x0:Math.min(box.x0,box.x0+dx), x1:Math.max(box.x1,box.x1+dx),
              y0:Math.min(box.y0,box.y0+dy), y1:Math.max(box.y1,box.y1+dy)};
    return this.solidsNear(ex.x0,ex.y0,ex.x1,ex.y1).filter(g=>rectHit(ex,g));
  },
  /* oneway는 하강 중 + 직전 바닥이 판 위 + 드롭스루 아닐 때만 막는다 */
  onewayBlocks(plat, prevBottomY, vy, dropping){
    if(plat.t!=="oneway") return true;
    if(dropping && plat.dropThrough!==false) return false;
    return vy<=0 && prevBottomY>=plat.y1-1e-6;
  },
  groundBelow(x,y,maxDrop=40){
    let best=null;
    for(const g of this.solidsNear(x-0.01,y-maxDrop,x+0.01,y))
      if(g.stand && g.x0<=x && g.x1>=x && g.y1<=y+1e-6)
        if(!best||g.y1>best.y) best={y:g.y1, geo:g};
    return best;
  },
  wallContact(box){
    for(const g of this.solidsNear(box.x0-0.1,box.y0,box.x1+0.1,box.y1)){
      if(g.t!=="wall") continue;
      if(g.y0<box.y1 && g.y1>box.y0){
        if(Math.abs(g.x1-box.x0)<0.1) return -1;
        if(Math.abs(g.x0-box.x1)<0.1) return  1;
      }
    }
    return 0;
  },
  ceilingAbove(box){
    let best=null;
    for(const g of this.solidsNear(box.x0,box.y1,box.x1,box.y1+40))
      if(g.t!=="oneway" && g.x0<box.x1 && g.x1>box.x0 && g.y0>=box.y1-1e-6)
        if(best===null||g.y0<best) best=g.y0;
    return best;
  },
  hazardAt(x,y){
    for(const z of HAZARDS) if(x>=z.x0&&x<=z.x1&&y>=z.y0&&y<=z.y1) return z;
    return null;
  },
  checkpointNear(x,y,r=0.8){
    let best=null,bd=r;
    for(const c of CHECKPOINTS){ const d=Math.hypot(c.wx-x,c.wy-y); if(d<bd){bd=d;best=c;} }
    return best;
  },
  /* 창 레이캐스트 — 사거리 내 최초 spear 면 */
  raycastSpear(px,py,dirx,diry,range=REACH.spear){
    const L=Math.hypot(dirx,diry)||1; dirx/=L; diry/=L;
    let best=null;
    for(const f of SPEAR_FACES){
      for(let t=0.1;t<=range;t+=0.05){
        const x=px+dirx*t, y=py+diry*t;
        if(x>=f.x0-0.06&&x<=f.x1+0.06&&y>=f.y0&&y<=f.y1){
          if(!best||t<best.dist) best={face:f, point:{x,y}, normal:[f.nx,f.ny], dist:t};
          break;
        }
      }
    }
    return best;
  },
};

/* ------------------------------------------------------------------ */
/* 4. 설계 검증 — 데이터 파생. 하드코딩 리터럴 없음.                     */
/* ------------------------------------------------------------------ */
function standables(floorN){
  return WORLD_GEO.filter(g=>g.stand && g.t!=="deco" && (g.x1-g.x0)>0.15 &&
    (floorN==null||g.floor===floorN));
}
function gapBetween(a,b){
  const dx = b.x0>a.x1 ? b.x0-a.x1 : (a.x0>b.x1 ? a.x0-b.x1 : 0);
  return {dx, dy: b.y1-a.y1};
}
/* 차폐 판정
   - 수평 통로: 사이 지형의 상단이 도약 정점보다 높으면 "타고 넘을 수 없음" → 차단
   - 수직 통로: x가 겹치면 두 높이 사이를 가로막는 지형이 있으면 차단(니치 천장 등) */
function blockedBetween(floorN, aTop, bTop, ax0,ax1, bx0,bx1, maxUp, exclude){
  const band0=Math.min(aTop,bTop), band1=Math.max(aTop,bTop), apex=aTop+maxUp;
  const ovl0=Math.max(ax0,bx0), ovl1=Math.min(ax1,bx1);
  const gap = bx0>ax1 ? [ax1,bx0] : (ax0>bx1 ? [bx1,ax0] : null);
  for(const g of WORLD_GEO){
    if(g.floor!==floorN||g.t==="deco"||g.t==="oneway") continue;
    if(exclude&&exclude.includes(g)) continue;
    if(gap){                                    // 수평 이동 — 넘어갈 수 있나
      if(g.x1<=gap[0]+0.02||g.x0>=gap[1]-0.02) continue;
      if(g.y1<=band0+0.05) continue;            // 발밑 — 그냥 지나감
      if(g.y1< apex-0.05) continue;             // 정점 아래 — 타고 넘음
      if(g.y0 > band1+PHYS.bodyH) continue;     // 머리 위로 충분히 떠 있음
      return true;
    }else if(ovl1-ovl0>0.05 && bTop<aTop-0.05){ // 하강 — 사이를 막는 천장/차양이 있나
      // (상승은 옆 모서리로 아치 착지가 가능하므로 수직 차단을 적용하지 않는다)
      if(g.x1<=ovl0+0.02||g.x0>=ovl1-0.02) continue;
      if(g.y1>band0+0.05 && g.y0<band1-0.05) return true;
    }
  }
  return false;
}
function occludedPair(a,b,maxUp=REACH.doubleJump){
  return blockedBetween(a.floor,a.y1,b.y1,a.x0,a.x1,b.x0,b.x1,maxUp,[a,b]);
}
function occludedPoint(a,x,y,maxUp=REACH.doubleJump){
  return blockedBetween(a.floor,a.y1,y,a.x0,a.x1,x-0.05,x+0.05,maxUp,[a]);
}
/* 창대 도약은 도약 나브(vault) 또는 박힌 창 위에서만 발동한다 */
function maxRise(a){
  return (a.t==="vault"||a.virt||a.vaultable) ? REACH.vault : REACH.doubleJump;
}
/* 공통 이동 판정 (벽점프 힌트 포함) */
function canMove(a,b,cap){
  const maxUp=Math.min(cap!=null?cap:REACH.vault, maxRise(a));
  const {dx,dy}=gapBetween(a,b);
  if(b.reachVia&&b.reachVia.includes("walljump")&&b.y1>a.y1){
    if(b.y1-a.y1<=6.5 && dx<=REACH.dashX*1.6) return !occludedPair(a,b,b.y1-a.y1);
  }
  if(dx>REACH.dashX || dy>maxUp) return false;
  return !occludedPair(a,b,maxUp);
}
/* 진입 발판 찾기 */
function startSurfaces(f){
  const S=standables(f.n), start=[];
  const sp = f.spawnW ? {x:f.spawnW[0], y:f.spawnW[1]}
    : (()=>{ const e=(f.portals||[]).find(p=>p.id==="entry");
             return e? {x:e.pos[0], y:e.pos[1]+f.yOff} : null; })();
  if(sp) for(const g of S)
    if(Math.abs(g.y1-sp.y)<0.4 && g.x0-0.6<=sp.x && g.x1+0.6>=sp.x) start.push(g);
  if(!start.length && S.length) start.push(S.reduce((a,b)=>a.y1<b.y1?a:b));
  return start;
}
/* 이동기만으로(창 없이) 진입점에서 도달 가능한 표면 폐포 */
function freeClosure(f){
  const S=standables(f.n);
  const start=startSurfaces(f);
  const seen=new Set(start);
  let changed=true;
  while(changed){
    changed=false;
    for(const a of [...seen]) for(const b of S){
      if(seen.has(b)||!canMove(a,b,REACH.doubleJump)) continue;
      seen.add(b); changed=true;
    }
  }
  return seen;
}
/* 전 표면쌍 감사: free = 이동기만으로 도달 / razor = 여유 부족 */
function auditGates(){
  const free=[], razor=[];
  for(const f of FLOORS){
    const S=standables(f.n);
    for(const a of S) for(const b of S){
      if(a===b||b.y1<=a.y1) continue;
      const {dx,dy}=gapBetween(a,b);
      if(dx>REACH.dashX||occludedPair(a,b,REACH.doubleJump)) continue;
      if(dy<=REACH.doubleJump)                    free.push({a,b,dx,dy});
      else if(dy<=REACH.doubleJump+GATE_MARGIN)   razor.push({a,b,dx,dy});
    }
  }
  return {free, razor};
}
/* 게이트 무결성: gate 표면이 "창 없이 도달 가능한 폐포" 안에 들어오면 실패
   (게이트 상류가 이미 창으로 막혀 있으면 위반이 아니다) */
function gateViolations(){
  const bad=[];
  for(const f of FLOORS){
    const closure=freeClosure(f);
    for(const g of standables(f.n))
      if(g.gate && closure.has(g)) bad.push({b:g, a:{uid:"free-closure"}, dy:0, dx:0});
  }
  return bad;
}
/* 창 발판이 기존 지형에 파묻히는가 (= 발판이 무의미) */
function ledgeEmbedded(){
  const bad=[];
  for(const p of PLANS){
    const L=p.ledge;
    for(const g of WORLD_GEO){
      if(g.floor!==p.floor||g.t==="deco"||!g.stand) continue;
      const ox=Math.min(L.x1,g.x1)-Math.max(L.x0,g.x0);
      if(ox>0.3 && Math.abs(g.y1-L.y1)<0.35) bad.push({plan:p, geo:g, ox});
    }
  }
  return bad;
}
/* 서로 다른 충돌 타입이 겹치는가 (7F 개구 사고 방지) */
function typeOverlaps(){
  const bad=[], C=WORLD_GEO.filter(g=>g.t!=="deco");
  for(let i=0;i<C.length;i++) for(let j=i+1;j<C.length;j++){
    const a=C[i],b=C[j];
    if(a.floor!==b.floor||a.t===b.t) continue;
    const ox=Math.min(a.x1,b.x1)-Math.max(a.x0,b.x0);
    const oy=Math.min(a.y1,b.y1)-Math.max(a.y0,b.y0);
    if(ox>0.05&&oy>0.05){
      // solid가 다른 solid를 포함하는 정상적 적층(단상 등)은 제외
      const contained = (a.x0<=b.x0&&a.x1>=b.x1&&a.y0<=b.y0) || (b.x0<=a.x0&&b.x1>=a.x1&&b.y0<=a.y0);
      if(!(contained && (a.t==="solid"&&b.t==="solid"))) bad.push({a,b,ox,oy});
    }
  }
  return bad;
}
/* 창 계획이 실제 면에 착탄하고 사거리 안인가 */
function planIssues(){
  const bad=[];
  for(const p of PLANS){
    if(!p.faceRef){ bad.push({p,why:"면 참조 없음"}); continue; }
    if(p.dist>REACH.spear) bad.push({p,why:`사거리 초과 ${p.dist.toFixed(2)}u`});
    const f=SPEAR_FACES.find(s=>s.uid===`${p.fid}:${p.face}`);
    if(!f){ bad.push({p,why:"면 미발견"}); continue; }
    if(p.atY<f.y0-0.01||p.atY>f.y1+0.01) bad.push({p,why:`착탄 y${p.atY.toFixed(2)} 면 밖(${f.y0}~${f.y1})`});
  }
  return bad;
}
/* 공격 리치를 포함한 표적 도달성: gate가 붙은 표적은 창발판 없이 못 때려야 함 */
function targetGateIssues(){
  const bad=[];
  for(const t of TARGETS){
    if(t.gate!=="spear") continue;
    const f=FLOORS.find(a=>a.n===t.floor);
    const closure=freeClosure(f);
    for(const s of closure){                       // 창 없이 갈 수 있는 발판만 검사
      const dx = t.wx>s.x1 ? t.wx-s.x1 : (t.wx<s.x0 ? s.x0-t.wx : 0);
      if(dx>REACH.dashX) continue;
      if(occludedPoint(s,t.wx,t.wy,REACH.doubleJump)) continue;   // 기둥벽 차단
      if(s.y1+REACH.doubleJump+REACH.atkUp >= t.wy) bad.push({t,s});
    }
  }
  return bad;
}
/* 창을 쓸 수 있을 때 도달 가능한 표면 폐포 (가상 창 발판 포함) — 클리어 가능성 증명 */
function spearClosure(f, excludeFaces){
  const S=standables(f.n);
  const faces=SPEAR_FACES.filter(s=>s.floor===f.n &&
    !(excludeFaces&&excludeFaces.includes(s.id)));
  const {ledgeLen:L, ledgeThick:T}=MAP.spear;
  const ledges=[];
  for(const fc of faces){
    if(fc.ny===-1) continue;                        // 하면(플로리시)은 발판 아님
    const px = fc.nx<0 ? fc.x0 : fc.x1;
    for(let y=fc.y0+0.1; y<=fc.y1-0.05; y+=0.2)
      ledges.push({uid:`ledge@${fc.id}:${y.toFixed(1)}`, floor:f.n, t:"solid",
        stand:true, virt:true, face:fc, hx:px, hy:y,
        x0: fc.nx<0? px-L : px, x1: fc.nx<0? px : px+L, y0:y, y1:y+T});
  }
  const seen=new Set(startSurfaces(f));
  let changed=true, guard=0;
  while(changed && guard++<40){
    changed=false;
    for(const a of [...seen]){
      const ax=(a.x0+a.x1)/2, ay=a.y1+0.5;
      for(const b of S){
        if(seen.has(b)) continue;
        if(canMove(a,b,REACH.vault)){ seen.add(b); changed=true; }
      }
      for(const lg of ledges){
        if(seen.has(lg)) continue;
        if(Math.hypot(lg.hx-ax, lg.hy-ay) > REACH.spear) continue;   // 던질 수 있나
        if(canMove(a,lg,REACH.vault)){ seen.add(lg); changed=true; }
      }
    }
  }
  return seen;
}
function surfaceAt(f,x,y,tol=0.45){
  return standables(f.n).find(g=>Math.abs(g.y1-y)<tol && g.x0-0.8<=x && g.x1+0.8>=x);
}
/* 각 층이 실제로 클리어 가능한가 (출구 도달) */
function solvability(){
  const bad=[];
  for(const f of FLOORS){
    const ex=(f.portals||[]).find(p=>p.id==="exit");
    const R=spearClosure(f);
    if(ex){
      const tgt=surfaceAt(f, ex.pos[0], ex.pos[1]+f.yOff);
      if(!tgt) bad.push({f, why:"출구 발판 미발견"});
      else if(!R.has(tgt)) bad.push({f, why:"출구 도달 불가"});
    }
    for(const tr of (f.triggers||[])){              // 7F 성종
      const gy=tr.rect[1]+f.yOff;
      const cx=tr.rect[0]+tr.rect[2]/2;
      const hit=[...R].some(s=>{
        const dx = cx>s.x1 ? cx-s.x1 : (cx<s.x0 ? s.x0-cx : 0);
        return dx<=REACH.dashX && s.y1+REACH.jump+REACH.atkUp >= gy && !occludedPoint(s,cx,gy,REACH.vault);
      });
      if(!hit) bad.push({f, why:`목표 ${tr.id} 타격 불가`});
    }
  }
  return bad;
}
/* 어떤 표면 집합에서 한 지점을 집을 수 있는가 */
function pointReachable(R,cx,cy){
  return [...R].some(s=>{
    const dx = cx>s.x1 ? cx-s.x1 : (cx<s.x0 ? s.x0-cx : 0);
    return dx<=REACH.dashX && s.y1+REACH.vault+0.5 >= cy && cy >= s.y1-3.5
        && !occludedPoint(s,cx,cy,REACH.vault);
  });
}
/* 히든 수집물이 창을 써서 도달 가능한가 */
function collectableIssues(){
  const bad=[];
  for(const f of FLOORS){
    if(!(f.collectibles||[]).length) continue;
    const R=spearClosure(f);
    for(const c of f.collectibles)
      if(!pointReachable(R,c.pos[0],c.pos[1]+f.yOff)) bad.push({f,c});
  }
  return bad;
}
/* 히든 게이트 검증
   spear-face : 전용 hidden 면을 빼면 도달 불가여야 한다
   spear-return: 획득은 되지만, 창 없이는 그 자리에서 되돌아 나올 수 없어야 한다 */
function hiddenGateIssues(){
  const bad=[];
  for(const f of FLOORS){
    const hid=(f.spearFaces||[]).filter(s=>s.role==="hidden").map(s=>s.id);
    for(const c of (f.collectibles||[])){
      if(c.gate==="spear-face"){
        if(!hid.length){ bad.push({f,c,why:"hidden 면 없음"}); continue; }
        if(pointReachable(spearClosure(f,hid), c.pos[0], c.pos[1]+f.yOff))
          bad.push({f,c,why:"전용 면 없이 도달됨"});
      }else if(c.gate==="spear-return"){
        const perch=standables(f.n).find(g=>g.id===c.stand);
        if(!perch){ bad.push({f,c,why:"stand 참조 없음"}); continue; }
        // 창 없이 이 자리에서 위로 되돌아 나갈 수 있으면 게이트가 아니다
        const S=standables(f.n);
        const seen=new Set([perch]); let ch=true;
        while(ch){ ch=false; for(const a of [...seen]) for(const b of S){
          if(seen.has(b)||b.y1<=perch.y1) continue;
          if(canMove(a,b,REACH.doubleJump)){ seen.add(b); ch=true; } } }
        if([...seen].some(g=>g!==perch)) bad.push({f,c,why:"창 없이 복귀 가능"});
      }
    }
  }
  return bad;
}
function runTests(){
  const R=[]; const ok=(n,c,d="")=>R.push({n,ok:!!c,d});
  const gv=gateViolations(), le=ledgeEmbedded(), to=typeOverlaps(),
        pi=planIssues(), tg=targetGateIssues(), au=auditGates();
  ok("충돌 타입 겹침 없음", to.length===0, to.map(o=>`${o.a.uid}×${o.b.uid}`).join(", "));
  ok("창 계획 전부 유효(면·사거리)", pi.length===0, pi.map(x=>`${x.p.id}:${x.why}`).join(", "));
  ok("창 발판이 기존 지형에 파묻히지 않음", le.length===0, le.map(x=>`${x.plan.id}⊂${x.geo.uid}`).join(", "));
  ok("게이트 표면이 이동기만으로 도달 불가", gv.length===0, gv.map(p=>`${p.a.uid}→${p.b.uid}(dy${p.dy.toFixed(2)})`).join(", "));
  ok("게이트 표적이 공격리치 포함해도 도달 불가", tg.length===0, tg.map(x=>`${x.s.uid}→${x.t.id}`).join(", "));
  ok(`게이트 갭 여유 ≥${GATE_MARGIN}u`, au.razor.filter(p=>p.b.gate).length===0,
     au.razor.filter(p=>p.b.gate).map(p=>`${p.a.uid}→${p.b.uid}(${p.dy.toFixed(2)})`).join(", "));
  ok("층간 포탈 양방향 정합", portalPairsOk());
  ok("체크포인트 참조 유효", HAZARDS.every(z=>z.respawn==="auto"||CHECKPOINTS.some(c=>c.id===z.respawn)));
  const sv=solvability(), ci=collectableIssues();
  ok("모든 층 클리어 가능(창 포함 도달)", sv.length===0, sv.map(x=>`${x.f.n}F:${x.why}`).join(", "));
  ok("히든 수집물 전부 도달 가능", ci.length===0, ci.map(x=>`${x.f.n}F:${x.c.id}`).join(", "));
  const hg=hiddenGateIssues();
  ok("히든 게이트 성립(전용 면/복귀 제약)", hg.length===0, hg.map(x=>`${x.f.n}F:${x.c.id}(${x.why})`).join(", "));
  return R;
}
function portalPairsOk(){
  for(const p of PORTALS){
    const tf=FLOORS.find(f=>f.id===p.to); if(!tf) return false;
    if(!(tf.portals||[]).some(q=>q.id===p.toPortal)) return false;
  }
  return true;
}
let TESTS=runTests();

/* 도달성 분류: 특정 표면에서 다른 표면들이 어떻게 도달되는가 */
function reachFrom(src){
  const out=[];
  for(const b of standables(src.floor)){
    if(b===src) continue;
    const {dx,dy}=gapBetween(src,b);
    let k;
    if(dx>REACH.dashX)                 k="far";
    else if(dy<=REACH.jump)            k="jump";
    else if(dy<=REACH.doubleJump)      k="double";
    else if(dy<=REACH.vault)           k="vault";
    else                               k="no";
    out.push({b,dx,dy,k});
  }
  return out;
}

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function rr(c,x,y,w,h,r){
  r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y); c.closePath();
}
function mulberry(seed){ return function(){
  seed|=0; seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; };}
function mix(a,b,t){
  const pa=parseInt(a.slice(1),16), pb=parseInt(b.slice(1),16);
  return `rgb(${Math.round(lerp((pa>>16)&255,(pb>>16)&255,t))},`
       + `${Math.round(lerp((pa>>8)&255,(pb>>8)&255,t))},`
       + `${Math.round(lerp(pa&255,pb&255,t))})`;
}

    const S=256, cc=document.createElement("canvas"); cc.width=S; cc.height=S*0.42;

    c.fillStyle=g; c.beginPath(); c.ellipse(S/2,S*0.21,S/2,S*0.21,0,0,7); c.fill();
    const r=mulberry(v*77+3);
    for(let i=0;i<3;i++){
      const ox=S*(0.25+r()*0.5), oy=S*0.21*(0.7+r()*0.6), rr2=S*(0.12+r()*0.14);
      const g2=c.createRadialGradient(ox,oy,0,ox,oy,rr2);
      g2.addColorStop(0,"rgba(255,255,255,0.6)"); g2.addColorStop(1,"rgba(255,255,255,0)");
      c.fillStyle=g2; c.beginPath(); c.arc(ox,oy,rr2,0,7); c.fill();
    }
    out.push(cc);
  }
  return out;
})();

function drawSky(T){
  const alt=clamp(cam.y/WORLD.y1,0,1);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, mix(PAL.skyTop,"#2b4b78",alt));
  g.addColorStop(0.45, mix(PAL.skyMid,"#7fa4cc",alt));
  g.addColorStop(0.80, mix(PAL.skyLow,"#dfe9f2",alt*0.9));
  g.addColorStop(1, mix("#7a8ba3",PAL.skyHaze,alt*0.85));
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  const sunX=W*0.80, sunY=H*(0.16-alt*0.05);
  const sg=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,Math.max(W,H)*0.55);
  sg.addColorStop(0,`rgba(255,246,214,${0.34+alt*0.22})`);
  sg.addColorStop(0.28,`rgba(255,226,168,${0.13+alt*0.10})`);
  sg.addColorStop(1,"rgba(255,220,160,0)");
  ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);

  for(const s of SPIRES){
    const px=((s.x*1.4 - cam.x*0.008*s.d)%1.4+1.4)%1.4;
    const X=px*W*1.1-W*0.05, baseY=H*0.66+(cam.y*0.9*s.d), hh=H*s.h;
    ctx.fillStyle=`rgba(122,146,178,${0.16+s.d*0.16})`;
    ctx.fillRect(X, baseY-hh, W*s.w, hh);
    ctx.beginPath(); ctx.moveTo(X-W*0.012,baseY-hh);
    ctx.lineTo(X+W*s.w/2, baseY-hh-H*0.05);
    ctx.lineTo(X+W*s.w+W*0.012, baseY-hh); ctx.closePath(); ctx.fill();
  }
  for(const c of CLOUDS){
    const pxr=((c.x - cam.x*0.006*c.d)%1.5+1.5)%1.5;
    const X=pxr*W*1.2-W*0.1;
    const Y=(c.y*H*1.4)+cam.y*c.d*7-H*0.12+Math.sin(T*0.00013+c.ph)*6;
    if(Y<-260||Y>H+260) continue;
    const rw=W*0.20*c.s, rh=rw*0.42;
    ctx.globalAlpha=c.a;
    ctx.drawImage(cloudSprites[c.v], X-rw/2, Y-rh/2, rw, rh);
  }
  ctx.globalAlpha=1;
}

/* 챔버 배경 — 층별 오프스크린 캐시 (아치 니치는 도려내 하늘 노출) */
function chamberSprite(f){
  const key=f.id+"|"+Math.round(cam.zoom);
  let s=chamberCache.get(key);
  if(s) return s;
  if(chamberCache.size>24) chamberCache.clear();
  const z=cam.zoom;
  const cw=Math.ceil((f.w+1.6)*z), ch=Math.ceil((f.h+0.8)*z);
  if(cw<=0||ch<=0||cw>6000||ch>6000) return null;
  const cc=document.createElement("canvas"); cc.width=cw; cc.height=ch;
  const c=cc.getContext("2d");
  const g=c.createLinearGradient(0,0,0,ch);
  g.addColorStop(0,"#243147"); g.addColorStop(0.42,"#192337"); g.addColorStop(1,"#121a2b");
  c.fillStyle=g; c.fillRect(0,0,cw,ch);
  // 코니스
  c.strokeStyle="rgba(170,196,234,0.07)"; c.lineWidth=1;
  for(let cy=2; cy<f.h; cy+=3){
    const CY=ch-(cy+0.4)*z;
    c.beginPath(); c.moveTo(0,CY); c.lineTo(cw,CY); c.stroke();
  }
  // 아치 니치 — destination-out 으로 도려내 하늘/구름이 비치게
  const step=3.2, aw=step*0.56*z, ah=Math.min(ch*0.46, 2.8*z);
  c.save(); c.globalCompositeOperation="destination-out";
  for(let ax=0.4; ax<f.w; ax+=step){
    const AX=(ax+0.8)*z, AY=ch-0.4*z-ah;
    c.beginPath();
    c.moveTo(AX, ch-0.4*z);
    c.lineTo(AX, AY+aw*0.45);
    c.quadraticCurveTo(AX+aw/2, AY-aw*0.10, AX+aw, AY+aw*0.45);
    c.lineTo(AX+aw, ch-0.4*z); c.closePath();
    c.fillStyle="rgba(0,0,0,0.40)"; c.fill();
  }
  c.restore();
  // 아치 테두리
  for(let ax=0.4; ax<f.w; ax+=step){
    const AX=(ax+0.8)*z, AY=ch-0.4*z-ah;
    c.beginPath();
    c.moveTo(AX, ch-0.4*z); c.lineTo(AX, AY+aw*0.45);
    c.quadraticCurveTo(AX+aw/2, AY-aw*0.10, AX+aw, AY+aw*0.45);
    c.lineTo(AX+aw, ch-0.4*z);
    c.strokeStyle="rgba(214,186,122,0.16)"; c.lineWidth=2; c.stroke();
  }
  // 상단 성광 + 바닥 금빛 바운스
  const rg=c.createLinearGradient(0,0,0,ch*0.45);
  rg.addColorStop(0,"rgba(255,238,190,0.16)"); rg.addColorStop(1,"rgba(255,238,190,0)");
  c.fillStyle=rg; c.fillRect(0,0,cw,ch*0.45);
  const bg=c.createLinearGradient(0,ch,0,ch-ch*0.22);
  bg.addColorStop(0,"rgba(232,200,106,0.12)"); bg.addColorStop(1,"rgba(232,200,106,0)");
  c.fillStyle=bg; c.fillRect(0,ch-ch*0.22,cw,ch*0.22);
  chamberCache.set(key,cc);
  return cc;
}
function drawChamber(f){
  const s=chamberSprite(f); if(!s) return;
  const X=sx(-0.8), Y=sy(f.yOff+f.h+0.4);
  ctx.drawImage(s, X, Y, s.width, s.height);
  ctx.save();
  ctx.strokeStyle="rgba(232,200,106,0.30)"; ctx.lineWidth=2;
  ctx.strokeRect(X,Y,s.width,s.height);
  ctx.restore();
}
function drawGodRays(f,T){
  if(cam.zoom<14) return;
  ctx.save(); ctx.globalCompositeOperation="lighter";
  for(let i=0;i<3;i++){
    const bx=f.w*(0.58+i*0.16), top=f.yOff+f.h;
    const a=0.05+0.02*Math.sin(T*0.0004+i);
    ctx.beginPath();
    ctx.moveTo(sx(bx-0.3),sy(top)); ctx.lineTo(sx(bx+0.3),sy(top));
    ctx.lineTo(sx(bx+1.4+i*0.5),sy(f.yOff)); ctx.lineTo(sx(bx-1.4-i*0.5),sy(f.yOff));
    ctx.closePath();
    const rg=ctx.createLinearGradient(0,sy(top),0,sy(f.yOff));
    rg.addColorStop(0,`rgba(255,244,206,${a})`); rg.addColorStop(1,"rgba(255,244,206,0)");
    ctx.fillStyle=rg; ctx.fill();
  }
  ctx.restore();
}

function offscreen(g){
  return sx(g.x1)<-60||sx(g.x0)>W+60||sy(g.y1)>H+60||sy(g.y0)<-60;
}
function drawSolid(g,T,opt={}){
  if(offscreen(g)) return;
  const z=cam.zoom;
  const bot = (opt.massTo!=null && opt.massTo<g.y0) ? opt.massTo : g.y0;
  const X=sx(g.x0), Y=sy(g.y1), Wd=(g.x1-g.x0)*z, Hd=Math.max((g.y1-bot)*z,4);
  const cap=Math.min(Hd*0.42, Math.max(3,z*0.14));
  ctx.save();
  ctx.fillStyle="rgba(4,8,18,0.45)"; ctx.fillRect(X+2,Y+3,Wd,Hd);
  const gr=ctx.createLinearGradient(0,Y,0,Y+Hd);
  gr.addColorStop(0,PAL.bodyHi); gr.addColorStop(0.28,PAL.body);
  gr.addColorStop(0.78,PAL.bodyLo); gr.addColorStop(1,PAL.bodyDeep);
  ctx.fillStyle=gr; ctx.fillRect(X,Y,Wd,Hd);
  if(z>24&&Wd>20){
    ctx.strokeStyle="rgba(12,18,30,0.35)"; ctx.lineWidth=1;
    const n=Math.max(1,Math.floor(Wd/(z*0.9)));
    for(let i=1;i<n;i++){ const bx=Math.round(X+Wd*i/n)+0.5;
      ctx.beginPath(); ctx.moveTo(bx,Y+cap); ctx.lineTo(bx,Y+Hd); ctx.stroke(); }
  }
  const cg=ctx.createLinearGradient(0,Y,0,Y+cap);
  cg.addColorStop(0,PAL.marbleHi); cg.addColorStop(0.6,PAL.marble); cg.addColorStop(1,PAL.marbleLo);
  ctx.fillStyle=cg; ctx.fillRect(X,Y,Wd,cap);
  ctx.fillStyle=PAL.gold;   ctx.fillRect(X,Y+cap,Wd,Math.max(1.4,z*0.028));
  ctx.fillStyle=PAL.goldHi; ctx.fillRect(X,Y,Wd,Math.max(1,z*0.014));
  ctx.fillStyle="rgba(255,255,255,0.10)"; ctx.fillRect(X,Y,Math.max(1,z*0.02),Hd);
  ctx.fillStyle="rgba(6,10,20,0.35)";     ctx.fillRect(X+Wd-Math.max(1,z*0.02),Y,Math.max(1,z*0.02),Hd);
  if(g.dyn){                                       // 박힌 창 발판 = 성광 강조
    ctx.globalCompositeOperation="lighter";
    ctx.fillStyle=`rgba(143,220,240,${0.25+0.12*Math.sin(T*0.005)})`;
    ctx.fillRect(X-2,Y-3,Wd+4,Hd+6);
  }
  ctx.restore();
}
function drawOneway(g,T){
  if(offscreen(g)) return;
  const z=cam.zoom;
  const X=sx(g.x0), Y=sy(g.y1), Wd=(g.x1-g.x0)*z, Hd=Math.max((g.y1-g.y0)*z,3);
  ctx.save();
  const gr=ctx.createLinearGradient(0,Y,0,Y+Hd);
  gr.addColorStop(0,PAL.marbleHi); gr.addColorStop(1,PAL.marbleLo);
  ctx.fillStyle=gr; rr(ctx,X,Y,Wd,Hd,2); ctx.fill();
  ctx.fillStyle=PAL.oneway; ctx.fillRect(X,Y,Wd,Math.max(1.4,z*0.03));
  const cg=ctx.createLinearGradient(0,Y+Hd,0,Y+Hd+z*0.42);
  const a=0.20+0.08*Math.sin(T*0.003);
  cg.addColorStop(0,`rgba(255,238,190,${a})`); cg.addColorStop(1,"rgba(255,238,190,0)");
  ctx.fillStyle=cg; ctx.fillRect(X,Y+Hd,Wd,z*0.42);
  ctx.restore();
}
function drawWall(g,T,alpha=1){
  if(offscreen(g)) return;
  const z=cam.zoom;
  const X=sx(g.x0), Y=sy(g.y1), Wd=(g.x1-g.x0)*z, Hd=(g.y1-g.y0)*z;
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.fillStyle="rgba(4,8,18,0.40)"; ctx.fillRect(X+2,Y+2,Wd,Hd);
  const gr=ctx.createLinearGradient(X,0,X+Wd,0);
  gr.addColorStop(0,"#232d42"); gr.addColorStop(0.30,PAL.wallHi);
  gr.addColorStop(0.55,PAL.wallMid); gr.addColorStop(1,PAL.wallLo);
  ctx.fillStyle=gr; ctx.fillRect(X,Y,Wd,Hd);
  if(z>18&&Wd>7){
    const n=Math.max(1,Math.floor(Wd/Math.max(7,z*0.16)));
    for(let i=1;i<n;i++){ const fx=Math.round(X+Wd*i/n)+0.5;
      ctx.strokeStyle="rgba(140,166,204,0.13)"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(fx,Y+2); ctx.lineTo(fx,Y+Hd-2); ctx.stroke();
      ctx.strokeStyle="rgba(8,12,22,0.32)";
      ctx.beginPath(); ctx.moveTo(fx+1.4,Y+2); ctx.lineTo(fx+1.4,Y+Hd-2); ctx.stroke(); }
  }
  const cap=Math.max(2,z*0.055);
  ctx.fillStyle=PAL.goldLo;
  ctx.fillRect(X-Wd*0.12,Y+Hd-cap,Wd*1.24,cap);
  if(g.cap==="finial"){                       // 첨탑캡 = 설 수 없음(뾰족)
    ctx.fillStyle=PAL.gold;
    ctx.beginPath(); ctx.moveTo(X+Wd/2, Y-z*0.30);
    ctx.lineTo(X+Wd*1.05, Y+cap); ctx.lineTo(X-Wd*0.05, Y+cap);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle=PAL.goldHi;
    ctx.beginPath(); ctx.arc(X+Wd/2, Y-z*0.34, Math.max(1.5,z*0.045),0,7); ctx.fill();
  }else{
    ctx.fillStyle=PAL.goldLo; ctx.fillRect(X-Wd*0.12,Y,Wd*1.24,cap);
    ctx.fillStyle=PAL.gold;   ctx.fillRect(X-Wd*0.12,Y,Wd*1.24,Math.max(1,z*0.022));
  }
  ctx.restore();
}
function drawVault(g,T){
  if(offscreen(g)) return;
  const z=cam.zoom;
  const cx=sx((g.x0+g.x1)/2), top=sy(g.y1), bot=sy(g.y0), half=(g.x1-g.x0)/2*z;
  ctx.save();
  const gr=ctx.createLinearGradient(0,top,0,bot);
  gr.addColorStop(0,PAL.goldHi); gr.addColorStop(0.5,PAL.gold); gr.addColorStop(1,PAL.goldLo);
  ctx.fillStyle=gr;
  ctx.beginPath(); ctx.moveTo(cx,top); ctx.lineTo(cx+half,bot); ctx.lineTo(cx-half,bot);
  ctx.closePath(); ctx.fill();
  ctx.globalCompositeOperation="lighter";
  ctx.fillStyle=`rgba(255,240,190,${0.22+0.12*Math.sin(T*0.004)})`;
  ctx.beginPath(); ctx.arc(cx,top,half*1.6,0,7); ctx.fill();
  ctx.restore();
}
function drawHazard(z_,T){
  const X=sx(z_.x0), Wd=(z_.x1-z_.x0)*cam.zoom;
  const Y=sy(z_.y1), Hd=Math.max((z_.y1-z_.y0)*cam.zoom, cam.zoom*0.8);
  if(X>W+40||X+Wd<-40) return;

  const dg=ctx.createLinearGradient(0,Y,0,Y+Hd);
  dg.addColorStop(0,"rgba(30,44,70,0.0)");
  dg.addColorStop(0.35,"rgba(24,36,60,0.45)");
  dg.addColorStop(1,"rgba(10,18,34,0.88)");
  ctx.fillStyle=dg; ctx.fillRect(X,Y,Wd,Hd);
  ctx.globalAlpha=0.34;
  for(let i=0;i<4;i++){
    const yy=Y+Hd*(0.3+i*0.22)+Math.sin(T*0.0006+i*1.7)*5;
    ctx.fillStyle="rgba(160,186,216,0.18)";
    ctx.beginPath(); ctx.ellipse(X+Wd/2,yy,Wd*0.5,Hd*0.09,0,0,7); ctx.fill();
  }

  ctx.save();
  ctx.strokeStyle="rgba(255,140,120,0.34)"; ctx.setLineDash([7,6]); ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(X,Y); ctx.lineTo(X+Wd,Y); ctx.stroke();
  ctx.restore();
}
function drawSpearFace(f,T){
  const z=cam.zoom;
  const X=sx(f.x0), Y=sy(f.y1);
  const Wd=Math.max((f.x1-f.x0)*z,3), Hd=(f.y1-f.y0)*z;
  if(X>W+80||X+Wd<-80) return;
  const pulse=0.45+0.25*Math.sin(T*0.0022+f.y0);
  // 노출면(법선 쪽)에서 바깥으로 발광
  const ex = f.nx<0 ? X : X+Wd;              // 노출 x
  ctx.save(); ctx.globalCompositeOperation="lighter";
  if(f.ny===-1){
    const ug=ctx.createLinearGradient(0,Y+Hd,0,Y+Hd+z*0.6);
    ug.addColorStop(0,`rgba(143,220,240,${0.40*pulse})`); ug.addColorStop(1,"rgba(143,220,240,0)");
    ctx.fillStyle=ug; ctx.fillRect(X,Y+Hd,Wd,z*0.6);
  }else{
    const gw=z*1.6*(f.nx<0?-1:1);
    const fg=ctx.createLinearGradient(ex,0,ex+gw,0);
    fg.addColorStop(0,`rgba(143,220,240,${0.40*pulse})`); fg.addColorStop(1,"rgba(143,220,240,0)");
    ctx.fillStyle=fg;
    ctx.fillRect(Math.min(ex,ex+gw), Y, Math.abs(gw), Hd);
  }
  ctx.restore();
  ctx.save();
  ctx.strokeStyle=`rgba(180,238,255,${0.55+0.2*Math.sin(T*0.003)})`;
  ctx.lineWidth=Math.max(1.5,z*0.035);
  ctx.beginPath();
  if(f.ny===-1){ ctx.moveTo(X,Y+Hd); ctx.lineTo(X+Wd,Y+Hd); }
  else { ctx.moveTo(ex,Y); ctx.lineTo(ex,Y+Hd); }
  ctx.stroke();
  if(z>16){
    const span=f.ny===-1 ? (f.x1-f.x0) : (f.y1-f.y0);
    const n=Math.max(2,Math.round(span/0.9));           // 월드 유닛당 고정 밀도
    for(let i=0;i<=n;i++){
      const t=i/n;
      const cx = f.ny===-1 ? lerp(X,X+Wd,t) : ex;
      const cy = f.ny===-1 ? Y+Hd : lerp(Y,Y+Hd,t);
      const r=(2.0+1.2*Math.sin(T*0.004+i))*Math.max(0.6,z/48);
      ctx.fillStyle="rgba(200,244,255,0.9)";
      ctx.beginPath(); ctx.arc(cx,cy,r*0.5,0,7); ctx.fill();
      ctx.fillStyle="rgba(143,220,240,0.26)";
      ctx.beginPath(); ctx.arc(cx,cy,r*1.7,0,7); ctx.fill();
    }
  }
  ctx.restore();
}

  }
  const gr=ctx.createLinearGradient(X-wid/2,0,X+wid/2,0);
  gr.addColorStop(0,PAL.marbleLo); gr.addColorStop(0.4,PAL.marbleHi); gr.addColorStop(1,PAL.marbleLo);
  ctx.fillStyle=gr; rr(ctx,X-wid/2,yy-hgt,wid,hgt,Math.max(1.5,z*0.05)); ctx.fill();
  ctx.fillStyle = d.kind==="counter" ? "#e08a5a" : PAL.gold;

const _lb=[];
function slot(X,Y,w,h){
  for(let i=0;i<8;i++){
    const yy=Y-i*(h+3);
    let hit=false;
    for(const b of _lb) if(X<b.x+b.w+3&&X+w+3>b.x&&yy<b.y+b.h+2&&yy+h+2>b.y){hit=true;break;}
    if(!hit){ _lb.push({x:X,y:yy,w,h}); return yy; }
  }
  return null;
}

  ctx.font="500 11.5px system-ui"; ctx.fillStyle="rgba(186,208,238,0.85)";
  const pass=TESTS.filter(r=>r.ok).length;
  ctx.fillText(`맵 프로토 v1.1 · 전역 ${WORLD.x1}×${WORLD.y1}u · 7층 · 검증 ${pass}/${TESTS.length} · 캐릭터 미구현(뷰어)`, 18, 44);
  ctx.restore();

  const wx=wxAt(ui.mouse.x), wy=wyAt(ui.mouse.y);
  const f=FLOORS.find(a=>wy>=a.yOff&&wy<a.yOff+a.h);
  ctx.save();
  ctx.font="600 12px ui-monospace,monospace"; ctx.textAlign="left";
  ctx.fillStyle="rgba(8,14,26,0.70)"; rr(ctx,14,H-34,300,24,6); ctx.fill();
  ctx.fillStyle="rgba(200,224,255,0.95)";
  ctx.fillText(`전역 (${wx.toFixed(2)}, ${wy.toFixed(2)})`, 22, H-18);
  if(f) ctx.fillText(`${f.n}F 로컬 y ${(wy-f.yOff).toFixed(2)}`, 172, H-18);
  ctx.restore();

  if(ui.help){
    const rows=[
      ["카메라","드래그 · WASD/방향키 · 휠 줌"],
      ["층 이동","1~7 · O 전체 조망"],
      ["토글","L 라벨 · K 콜리전 · G 그리드 · P 창꽂기 · H 도움말"],
      ["검증","T 테스트 실행/표시 · E JSON 내보내기"],
      ["도달성","표면 클릭 → 포락선·창 사거리·도달 분류 (ESC 해제)"],
    ];
    const derived=[
      ["단일점프", REACH.jump], ["이단강림", REACH.doubleJump],
      ["창대도약", REACH.vault], ["대시점프 수평", REACH.dashX], ["창 사거리", REACH.spear],
    ];
    ctx.save();
    const px=14, py=76, pw=308;
    const ph=26+rows.length*17+14+derived.length*15+10;
    ctx.fillStyle="rgba(8,14,26,0.76)"; rr(ctx,px,py,pw,ph,10); ctx.fill();
    ctx.strokeStyle="rgba(232,200,106,0.20)"; ctx.lineWidth=1; ctx.stroke();
    ctx.textAlign="left";
    ctx.font="700 11px system-ui"; ctx.fillStyle="#f0dda8"; ctx.fillText("조작", px+12, py+18);
    ctx.font="500 11px system-ui";
    let yy=py+34;
    for(const [k,v] of rows){
      ctx.fillStyle="rgba(255,226,150,0.85)"; ctx.fillText(k, px+12, yy);
      ctx.fillStyle="rgba(196,216,244,0.88)"; ctx.fillText(v, px+70, yy); yy+=17;
    }
    yy+=8;
    ctx.font="700 11px system-ui"; ctx.fillStyle="#f0dda8";
    ctx.fillText("도달성 (PHYS에서 유도)", px+12, yy); yy+=15;
    ctx.font="500 10.5px ui-monospace,monospace";
    for(const [k,v] of derived){
      ctx.fillStyle="rgba(196,216,244,0.80)"; ctx.fillText(k, px+12, yy);
      ctx.fillStyle="rgba(143,220,240,0.95)"; ctx.fillText(v.toFixed(3)+"u", px+150, yy); yy+=15;
    }
    ctx.restore();
  }

  if(ui.tests){
    ctx.save();
    const px=14, py=ui.help? 76+ (26+5*17+14+5*15+10) + 10 : 76;
    const fs=11, pw=460, ph=26+TESTS.length*19+8;
    ctx.fillStyle="rgba(8,14,26,0.82)"; rr(ctx,px,py,pw,ph,10); ctx.fill();
    ctx.strokeStyle="rgba(232,200,106,0.24)"; ctx.lineWidth=1; ctx.stroke();
    ctx.textAlign="left"; ctx.font="700 11px system-ui"; ctx.fillStyle="#f0dda8";
    ctx.fillText("설계 검증 (데이터 파생 · T 갱신)", px+12, py+18);
    ctx.font=`500 ${fs}px system-ui`;
    let yy=py+34;
    for(const r of TESTS){
      ctx.fillStyle= r.ok?"#7fe3a0":"#ff8b7a"; ctx.fillText(r.ok?"✓":"✗", px+12, yy);
      ctx.fillStyle="rgba(200,220,246,0.9)"; ctx.fillText(r.n, px+28, yy);
      if(!r.ok&&r.d){ ctx.fillStyle="rgba(255,170,160,0.85)";
        ctx.fillText(r.d.slice(0,44), px+28, yy+11); yy+=11; }
      yy+=17;
    }
    ctx.restore();
  }

  const cf=FLOORS.find(a=>a.n===ui.floorFocus);
  if(cf){
    ctx.save();
    const txt=`${cf.n}F ${cf.name} — ${cf.concept}`;
    ctx.font="600 12px system-ui";
    const wpx=ctx.measureText(txt).width, bx=(W-wpx-28)/2;
    ctx.fillStyle="rgba(8,14,26,0.74)"; rr(ctx,bx,H-72,wpx+28,26,8); ctx.fill();
    ctx.strokeStyle="rgba(232,200,106,0.22)"; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle="rgba(232,240,255,0.92)"; ctx.textAlign="left";
    ctx.fillText(txt,bx+14,H-54);
    ctx.restore();
  }
  if(ui.sel){
    ctx.save();
    const s=ui.sel;
    const lines=[`${s.label}  [${s.uid}]`,
      `rect  x${s.x0.toFixed(2)}–${s.x1.toFixed(2)}  y${s.y0.toFixed(2)}–${s.y1.toFixed(2)}`,
      `type ${s.t}  stand ${s.stand}${s.gate?"  gate "+s.gate:""}${s.cap?"  cap "+s.cap:""}`];
    ctx.font="600 11.5px ui-monospace,monospace";
    const wpx=Math.max(...lines.map(l=>ctx.measureText(l).width))+22;
    const bx=W-wpx-16, by=H-84;
    ctx.fillStyle="rgba(8,14,26,0.86)"; rr(ctx,bx,by,wpx,58,8); ctx.fill();
    ctx.strokeStyle="rgba(255,238,180,0.35)"; ctx.lineWidth=1; ctx.stroke();
    ctx.textAlign="left"; ctx.fillStyle="rgba(255,238,186,0.95)";
    ctx.fillText(lines[0],bx+11,by+18);
    ctx.fillStyle="rgba(196,216,244,0.88)";
    ctx.fillText(lines[1],bx+11,by+34); ctx.fillText(lines[2],bx+11,by+50);
    ctx.restore();
  }
  if(ui.toast&&T-ui.toastT<2200){
    ctx.save(); ctx.font="700 13px system-ui"; ctx.textAlign="center";
    const a=1-Math.max(0,(T-ui.toastT-1500)/700);
    const wpx=ctx.measureText(ui.toast).width+30;
    ctx.globalAlpha=a;
    ctx.fillStyle="rgba(8,14,26,0.9)"; rr(ctx,(W-wpx)/2,H-118,wpx,30,8); ctx.fill();
    ctx.strokeStyle="rgba(232,200,106,0.4)"; ctx.stroke();
    ctx.fillStyle="#ffeaa7"; ctx.fillText(ui.toast,W/2,H-98);
    ctx.restore();
  }
}

/* ------------------------------------------------------------------ */
/* 11. 메인 루프                                                       */
/* ------------------------------------------------------------------ */
let last=performance.now();
function frame(T){
  const dt=Math.min(50,T-last); last=T;
  const sp=(keys["shift"]?2.4:1)*dt*0.018*(60/cam.zoom)*22;
  if(keys["a"]||keys["arrowleft"])  cam.tx-=sp;
  if(keys["d"]||keys["arrowright"]) cam.tx+=sp;
  if(keys["w"]||keys["arrowup"])    cam.ty+=sp;
  if(keys["s"]||keys["arrowdown"])  cam.ty-=sp;
  if(keys["="]||keys["+"]) cam.tzoom=clamp(cam.tzoom*1.03,6,220);
  if(keys["-"]||keys["_"]) cam.tzoom=clamp(cam.tzoom/1.03,6,220);
  cam.tx=clamp(cam.tx,-12,WORLD.x1+12);
  cam.ty=clamp(cam.ty,-8,WORLD.y1+8);
  const k=1-Math.pow(0.001,dt/1000);
  cam.x=lerp(cam.x,cam.tx,k); cam.y=lerp(cam.y,cam.ty,k); cam.zoom=lerp(cam.zoom,cam.tzoom,k);

  drawSky(T);
  const vy0=wyAt(H)-2, vy1=wyAt(0)+2;
  const vis=FLOORS.filter(f=>f.yOff+f.h>vy0 && f.yOff<vy1);

  for(const f of vis) drawChamber(f);
  for(const f of vis) drawGodRays(f,T);
  for(const z_ of HAZARDS) if(z_.y1>vy0&&z_.y0<vy1) drawHazard(z_,T);

  // 장식 → 벽 → 솔리드/한방향/나브
  for(const g of WORLD_GEO) if(g.t==="deco") drawWall(g,T,0.42);
  for(const g of WORLD_GEO) if(g.t==="wall") drawWall(g,T);
  for(const g of WORLD_GEO){
    if(g.t==="solid"){
      const f=FLOORS.find(a=>a.n===g.floor);
      drawSolid(g,T,{massTo: (g.y0-f.yOff)<=0.25 ? f.yOff-0.4 : null});
    } else if(g.t==="oneway") drawOneway(g,T);
    else if(g.t==="vault")    drawVault(g,T);
  }
  if(spear.planted) drawSolid(spear.planted,T);
  for(const f of SPEAR_FACES) drawSpearFace(f,T);

  for(const c of CHECKPOINTS) drawShrine(c,T);
  for(const t of TARGETS)     drawTarget(t,T);
  for(const c of COLLECTIBLES)drawCrystal(c,T);
  for(const tr of TRIGGERS)   if(tr.kind==="goal-strike") drawBell(tr,T);
  for(const p of PORTALS)     drawPortal(p,T);
  for(const f of vis)         drawSpawn(f,T);
  if(ui.plan) drawSpearPlan(T);

  ctx.save(); ctx.globalCompositeOperation="lighter";
  for(const m of MOTES){
    const my=(m.y+(T*0.00004*m.sp))%WORLD.y1;
    const X=sx(m.x), Y=sy(my+Math.sin(T*0.0009+m.ph)*0.12);
    if(X<-20||X>W+20||Y<-20||Y>H+20) continue;
    ctx.fillStyle=`rgba(214,238,255,${0.18+0.16*Math.sin(T*0.002+m.ph)})`;
    ctx.beginPath(); ctx.arc(X,Y,Math.max(0.8,m.r*cam.zoom),0,7); ctx.fill();
  }
  ctx.restore();

  if(ui.floorFocus>0) for(const f of vis) if(f.n!==ui.floorFocus) dimFloor(f);
  drawReach(T);
  drawGrid();
  if(ui.debug) for(const f of vis) drawDebug(f);
  _lb.length=0; _badges.length=0;
  if(ui.labels){
    const order=[...vis].sort((a,b)=>(b.n===ui.floorFocus)-(a.n===ui.floorFocus));
    for(const f of order) drawLabels(f, ui.floorFocus>0 && f.n!==ui.floorFocus);
  }
  for(const f of vis) drawFloorBadge(f);
  drawVignette();
  drawMinimap();
  drawHUD(T);
  requestAnimationFrame(frame);
}
focusFloor(1);
cam.x=cam.tx; cam.y=cam.ty; cam.zoom=cam.tzoom;
requestAnimationFrame(frame);

/* 헤드리스/콘솔 노출 */
window.__MAP__={MAP,FLOORS,WORLD,WORLD_GEO,SPEAR_FACES,HAZARDS,CHECKPOINTS,PORTALS,
  TARGETS,COLLECTIBLES,TRIGGERS,PLANS,PHYS,REACH,GATE_MARGIN,Q,grid,spear,
  plantSpear,recallSpear,runTests,auditGates,gateViolations,ledgeEmbedded,
  typeOverlaps,planIssues,targetGateIssues,reachFrom,standables,
  freeClosure,spearClosure,solvability,collectableIssues,hiddenGateIssues,pointReachable,
  occludedPair,occludedPoint,canMove,maxRise,startSurfaces,
  cam,focusFloor,overview,ui,exportJSON};
</script>
