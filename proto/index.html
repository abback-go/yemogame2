"use strict";
/* =====================================================================
   성창(聖槍) — 잊힌 성물 · 「신전 수련장」 맵 프로토타입 v1.1
   ---------------------------------------------------------------------
   설계 원본 : docs/specs/2026-08-07-temple-training-map.md (+ v1.1 개정)
   좌표계    : 유닛(u). 좌하단 원점, +x 오른쪽, +y 위. 1u = 100px @PPU100
   현 단계   : 맵 지오메트리 + 신전 아트 + 설계 검증 도구. 캐릭터/전투는 다음 단계.
   v1.1 변경 : 어드바이저 검토 반영 —
     · 게이팅 검증을 리터럴 → 데이터 파생 + 전 표면쌍 자동 감사로 교체
     · 시퀀스 브레이크 4건 수정 (3F 히든 / 4F 먼기둥 / 5F 성물기둥 / 7F 개구)
     · REACH를 PHYS에서 유도 (유니티 물리 상수와 단일 진실원)
     · 스키마 정비: ascii id · rect[x,y,w,h] · stand/cap/gate · spearFaces(normal)
       · hazards.respawn · checkpoints · portals · targets · dropThrough
     · 월드 평탄화(WORLD_GEO/SPEAR_FACES) + 콜리전 질의 API + 동적 창 발판
     · 인페이지 테스트(T) · JSON 익스포트(E) · 도달성 오버레이(클릭)
   ===================================================================== */

/* ------------------------------------------------------------------ */
/* 0. 물리 상수 (유니티 이식 스펙 §4와 동일 — 여기가 단일 진실원)        */
/* ------------------------------------------------------------------ */
const PHYS = {
  gravity:      26.0,   // u/s² (아래)
  runSpeed:      3.92,  // u/s
  airControl:    0.90,
  jumpV:         9.10,  // u/s
  airJumpV:      8.20,  // u/s (이단 강림)
  dashSpeed:     7.80,  // u/s
  dashTime:      0.16,  // s
  vaultV:       13.30,  // u/s (창대 도약 — 정점 3.4u 역산)
  spearRange:    5.00,  // u  창 던지기 사거리 (창 꽂기 비활성 — 부활 대비 보존)
  attackUpReach: 0.80,  // u  위공격 유효 리치(히트박스 상단 기준 추가 도달)
  ledgeSnap:     0.08,  // u  낮은 턱 자동 승월
  /* ── ★창대쉬 (Spear Dash) — v1.3 신설 시그니처 ─────────────────────
     레퍼런스: 오리와 도깨비불의 「충전 점프」.
     누르면 sdashHover 동안 공중에 멈춰 서고(중력·수평 모두 정지) 그 다음
     8방향 중 하나로 sdashTime 동안 sdashSpeed로 돌진한다.
     충전 1회. 접지 또는 **wallJump:true 표면 접촉** 시에만 회복된다.
     ★ 이 세 값이 REACH.sdash / REACH.chainUp / 포락선을 전부 결정한다.
       손으로 도달 수치를 적지 말고 반드시 여기를 고칠 것.
     ★ hover 시간은 "튜닝 손잡이"지만 CTRL이 아니라 여기 있다 — hover가 체공을
       늘려 도달 범위를 바꾸기 때문. 도달을 바꾸는 값은 전부 PHYS가 정본이다. */
  sdashSpeed:   11.00,  // u/s  돌진 속도
  sdashTime:     0.15,  // s    돌진 지속 → 순수 변위 1.65u
  sdashHover:    0.20,  // s    발동 직후 공중 정지(체공)
  /* 공중 수평속도가 상한(runSpeed·airControl)으로 되돌아오는 시간.
     v1.2의 하드 클램프(즉시 절단)를 대체한다 — 게이팅은 포락선이 보장하므로
     감각을 위해 관성을 살린다(어드바이저 B-8). */
  airDecayT:     0.12,  // s
  /* ── 히트박스 (2026-08-08 확정 · 스프라이트 실측 기반) ────────────────
     art/temple_maiden_sheet.png 108×116 셀을 프레임별로 실측한 결과:
       · 발 기준선  : 전 프레임 공통. 몸 픽셀 마지막 행 = y110 → 발바닥 경계 y111
       · 머리 정수리: 대기(r1) 6프레임 모두 y28 (그 위 행은 폭 ≤7px = 창 자루뿐)
                      공격(r4c2~c4)도 y29~31로 일치
       → 서 있는 실높이 111-28 = 83px = 0.83u
       · 머리카락 끝단(y26)·치맛자락(x8)·창(x46~103)은 히트박스에서 제외 —
         히트박스는 실루엣이 아니라 플레이 감각이 정한다.
     bodyH 0.82 : 실측 0.83에서 1px 여유. 이보다 크면 몸이 지면 위에 떠 보이고,
                  훨씬 작으면(구 0.46) 머리가 천장을 통과한다.
                  점프비 = jump 1.592 / 0.82 = 1.94배 (구 0.46은 3.46배 = 비현실)
     bodyW 0.30 : 몸통 코어 실측 — 발목 14px(y104~110), 상체 18~20px(y47~72),
                  달리기 보폭 21px. 30px는 코어를 좌우 5px씩 여유로 감싼다.
                  더 넓히면 3F 히든 니치(폭 0.6u)에 못 들어간다.
                  피벗 x35 = 몸통 코어 중심 (24~45의 중앙 34.5) — 박스는 피벗 중심 정렬. */
  bodyW:         0.30, bodyH: 0.82,
};
/* REACH는 상수가 아니라 PHYS에서 유도된다 → 물리를 튜닝하면 게이팅이 자동 재검증됨 */
const REACH = (()=>{
  const h = v => v*v/(2*PHYS.gravity);
  const jump = h(PHYS.jumpV);
  const airT = 2*PHYS.jumpV/PHYS.gravity;               // 단일점프 총 체공
  const sdash = PHYS.sdashSpeed*PHYS.sdashTime;         // 창대쉬 순수 변위
  return {
    jump,
    doubleJump: jump + h(PHYS.airJumpV),
    vault:      h(PHYS.vaultV),
    sdash,
    /* 점프 → 이단강림 → 창대쉬(수직) 4단 체인의 최대 상승 */
    chainUp:    jump + h(PHYS.airJumpV) + sdash,
    // 대시점프 수평 도달(스칼라 표시용). 실제 게이팅 판정은 아래 ENV 포락선이 한다.
    dashX: PHYS.dashSpeed*PHYS.dashTime + (airT-PHYS.dashTime)*PHYS.runSpeed*PHYS.airControl,
    spear: PHYS.spearRange,
    atkUp: PHYS.attackUpReach,
  };
})();
/* 게이팅 여유 규칙: 게이트 갭은 이동기 한계 대비 최소 이만큼 초과해야 한다.
   ledgeSnap(런타임 관대함)에서 유도한다 — ledgeSnap을 키우면 요구 여유도 커진다.
   0.30u는 프로젝트 원칙 6의 하한. (v1.2에선 순수 리터럴이라 ledgeSnap을 0.90으로
   바꿔도 전 항목 PASS였다 — 어드바이저 B-6) */
const GATE_MARGIN = Math.max(0.30, PHYS.ledgeSnap*3.5);

/* ------------------------------------------------------------------ */
/* 0.5 도달 포락선 (dy → 최대 dx) — PHYS만으로 유도한 탄도 모델          */
/*                                                                     */
/*   v1.2는 도달을 "직사각형"(dx≤dashX && dy≤maxUp)으로 봤다. 실제는     */
/*   높이를 벌수록 수평이 줄어드는 **포락선**이고, 그 차이 때문에         */
/*   1F step_p1→exit_ledge(dx4.0/dy2.6) 같은 구간이 모델 밖에서 넘어갔다. */
/*   (어드바이저 B-4)                                                   */
/*                                                                     */
/*   여기 모델은 컨트롤러 코드를 참조하지 않는다 — PHYS 상수만 쓰는       */
/*   독립 질점 탄도 시뮬레이터다. 그래야 "컨트롤러가 계약을 지키는가"를    */
/*   검사(test: 실측 ≤ 모델)할 수 있다. 모델이 실측에서 유도되면 그 검사는 */
/*   공허해진다.                                                        */
/* ------------------------------------------------------------------ */
const ENV_STEP = 0.1, ENV_LO = -8, ENV_HI = 8;
const envIdx = dy => Math.round((dy-ENV_LO)/ENV_STEP);
const ENV_N  = envIdx(ENV_HI)+1;

/* 한 궤적을 굴려 dy 버킷마다 최대 x를 적립 */
function envTrace(tbl, o){
  const g=PHYS.gravity, dt=1/480;
  const cap=PHYS.runSpeed*PHYS.airControl;
  let x=0, y=0, vx=o.vx0, vy=o.vy0;
  let t=0, airJumped=!o.airJump, dashed=!o.dash, sdashed=!o.sdash;
  let dashT=0, sdHover=0, sdT=0, sdx=0, sdy=0, decay=0;
  const mark=()=>{ const i=envIdx(y); if(i>=0&&i<tbl.length&&x>tbl[i]) tbl[i]=x; };
  mark();
  for(let n=0;n<3000;n++){
    t+=dt;
    /* 이벤트 발동 */
    if(!airJumped && t>=o.tAir){ vy=PHYS.airJumpV; airJumped=true; }
    if(!dashed   && t>=o.tDash){ dashT=PHYS.dashTime; dashed=true; }
    if(!sdashed  && t>=o.tSd){ sdHover=PHYS.sdashHover; sdT=PHYS.sdashTime;
                               sdx=o.sdx; sdy=o.sdy; sdashed=true; vx=0; vy=0; }
    if(sdHover>0){ sdHover-=dt; }                       // 체공: 완전 정지
    else if(sdT>0){ sdT-=dt; vx=sdx*PHYS.sdashSpeed; vy=sdy*PHYS.sdashSpeed;
                    x+=vx*dt; y+=vy*dt;
                    if(sdT<=0){ vy=0; decay=PHYS.airDecayT; }   // 종료: 상승분 소멸
                    mark(); continue; }
    else if(dashT>0){ dashT-=dt; vx=Math.sign(o.vx0||1)*PHYS.dashSpeed;
                      x+=vx*dt; y+=vy*dt; vy-=g*dt;
                      if(dashT<=0) decay=PHYS.airDecayT;
                      mark(); continue; }
    else{
      /* 수평: 상한 초과분을 airDecayT에 걸쳐 선형 감쇠 (하드 클램프 대체) */
      if(Math.abs(vx)>cap){
        const d=(PHYS.dashSpeed-cap)/Math.max(1e-6,PHYS.airDecayT);
        vx = vx>0 ? Math.max(cap, vx-d*dt) : Math.min(-cap, vx+d*dt);
      }
      vy-=g*dt; x+=vx*dt; y+=vy*dt;
    }
    mark();
    if(y<ENV_LO-1) break;
    if(t>o.tMax) break;
  }
}
/* kit: {airJump, dash, sdash, vy0, vx0} → dy→maxdx 테이블 */
function buildEnvelope(kit){
  const tbl=new Float64Array(ENV_N).fill(-1);
  const T=[0,0.05,0.10,0.16,0.22,0.28,0.34,0.40,0.48,0.56,0.66,0.76,0.90,1.05,1.25];
  const D8=[[1,0],[0.7071,0.7071],[0,1],[0.7071,-0.7071],[0,-1]];   // +x/상승 유효분면
  const tAirs = kit.airJump? T : [1e9];
  const tDashes= kit.dash?   T : [1e9];
  const tSds   = kit.sdash?  T : [1e9];
  const dirs   = kit.sdash?  D8 : [[1,0]];
  for(const tAir of tAirs) for(const tDash of tDashes)
    for(const tSd of tSds) for(const d of dirs)
      envTrace(tbl,{vx0:kit.vx0, vy0:kit.vy0, airJump:kit.airJump, dash:kit.dash,
        sdash:kit.sdash, tAir, tDash, tSd, sdx:d[0], sdy:d[1], tMax:3.2});
  /* 위로 갈수록 좁아지도록 단조화(수치 노이즈 제거) — 아래 방향은 그대로 */
  for(let i=envIdx(0);i<tbl.length-1;i++) if(tbl[i+1]>tbl[i]) tbl[i+1]=tbl[i];
  return tbl;
}
/* 표면에서 표면으로: 달려서 대시까지 붙일 수 있다고 본다(게이팅은 낙관 가정이 안전) */
const ENV = {
  /* 기본 키트 — 달리기·점프·이단강림·대시. 창대쉬 없음 */
  basic: buildEnvelope({vy0:PHYS.jumpV,  vx0:PHYS.dashSpeed, airJump:true,  dash:true,  sdash:false}),
  /* 전체 키트 — + 창대쉬 */
  full:  buildEnvelope({vy0:PHYS.jumpV,  vx0:PHYS.dashSpeed, airJump:true,  dash:true,  sdash:true }),
  /* 도약 나브에서 출발 (창대 도약) */
  vault: buildEnvelope({vy0:PHYS.vaultV, vx0:PHYS.dashSpeed, airJump:true,  dash:true,  sdash:false}),
  vaultFull: buildEnvelope({vy0:PHYS.vaultV,vx0:PHYS.dashSpeed,airJump:true,dash:true,  sdash:true }),
  /* 첨탑캡(stand:false) — 점프 봉인. 미끄러지며 창대쉬만 가능 */
  finial:     buildEnvelope({vy0:0, vx0:0, airJump:false, dash:false, sdash:false}),
  finialFull: buildEnvelope({vy0:0, vx0:0, airJump:false, dash:false, sdash:true }),
};
/* 포락선 조회: 높이차 dy를 벌면서 갈 수 있는 최대 수평거리. 없으면 -1 */
function envDx(tbl,dy){
  const i=envIdx(dy);
  if(i<0) return tbl[0];
  if(i>=tbl.length) return -1;
  return tbl[i];
}
/* 포락선의 최대 상승 (dx≥0으로 닿을 수 있는 가장 높은 dy) */
function envMaxUp(tbl){
  let best=-Infinity;
  for(let i=0;i<tbl.length;i++) if(tbl[i]>=0) best=Math.max(best, ENV_LO+i*ENV_STEP);
  return best;
}

/* ------------------------------------------------------------------ */
/* 1. 맵 데이터 (schema temple-map/1.1)                                */
/*    rect:[x,y,w,h] 좌하단 원점 · 층 로컬 좌표 + yOff                  */
/*    t: solid|oneway|wall|vault|deco   stand:착지가능  cap:"finial"    */
/*    gate: 이 표면에 도달하려면 반드시 필요한 수단(spear|vault)         */
/* ------------------------------------------------------------------ */
const MAP = {
  schema:"temple-map/1.1", units:"u", ppu:100, origin:"bottom-left", yUp:true,
  name:"신전 수련장", phys:PHYS,
  /* ★ 창 꽂기(스피어 앵커)는 v1.3에서 이 맵에 한해 **비활성**이다 (유저 확정).
     삭제가 아니라 스위치인 이유:
       · plantSpear/recallSpear·spearFaces·spearPlan 데이터가 전부 보존돼 되살리기 쉽다
       · enabled:false면 buildWorld가 SPEAR_FACES/PLANS를 비우고, 그에 딸린 검증
         항목(창 계획 유효 / 발판 파묻힘)은 **데이터가 비어 자동 skip**된다 —
         테스트를 지우지 않으므로 부활 시 그대로 다시 물린다
     되살리려면 enabled:true 하나만 바꾸고 게이트 재설계하면 된다. */
  spear:{ enabled:false, ledgeLen:0.8, ledgeThick:0.12, maxPlanted:1, recallDamages:true },
  /* 이동기 게이트 종류: "sdash" = 창대쉬 필수 · "vault" = 도약 나브 필수(현재 미사용) */
  floors:[

    {id:"plaza_floor", t:"solid", rect:[0,0,34,1.0],    stand:true,  label:"대광장 바닥"},

{

  concept:"동일 2.5u 갭 반복 대시점프 + 기둥머리 위 공중 허수아비 에어콤보.",
  camera:{padY:1.2},
  geo:[
    {id:"safe_floor", t:"solid", rect:[0.4,0,25.6,1.0], stand:true,  label:"회복 바닥(세이프티)"},
    {id:"wall_l",     t:"wall",  rect:[0,0,0.4,7],      stand:false, label:"좌 경계벽"},

/* 2. 월드 평탄화 — yOff 산술을 여기서 한 번만. 이후 전부 월드 좌표.     */
/* ------------------------------------------------------------------ */
const STANDABLE = new Set(["solid","oneway","vault"]);
let WORLD_GEO=[], SPEAR_FACES=[], HAZARDS=[], CHECKPOINTS=[], PORTALS=[],
    TARGETS=[], COLLECTIBLES=[], TRIGGERS=[], PLANS=[], WORLD={x0:0,x1:0,y0:0,y1:0};

function buildWorld(){
  WORLD_GEO=[]; SPEAR_FACES=[]; HAZARDS=[]; CHECKPOINTS=[]; PORTALS=[];
  TARGETS=[]; COLLECTIBLES=[]; TRIGGERS=[]; PLANS=[];
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for(const f of FLOORS){
    const o=f.yOff;
    f.bbox={x0:0,x1:f.w,y0:0,y1:f.h};
    for(const g of f.geo){
      const [x,y,w,h]=g.rect;
      const wg={...g, floor:f.n, fid:f.id, uid:`${f.id}:${g.id}`,
        x0:x, y0:y+o, x1:x+w, y1:y+h+o,
        stand: g.stand!==undefined ? g.stand : STANDABLE.has(g.t)};
      WORLD_GEO.push(wg);
      x0=Math.min(x0,wg.x0); x1=Math.max(x1,wg.x1);
      y0=Math.min(y0,wg.y0); y1=Math.max(y1,wg.y1);
    }
    /* 창 꽂기 비활성이면 면·계획을 월드에 올리지 않는다 → 관련 검증은 자동 skip,
       렌더/HUD도 자연히 사라진다. MAP 데이터는 그대로 남아 부활 가능. */
    for(const s of (MAP.spear.enabled? (f.spearFaces||[]) : [])){
      const [x,y,w,h]=s.rect;
      SPEAR_FACES.push({...s, floor:f.n, fid:f.id, uid:`${f.id}:${s.id}`,
        x0:x, y0:y+o, x1:x+w, y1:y+h+o, nx:s.normal[0], ny:s.normal[1]});
    }
    for(const z of (f.hazards||[])){
      const [x,y,w,h]=z.rect;
      HAZARDS.push({...z, floor:f.n, fid:f.id, uid:`${f.id}:${z.id}`,
        x0:x, y0:y+o, x1:x+w, y1:y+h+o});
    }
    for(const c of (f.checkpoints||[]))  CHECKPOINTS.push({...c, floor:f.n, fid:f.id, wx:c.pos[0], wy:c.pos[1]+o});
    for(const p of (f.portals||[]))      PORTALS.push({...p, floor:f.n, fid:f.id, wx:p.pos[0], wy:p.pos[1]+o});
    for(const t of (f.targets||[]))      TARGETS.push({...t, floor:f.n, fid:f.id, wx:t.pos[0], wy:t.pos[1]+o});
    for(const c of (f.collectibles||[])) COLLECTIBLES.push({...c, floor:f.n, fid:f.id, wx:c.pos[0], wy:c.pos[1]+o});
    for(const t of (f.triggers||[])){
      const [x,y,w,h]=t.rect;
      TRIGGERS.push({...t, floor:f.n, fid:f.id, x0:x, y0:y+o, x1:x+w, y1:y+h+o});
    }
    for(const p of (MAP.spear.enabled? (f.spearPlan||[]) : [])){
      const face=(f.spearFaces||[]).find(s=>s.id===p.face);
      const nx = face? face.normal[0] : -1;
      const L  = MAP.spear.ledgeLen, T = MAP.spear.ledgeThick;
      const px = p.at[0], py = p.at[1]+o;
      PLANS.push({...p, floor:f.n, fid:f.id, faceRef:face,
        fromX:p.from[0], fromY:p.from[1]+o, atX:px, atY:py, nx,
        // 박힌 창 = 면 법선 방향으로 돌출한 작은 레지
        ledge:{ x0: nx<0? px-L : px, x1: nx<0? px : px+L, y0:py, y1:py+T },
        dist: Math.hypot(px-p.from[0], py-(p.from[1]+o))});
    }
    if(f.spawn) f.spawnW=[f.spawn[0], f.spawn[1]+o];
  }
  for(const f of FLOORS){ x1=Math.max(x1,f.w); y1=Math.max(y1,f.yOff+f.h); }
  WORLD={x0:Math.min(0,x0), x1, y0:Math.min(0,y0), y1};
}
buildWorld();

/* ------------------------------------------------------------------ */
/* 3. 콜리전 질의 API — 다음 단계(캐릭터 컨트롤러)의 유일한 진입점      */
/*    공간 해시 + 동적 창 발판 등록/해제                                */
/* ------------------------------------------------------------------ */
class SpatialHash{
  constructor(cell=2){ this.cell=cell; this.m=new Map(); }
  _k(cx,cy){ return cx+","+cy; }
  _cells(g,fn){
    const c=this.cell;
    for(let cx=Math.floor(g.x0/c); cx<=Math.floor(g.x1/c); cx++)
      for(let cy=Math.floor(g.y0/c); cy<=Math.floor(g.y1/c); cy++) fn(this._k(cx,cy));
  }
  insert(g){ this._cells(g,k=>{ let a=this.m.get(k); if(!a) this.m.set(k,a=[]); a.push(g); }); }
  remove(g){ this._cells(g,k=>{ const a=this.m.get(k); if(!a) return;
                const i=a.indexOf(g); if(i>=0) a.splice(i,1); }); }
  query(x0,y0,x1,y1){
    const c=this.cell, out=new Set();
    for(let cx=Math.floor(x0/c); cx<=Math.floor(x1/c); cx++)
      for(let cy=Math.floor(y0/c); cy<=Math.floor(y1/c); cy++){
        const a=this.m.get(this._k(cx,cy)); if(a) for(const g of a) out.add(g);
      }
    return [...out];
  }
}
const grid=new SpatialHash(2);
for(const g of WORLD_GEO) if(g.t!=="deco") grid.insert(g);

/* 동적 창 발판 — 한 번에 하나 (MAP.spear.maxPlanted) */
const spear = { state:"held", planted:null };
/* ★ 창 꽂기 런타임은 v1.3에서 컨트롤러에 연결되지 않는다(MAP.spear.enabled=false).
   함수 자체는 부활을 위해 그대로 둔다 — enabled를 켜고 입력만 물리면 된다. */
function plantSpear(faceUid, atY){
  if(!MAP.spear.enabled) return null;
  const face=SPEAR_FACES.find(f=>f.uid===faceUid); if(!face) return null;
  if(spear.planted) recallSpear();
  const {ledgeLen:L, ledgeThick:T}=MAP.spear;
  const px = face.nx<0 ? face.x0 : face.x1;                 // 면의 노출면
  const g={ id:"spear_ledge", uid:"dyn:spear", t:"solid", dyn:true, stand:true, vaultable:true,
            label:"박힌 창(발판)",
            x0: face.nx<0 ? px-L : px, x1: face.nx<0 ? px : px+L,
            y0: atY, y1: atY+T, floor:face.floor, fid:face.fid };
  spear.planted=g; spear.state="planted"; grid.insert(g); return g;
}
function recallSpear(){ if(spear.planted) grid.remove(spear.planted);
                        spear.planted=null; spear.state="held"; }

const rectHit=(a,b)=> a.x0<b.x1 && a.x1>b.x0 && a.y0<b.y1 && a.y1>b.y0;
const Q = {
  solidsNear(x0,y0,x1,y1){ return grid.query(x0,y0,x1,y1).filter(g=>g.t!=="deco"); },
  /* 축분리 스윕용 후보 (컨트롤러가 붙을 때 tMin 계산을 여기에 채운다) */
  sweep(box,dx,dy){
    const ex={x0:Math.min(box.x0,box.x0+dx), x1:Math.max(box.x1,box.x1+dx),
              y0:Math.min(box.y0,box.y0+dy), y1:Math.max(box.y1,box.y1+dy)};
    return this.solidsNear(ex.x0,ex.y0,ex.x1,ex.y1).filter(g=>rectHit(ex,g));
  },
  /* oneway는 하강 중 + 직전 바닥이 판 위 + 드롭스루 아닐 때만 막는다 */
  onewayBlocks(plat, prevBottomY, vy, dropping){
    if(plat.t!=="oneway") return true;
    if(dropping && plat.dropThrough!==false) return false;
    return vy<=0 && prevBottomY>=plat.y1-1e-6;
  },
  groundBelow(x,y,maxDrop=40){
    let best=null;
    for(const g of this.solidsNear(x-0.01,y-maxDrop,x+0.01,y))
      if(g.stand && g.x0<=x && g.x1>=x && g.y1<=y+1e-6)
        if(!best||g.y1>best.y) best={y:g.y1, geo:g};
    return best;
  },
  /* ★ 벽점프·벽슬라이드·창대쉬 충전이 성립하는 벽만 돌려준다.
     `wallJump:true`를 명시한 표면(설계가 지정한 슈트)만 인정하고 **경계벽은 제외**한다.
     경계벽을 인정하면 (a) 단일 벽 무한 벽점프로 층이 통째로 스킵되고(B-1),
     (b) 창대쉬 충전이 경계벽에서 회복돼 "붙어 충전 → 창대쉬 → 다시 붙기" 사다리로
     무한 상승이 부활한다. 두 경우 모두 검증 항목으로 못 박혀 있다.
     반환: 0 (없음) 또는 {dir:-1|1, geo} */
  wallContact(box){
    for(const g of this.solidsNear(box.x0-0.1,box.y0,box.x1+0.1,box.y1)){
      if(g.t!=="wall" || g.wallJump!==true) continue;
      if(g.y0<box.y1 && g.y1>box.y0){
        if(Math.abs(g.x1-box.x0)<0.1) return {dir:-1, geo:g};
        if(Math.abs(g.x0-box.x1)<0.1) return {dir: 1, geo:g};
      }
    }
    return 0;
  },
  /* 설계가 지정한 벽점프 슈트 목록 (검증·모델이 쓴다) */
  wallJumpSurfaces(floorN){
    return WORLD_GEO.filter(g=>g.wallJump===true && (floorN==null||g.floor===floorN));
  },
  ceilingAbove(box){
    let best=null;
    for(const g of this.solidsNear(box.x0,box.y1,box.x1,box.y1+40))
      if(g.t!=="oneway" && g.x0<box.x1 && g.x1>box.x0 && g.y0>=box.y1-1e-6)
        if(best===null||g.y0<best) best=g.y0;
    return best;
  },
  hazardAt(x,y){
    for(const z of HAZARDS) if(x>=z.x0&&x<=z.x1&&y>=z.y0&&y<=z.y1) return z;
    return null;
  },
  checkpointNear(x,y,r=0.8){
    let best=null,bd=r;
    for(const c of CHECKPOINTS){ const d=Math.hypot(c.wx-x,c.wy-y); if(d<bd){bd=d;best=c;} }
    return best;
  },
  /* 창 레이캐스트 — 사거리 내 최초 spear 면 */
  raycastSpear(px,py,dirx,diry,range=REACH.spear){
    const L=Math.hypot(dirx,diry)||1; dirx/=L; diry/=L;
    let best=null;
    for(const f of SPEAR_FACES){
      for(let t=0.1;t<=range;t+=0.05){
        const x=px+dirx*t, y=py+diry*t;
        if(x>=f.x0-0.06&&x<=f.x1+0.06&&y>=f.y0&&y<=f.y1){
          if(!best||t<best.dist) best={face:f, point:{x,y}, normal:[f.nx,f.ny], dist:t};
          break;
        }
      }
    }
    return best;
  },
};

/* ------------------------------------------------------------------ */
/* 4. 설계 검증 — 데이터 파생. 하드코딩 리터럴 없음.                     */
/* ------------------------------------------------------------------ */
function standables(floorN){
  return WORLD_GEO.filter(g=>g.stand && g.t!=="deco" && (g.x1-g.x0)>0.15 &&
    (floorN==null||g.floor===floorN));
}
/* ★ 첨탑캡(cap:"finial") — `stand:false`라 "설 수 없는" 표면이지만 런타임 moveY는
   여기서 **착지시킨다**(미끄러지며 얹힘). v1.2 모델은 이걸 노드로 아예 취급하지
   않아서, 4F 먼 기둥 캡을 밟고 점프해 출구로 올라타는 시퀀스 브레이크를 못 봤다
   (어드바이저 B-2). 이제 **점프 못 하는 경유 지점**으로 명시 모델링한다:
     · 진입: 보통 표면과 동일하게 착지 가능
     · 탈출: 점프·대시 불가(ENV.finial = 상승 0), 창대쉬만 가능(ENV.finialFull)
   컨트롤러 쪽에서도 슬립 중 점프를 봉인해 이 모델과 일치시킨다. */
function finialNodes(floorN){
  return WORLD_GEO.filter(g=>g.cap==="finial" && (floorN==null||g.floor===floorN))
    .map(g=>({...g, baseUid:g.uid, uid:g.uid+"#cap", stand:true, noJump:true, finial:true}));
}
/* 도달성 그래프의 노드 = 착지 표면 + 첨탑캡 경유 지점 */
let _nodeCache=new Map();
function graphNodes(floorN){
  if(!_nodeCache.has(floorN)) _nodeCache.set(floorN,[...standables(floorN),...finialNodes(floorN)]);
  return _nodeCache.get(floorN);
}
function gapBetween(a,b){
  const dx = b.x0>a.x1 ? b.x0-a.x1 : (a.x0>b.x1 ? a.x0-b.x1 : 0);
  return {dx, dy: b.y1-a.y1};
}
/* 차폐 판정
   - 수평 통로: 사이 지형의 상단이 도약 정점보다 높으면 "타고 넘을 수 없음" → 차단
   - 수직 통로: x가 겹치면 두 높이 사이를 가로막는 지형이 있으면 차단(니치 천장 등) */
function blockedBetween(floorN, aTop, bTop, ax0,ax1, bx0,bx1, maxUp, exclude){
  const band0=Math.min(aTop,bTop), band1=Math.max(aTop,bTop), apex=aTop+maxUp;
  const ovl0=Math.max(ax0,bx0), ovl1=Math.min(ax1,bx1);
  const gap = bx0>ax1 ? [ax1,bx0] : (ax0>bx1 ? [bx1,ax0] : null);
  for(const g of WORLD_GEO){
    if(g.floor!==floorN||g.t==="deco"||g.t==="oneway") continue;
    if(exclude&&exclude.some(e=>e&&(e===g||e.baseUid===g.uid||e.uid===g.uid))) continue;
    if(gap){                                    // 수평 이동 — 넘어갈 수 있나
      if(g.x1<=gap[0]+0.02||g.x0>=gap[1]-0.02) continue;
      if(g.y1<=band0+0.05) continue;            // 발밑 — 그냥 지나감
      if(g.y1< apex-0.05) continue;             // 정점 아래 — 타고 넘음
      if(g.y0 > band1+PHYS.bodyH) continue;     // 머리 위로 충분히 떠 있음
      return true;
    }else if(ovl1-ovl0>0.05 && bTop<aTop-0.05){ // 하강 — 사이를 막는 천장/차양이 있나
      // (상승은 옆 모서리로 아치 착지가 가능하므로 수직 차단을 적용하지 않는다)
      if(g.x1<=ovl0+0.02||g.x0>=ovl1-0.02) continue;
      if(g.y1>band0+0.05 && g.y0<band1-0.05) return true;
    }
  }
  return false;
}
function occludedPair(a,b,maxUp=REACH.doubleJump){
  return blockedBetween(a.floor,a.y1,b.y1,a.x0,a.x1,b.x0,b.x1,maxUp,[a,b]);
}
function occludedPoint(a,x,y,maxUp=REACH.doubleJump){
  return blockedBetween(a.floor,a.y1,y,a.x0,a.x1,x-0.05,x+0.05,maxUp,[a]);
}
/* ------------------------------------------------------------------ */
/*  이동 판정 — v1.3부터 포락선(dy→maxdx) 기반. 직사각형 모델 폐기.       */
/*                                                                     */
/*  v1.2의 판정은 `dx<=REACH.dashX && dy<=maxUp`인 직사각형이었고,        */
/*  거기에 `dy<=6.5 && dx<=dashX*1.6` 같은 매직 리터럴이 벽점프 표면의     */
/*  도달성을 혼자 결정했다(어드바이저 B-6). 둘 다 없앤다.                 */
/* ------------------------------------------------------------------ */
/* 출발 표면의 성격 → 어떤 포락선을 쓰는가 */
function envFor(a, kit){                      // kit: "basic" | "full"
  const full = kit==="full";
  if(a.noJump)                        return full? ENV.finialFull : ENV.finial;   // 첨탑캡
  if(a.t==="vault"||a.virt||a.vaultable) return full? ENV.vaultFull : ENV.vault;  // 도약 나브(현재 미사용)
  return full? ENV.full : ENV.basic;
}
/* 이 표면에서 낼 수 있는 최대 상승 (차폐 판정의 아치 정점 계산용) */
function maxRise(a, kit){ return envMaxUp(envFor(a,kit)); }
/* 벽점프 보정: a에서 뛰어 `wallJump:true` 벽에 붙었다가 한 번 차고 오르는 경로.
   - 접촉 높이는 min(a.y1 + 단일점프, 벽 상단)까지
   - 차고 난 뒤에는 다시 기본 포락선(이단강림 1회 남음)
   - **같은 벽 연속 벽점프는 컨트롤러가 금지**하므로 1회만 인정한다
   벽에 닿으려면 벽이 a에서 수평 포락선 안에 있어야 한다. */
function wallBoostTop(a, kit){
  let best=-Infinity;
  const tbl=envFor(a,kit);
  for(const w of Q.wallJumpSurfaces(a.floor)){
    if(w.y1<=a.y1) continue;                                    // 이미 벽 꼭대기 위
    const wdx = w.x0>a.x1 ? w.x0-a.x1 : (a.x0>w.x1 ? a.x0-w.x1 : 0);
    /* 접촉 가능 높이:
       basic — 한 번 뛰어 붙는 게 전부다(같은 벽 연속 벽점프는 컨트롤러가 금지).
       full  — 창대쉬 충전이 이 벽에서 회복되므로 "붙어 충전 → 위로 창대쉬 → 다시 붙기"로
               **벽 꼭대기까지 기어오를 수 있다.** 그래서 벽 상단을 그대로 접촉 높이로 본다.
               (이 상한이 곧 wallJump 표면을 짧게 유지해야 하는 이유다) */
    const contact = kit==="full"
      ? Math.min(a.y1+Math.max(REACH.jump, envMaxUp(tbl)), w.y1) === w.y1
        ? w.y1 : Math.min(a.y1+envMaxUp(tbl), w.y1)
      : Math.min(a.y1+REACH.jump, w.y1);
    if(contact<=a.y1) continue;
    if(wdx > envDx(tbl, Math.min(contact-a.y1, envMaxUp(tbl)))) continue;   // 벽까지 못 감
    best=Math.max(best, contact);
  }
  return best;
}
/* ------------------------------------------------------------------ */
/*  가시 영역 — 맵 설계 제약의 출처                                       */
/*                                                                     */
/*  PLAY.scale=2(유저 확정)에서 1u = 200 화면px. 설계 기준은 사지방 모니터의  */
/*  하한을 모르므로 **작은 쪽(1600×900)** 으로 잡는다 → 8.0u × 4.5u.       */
/*  전체 상승 체인이 4.536u라 세로 시야 4.5u를 통째로 먹는다 = 맹목 점프.    */
/*  그래서 도약 목표는 출발 시점에 화면 안에 있어야 하고, 연속 상승은         */
/*  중간 착지로 끊어야 한다. 값은 전부 PLAY.scale·CTRL·REACH에서 유도한다 —  */
/*  scale을 1로 되돌리면 기준이 자동으로 완화된다.                          */
/* ------------------------------------------------------------------ */
const VIEW_REF={w:1600, h:900};        // 설계 기준 해상도(가정 하한)
function viewSpec(){
  const ppu=100*PLAY.scale;            // 스프라이트 PPU100 × 정수배 확대
  const w=VIEW_REF.w/ppu, h=VIEW_REF.h/ppu;
  /* 이륙 순간의 엄밀한 가시 상한은 h/2 + camUp 이지만, 그 값(2.75u)은 기본 키트
     상한(2.886u)보다 낮아 게이트 자체가 성립할 수 없다. 그래서 "이륙 직후
     카메라가 따라 올라가며 곧바로 보인다"를 허용치로 잡아 **상승 한 호흡의 절반**
     (단일점프/2)을 더한다. 가로도 카메라 리드의 절반을 뺀다. */
  return {
    w, h,
    gateDx: w/2 - CTRL.camLead/2,                    // 1600×900·2배 → 3.55u
    gateDy: h/2 + CTRL.camUp + REACH.jump/2,         //               → 3.55u
    riseCap: h/2 + CTRL.camUp + REACH.jump,          //               → 4.34u
  };
}
/* 공통 이동 판정. kit: "basic"(창대쉬 없음) | "full"(창대쉬 포함)
   riseCap: 한 번의 도약으로 허용할 최대 상승(시야 제약 검사용). 기본 무제한. */
function canMove(a,b,kit="basic",riseCap=Infinity){
  const tbl=envFor(a,kit);
  const {dx,dy}=gapBetween(a,b);
  if(dy>riseCap) return false;
  const dyEff = dy - PHYS.ledgeSnap;                 // 런타임 렛지스냅 관대함 흡수
  const up=maxRise(a,kit);
  if(dx<=envDx(tbl,dyEff) && dyEff<=up && !occludedPair(a,b,up)) return true;
  /* 벽점프 경유 */
  const wt=wallBoostTop(a,kit);
  if(wt>-Infinity){
    const wtbl = kit==="full"? ENV.full : ENV.basic;   // 벽을 찬 뒤엔 통상 도약
    const dy2 = b.y1 - wt - PHYS.ledgeSnap;
    if(dy2<=envMaxUp(wtbl) && dx<=envDx(wtbl,dy2) && !occludedPair(a,b,wt-a.y1+envMaxUp(wtbl)))
      return true;
  }
  return false;
}
/* 포락선 밖으로 얼마나 벗어났나 (>0 = 도달 불가, 그 여유). 게이트 여유 검사용 */
function envSlack(a,b,kit="basic"){
  const tbl=envFor(a,kit);
  const {dx,dy}=gapBetween(a,b);
  const dyEff=dy-PHYS.ledgeSnap;
  const md=envDx(tbl,dyEff);
  const vSlack = dyEff - maxRise(a,kit);
  if(md<0) return vSlack;                            // 이 높이는 아예 불가 → 높이 여유
  return Math.min(dx-md, vSlack>0? vSlack : Infinity);
}
/* 진입 발판 찾기 */
function startSurfaces(f){
  const S=standables(f.n), start=[];
  const sp = f.spawnW ? {x:f.spawnW[0], y:f.spawnW[1]}
    : (()=>{ const e=(f.portals||[]).find(p=>p.id==="entry");
             return e? {x:e.pos[0], y:e.pos[1]+f.yOff} : null; })();
  if(sp) for(const g of S)
    if(Math.abs(g.y1-sp.y)<0.4 && g.x0-0.6<=sp.x && g.x1+0.6>=sp.x) start.push(g);
  if(!start.length && S.length) start.push(S.reduce((a,b)=>a.y1<b.y1?a:b));
  return start;
}
/* 진입점에서 kit만으로 도달 가능한 노드 폐포.
   kit "basic" = 달리기·점프·이단강림·대시·(지정 슈트에서의)벽점프  — 창대쉬 없음
   kit "full"  = + ★창대쉬 */
function closure(f, kit, riseCap=Infinity){
  const S=graphNodes(f.n);
  const seen=new Set(startSurfaces(f));
  let changed=true, guard=0;
  while(changed && guard++<60){
    changed=false;
    for(const a of [...seen]) for(const b of S){
      if(seen.has(b)||!canMove(a,b,kit,riseCap)) continue;
      seen.add(b); changed=true;
    }
  }
  return seen;
}
const freeClosure = f => closure(f,"basic");    // 이름 유지(외부 노출·역호환)
const fullClosure = f => closure(f,"full");
/* 전 표면쌍 감사: free = 기본 키트로 도달 / razor = 게이트인데 여유 부족 */
function auditGates(){
  const free=[], razor=[];
  for(const f of FLOORS){
    const S=graphNodes(f.n);
    for(const a of S) for(const b of S){
      if(a===b||b.y1<=a.y1) continue;
      const {dx,dy}=gapBetween(a,b);
      if(canMove(a,b,"basic")) free.push({a,b,dx,dy});
      else if(envSlack(a,b,"basic") < GATE_MARGIN && !occludedPair(a,b,maxRise(a,"basic")))
        razor.push({a,b,dx,dy,slack:envSlack(a,b,"basic")});
    }
  }
  return {free, razor};
}
/* 게이트 무결성 — **양면 검사**.
   v1.2는 "기본 키트로 도달되면 실패" 한쪽만 봤다. 창 꽂기는 해금형 능력이라
   그걸로 충분했지만, 창대쉬는 **상시 사용 가능한 기본 시그니처**다. 그래서
   게이트의 의미가 "능력 잠금"에서 "이 테크 없이는 못 넘는 구간"으로 바뀌었고,
   검사도 두 방향이 필요하다:
     (1) 기본 키트(창대쉬 없음)로는 도달 불가  → 시그니처가 실제로 강제되는가
     (2) 전체 키트로는 도달 가능              → 막다른 길이 아닌가
   (게이트 상류가 이미 막혀 있으면 (1)은 자동 성립 — 그건 위반이 아니다) */
function gateViolations(){
  const bad=[];
  for(const f of FLOORS){
    const basic=freeClosure(f), full=fullClosure(f);
    const byUid=new Map([...full].map(n=>[n.uid,n]));
    for(const g of graphNodes(f.n)){
      if(!g.gate) continue;
      if([...basic].some(n=>n.uid===g.uid))
        bad.push({b:g, a:{uid:"basic-closure"}, why:"창대쉬 없이 도달됨"});
      else if(!byUid.has(g.uid))
        bad.push({b:g, a:{uid:"full-closure"}, why:"창대쉬로도 도달 불가"});
    }
  }
  return bad;
}
/* 창 발판이 기존 지형에 파묻히는가 (= 발판이 무의미) */
function ledgeEmbedded(){
  const bad=[];
  for(const p of PLANS){
    const L=p.ledge;
    for(const g of WORLD_GEO){
      if(g.floor!==p.floor||g.t==="deco"||!g.stand) continue;
      const ox=Math.min(L.x1,g.x1)-Math.max(L.x0,g.x0);
      if(ox>0.3 && Math.abs(g.y1-L.y1)<0.35) bad.push({plan:p, geo:g, ox});
    }
  }
  return bad;
}
/* 서로 다른 충돌 타입이 겹치는가 (7F 개구 사고 방지) */
function typeOverlaps(){
  const bad=[], C=WORLD_GEO.filter(g=>g.t!=="deco");
  for(let i=0;i<C.length;i++) for(let j=i+1;j<C.length;j++){
    const a=C[i],b=C[j];
    if(a.floor!==b.floor||a.t===b.t) continue;
    const ox=Math.min(a.x1,b.x1)-Math.max(a.x0,b.x0);
    const oy=Math.min(a.y1,b.y1)-Math.max(a.y0,b.y0);
    if(ox>0.05&&oy>0.05){
      // solid가 다른 solid를 포함하는 정상적 적층(단상 등)은 제외
      const contained = (a.x0<=b.x0&&a.x1>=b.x1&&a.y0<=b.y0) || (b.x0<=a.x0&&b.x1>=a.x1&&b.y0<=a.y0);
      if(!(contained && (a.t==="solid"&&b.t==="solid"))) bad.push({a,b,ox,oy});
    }
  }
  return bad;
}
/* 창 계획이 실제 면에 착탄하고 사거리 안인가 */
function planIssues(){
  const bad=[];
  for(const p of PLANS){
    if(!p.faceRef){ bad.push({p,why:"면 참조 없음"}); continue; }
    if(p.dist>REACH.spear) bad.push({p,why:`사거리 초과 ${p.dist.toFixed(2)}u`});
    const f=SPEAR_FACES.find(s=>s.uid===`${p.fid}:${p.face}`);
    if(!f){ bad.push({p,why:"면 미발견"}); continue; }
    if(p.atY<f.y0-0.01||p.atY>f.y1+0.01) bad.push({p,why:`착탄 y${p.atY.toFixed(2)} 면 밖(${f.y0}~${f.y1})`});
  }
  return bad;
}
/* 한 지점(표적/수집물)에 닿을 수 있는가 — 포락선 + 공격 리치.
   v1.2의 `s.y1+REACH.vault+0.5 >= cy && cy >= s.y1-3.5`(매직 +0.5 / -3.5, B-6)를
   포락선 판정으로 교체했다. 몸이 그 지점에 겹치면 집는다 = 발 높이 기준
   [cy-bodyH-extra, cy+extra] 사이 어딘가를 지나면 된다. */
function pointHit(s,cx,cy,kit,extra=0){
  const tbl=envFor(s,kit);
  const dx = cx>s.x1 ? cx-s.x1 : (cx<s.x0 ? s.x0-cx : 0);
  const lo = cy-s.y1-PHYS.bodyH-extra, hi = cy-s.y1+extra;   // 필요한 발 높이차 구간
  /* ledgeSnap은 "낮은 턱을 걸어 올라간다"는 런타임 관대함이라 착지 판정에만 쓴다.
     공중의 한 점에 닿는 판정에는 적용하지 않는다. */
  if(lo > envMaxUp(tbl)) return false;
  if(occludedPoint(s,cx,cy,maxRise(s,kit))) return false;
  for(let dy=Math.max(lo,ENV_LO); dy<=hi+1e-9; dy+=ENV_STEP)
    if(dx<=envDx(tbl,dy)) return true;
  return false;
}
function pointReachable(R,cx,cy,kit="full",extra=0){
  return [...R].some(s=>pointHit(s,cx,cy,kit,extra));
}
/* 공격 리치를 포함한 표적 도달성 — 게이트 표적은 **양면 검사**
   (기본 키트로는 못 때리고, 전체 키트로는 때릴 수 있어야 한다) */
function targetGateIssues(){
  const bad=[];
  for(const t of TARGETS){
    if(!t.gate) continue;
    const f=FLOORS.find(a=>a.n===t.floor);
    if(pointReachable(freeClosure(f), t.wx, t.wy, "basic", REACH.atkUp))
      bad.push({t, why:"창대쉬 없이 타격됨"});
    else if(!pointReachable(fullClosure(f), t.wx, t.wy, "full", REACH.atkUp))
      bad.push({t, why:"창대쉬로도 타격 불가"});
  }
  return bad;
}
/* 창 꽂기가 켜져 있을 때만: 가상 창 발판을 얹은 폐포 (부활 대비 · 현재 비활성) */
function spearClosure(f, excludeFaces){
  const seen=fullClosure(f);
  if(!MAP.spear.enabled) return seen;
  const S=graphNodes(f.n);
  const faces=SPEAR_FACES.filter(s=>s.floor===f.n &&
    !(excludeFaces&&excludeFaces.includes(s.id)));
  const {ledgeLen:L, ledgeThick:T}=MAP.spear;
  const ledges=[];
  for(const fc of faces){
    if(fc.ny===-1) continue;                        // 하면(플로리시)은 발판 아님
    const px = fc.nx<0 ? fc.x0 : fc.x1;
    for(let y=fc.y0+0.1; y<=fc.y1-0.05; y+=0.2)
      ledges.push({uid:`ledge@${fc.id}:${y.toFixed(1)}`, floor:f.n, t:"solid",
        stand:true, virt:true, vaultable:true, face:fc, hx:px, hy:y,
        x0: fc.nx<0? px-L : px, x1: fc.nx<0? px : px+L, y0:y, y1:y+T});
  }
  let changed=true, guard=0;
  while(changed && guard++<40){
    changed=false;
    for(const a of [...seen]){
      const ax=(a.x0+a.x1)/2, ay=a.y1+0.5;
      for(const b of S){ if(!seen.has(b)&&canMove(a,b,"full")){ seen.add(b); changed=true; } }
      for(const lg of ledges){
        if(seen.has(lg)) continue;
        if(Math.hypot(lg.hx-ax, lg.hy-ay) > REACH.spear) continue;   // 던질 수 있나
        if(canMove(a,lg,"full")){ seen.add(lg); changed=true; }
      }
    }
  }
  return seen;
}
function surfaceAt(f,x,y,tol=0.45){
  return standables(f.n).find(g=>Math.abs(g.y1-y)<tol && g.x0-0.8<=x && g.x1+0.8>=x);
}
/* 각 층이 실제로 클리어 가능한가 (출구 도달) */
function solvability(){
  const bad=[];
  for(const f of FLOORS){
    const ex=(f.portals||[]).find(p=>p.id==="exit");
    const R=spearClosure(f);
    if(ex){
      const tgt=surfaceAt(f, ex.pos[0], ex.pos[1]+f.yOff);
      if(!tgt) bad.push({f, why:"출구 발판 미발견"});
      else if(![...R].some(n=>n.uid===tgt.uid)) bad.push({f, why:"출구 도달 불가"});
    }
    for(const tr of (f.triggers||[])){              // 7F 성종
      const gy=tr.rect[1]+f.yOff;
      const cx=tr.rect[0]+tr.rect[2]/2;
      if(!pointReachable(R,cx,gy,"full",REACH.atkUp)) bad.push({f, why:`목표 ${tr.id} 타격 불가`});
    }
  }
  return bad;
}
/* 히든 수집물이 창을 써서 도달 가능한가 */
function collectableIssues(){
  const bad=[];
  for(const f of FLOORS){
    if(!(f.collectibles||[]).length) continue;
    const R=spearClosure(f);
    for(const c of f.collectibles)
      if(!pointReachable(R,c.pos[0],c.pos[1]+f.yOff)) bad.push({f,c});
  }
  return bad;
}
/* 히든 게이트 검증 — 수집물도 표면·표적과 같은 **양면 검사**.
   v1.2의 두 규칙("전용 hidden 면 없이 불가" / "창 없이는 복귀 불가")은 창 꽂기
   비활성으로 성립하지 않는다. 특히 **복귀 제약형(spear-return)은 원리적으로 죽었다**:
   창대쉬가 상시 사용 가능하므로 어떤 포켓에서도 되돌아 나올 수 있다.
   ⇒ 전부 `gate:"sdash"`(진입 게이트)로 전환하고 아래 한 규칙으로 검사한다. */
function hiddenGateIssues(){
  const bad=[];
  for(const f of FLOORS){
    for(const c of (f.collectibles||[])){
      if(!c.gate) continue;
      const x=c.pos[0], y=c.pos[1]+f.yOff;
      if(c.gate==="sdash"){
        if(pointReachable(freeClosure(f), x, y, "basic"))
          bad.push({f,c,why:"창대쉬 없이 도달됨"});
        else if(!pointReachable(fullClosure(f), x, y, "full"))
          bad.push({f,c,why:"창대쉬로도 도달 불가"});
      }else if(c.gate==="spear-face"){        // 창 꽂기 부활 시에만 유효
        const hid=(f.spearFaces||[]).filter(s=>s.role==="hidden").map(s=>s.id);
        if(!hid.length){ bad.push({f,c,why:"hidden 면 없음"}); continue; }
        if(pointReachable(spearClosure(f,hid), x, y)) bad.push({f,c,why:"전용 면 없이 도달됨"});
      }
    }
  }
  return bad;
}
/* ── 시야 ① 「게이트가 출발 시점에 보이는가」 ──────────────────────────
   PLAY.scale 2배에서 세로 시야는 4.5u뿐인데 전체 상승 체인은 4.536u다.
   목표가 시야 밖이면 그건 실력 시험이 아니라 맹목 점프다.
   각 게이트마다 **시야 안에서 출발할 수 있는 발판이 하나라도 있어야** 한다. */
function visibilityIssues(){
  const bad=[], V=viewSpec();
  for(const f of FLOORS){
    const full=fullClosure(f);
    for(const b of graphNodes(f.n)){
      if(!b.gate) continue;
      let best=null;
      for(const a of full){
        if(a.uid===b.uid||!canMove(a,b,"full")) continue;
        const {dx,dy}=gapBetween(a,b);
        if(!best || (dx+dy)<(best.dx+best.dy)) best={a,dx,dy};
      }
      if(!best){ bad.push({b, why:"출발 발판 없음"}); continue; }
      if(best.dx>V.gateDx || best.dy>V.gateDy)
        bad.push({b, why:`최근접 출발 ${best.a.id} dx${best.dx.toFixed(2)}/dy${best.dy.toFixed(2)}`
                       +` > 시야 ${V.gateDx.toFixed(2)}/${V.gateDy.toFixed(2)}`});
    }
  }
  return bad;
}
/* ── 시야 ② 「연속 상승 상한」 ────────────────────────────────────────
   중간 착지 없이 riseCap을 넘게 올라야만 도달되는 지점이 없어야 한다.
   = 한 도약의 상승을 riseCap으로 제한한 폐포가 여전히 출구·게이트·수집물에 닿는가. */
function riseChainIssues(){
  const bad=[], V=viewSpec();
  for(const f of FLOORS){
    const capped=closure(f,"full",V.riseCap);
    const has=n=>[...capped].some(s=>s.uid===n.uid);
    const ex=(f.portals||[]).find(p=>p.id==="exit");
    if(ex){
      const tgt=surfaceAt(f, ex.pos[0], ex.pos[1]+f.yOff);
      if(tgt&&!has(tgt)) bad.push({f, id:"exit", why:`출구가 연속 상승 ${V.riseCap.toFixed(2)}u 초과 없이는 도달 불가`});
    }
    for(const g of graphNodes(f.n))
      if(g.gate&&!has(g)) bad.push({f, id:g.id, why:`게이트가 연속 상승 초과 없이는 도달 불가`});
    for(const c of (f.collectibles||[]))
      if(!pointReachable(capped, c.pos[0], c.pos[1]+f.yOff, "full"))
        bad.push({f, id:c.id, why:`수집물이 연속 상승 초과 없이는 도달 불가`});
  }
  return bad;
}
/* ── B-5 ① 보행 천장 여유 ────────────────────────────────────────────
   전 `stand` 표면 상단을 실제로 걸어가며(x를 잘게 훑으며) 머리 위 여유를 잰다.
   그 x에 기둥이 서 있으면(발밑에서 솟은 지형) 걸을 수 없는 자리이므로 건너뛴다.
   v1.2 검증은 "필수 지점"만 봐서 bodyH를 1.05로 올려도 전부 PASS였다
   (실제 최소 여유는 1.00u) — 그 사각지대를 메운다. */
function walkClearance(){
  const out=[]; const hw=PHYS.bodyW/2, step=0.05, eps=1e-3;
  for(const s of standables()){
    for(let x=s.x0+hw; x<=s.x1-hw+1e-9; x+=step){
      let roof=Infinity, blocked=false;
      for(const g of WORLD_GEO){
        if(g.floor!==s.floor||g.t==="deco"||g.uid===s.uid) continue;
        if(g.t==="oneway") continue;                       // 아래에서 통과 가능
        if(g.x1<=x-hw+eps||g.x0>=x+hw-eps) continue;       // 몸통 폭 밖
        if(g.y1<=s.y1+eps) continue;                       // 발밑
        if(g.y0<=s.y1+eps){ blocked=true; break; }         // 이 x는 지형이 막고 있음
        roof=Math.min(roof,g.y0);
      }
      if(blocked) continue;
      out.push({uid:s.uid, x:+x.toFixed(2), clear: roof===Infinity? Infinity : +(roof-s.y1).toFixed(3),
                roofOf: roof});
    }
  }
  out.sort((a,b)=>a.clear-b.clear);
  return out;
}
/* ── B-5 ② 지지면 검사 ───────────────────────────────────────────────
   "플레이어가 서 있다"고 선언된 지점의 **발밑에 실제로 착지 표면이 있는가**.
   v1.2는 겹침만 봐서 spawn을 허공(y4.5)에 둬도 PASS였다. */
function supportIssues(){
  const bad=[], hw=PHYS.bodyW/2, tol=PHYS.ledgeSnap;
  for(const p of standPoints()){
    const ok=standables(p.floor).some(g=>
      Math.abs(g.y1-p.y)<=tol && g.x0<=p.x+hw && g.x1>=p.x-hw);
    if(!ok) bad.push(p);
  }
  return bad;
}
/* 신체 여유 — 설계가 "플레이어가 서 있다"고 지정한 모든 지점에서
   bodyW×bodyH 박스가 지형과 겹치지 않아야 한다.
   지점은 데이터에서 파생: 스폰 · 포탈 · 체크포인트 · 지상/반격 표적.
   (bodyH를 키우면 여기서 먼저 터진다 — 히트박스 변경의 안전망) */
function standPoints(){
  const P=[];
  for(const f of FLOORS){
    const o=f.yOff;
    if(f.spawn)                       P.push({fid:f.id, floor:f.n, id:"spawn", x:f.spawn[0], y:f.spawn[1]+o});
    for(const p of (f.portals||[]))   P.push({fid:f.id, floor:f.n, id:"portal:"+p.id, x:p.pos[0], y:p.pos[1]+o});
    for(const c of (f.checkpoints||[]))P.push({fid:f.id, floor:f.n, id:"cp:"+c.id,   x:c.pos[0], y:c.pos[1]+o});
    for(const t of (f.targets||[]))
      if(t.kind==="ground"||t.kind==="counter")
                                      P.push({fid:f.id, floor:f.n, id:"tgt:"+t.id,  x:t.pos[0], y:t.pos[1]+o});
  }
  return P;
}
function bodyFitIssues(){
  const bad=[], hw=PHYS.bodyW/2, eps=1e-3;
  for(const p of standPoints()){
    const b={x0:p.x-hw+eps, x1:p.x+hw-eps, y0:p.y+eps, y1:p.y+PHYS.bodyH-eps};
    for(const g of WORLD_GEO){
      if(g.floor!==p.floor||g.t==="deco"||g.t==="oneway") continue;   // oneway는 통과 가능
      if(rectHit(b,g)) bad.push({p, g, over:+(g.y1-b.y0).toFixed(2)});
    }
  }
  return bad;
}

function portalPairsOk(){
  for(const p of PORTALS){
    const tf=FLOORS.find(f=>f.id===p.to); if(!tf) return false;
    if(!(tf.portals||[]).some(q=>q.id===p.toPortal)) return false;
  }
  return true;
}
/* 검증 실행은 컨트롤러 정의 이후로 미룬다 — 실측 항목(B-3)이 stepPlayer·CTRL을 쓴다 */

/* 도달성 분류: 특정 표면에서 다른 표면들이 어떻게 도달되는가 */
function reachFrom(src){
  const out=[];
  for(const b of standables(src.floor)){
    if(b===src) continue;
    const {dx,dy}=gapBetween(src,b);
    let k;
    if(dx>REACH.dashX)                 k="far";
    else if(dy<=REACH.jump)            k="jump";
    else if(dy<=REACH.doubleJump)      k="double";
    else if(dy<=REACH.vault)           k="vault";
    else                               k="no";
    out.push({b,dx,dy,k});
  }
  return out;
}

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function rr(c,x,y,w,h,r){
  r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y); c.closePath();
}
function mulberry(seed){ return function(){
  seed|=0; seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; };}
function mix(a,b,t){
  const pa=parseInt(a.slice(1),16), pb=parseInt(b.slice(1),16);
  return `rgb(${Math.round(lerp((pa>>16)&255,(pb>>16)&255,t))},`
       + `${Math.round(lerp((pa>>8)&255,(pb>>8)&255,t))},`
       + `${Math.round(lerp(pa&255,pb&255,t))})`;
}

  for(const g of WORLD_GEO){
    if(!g.stand||g.t==="deco") continue;
    if(wx>=g.x0-0.2&&wx<=g.x1+0.2&&wy>=g.y0-0.3&&wy<=g.y1+0.4){ hit=g; break; }
  }
  ui.sel = (hit&&ui.sel===hit) ? null : hit;
}
function exportJSON(){
  const data=JSON.parse(JSON.stringify(MAP));
  data.derived={reach:REACH, gateMargin:GATE_MARGIN};
  data.tests=runTests().map(r=>({name:r.n, ok:r.ok, detail:r.d}));
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="temple-map.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);

}

const rnd=mulberry(20260807);

               d:0.10+rnd()*0.55, a:0.10+rnd()*0.32, ph:rnd()*99, v:(i%4)});

              sp:0.15+rnd()*0.5, ph:rnd()*99});
const SPIRES=[]; for(let i=0;i<7;i++)
  SPIRES.push({x:rnd(), w:0.03+rnd()*0.05, h:0.12+rnd()*0.28, d:0.14+rnd()*0.2});

const cloudSprites=(()=>{
  const out=[];
  for(let v=0;v<4;v++){
    const S=256, cc=document.createElement("canvas"); cc.width=S; cc.height=S*0.42;
    const c=cc.getContext("2d");

      const g2=c.createRadialGradient(ox,oy,0,ox,oy,rr2);
      g2.addColorStop(0,"rgba(255,255,255,0.6)"); g2.addColorStop(1,"rgba(255,255,255,0)");
      c.fillStyle=g2; c.beginPath(); c.arc(ox,oy,rr2,0,7); c.fill();
    }

})();

function drawSky(T){
  const alt=clamp(cam.y/WORLD.y1,0,1);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, mix(PAL.skyTop,"#2b4b78",alt));
  g.addColorStop(0.45, mix(PAL.skyMid,"#7fa4cc",alt));
  g.addColorStop(0.80, mix(PAL.skyLow,"#dfe9f2",alt*0.9));
  g.addColorStop(1, mix("#7a8ba3",PAL.skyHaze,alt*0.85));
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  const sunX=W*0.80, sunY=H*(0.16-alt*0.05);
  const sg=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,Math.max(W,H)*0.55);
  sg.addColorStop(0,`rgba(255,246,214,${0.34+alt*0.22})`);
  sg.addColorStop(0.28,`rgba(255,226,168,${0.13+alt*0.10})`);
  sg.addColorStop(1,"rgba(255,220,160,0)");
  ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);

  for(const s of SPIRES){
    const px=((s.x*1.4 - cam.x*0.008*s.d)%1.4+1.4)%1.4;

    ctx.fillStyle=`rgba(122,146,178,${0.16+s.d*0.16})`;
    ctx.fillRect(X, baseY-hh, W*s.w, hh);
    ctx.beginPath(); ctx.moveTo(X-W*0.012,baseY-hh);
    ctx.lineTo(X+W*s.w/2, baseY-hh-H*0.05);
    ctx.lineTo(X+W*s.w+W*0.012, baseY-hh); ctx.closePath(); ctx.fill();
  }
  for(const c of CLOUDS){
    const pxr=((c.x - cam.x*0.006*c.d)%1.5+1.5)%1.5;

    if(Y<-260||Y>H+260) continue;

/* 챔버 배경 — 층별 오프스크린 캐시 (아치 니치는 도려내 하늘 노출) */
function chamberSprite(f){
  const key=f.id+"|"+Math.round(cam.zoom);
  let s=chamberCache.get(key);
  if(s) return s;
  if(chamberCache.size>24) chamberCache.clear();
  const z=cam.zoom;
  const cw=Math.ceil((f.w+1.6)*z), ch=Math.ceil((f.h+0.8)*z);
  if(cw<=0||ch<=0||cw>6000||ch>6000) return null;
  const cc=document.createElement("canvas"); cc.width=cw; cc.height=ch;
  const c=cc.getContext("2d");
  const g=c.createLinearGradient(0,0,0,ch);
  g.addColorStop(0,"#243147"); g.addColorStop(0.42,"#192337"); g.addColorStop(1,"#121a2b");
  c.fillStyle=g; c.fillRect(0,0,cw,ch);
  // 코니스
  c.strokeStyle="rgba(170,196,234,0.07)"; c.lineWidth=1;
  for(let cy=2; cy<f.h; cy+=3){
    const CY=ch-(cy+0.4)*z;
    c.beginPath(); c.moveTo(0,CY); c.lineTo(cw,CY); c.stroke();
  }
  // 아치 니치 — destination-out 으로 도려내 하늘/구름이 비치게
  const step=3.2, aw=step*0.56*z, ah=Math.min(ch*0.46, 2.8*z);
  c.save(); c.globalCompositeOperation="destination-out";
  for(let ax=0.4; ax<f.w; ax+=step){
    const AX=(ax+0.8)*z, AY=ch-0.4*z-ah;
    c.beginPath();
    c.moveTo(AX, ch-0.4*z);
    c.lineTo(AX, AY+aw*0.45);
    c.quadraticCurveTo(AX+aw/2, AY-aw*0.10, AX+aw, AY+aw*0.45);
    c.lineTo(AX+aw, ch-0.4*z); c.closePath();
    c.fillStyle="rgba(0,0,0,0.40)"; c.fill();
  }
  c.restore();
  // 아치 테두리
  for(let ax=0.4; ax<f.w; ax+=step){
    const AX=(ax+0.8)*z, AY=ch-0.4*z-ah;
    c.beginPath();
    c.moveTo(AX, ch-0.4*z); c.lineTo(AX, AY+aw*0.45);
    c.quadraticCurveTo(AX+aw/2, AY-aw*0.10, AX+aw, AY+aw*0.45);
    c.lineTo(AX+aw, ch-0.4*z);
    c.strokeStyle="rgba(214,186,122,0.16)"; c.lineWidth=2; c.stroke();
  }
  // 상단 성광 + 바닥 금빛 바운스
  const rg=c.createLinearGradient(0,0,0,ch*0.45);
  rg.addColorStop(0,"rgba(255,238,190,0.16)"); rg.addColorStop(1,"rgba(255,238,190,0)");
  c.fillStyle=rg; c.fillRect(0,0,cw,ch*0.45);
  const bg=c.createLinearGradient(0,ch,0,ch-ch*0.22);
  bg.addColorStop(0,"rgba(232,200,106,0.12)"); bg.addColorStop(1,"rgba(232,200,106,0)");
  c.fillStyle=bg; c.fillRect(0,ch-ch*0.22,cw,ch*0.22);
  chamberCache.set(key,cc);
  return cc;
}
function drawChamber(f){

function offscreen(g){
  return sx(g.x1)<-60||sx(g.x0)>W+60||sy(g.y1)>H+60||sy(g.y0)<-60;
}
function drawSolid(g,T,opt={}){
  if(offscreen(g)) return;
  const z=cam.zoom;
  const bot = (opt.massTo!=null && opt.massTo<g.y0) ? opt.massTo : g.y0;
  const X=sx(g.x0), Y=sy(g.y1), Wd=(g.x1-g.x0)*z, Hd=Math.max((g.y1-bot)*z,4);
  const cap=Math.min(Hd*0.42, Math.max(3,z*0.14));
  ctx.save();
  ctx.fillStyle="rgba(4,8,18,0.45)"; ctx.fillRect(X+2,Y+3,Wd,Hd);
  const gr=ctx.createLinearGradient(0,Y,0,Y+Hd);
  gr.addColorStop(0,PAL.bodyHi); gr.addColorStop(0.28,PAL.body);
  gr.addColorStop(0.78,PAL.bodyLo); gr.addColorStop(1,PAL.bodyDeep);
  ctx.fillStyle=gr; ctx.fillRect(X,Y,Wd,Hd);
  if(z>24&&Wd>20){
    ctx.strokeStyle="rgba(12,18,30,0.35)"; ctx.lineWidth=1;
    const n=Math.max(1,Math.floor(Wd/(z*0.9)));
    for(let i=1;i<n;i++){ const bx=Math.round(X+Wd*i/n)+0.5;
      ctx.beginPath(); ctx.moveTo(bx,Y+cap); ctx.lineTo(bx,Y+Hd); ctx.stroke(); }
  }
  const cg=ctx.createLinearGradient(0,Y,0,Y+cap);
  cg.addColorStop(0,PAL.marbleHi); cg.addColorStop(0.6,PAL.marble); cg.addColorStop(1,PAL.marbleLo);
  ctx.fillStyle=cg; ctx.fillRect(X,Y,Wd,cap);
  ctx.fillStyle=PAL.gold;   ctx.fillRect(X,Y+cap,Wd,Math.max(1.4,z*0.028));
  ctx.fillStyle=PAL.goldHi; ctx.fillRect(X,Y,Wd,Math.max(1,z*0.014));
  ctx.fillStyle="rgba(255,255,255,0.10)"; ctx.fillRect(X,Y,Math.max(1,z*0.02),Hd);
  ctx.fillStyle="rgba(6,10,20,0.35)";     ctx.fillRect(X+Wd-Math.max(1,z*0.02),Y,Math.max(1,z*0.02),Hd);
  if(g.dyn){                                       // 박힌 창 발판 = 성광 강조
    ctx.globalCompositeOperation="lighter";
    ctx.fillStyle=`rgba(143,220,240,${0.25+0.12*Math.sin(T*0.005)})`;
    ctx.fillRect(X-2,Y-3,Wd+4,Hd+6);

function drawWall(g,T,alpha=1){
  if(offscreen(g)) return;
  const z=cam.zoom;
  const X=sx(g.x0), Y=sy(g.y1), Wd=(g.x1-g.x0)*z, Hd=(g.y1-g.y0)*z;
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.fillStyle="rgba(4,8,18,0.40)"; ctx.fillRect(X+2,Y+2,Wd,Hd);
  const gr=ctx.createLinearGradient(X,0,X+Wd,0);

  gr.addColorStop(0.55,PAL.wallMid); gr.addColorStop(1,PAL.wallLo);
  ctx.fillStyle=gr; ctx.fillRect(X,Y,Wd,Hd);
  if(z>18&&Wd>7){
    const n=Math.max(1,Math.floor(Wd/Math.max(7,z*0.16)));
    for(let i=1;i<n;i++){ const fx=Math.round(X+Wd*i/n)+0.5;
      ctx.strokeStyle="rgba(140,166,204,0.13)"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(fx,Y+2); ctx.lineTo(fx,Y+Hd-2); ctx.stroke();
      ctx.strokeStyle="rgba(8,12,22,0.32)";
      ctx.beginPath(); ctx.moveTo(fx+1.4,Y+2); ctx.lineTo(fx+1.4,Y+Hd-2); ctx.stroke(); }
  }
  const cap=Math.max(2,z*0.055);
  ctx.fillStyle=PAL.goldLo;
  ctx.fillRect(X-Wd*0.12,Y+Hd-cap,Wd*1.24,cap);
  if(g.cap==="finial"){                       // 첨탑캡 = 설 수 없음(뾰족)
    ctx.fillStyle=PAL.gold;
    ctx.beginPath(); ctx.moveTo(X+Wd/2, Y-z*0.30);
    ctx.lineTo(X+Wd*1.05, Y+cap); ctx.lineTo(X-Wd*0.05, Y+cap);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle=PAL.goldHi;

  }else{
    ctx.fillStyle=PAL.goldLo; ctx.fillRect(X-Wd*0.12,Y,Wd*1.24,cap);
    ctx.fillStyle=PAL.gold;   ctx.fillRect(X-Wd*0.12,Y,Wd*1.24,Math.max(1,z*0.022));

function drawVault(g,T){
  if(offscreen(g)) return;

  const cx=sx((g.x0+g.x1)/2), top=sy(g.y1), bot=sy(g.y0), half=(g.x1-g.x0)/2*z;

  ctx.fillStyle=gr;

  ctx.closePath(); ctx.fill();
  ctx.globalCompositeOperation="lighter";
  ctx.fillStyle=`rgba(255,240,190,${0.22+0.12*Math.sin(T*0.004)})`;

  ctx.restore();
}
function drawHazard(z_,T){
  const X=sx(z_.x0), Wd=(z_.x1-z_.x0)*cam.zoom;
  const Y=sy(z_.y1), Hd=Math.max((z_.y1-z_.y0)*cam.zoom, cam.zoom*0.8);
  if(X>W+40||X+Wd<-40) return;

function drawSpearFace(f,T){
  const z=cam.zoom;
  const X=sx(f.x0), Y=sy(f.y1);
  const Wd=Math.max((f.x1-f.x0)*z,3), Hd=(f.y1-f.y0)*z;
  if(X>W+80||X+Wd<-80) return;
  const pulse=0.45+0.25*Math.sin(T*0.0022+f.y0);
  // 노출면(법선 쪽)에서 바깥으로 발광
  const ex = f.nx<0 ? X : X+Wd;              // 노출 x
  ctx.save(); ctx.globalCompositeOperation="lighter";
  if(f.ny===-1){
    const ug=ctx.createLinearGradient(0,Y+Hd,0,Y+Hd+z*0.6);
    ug.addColorStop(0,`rgba(143,220,240,${0.40*pulse})`); ug.addColorStop(1,"rgba(143,220,240,0)");
    ctx.fillStyle=ug; ctx.fillRect(X,Y+Hd,Wd,z*0.6);
  }else{
    const gw=z*1.6*(f.nx<0?-1:1);
    const fg=ctx.createLinearGradient(ex,0,ex+gw,0);
    fg.addColorStop(0,`rgba(143,220,240,${0.40*pulse})`); fg.addColorStop(1,"rgba(143,220,240,0)");
    ctx.fillStyle=fg;
    ctx.fillRect(Math.min(ex,ex+gw), Y, Math.abs(gw), Hd);
  }
  ctx.restore();
  ctx.save();
  ctx.strokeStyle=`rgba(180,238,255,${0.55+0.2*Math.sin(T*0.003)})`;
  ctx.lineWidth=Math.max(1.5,z*0.035);
  ctx.beginPath();
  if(f.ny===-1){ ctx.moveTo(X,Y+Hd); ctx.lineTo(X+Wd,Y+Hd); }
  else { ctx.moveTo(ex,Y); ctx.lineTo(ex,Y+Hd); }
  ctx.stroke();
  if(z>16){
    const span=f.ny===-1 ? (f.x1-f.x0) : (f.y1-f.y0);
    const n=Math.max(2,Math.round(span/0.9));           // 월드 유닛당 고정 밀도
    for(let i=0;i<=n;i++){
      const t=i/n;
      const cx = f.ny===-1 ? lerp(X,X+Wd,t) : ex;
      const cy = f.ny===-1 ? Y+Hd : lerp(Y,Y+Hd,t);
      const r=(2.0+1.2*Math.sin(T*0.004+i))*Math.max(0.6,z/48);
      ctx.fillStyle="rgba(200,244,255,0.9)";
      ctx.beginPath(); ctx.arc(cx,cy,r*0.5,0,7); ctx.fill();
      ctx.fillStyle="rgba(143,220,240,0.26)";
      ctx.beginPath(); ctx.arc(cx,cy,r*1.7,0,7); ctx.fill();
    }
  }
  ctx.restore();
}

const _lb=[];
function slot(X,Y,w,h){
  for(let i=0;i<8;i++){
    const yy=Y-i*(h+3);
    let hit=false;
    for(const b of _lb) if(X<b.x+b.w+3&&X+w+3>b.x&&yy<b.y+b.h+2&&yy+h+2>b.y){hit=true;break;}
    if(!hit){ _lb.push({x:X,y:yy,w,h}); return yy; }
  }
  return null;
}

  for(const g of WORLD_GEO){
    if(g.floor!==f.n||g.t==="deco") continue;

    ctx.fillRect(MX(c.wx)-1.5,MY(c.wy)-1.5,3,3); }
  ctx.fillStyle="rgba(255,236,180,0.6)"; ctx.font="8px system-ui"; ctx.textAlign="right";

      ["점프","Space/Z (누르면 높이) · 공중 재입력 = 이단 강림 · 벽에서 = 벽점프"],
      ["대시","Shift/X (i-frame) · 공격 J (애니메이션만)"],
      ["★창대쉬","C/V — 0.2s 체공 후 8방향 돌진 · 충전 1회 · 접지/지정 벽에서 회복"],
      ["문·이동","↑/W 문 통과 · 1~7 층 워프 · R 리스폰 · Enter 뷰어 복귀"],
      ["토글","L 라벨 · K 히트박스 · G 그리드 · P 창꽂기 · T 검증 · E JSON"],

      ["층 이동","1~7 · O 전체 조망"],

      ctx.fillStyle="rgba(200,220,246,0.9)"; ctx.fillText(r.n, px+28, yy);

  }

const ANIM={
  idle:      {i:[0,1,2,3,4,5],   fps:8,  loop:true },
  /* ★ 보행 계열은 fps를 손으로 적지 않는다 — **보폭에서 유도**한다.

     run  strideU 0.784u → 3 × 3.92 / 0.784 = **15.0fps** (JSON 권장값과 일치)

     c1·c2를 선행으로 깔고 돌진 최고조(c3·c4)에 시간을 실어 잔상을 남긴다. */

/* 창대쉬 방향(8방향) → {애니, 좌우반전}.
   시트에는 오른쪽 계열 5행만 있고 왼쪽은 **좌우 반전**으로 만든다. 상하 반전 금지. */
function sdashAnim(sx,sy){
  const flip = sx<-1e-6;
  const ax=Math.abs(sx);
  if(ax<1e-6)            return {a: sy>0? "sdashUp"      : "sdashDown",      flip:false};
  if(Math.abs(sy)<1e-6)  return {a: "sdashRight",                            flip};
  return {a: sy>0? "sdashUpRight" : "sdashDownRight", flip};
}
